<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0f766e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="PT/OT国試"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="apple-touch-icon" href="./app-icon-192.png"/>
<title>PT/OT国試 基礎3科目 弱点診断 v1.14</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#15202b;--muted:#64748b;--line:#e2e8f0;--teal:#0f766e;--teal2:#115e59;--good:#15803d;--bad:#b91c1c;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text)}
.app{max-width:860px;margin:auto;padding:16px 16px 92px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:850}
.version{font-size:12px;padding:5px 9px;border-radius:999px;background:#dff5f2;color:var(--teal2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 14px rgba(15,23,42,.04)}
.hero{background:linear-gradient(135deg,#fff,#edfdf9)}
h1{font-size:26px;margin:4px 0 10px} h2{font-size:19px;margin:2px 0 12px} h3{font-size:16px;margin:14px 0 7px}
p{line-height:1.72;margin:8px 0}
.muted{color:var(--muted)} .small{font-size:12px}
.note{font-size:12px;background:#fff7ed;color:#7c2d12;padding:10px;border-radius:10px;line-height:1.6}
.btn{width:100%;border:0;border-radius:12px;padding:14px 16px;background:var(--teal);color:#fff;-webkit-text-fill-color:#fff;font-size:16px;font-weight:750;cursor:pointer}
.btn.secondary{background:#fff;color:var(--teal2);-webkit-text-fill-color:var(--teal2);border:1px solid #85c8c0}
.btn.soft{background:#e9f8f6;color:var(--teal2);-webkit-text-fill-color:var(--teal2)}
.btn:disabled{opacity:.45}
.actions{display:grid;gap:9px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:11px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;text-align:center;min-width:0}
.stat b{display:block;font-size:20px;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:4px 7px;background:#eef2f7;border-radius:999px;color:#475569;border:0}
.source{font-size:12px;color:var(--teal2);font-weight:700;margin:8px 0}
.figure{margin:14px 0;padding:8px;background:#fff;border:1px solid var(--line);border-radius:14px}
.figure svg{display:block;width:100%;height:auto}
.choice{display:block;width:100%;text-align:left;padding:13px;margin:9px 0;border:1px solid #cbd5e1;background:#fff;color:var(--text);-webkit-text-fill-color:var(--text);border-radius:12px;font-size:15px;line-height:1.55;cursor:pointer}
.choice.sel{border:2px solid var(--teal);background:#eefbf8}
.choice.ok{border:2px solid var(--good);background:#f0fdf4}
.choice.ng{border:2px solid var(--bad);background:#fef2f2}
.confrow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}
.conf{padding:10px 4px;border:1px solid var(--line);background:#fff;color:var(--text);-webkit-text-fill-color:var(--text);border-radius:10px;font-weight:650}
.conf.sel{border:2px solid var(--teal);background:#eefbf8}
.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:var(--teal)}
.explain{background:#f8fffd;border-left:4px solid var(--teal);padding:13px;border-radius:10px;margin-top:14px}
.option-ex{padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.6}
.knowledge{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:10px;line-height:1.65}
.result-good{color:var(--good)} .result-bad{color:var(--bad)}
.weakcard{padding:12px;border:1px solid var(--line);border-radius:13px;margin:9px 0;background:#fbfcfd}
.weakhead{display:flex;justify-content:space-between;gap:10px}
.pill{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:#dff5f2;color:var(--teal2)}
.pill.mid{background:#fff7ed;color:var(--warn)}
.pill.high{background:#fef2f2;color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.gloss-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.gloss-item{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.gloss-item b{display:block;margin-bottom:4px}
.helpbox{font-size:13px;background:#eefbf8;border:1px solid #b8ece4;color:#115e59;padding:10px;border-radius:10px;line-height:1.65}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);backdrop-filter:blur(9px)}
.navin{max-width:860px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{border:0;background:transparent;padding:13px 4px;color:#64748b;font-weight:750}
.nav button.on{color:var(--teal)}
.hide{display:none!important}
.footer-note{font-size:11px;color:#64748b;line-height:1.6;margin-top:16px}
@media(max-width:640px){
 .card{padding:15px}
 h1{font-size:22px}
 .stat b{font-size:17px}
 .gloss-grid{grid-template-columns:1fr}
}

/* v1.3 */
.subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.subject-score{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}
.subject-score .name{font-weight:800;margin-bottom:6px}
.scoreline{display:flex;align-items:center;gap:8px}.scoreline b{font-size:22px;min-width:42px}
.meter{height:9px;background:#e2e8f0;border-radius:999px;overflow:hidden;flex:1}.meter>span{display:block;height:100%;background:var(--teal)}
.data-note{font-size:11px;color:var(--muted);margin-top:5px}.weak-top{display:grid;gap:8px}
.weak-top button{width:100%;text-align:left;padding:11px;border:1px solid var(--line);background:#fff;border-radius:11px;color:var(--text)}
.weak-rank{font-weight:850;color:var(--teal2);margin-right:7px}
.badge-danger,.badge-warn,.badge-good{display:inline-block;font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px}
.badge-danger{background:#fef2f2;color:#b91c1c}.badge-warn{background:#fff7ed;color:#b45309}.badge-good{background:#f0fdf4;color:#15803d}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mode-card{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}.mode-card b{display:block;margin-bottom:4px}.mode-card .btn{margin-top:9px;padding:10px;font-size:14px}
.radar-wrap{overflow-x:auto}.radar{display:block;margin:auto;max-width:100%;height:auto}.radar-legend{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--muted);margin-top:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.dot.current{background:#0f766e}.dot.prev{background:#94a3b8}
.practice-select{display:grid;gap:8px}.selectbtn{width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);font-weight:700}.selectbtn:hover{background:#f8fafc}
.diagstatus{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff}

@media(max-width:640px){.subject-grid,.mode-grid{grid-template-columns:1fr}}


/* v1.4 */
.weak-top{display:grid;gap:10px}
.weak-action{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:0;overflow:hidden;color:var(--text);cursor:pointer;box-shadow:0 1px 4px rgba(15,23,42,.03)}
.weak-action:hover{border-color:#85c8c0;background:#fbfffe}
.weak-action-main{display:flex;gap:11px;align-items:flex-start;padding:13px 13px 9px}
.weak-action .rankbox{flex:0 0 28px;height:28px;border-radius:9px;background:#e9f8f6;color:var(--teal2);display:grid;place-items:center;font-weight:850}
.weak-action .weak-copy{min-width:0;flex:1}.weak-action .weak-copy b{font-size:15px}.weak-action .weak-path{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}
.weak-action-footer{border-top:1px solid var(--line);padding:9px 13px;display:flex;justify-content:space-between;align-items:center;color:var(--teal2);font-size:13px;font-weight:800;background:#f8fffd}
.weak-action-footer small{font-size:11px;color:var(--muted);font-weight:600}
.axis-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.axis-chip{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;color:var(--text);cursor:pointer}
.axis-chip:hover{border-color:#85c8c0;background:#fbfffe}.axis-chip b{display:block;font-size:13px}.axis-chip-meta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:5px;font-size:11px;color:var(--muted)}
.axis-chip .go{color:var(--teal2);font-weight:800;white-space:nowrap}
.axis-label{cursor:pointer}.axis-label:hover text{fill:var(--teal2)}
.axis-detail-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.backlink{border:0;background:transparent;color:var(--teal2);font-weight:750;padding:4px 0;cursor:pointer}
.subgroup-card{border:1px solid var(--line);border-radius:13px;padding:12px;margin:9px 0;background:#fff}.subgroup-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.subgroup-score{font-weight:850;font-size:18px}.subgroup-score.mutedscore{font-size:12px;color:var(--muted)}
.mini-meter{height:7px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:7px 0}.mini-meter span{display:block;height:100%;background:var(--teal)}
.concept-list{display:grid;gap:6px;margin-top:8px}.concept-row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 9px;background:#f8fafc;border-radius:9px;font-size:12px}.concept-row button{border:0;background:transparent;color:var(--teal2);font-weight:800;cursor:pointer}
.status-unmeasured{font-size:11px;color:#64748b}.status-focus{font-size:11px;color:#b45309;font-weight:800}.status-ok{font-size:11px;color:#15803d;font-weight:800}
.radar-note{font-size:11px;color:var(--muted);line-height:1.55;margin-top:8px}
.practice-axis{display:grid;gap:8px}.practice-axis .selectbtn b{display:block}.practice-axis .selectbtn .small{font-weight:500;margin-top:3px;display:block}
@media(max-width:640px){.axis-grid{grid-template-columns:1fr}}


/* v1.6 */
.navin{grid-template-columns:repeat(4,1fr)}
.nav-count{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;margin-left:2px;border-radius:999px;background:#e2e8f0;color:#475569;font-size:10px;vertical-align:1px}
.nav button.on .nav-count{background:#dff5f2;color:var(--teal2)}
.score-caption{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px}
.scoreline b{min-width:auto;font-size:23px;white-space:nowrap}
.scoreline b small{font-size:12px;color:var(--muted);font-weight:700}
.metric-note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}
.explain{background:#fff;border-left:0;padding:0;margin-top:14px}
.explain-result{padding:13px 14px;border-radius:12px;margin-bottom:10px}
.explain-result.good{background:#f0fdf4;border:1px solid #bbf7d0}
.explain-result.bad{background:#fef2f2;border:1px solid #fecaca}
.section-box{border-radius:12px;padding:13px 14px;margin-top:11px;line-height:1.68}
.section-box h3{margin:0 0 8px;font-size:15px}
.section-main{background:#ffffff;border:1px solid #dbe4ee}
.section-options{background:#f8fafc;border:1px solid #e2e8f0}
.section-related{background:#eff6ff;border:1px solid #bfdbfe}
.section-exam{background:#fff7ed;border:1px solid #fed7aa}
.section-tip{background:#ecfdf5;border:1px solid #a7f3d0}
.section-answer{background:#f8fafc;border:1px solid #e2e8f0}
.option-ex{padding:10px 0;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.65}
.option-ex:first-child{border-top:0}
.gloss-grid{margin-top:8px}
.gloss-item{background:#f8fafc;border-color:#dbe4ee}
.lookup-add{margin-top:8px;border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:750;cursor:pointer}
.lookup-add.saved{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.lookup-list{display:grid;gap:10px}
.lookup-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:13px}
.lookup-card.done{opacity:.68}
.lookup-term{font-size:17px;font-weight:850;margin-bottom:5px}
.lookup-path{font-size:11px;color:var(--muted);line-height:1.5}
.lookup-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.lookup-actions button{border-radius:9px;padding:9px;border:1px solid var(--line);background:#fff;color:var(--text);font-weight:750;cursor:pointer}
.lookup-actions .primary{background:#e9f8f6;color:var(--teal2);border-color:#b8ece4}
.lookup-actions .donebtn{background:#f8fafc}
.lookup-empty{padding:18px;text-align:center;border:1px dashed #cbd5e1;border-radius:12px;color:var(--muted)}
.radar-score-label{font-size:9px;fill:#64748b}
.radar-gap-note{display:inline-block;background:#f8fafc;border:1px solid #e2e8f0;border-radius:999px;padding:5px 8px;margin-top:6px;font-size:10px;color:#64748b}
.axis-chip-score{font-weight:800;color:#0f766e}
.axis-detail-score-label{font-size:11px;color:var(--muted);font-weight:700}
.axis-detail-score-value{font-size:20px;font-weight:850}
.subgroup-score-label{font-size:10px;color:var(--muted);font-weight:700}
@media(max-width:640px){
 .nav button{font-size:11px;padding:12px 2px}
 .lookup-actions{grid-template-columns:1fr}
}


/* v1.7 */
.test-mode-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:800;margin-bottom:8px}
.diag-note{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;padding:10px 12px;border-radius:11px;font-size:12px;line-height:1.6;margin:10px 0}
.resume-card{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:13px;margin-top:12px}
.resume-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.resume-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.resume-actions .btn{padding:10px;font-size:14px}
.diag-summary-list{display:grid;gap:8px;margin-top:10px}
.diag-summary-item{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;color:var(--text);cursor:pointer}
.diag-summary-item.bad{border-color:#fecaca;background:#fffafa}
.diag-summary-item.good{border-color:#d1fae5;background:#fbfffd}
.diag-summary-item b{display:block;margin-bottom:3px}
.data-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.data-actions .btn{padding:11px;font-size:14px}
.data-note-box{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}
.file-input{display:none}
.app-ready{font-size:11px;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;padding:6px 8px;border-radius:999px;font-weight:800}
@media(max-width:640px){
 .resume-actions,.data-actions{grid-template-columns:1fr}
}


/* v1.8 diagnostic result dashboard */
.diag-hero-score{text-align:center;padding:8px 0 2px}
.diag-hero-score .fraction{font-size:34px;font-weight:900;letter-spacing:-1px;color:var(--text)}
.diag-hero-score .percent{font-size:15px;font-weight:800;color:var(--teal2);margin-top:3px}
.result-subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.result-subject{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px}
.result-subject .subject-name{font-weight:850;margin-bottom:7px}
.result-subject .subject-frac{font-size:22px;font-weight:900}
.result-subject .subject-pct{font-size:12px;color:var(--muted);font-weight:750;margin-left:4px}
.result-subject .mini-meter{margin-top:8px}
.conf-matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.conf-cell{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.conf-cell.correct{background:#f8fffb;border-color:#d1fae5}
.conf-cell.wrong{background:#fffafa;border-color:#fee2e2}
.conf-cell b{display:block;font-size:21px}
.conf-cell span{font-size:11px;color:var(--muted);line-height:1.35}
.focus-card{border:1px solid #fed7aa;background:#fff7ed;border-radius:13px;padding:13px}
.focus-card .focus-count{font-size:26px;font-weight:900;color:#9a3412}
.focus-card p{margin:5px 0 10px;color:#7c2d12;font-size:12px;line-height:1.6}
.result-weak-grid{display:grid;gap:9px}
.result-weak-card{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;color:var(--text);cursor:pointer}
.result-weak-card:hover{background:#f8fafc}
.result-weak-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.result-weak-title{font-weight:850;font-size:15px}
.result-weak-score{font-size:12px;font-weight:800;color:var(--teal2);white-space:nowrap}
.result-weak-path{font-size:11px;color:var(--muted);margin-top:4px}
.result-weak-action{font-size:12px;color:var(--teal2);font-weight:800;margin-top:8px}
.change-list{display:grid;gap:8px}
.change-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}
.change-main b{display:block;margin-bottom:3px}
.change-values{font-size:13px;color:#475569}
.change-delta{font-size:12px;font-weight:850;padding:5px 7px;border-radius:999px;background:#f8fafc;color:#475569}
.change-delta.up{background:#ecfdf5;color:#047857}
.change-delta.down{background:#fff7ed;color:#b45309}
.result-note{font-size:11px;color:var(--muted);line-height:1.55;margin-top:8px}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.result-actions .btn{padding:11px;font-size:14px}
@media(max-width:640px){
  .result-subject-grid,.conf-matrix,.result-actions{grid-template-columns:1fr}
}


/* v1.9 PWA install UX */
.install-card{border:1px solid #b8ece4;background:#f0fdfa;border-radius:14px;padding:13px;margin-bottom:12px}
.install-card.hidden{display:none}
.install-title{font-weight:900;margin-bottom:5px;color:#0f766e}
.install-body{font-size:12px;line-height:1.65;color:#334155}
.install-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.install-actions .btn{padding:10px 12px;font-size:13px}
.install-close{border:0;background:transparent;color:#64748b;font-weight:800;cursor:pointer;padding:8px}
.app-mode-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;font-size:10px;font-weight:850;margin-bottom:10px}
.browser-mode-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:#f8fafc;color:#475569;border:1px solid #cbd5e1;font-size:10px;font-weight:850;margin-bottom:10px}
@media(max-width:640px){.install-actions{grid-template-columns:1fr}}


/* v1.10: subject-coded weakness analysis */
.subject-score.subject-anatomy{border-top:4px solid #2563eb;background:#f8fbff}
.subject-score.subject-physiology{border-top:4px solid #059669;background:#f7fffb}
.subject-score.subject-kinesiology{border-top:4px solid #d97706;background:#fffaf3}
.subject-score.subject-anatomy .name{color:#1d4ed8}
.subject-score.subject-physiology .name{color:#047857}
.subject-score.subject-kinesiology .name{color:#b45309}

.weak-subject-card{border-top:5px solid var(--subject-color);overflow:hidden}
.weak-subject-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.weak-subject-badge{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;background:var(--subject-soft);color:var(--subject-color);font-size:12px;font-weight:900}
.weak-subject-card h2{margin:0;color:var(--subject-color)}

<script>
const Q = [{"id":"59A51","round":59,"source":"第59回・午前51（出題内容をもとに学習用再構成）","source_session":"午前","source_no":51,"subject":"解剖学","domain":"総論","topic":"基礎・発生","concept":"三胚葉の分化","secondary":["外胚葉","松果体","神経管","中胚葉","内胚葉"],"question":"胚発生で外胚葉に由来する構造はどれか。","options":[{"id":"o1","text":"筋"},{"id":"o2","text":"子宮"},{"id":"o3","text":"甲状腺"},{"id":"o4","text":"消化管"},{"id":"o5","text":"松果体"}],"answers":["o5"],"why":"正答は松果体です。松果体は神経外胚葉に由来します。外胚葉は神経系・表皮など、中胚葉は筋・骨・循環器・生殖器など、内胚葉は消化管や呼吸器の上皮などを主に形成します。","option_explanations":{"o1":"骨格筋や平滑筋の多くは中胚葉由来です。","o2":"子宮は主に中胚葉由来のミュラー管から形成されます。","o3":"甲状腺濾胞上皮は主に内胚葉由来です。","o4":"消化管上皮の大部分は内胚葉由来です。","o5":"正しい。松果体は間脳の一部として神経外胚葉から発生します。"},"related":"三胚葉問題は『外胚葉＝皮膚・神経、中胚葉＝筋骨格・循環・泌尿生殖、内胚葉＝消化・呼吸上皮』を骨格にすると整理できます。","tip":"外＝皮膚と神経、中＝筋骨格、内＝消化・呼吸。","glossary":[{"term":"外胚葉","desc":"表皮や中枢・末梢神経系などを形成する胚葉。"},{"term":"中胚葉","desc":"筋・骨・結合組織・循環器などを形成する胚葉。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["神経系の発生と神経管・神経堤の違いも関連づける。","甲状腺では濾胞上皮とC細胞で由来が異なる点に注意。"]},{"id":"59A52","round":59,"source":"第59回・午前52（出題内容をもとに学習用再構成）","source_session":"午前","source_no":52,"subject":"解剖学","domain":"筋系","topic":"筋の構造","concept":"サルコメアのフィラメント分布","secondary":["A帯","H帯","ミオシン","アクチン","筋節"],"question":"サルコメア内の帯状領域のうち、ミオシンフィラメントを直接含むものを2つ選べ。","options":[{"id":"o1","text":"A帯"},{"id":"o2","text":"H帯"},{"id":"o3","text":"I帯"},{"id":"o4","text":"Z帯"},{"id":"o5","text":"筋節"}],"answers":["o1","o2"],"why":"正答はA帯とH帯です。A帯は太いミオシンフィラメントの全長に相当し、その中央部のH帯には主にミオシンのみが存在します。I帯は主にアクチンのみ、Z帯はサルコメアの境界です。","option_explanations":{"o1":"正しい。A帯はミオシンの全長に相当し、アクチンとの重なり部分も含みます。","o2":"正しい。H帯はA帯中央で、主にミオシンのみが存在する領域です。","o3":"I帯は主に細いアクチンフィラメントからなります。","o4":"Z帯はアクチンが固定されるサルコメア境界で、ミオシンは直接存在しません。","o5":"筋節（サルコメア）はZ線間の構造単位で、帯そのものではありません。"},"related":"筋収縮ではI帯とH帯が短縮し、A帯の長さは基本的に変化しません。","tip":"A帯＝太いフィラメント全長、H帯＝太いフィラメントのみ。","glossary":[{"term":"A帯","desc":"サルコメア内でミオシンフィラメント全長に相当する暗帯。"},{"term":"H帯","desc":"A帯中央でアクチンとの重なりがない領域。"}],"official_answers":[1,2,5],"problemImage":null,"problemImageCaption":null,"exam_links":["滑走説ではフィラメント自体の長さは変化しない。","Z線間が1サルコメア。"],"scoring_status":"採点調整","official_note":"厚生労働省の訂正版では原問題について、1・2、1・5、2・5の3通りの解答を正解として採点している。本アプリでは『帯状領域』に限定し、1・2を選ぶ学習問題に再構成して診断から除外する。","excludeFromDiagnosis":true,"official_answer_patterns":[[1,2],[1,5],[2,5]]},{"id":"59A53","round":59,"source":"第59回・午前53（出題内容をもとに学習用再構成）","source_session":"午前","source_no":53,"subject":"解剖学","domain":"神経系","topic":"上肢末梢神経","concept":"肩甲背神経","secondary":["肩甲挙筋","菱形筋","腕神経叢","C5","肩甲骨内転"],"question":"肩甲背神経の支配を受ける筋を2つ選べ。","options":[{"id":"o1","text":"肩甲挙筋"},{"id":"o2","text":"鎖骨下筋"},{"id":"o3","text":"前鋸筋"},{"id":"o4","text":"僧帽筋"},{"id":"o5","text":"菱形筋"}],"answers":["o1","o5"],"why":"正答は肩甲挙筋と菱形筋です。肩甲背神経は主にC5由来で、菱形筋を支配し、肩甲挙筋にも運動枝を送ります。","option_explanations":{"o1":"正しい。肩甲挙筋は頸神経枝に加えて肩甲背神経からも支配を受けます。","o2":"鎖骨下筋は鎖骨下筋神経の支配です。","o3":"前鋸筋は長胸神経の支配です。","o4":"僧帽筋の運動支配は副神経が中心です。","o5":"正しい。大・小菱形筋は肩甲背神経の代表的支配筋です。"},"related":"肩甲帯の末梢神経は、長胸神経―前鋸筋、肩甲背神経―菱形筋、副神経―僧帽筋を対比すると覚えやすくなります。","tip":"肩甲背神経＝菱形筋＋肩甲挙筋。","glossary":[{"term":"肩甲背神経","desc":"腕神経叢C5付近から分かれ、菱形筋などを支配する神経。"}],"official_answers":[1,5],"problemImage":null,"problemImageCaption":null,"exam_links":["長胸神経障害では翼状肩甲がみられる。","菱形筋は肩甲骨内転・下方回旋に関与する。"],"scoring_status":"採点調整","official_note":"厚生労働省の訂正版では原問題の正答として1と5の両方を認めている。本アプリでは2つ選択する形式に再構成し、診断から除外する。","excludeFromDiagnosis":true},{"id":"59A54","round":59,"source":"第59回・午前54（出題内容をもとに学習用再構成）","source_session":"午前","source_no":54,"subject":"解剖学","domain":"神経系","topic":"脳神経","concept":"脳神経と支配筋","secondary":["三叉神経","顔面神経","咀嚼筋","表情筋","副神経"],"question":"脳神経と支配筋の組合せとして正しいものを2つ選べ。","options":[{"id":"o1","text":"動眼神経 ― 眼輪筋"},{"id":"o2","text":"三叉神経 ― 咬筋"},{"id":"o3","text":"顔面神経 ― 広頸筋"},{"id":"o4","text":"舌咽神経 ― 舌筋"},{"id":"o5","text":"副神経 ― 側頭筋"}],"answers":["o2","o3"],"why":"正答は『三叉神経―咬筋』と『顔面神経―広頸筋』です。咀嚼筋は三叉神経第3枝（下顎神経）の運動枝、表情筋は顔面神経が支配します。","option_explanations":{"o1":"眼輪筋は顔面神経支配です。","o2":"正しい。咬筋は下顎神経の運動枝に支配されます。","o3":"正しい。広頸筋は表情筋の一つで顔面神経支配です。","o4":"舌筋の大部分は舌下神経支配です。舌咽神経は茎突咽頭筋を支配します。","o5":"側頭筋は三叉神経第3枝の支配で、副神経は胸鎖乳突筋・僧帽筋を支配します。"},"related":"脳神経の運動支配は、V＝咀嚼、VII＝表情、XI＝胸鎖乳突筋・僧帽筋、XII＝舌筋を軸に整理します。","tip":"V咀嚼、VII表情、XI肩頸、XII舌。","glossary":[{"term":"下顎神経","desc":"三叉神経第3枝。感覚線維に加えて咀嚼筋への運動線維を含む。"}],"official_answers":[2,3],"problemImage":null,"problemImageCaption":null,"exam_links":["角膜反射では求心路V1、遠心路VII。","舌の味覚と運動支配は別神経なので区別する。"]},{"id":"59A55","round":59,"source":"第59回・午前55（出題内容をもとに学習用再構成）","source_session":"午前","source_no":55,"subject":"解剖学","domain":"神経系","topic":"中枢神経","concept":"黒質","secondary":["ドーパミン","黒質","基底核","Parkinson病"],"question":"ドーパミン作動性ニューロンが豊富で、線条体へ投射する代表的部位はどれか。","options":[{"id":"o1","text":"黒質"},{"id":"o2","text":"視床"},{"id":"o3","text":"小脳"},{"id":"o4","text":"脳梁"},{"id":"o5","text":"前頭葉"}],"answers":["o1"],"why":"正答は黒質です。黒質緻密部のドーパミン作動性ニューロンは線条体へ投射し、運動調節に重要な黒質線条体路を形成します。","option_explanations":{"o1":"正しい。黒質緻密部はドーパミン神経の代表的部位です。","o2":"視床は感覚・運動情報の中継に重要ですが、主要なドーパミン産生部位ではありません。","o3":"小脳は協調運動・運動学習に関与します。","o4":"脳梁は左右大脳半球を連絡する交連線維です。","o5":"前頭葉にはドーパミン入力がありますが、主要な産生部位ではありません。"},"related":"Parkinson病では黒質ドーパミンニューロンの変性により、線条体のドーパミンが低下します。","tip":"黒質→線条体＝ドーパミン。","glossary":[{"term":"黒質線条体路","desc":"黒質緻密部から線条体へ投射するドーパミン作動性経路。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["基底核回路と直接路・間接路も関連づける。","Parkinson病の無動・筋強剛・振戦との関係を確認する。"]},{"id":"59A56","round":59,"source":"第59回・午前56（出題内容をもとに学習用再構成）","source_session":"午前","source_no":56,"subject":"解剖学","domain":"神経系","topic":"脳神経","concept":"反回神経","secondary":["迷走神経","反回神経","喉頭","声帯","輪状甲状筋"],"question":"反回神経について正しいのはどれか。","options":[{"id":"o1","text":"味覚を主に伝える"},{"id":"o2","text":"横隔神経から分岐する"},{"id":"o3","text":"右側は大動脈弓を回る"},{"id":"o4","text":"輪状甲状筋を支配する"},{"id":"o5","text":"左側は右側より走行が長い"}],"answers":["o5"],"why":"正答は『左側は右側より走行が長い』です。反回神経は迷走神経の枝で、右は鎖骨下動脈、左は大動脈弓を回って上行するため左側の方が長い経路をとります。","option_explanations":{"o1":"反回神経の主機能は喉頭筋の運動と喉頭粘膜の感覚で、味覚が主ではありません。","o2":"迷走神経から分岐します。","o3":"大動脈弓を回るのは左反回神経です。","o4":"輪状甲状筋は上喉頭神経外枝が支配します。","o5":"正しい。左側は胸腔内で大動脈弓を回るため長い走行です。"},"related":"反回神経障害は嗄声や声帯麻痺の原因になります。甲状腺手術との関連も重要です。","tip":"右＝鎖骨下動脈、左＝大動脈弓。","glossary":[{"term":"反回神経","desc":"迷走神経の枝で、喉頭へ戻るように上行する神経。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["輪状甲状筋だけは上喉頭神経外枝。","左反回神経は縦隔病変でも障害されうる。"]},{"id":"59A57","round":59,"source":"第59回・午前57（出題内容をもとに学習用再構成）","source_session":"午前","source_no":57,"subject":"解剖学","domain":"脈管系","topic":"血管","concept":"頭頸部の動脈","secondary":["総頸動脈","椎骨動脈","脳底動脈","Willis動脈輪"],"question":"正常解剖で左右一対として存在する動脈を2つ選べ。","options":[{"id":"o1","text":"総頸動脈"},{"id":"o2","text":"椎骨動脈"},{"id":"o3","text":"脳底動脈"},{"id":"o4","text":"腕頭動脈"},{"id":"o5","text":"前交通動脈"}],"answers":["o1","o2"],"why":"正答は総頸動脈と椎骨動脈です。左右の総頸動脈と椎骨動脈はそれぞれ一対です。脳底動脈は左右椎骨動脈が合流して1本になり、腕頭動脈と前交通動脈も通常1本です。","option_explanations":{"o1":"正しい。左右に存在します。","o2":"正しい。左右の鎖骨下動脈から分岐し頭蓋内へ入ります。","o3":"左右椎骨動脈が合流してできる単一の動脈です。","o4":"通常は大動脈弓から出る右側の単一枝です。","o5":"左右前大脳動脈を連絡する単一の短い動脈です。"},"related":"脳血流では内頸動脈系と椎骨脳底動脈系の2系統を整理します。","tip":"椎骨2本→合流して脳底1本。","glossary":[{"term":"椎骨脳底動脈系","desc":"左右椎骨動脈が合流して脳底動脈となる後方循環。"}],"official_answers":[1,2],"problemImage":null,"problemImageCaption":null,"exam_links":["Willis動脈輪の構成血管を確認する。","大動脈弓の3分枝も併せて整理する。"]},{"id":"59A58","round":59,"source":"第59回・午前58（出題内容をもとに学習用再構成）","source_session":"午前","source_no":58,"subject":"解剖学","domain":"内臓諸器官","topic":"呼吸器","concept":"気道の構造","secondary":["上気道","下気道","気管支","気管","輪状軟骨"],"question":"呼吸器の解剖について正しいのはどれか。","options":[{"id":"o1","text":"気管支は下気道に含まれる"},{"id":"o2","text":"輪状軟骨は弾性軟骨である"},{"id":"o3","text":"成人の気管長は約20 cmである"},{"id":"o4","text":"咽頭下端はC8付近である"},{"id":"o5","text":"右主気管支は左より水平に近い"}],"answers":["o1"],"why":"正答は『気管支は下気道に含まれる』です。下気道は一般に気管・気管支・細気管支・肺胞系を含みます。","option_explanations":{"o1":"正しい。気管支は下気道に含まれます。","o2":"輪状軟骨は主に硝子軟骨です。","o3":"成人気管は概ね10〜12 cm程度で、20 cmは長すぎます。","o4":"咽頭はおおむねC6付近で食道へ移行します。","o5":"右主気管支は左より短く太く、より垂直に近いです。"},"related":"誤嚥異物は右主気管支へ入りやすいという臨床解剖につながります。","tip":"右主気管支＝短い・太い・垂直。","glossary":[{"term":"下気道","desc":"気管以下の気道を指す分類。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["気管分岐部は成人でT4〜T5付近。","喉頭軟骨の種類も区別する。"]},{"id":"59A59","round":59,"source":"第59回・午前59（出題内容をもとに学習用再構成）","source_session":"午前","source_no":59,"subject":"解剖学","domain":"感覚器","topic":"特殊感覚","concept":"眼房水と調節","secondary":["前眼房","後眼房","眼房水","毛様体","水晶体"],"question":"視覚器の構造について誤っているのはどれか。","options":[{"id":"o1","text":"虹彩と水晶体の間を前眼房という"},{"id":"o2","text":"眼房水は毛様体上皮から産生される"},{"id":"o3","text":"眼房水は強膜静脈洞へ流出する"},{"id":"o4","text":"毛様体筋収縮で毛様体小体は弛緩する"},{"id":"o5","text":"毛様体小体が弛緩すると水晶体は厚くなる"}],"answers":["o1"],"why":"誤っているのは『虹彩と水晶体の間を前眼房という』です。前眼房は角膜と虹彩の間で、虹彩と水晶体の間は後眼房です。","option_explanations":{"o1":"誤り。虹彩と水晶体の間は後眼房です。","o2":"正しい。毛様体突起の上皮から産生されます。","o3":"正しい。線維柱帯を経てSchlemm管（強膜静脈洞）へ流出します。","o4":"正しい。近見時には毛様体筋収縮でチン小帯の張力が低下します。","o5":"正しい。小帯が弛緩すると水晶体は弾性で厚くなり屈折力が増します。"},"related":"房水流出障害と眼圧上昇は緑内障の理解に直結します。","tip":"前眼房＝角膜―虹彩、後眼房＝虹彩―水晶体。","glossary":[{"term":"眼房水","desc":"前眼房・後眼房を満たし、角膜・水晶体の栄養や眼圧維持に関与する液体。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["近見調節では毛様体筋収縮→小帯弛緩→水晶体厚くなる。","Schlemm管は房水流出路。"]},{"id":"59A60","round":59,"source":"第59回・午前60（出題内容をもとに学習用再構成）","source_session":"午前","source_no":60,"subject":"解剖学","domain":"筋系","topic":"上肢の筋","concept":"前腕伸筋群の位置関係","secondary":["腕橈骨筋","長橈側手根伸筋","前腕後面","橈側","筋走行"],"question":"前腕を外側から見たとき、腕橈骨筋のすぐ尺側に並ぶ表在筋として最も適切なのはどれか。","options":[{"id":"o1","text":"示指伸筋"},{"id":"o2","text":"小指伸筋"},{"id":"o3","text":"総指伸筋"},{"id":"o4","text":"長橈側手根伸筋"},{"id":"o5","text":"長母指伸筋"}],"answers":["o4"],"why":"正答は長橈側手根伸筋です。前腕外側では腕橈骨筋の後方（尺側寄り）に長橈側手根伸筋が位置し、さらに短橈側手根伸筋が続きます。","option_explanations":{"o1":"示指伸筋は深層伸筋群で遠位に腱が現れます。","o2":"小指伸筋は後面中央寄りの表在伸筋群です。","o3":"総指伸筋は前腕後面中央の大きな表在筋です。","o4":"正しい。腕橈骨筋のすぐ後方・尺側に長橈側手根伸筋が位置します。","o5":"長母指伸筋は深層伸筋群です。"},"related":"前腕伸筋群は『橈側から腕橈骨筋→長橈側手根伸筋→短橈側手根伸筋』の並びが目印になります。","tip":"腕橈骨筋の隣＝長橈側手根伸筋。","glossary":[{"term":"長橈側手根伸筋","desc":"上腕骨外側上顆稜付近から第2中手骨底へ向かい、手関節伸展・橈屈に作用する筋。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":["橈骨神経支配の筋群として整理する。","画像問題では表層・深層と橈尺方向を同時に確認する。"]},{"id":"59A61","round":59,"source":"第59回・午前61（出題内容をもとに学習用再構成）","source_session":"午前","source_no":61,"subject":"生理学","domain":"神経","topic":"反射","concept":"伸張反射","secondary":["Ia群線維","筋紡錘","単シナプス反射","α運動ニューロン","γ運動ニューロン"],"question":"伸張反射について正しいのはどれか。","options":[{"id":"o1","text":"侵害刺激で生じる反射である"},{"id":"o2","text":"基本回路は多シナプス反射である"},{"id":"o3","text":"求心路にはIa群線維が関与する"},{"id":"o4","text":"α運動ニューロンは錘内筋線維を支配する"},{"id":"o5","text":"γ運動ニューロンは拮抗筋の錘外筋線維を支配する"}],"answers":["o3"],"why":"正答は『求心路にはIa群線維が関与する』です。筋紡錘の一次終末からのIa群求心線維が脊髄へ入り、同名筋のα運動ニューロンを興奮させるのが基本回路です。","option_explanations":{"o1":"伸張反射の受容器は筋紡錘で、侵害受容反射とは別です。","o2":"基本回路は単シナプスです。ただし拮抗筋抑制には介在ニューロンが関与します。","o3":"正しい。筋紡錘一次終末のIa群線維が主要な求心路です。","o4":"α運動ニューロンは錘外筋線維を支配します。","o5":"γ運動ニューロンは同じ筋の錘内筋線維を支配し、筋紡錘感度を調節します。"},"related":"腱反射は臨床的に伸張反射を利用した検査で、反射弓の末梢神経・脊髄髄節の評価に使われます。","tip":"Ia→α＝伸張反射。","glossary":[{"term":"Ia群線維","desc":"筋紡錘一次終末からの太い有髄求心線維。"},{"term":"γ運動ニューロン","desc":"錘内筋線維を支配し筋紡錘感度を調整する運動ニューロン。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["相反抑制にはIa抑制性介在ニューロンが関与する。","腱反射の髄節と末梢神経を関連づける。"]},{"id":"59A62","round":59,"source":"第59回・午前62（出題内容をもとに学習用再構成）","source_session":"午前","source_no":62,"subject":"生理学","domain":"神経","topic":"中枢・末梢神経機能","concept":"運動単位","secondary":["運動ニューロン","筋線維","動員","サイズの原理","精密運動"],"question":"運動単位の構成と運動単位の動員について正しいものを2つ選べ。","options":[{"id":"o1","text":"求心性線維も運動単位に含まれる"},{"id":"o2","text":"筋力を徐々に高めると大きな運動単位から先に動員される"},{"id":"o3","text":"活動する運動単位数が増える過程を動員という"},{"id":"o4","text":"精密運動を担う筋ほど1運動ニューロン当たりの筋線維数が多い"},{"id":"o5","text":"1つの運動ニューロンの支配筋線維は活動時にほぼ同時に収縮する"}],"answers":["o3","o5"],"why":"正答は『運動単位数が増える過程を動員という』と『同一運動単位の筋線維はほぼ同時に活動する』です。運動単位は1個のα運動ニューロンとその支配下の錘外筋線維からなります。","option_explanations":{"o1":"求心性線維は運動単位の構成要素ではありません。","o2":"サイズの原理により通常は小さな運動単位から動員されます。","o3":"正しい。活動する運動単位を増やすことをrecruitment（動員）といいます。","o4":"精密な筋ほど1運動ニューロン当たりの筋線維数は少なく、細かな調節が可能です。","o5":"正しい。同一運動単位の筋線維はその運動ニューロンの発火に応じてほぼ同時に活動します。"},"related":"筋力調節には運動単位の動員と発火頻度の増加（rate coding）が関与します。","tip":"小さい運動単位から動員、細かい筋ほど支配比が小さい。","glossary":[{"term":"運動単位","desc":"1個のα運動ニューロンと、そのニューロンが支配する全筋線維の集合。"},{"term":"サイズの原理","desc":"低閾値の小さな運動単位から順に動員される原則。"}],"official_answers":[3,5],"problemImage":null,"problemImageCaption":null,"exam_links":["眼球運動筋や手指筋は神経支配比が小さい。","最大筋力では動員と発火頻度がともに増える。"]},{"id":"59A63","round":59,"source":"第59回・午前63（出題内容をもとに学習用再構成）","source_session":"午前","source_no":63,"subject":"生理学","domain":"自律神経","topic":"自律神経機能","concept":"骨盤内臓神経","secondary":["副交感神経","骨盤内臓神経","S2-S4","排尿","排便"],"question":"副交感神経線維を含む神経として正しいのはどれか。","options":[{"id":"o1","text":"横隔神経"},{"id":"o2","text":"骨盤内臓神経（骨盤神経）"},{"id":"o3","text":"舌下神経"},{"id":"o4","text":"内耳神経"},{"id":"o5","text":"肋間神経"}],"answers":["o2"],"why":"正答は骨盤内臓神経です。骨盤内臓神経はS2〜S4から出る副交感神経性の節前線維を含み、膀胱・直腸・骨盤内臓器の機能調節に関与します。","option_explanations":{"o1":"横隔神経は主にC3〜C5由来の体性運動・感覚神経です。","o2":"正しい。S2〜S4由来の副交感神経です。","o3":"舌下神経は舌筋を支配する体性運動神経です。","o4":"内耳神経は特殊感覚神経です。","o5":"肋間神経は胸神経前枝からなる体性神経です。"},"related":"副交感神経の起始は『脳幹と仙髄』、交感神経は『胸腰髄』と整理します。","tip":"副交感＝脳仙髄、骨盤内臓神経＝S2〜S4。","glossary":[{"term":"骨盤内臓神経","desc":"S2〜S4から起こり骨盤内臓器へ向かう副交感神経性の神経。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["排尿反射では副交感神経が排尿筋収縮を促進する。","直腸・膀胱機能と仙髄損傷の関係を確認する。"]},{"id":"59A64","round":59,"source":"第59回・午前64（出題内容をもとに学習用再構成）","source_session":"午前","source_no":64,"subject":"生理学","domain":"呼吸","topic":"ガス交換・運搬","concept":"肺拡散能","secondary":["DLCO","肺胞表面積","ヘモグロビン","拡散距離","肺胞毛細血管膜"],"question":"肺拡散能に影響する因子を2つ選べ。","options":[{"id":"o1","text":"ヘモグロビン量"},{"id":"o2","text":"死腔換気量"},{"id":"o3","text":"肺胞表面積"},{"id":"o4","text":"気道抵抗"},{"id":"o5","text":"残気量"}],"answers":["o1","o3"],"why":"正答はヘモグロビン量と肺胞表面積です。肺拡散能は肺胞毛細血管膜の表面積・厚さ、ガスの拡散特性、肺毛細血管血液量やヘモグロビン量などの影響を受けます。","option_explanations":{"o1":"正しい。特にDLCOは血液中ヘモグロビン量の影響を受けます。","o2":"死腔換気は有効肺胞換気に影響しますが、膜そのものの拡散能を直接規定する主要因ではありません。","o3":"正しい。表面積が大きいほど拡散能は高くなります。","o4":"気道抵抗は換気力学の要素で、拡散能とは別の概念です。","o5":"残気量そのものは拡散能の主要決定因子ではありません。"},"related":"肺気腫では表面積低下、間質性肺疾患では膜の肥厚などによりDLCOが低下しやすくなります。","tip":"拡散＝面積↑で増え、膜厚↑で減る。","glossary":[{"term":"DLCO","desc":"一酸化炭素を用いて評価する肺拡散能の代表的指標。"}],"official_answers":[1,3],"problemImage":null,"problemImageCaption":null,"exam_links":["貧血ではDLCOが低く評価されうる。","換気障害と拡散障害を区別する。"]},{"id":"59A65","round":59,"source":"第59回・午前65（出題内容をもとに学習用再構成）","source_session":"午前","source_no":65,"subject":"生理学","domain":"血液・免疫","topic":"凝固・免疫","concept":"線溶系","secondary":["プラスミノゲン","プラスミン","フィブリン","線溶","tPA"],"question":"線維素溶解（線溶）系で中心的に働く前駆体はどれか。","options":[{"id":"o1","text":"カルシウムイオン"},{"id":"o2","text":"フィブリノゲン"},{"id":"o3","text":"プラスミノゲン"},{"id":"o4","text":"プロトロンビン"},{"id":"o5","text":"von Willebrand因子"}],"answers":["o3"],"why":"正答はプラスミノゲンです。プラスミノゲンはtPAなどでプラスミンに活性化され、フィブリン血栓を分解します。","option_explanations":{"o1":"カルシウムは凝固カスケードの複数段階で必要です。","o2":"フィブリノゲンはトロンビンによりフィブリンへ変換されます。","o3":"正しい。プラスミンの前駆体で、線溶系の中心です。","o4":"プロトロンビンはトロンビンの前駆体で凝固系に属します。","o5":"vWFは血小板粘着や第VIII因子安定化に関与します。"},"related":"凝固系と線溶系は対になる仕組みです。『プロトロンビン→トロンビン→フィブリン』と『プラスミノゲン→プラスミン→フィブリン分解』を対比します。","tip":"凝固はトロンビン、線溶はプラスミン。","glossary":[{"term":"プラスミン","desc":"フィブリンを分解する線溶系のセリンプロテアーゼ。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["Dダイマーは架橋フィブリン分解産物。","tPAはプラスミノゲン活性化因子。"]},{"id":"59A66","round":59,"source":"第59回・午前66（出題内容をもとに学習用再構成）","source_session":"午前","source_no":66,"subject":"生理学","domain":"血液・免疫","topic":"凝固・免疫","concept":"免疫グロブリン","secondary":["IgG","IgA","IgM","IgE","胎盤通過"],"question":"免疫グロブリンについて正しいのはどれか。","options":[{"id":"o1","text":"IgGは胎盤を通過する"},{"id":"o2","text":"IgMは唾液の主要免疫グロブリンである"},{"id":"o3","text":"IgDは肥満細胞を主に活性化する"},{"id":"o4","text":"血漿中で最も多いのはIgAである"},{"id":"o5","text":"T細胞が抗原刺激を受けて免疫グロブリンを産生する"}],"answers":["o1"],"why":"正答は『IgGは胎盤を通過する』です。IgGは血中で最も多く、胎盤通過により胎児・新生児へ受動免疫を与えます。","option_explanations":{"o1":"正しい。Fc受容体を介して胎盤を通過します。","o2":"唾液・涙・母乳など分泌液ではIgAが主要です。","o3":"肥満細胞・好塩基球と強く関連するのはIgEです。","o4":"血漿中で最も多いのはIgGです。","o5":"抗体を産生するのはB細胞が分化した形質細胞です。"},"related":"IgMは初期免疫応答、IgAは粘膜、IgEはアレルギー、IgGは二次応答・胎盤通過と整理します。","tip":"G＝胎盤、A＝粘膜、E＝アレルギー、M＝最初。","glossary":[{"term":"受動免疫","desc":"他者が作った抗体を受け取ることで得られる免疫。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["母乳では分泌型IgAが重要。","IgMは五量体で補体活性化能が高い。"]},{"id":"59A67","round":59,"source":"第59回・午前67（出題内容をもとに学習用再構成）","source_session":"午前","source_no":67,"subject":"生理学","domain":"咀嚼・嚥下・消化・吸収","topic":"消化吸収","concept":"肝機能","secondary":["尿素回路","薬物代謝","胆汁","グリコーゲン","解毒"],"question":"成人の肝臓の機能として正しいものを2つ選べ。","options":[{"id":"o1","text":"血球を主に産生する"},{"id":"o2","text":"胆汁を貯蔵する"},{"id":"o3","text":"尿素を生成する"},{"id":"o4","text":"薬物を代謝する"},{"id":"o5","text":"グルカゴンを分泌する"}],"answers":["o3","o4"],"why":"正答は尿素生成と薬物代謝です。肝臓ではアンモニアを尿素回路で尿素へ変換し、シトクロムP450系などで多くの薬物を代謝します。","option_explanations":{"o1":"胎児期には造血に関与しますが、成人の主要造血器官は骨髄です。","o2":"胆汁を生成するのは肝臓ですが、主な貯蔵・濃縮は胆嚢です。","o3":"正しい。アンモニアを尿素へ変換します。","o4":"正しい。多くの薬物・毒物を代謝します。","o5":"グルカゴンは膵島α細胞から分泌されます。"},"related":"肝機能は代謝・解毒・胆汁生成・血漿蛋白合成・尿素生成など多岐にわたります。","tip":"肝臓＝作る（胆汁・蛋白・尿素）＋代謝・解毒。","glossary":[{"term":"尿素回路","desc":"有害なアンモニアを尿素へ変換する肝臓の代謝経路。"}],"official_answers":[3,4],"problemImage":null,"problemImageCaption":null,"exam_links":["アルブミン・凝固因子の合成も肝機能。","高アンモニア血症と肝性脳症を関連づける。"]},{"id":"59A68","round":59,"source":"第59回・午前68（出題内容をもとに学習用再構成）","source_session":"午前","source_no":68,"subject":"生理学","domain":"内分泌・栄養・代謝","topic":"ホルモン","concept":"下垂体後葉ホルモン","secondary":["バソプレシン","オキシトシン","下垂体後葉","視床下部"],"question":"同じ内分泌器官から血中へ放出される組合せとして正しいのはどれか。","options":[{"id":"o1","text":"アルドステロン ― エリスロポエチン"},{"id":"o2","text":"グルカゴン ― ガストリン"},{"id":"o3","text":"バソプレシン ― オキシトシン"},{"id":"o4","text":"パラトルモン ― カルシトニン"},{"id":"o5","text":"レニン ― コルチゾール"}],"answers":["o3"],"why":"正答はバソプレシンとオキシトシンです。両者は視床下部で合成され、軸索輸送された後、下垂体後葉から血中へ放出されます。","option_explanations":{"o1":"アルドステロンは副腎皮質、エリスロポエチンは主に腎臓です。","o2":"グルカゴンは膵臓、ガストリンは主に胃前庭部G細胞です。","o3":"正しい。いずれも下垂体後葉から放出されます。","o4":"PTHは副甲状腺、カルシトニンは甲状腺C細胞です。","o5":"レニンは腎臓、コルチゾールは副腎皮質です。"},"related":"『合成部位』と『分泌・放出部位』を分けて覚えることが重要です。ADHとオキシトシンは視床下部で合成されます。","tip":"ADH・オキシトシン＝視床下部で作り、後葉から出す。","glossary":[{"term":"バソプレシン","desc":"抗利尿ホルモン（ADH）。腎集合管で水再吸収を促進する。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["下垂体前葉ホルモンとの違いを整理する。","ADH不足では中枢性尿崩症をきたす。"]},{"id":"59A69","round":59,"source":"第59回・午前69（出題内容をもとに学習用再構成）","source_session":"午前","source_no":69,"subject":"生理学","domain":"内分泌・栄養・代謝","topic":"代謝","concept":"安静時代謝","secondary":["基礎代謝量","安静時代謝量","呼吸商","METs","体重減少"],"question":"エネルギー代謝について正しいのはどれか。","options":[{"id":"o1","text":"基礎代謝量は安静時代謝量より通常大きい"},{"id":"o2","text":"安静時代謝量は体重減少に伴って低下しやすい"},{"id":"o3","text":"糖質利用が増えると呼吸商は低下する"},{"id":"o4","text":"1 METは基礎代謝量そのものを基準とする"},{"id":"o5","text":"エネルギー代謝率RMRは安静時代謝量だけを分母にする"}],"answers":["o2"],"why":"正答は『安静時代謝量は体重減少に伴って低下しやすい』です。除脂肪量を含む体格が小さくなると、安静時のエネルギー消費も一般に低下します。","option_explanations":{"o1":"安静時代謝量は測定条件が基礎代謝量より緩く、通常は基礎代謝量よりやや高値です。","o2":"正しい。体重、とくに除脂肪量の減少で安静時代謝量は低下しやすくなります。","o3":"糖質の呼吸商は約1.0で、脂質より高いため糖質利用増加で上昇します。","o4":"METは安静時酸素摂取量（便宜上3.5 mL/kg/min）を1とする指標です。","o5":"日本でいうエネルギー代謝率RMRは活動時代謝増加量を基礎代謝量で除す考え方で、単純に安静時代謝量だけを分母としません。"},"related":"呼吸商は糖質1.0、脂質約0.7、蛋白質約0.8が目安です。","tip":"RQ：糖1.0、脂0.7。MET＝安静を1。","glossary":[{"term":"安静時代謝量","desc":"安静状態で消費されるエネルギー量。基礎代謝より測定条件が緩い。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["減量時の代謝適応も安静時代謝量に影響する。","METsは運動強度の実用的指標。"]},{"id":"59A70","round":59,"source":"第59回・午前70（出題内容をもとに学習用再構成）","source_session":"午前","source_no":70,"subject":"運動学","domain":"四肢・体幹の運動","topic":"顔面・頭頸部","concept":"下顎運動","secondary":["外側翼突筋","咬筋","顎二腹筋","下顎前突"],"question":"筋と下顎運動の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"咬筋 ― 下制"},{"id":"o2","text":"顎二腹筋 ― 挙上"},{"id":"o3","text":"外側翼突筋 ― 前突"},{"id":"o4","text":"内側翼突筋 ― 後退"},{"id":"o5","text":"オトガイ舌筋 ― 側方移動"}],"answers":["o3"],"why":"正答は『外側翼突筋―前突』です。両側外側翼突筋は下顎頭・関節円板を前方へ引き、下顎前突に関与します。","option_explanations":{"o1":"咬筋は主に下顎を挙上します。","o2":"顎二腹筋は舌骨固定下で下顎を下制します。","o3":"正しい。外側翼突筋は下顎前突・開口に関与します。","o4":"内側翼突筋は主に挙上・前突に関与します。","o5":"オトガイ舌筋は舌筋で、下顎の側方移動筋ではありません。"},"related":"咀嚼筋では咬筋・側頭筋・内側翼突筋は挙上、外側翼突筋は前突・開口への関与が重要です。","tip":"外側翼突筋＝前へ引く。","glossary":[{"term":"外側翼突筋","desc":"下顎頭・関節円板へ付着し、前突や開口、側方運動に関与する咀嚼筋。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["咀嚼筋の支配は三叉神経第3枝。","側方運動では左右の翼突筋が非対称に活動する。"]},{"id":"59A71","round":59,"source":"第59回・午前71（出題内容をもとに学習用再構成）","source_session":"午前","source_no":71,"subject":"運動学","domain":"四肢・体幹の運動","topic":"手関節・手指","concept":"手関節・手指の運動","secondary":["橈骨手根関節","運動軸","PIP関節","母指対立","手のアーチ"],"question":"手関節・手指の運動について正しいのはどれか。","options":[{"id":"o1","text":"橈骨手根関節は2軸性関節である"},{"id":"o2","text":"PIP関節の側副靱帯は伸展位で完全に弛緩する"},{"id":"o3","text":"長母指外転筋は手関節背屈の主働筋である"},{"id":"o4","text":"手関節橈屈可動域は前腕回内位で必ず大きくなる"},{"id":"o5","text":"母指対立時の横アーチ形成は第2CM関節の大きな可動性が中心となる"}],"answers":["o1"],"why":"正答は『橈骨手根関節は2軸性関節である』です。橈骨手根関節は楕円関節で、屈曲・伸展と橈屈・尺屈の2軸運動を行います。","option_explanations":{"o1":"正しい。二軸性の楕円関節です。","o2":"PIP関節の側副靱帯は安定性を担い、単純に伸展位で完全弛緩とするのは不適切です。","o3":"長母指外転筋は母指CM関節の外転などが主作用で、手関節背屈の主働筋ではありません。","o4":"前腕位だけでこのように一律には規定できません。","o5":"母指対立では可動性の高い第1CM関節と第4・5CM関節などが重要で、第2CM関節は比較的強固です。"},"related":"手関節運動は橈骨手根関節と手根中央関節が協調して生じます。","tip":"橈骨手根関節＝楕円関節＝2軸。","glossary":[{"term":"楕円関節","desc":"直交する2軸の運動を許す関節形式。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["MCP関節も屈伸と内外転を行う2軸性関節。","母指CM関節は鞍関節。"]},{"id":"59A72","round":59,"source":"第59回・午前72（出題内容をもとに学習用再構成）","source_session":"午前","source_no":72,"subject":"運動学","domain":"四肢・体幹の運動","topic":"足関節・足部","concept":"足部運動と関節構造","secondary":["ヒラメ筋","内がえし","足根中足関節","滑り運動","足部アーチ"],"question":"足部・足関節の機能について正しいものを2つ選べ。","options":[{"id":"o1","text":"距腿関節は独立した2軸をもつ"},{"id":"o2","text":"後脛骨筋は外がえしの主働筋である"},{"id":"o3","text":"ヒラメ筋は底屈に加えて足部内がえし方向へ作用しうる"},{"id":"o4","text":"足根中足関節では滑り運動が主体となる"},{"id":"o5","text":"立方骨は内側縦アーチの主要構成骨である"}],"answers":["o3","o4"],"why":"正答は『ヒラメ筋は内がえし方向へ作用しうる』と『足根中足関節では滑り運動が主体』です。距腿関節は主に背屈・底屈を担う1軸性関節で、足根中足関節は平面関節として小さな滑りを行います。","option_explanations":{"o1":"距腿関節は主に背屈・底屈を行う1軸性の蝶番関節として扱います。","o2":"後脛骨筋は内がえし・底屈に作用します。","o3":"正しい。アキレス腱を介するヒラメ筋は底屈に加え、足部を内がえし方向へ導く成分をもちます。","o4":"正しい。足根中足関節は小さな滑り運動を行います。","o5":"立方骨は主に外側縦アーチに関与します。"},"related":"内側縦アーチは踵骨・距骨・舟状骨・楔状骨・第1〜3中足骨、外側縦アーチは踵骨・立方骨・第4〜5中足骨が中心です。","tip":"後脛骨筋＝内がえし、立方骨＝外側縦アーチ。","glossary":[{"term":"足根中足関節","desc":"足根骨と中足骨の間の関節群。Lisfranc関節とも呼ばれる。"}],"official_answers":[3,4],"problemImage":null,"problemImageCaption":null,"exam_links":["距骨下関節は内外がえしに重要。","足部アーチの構成骨は頻出。"],"scoring_status":"採点調整","official_note":"厚生労働省の訂正版では原問題の正答として3と4の両方を認めている。本アプリでは2つ選択する形式に再構成し、診断から除外する。","excludeFromDiagnosis":true},{"id":"59A73","round":59,"source":"第59回・午前73（出題内容をもとに学習用再構成）","source_session":"午前","source_no":73,"subject":"運動学","domain":"四肢・体幹の運動","topic":"体幹","concept":"体幹筋の片側作用","secondary":["外腹斜筋","内腹斜筋","脊柱起立筋","腰方形筋","体幹側屈"],"question":"片側の筋収縮と体幹運動の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"外腹斜筋 ― 同側側屈"},{"id":"o2","text":"脊柱起立筋 ― 対側側屈"},{"id":"o3","text":"内腹斜筋 ― 対側回旋"},{"id":"o4","text":"腹直筋 ― 対側回旋"},{"id":"o5","text":"腰方形筋 ― 同側回旋"}],"answers":["o1"],"why":"正答は『外腹斜筋―同側側屈』です。外腹斜筋は片側収縮で同側側屈と反対側回旋に関与します。","option_explanations":{"o1":"正しい。外腹斜筋は同側側屈・反対側回旋に作用します。","o2":"脊柱起立筋の片側収縮は主に同側側屈に作用します。","o3":"内腹斜筋は主に同側回旋に作用します。","o4":"腹直筋は両側性に体幹屈曲を担い、主たる回旋筋ではありません。","o5":"腰方形筋は主に同側側屈や骨盤挙上に作用します。"},"related":"外腹斜筋と反対側内腹斜筋は協調して同じ方向への体幹回旋をつくります。","tip":"外腹斜筋＝反対回旋、内腹斜筋＝同側回旋。","glossary":[{"term":"外腹斜筋","desc":"腹壁外側の筋。体幹屈曲・同側側屈・反対側回旋に関与する。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["体幹回旋の筋活動を左右で考える。","腰方形筋は骨盤挙上にも関与。"]},{"id":"59A74","round":59,"source":"第59回・午前74（出題内容をもとに学習用再構成）","source_session":"午前","source_no":74,"subject":"運動学","domain":"歩行","topic":"歩行周期","concept":"歩行中の重心移動","secondary":["立脚中期","重心","歩行周期","上下動"],"question":"健常成人の歩行で身体重心が最も高くなる時期はどれか。","options":[{"id":"o1","text":"初期接地"},{"id":"o2","text":"荷重応答期"},{"id":"o3","text":"立脚中期"},{"id":"o4","text":"立脚終期"},{"id":"o5","text":"前遊脚期"}],"answers":["o3"],"why":"正答は立脚中期です。立脚中期では支持脚の上を身体が通過し、身体重心の上下移動が最も高い位置になります。","option_explanations":{"o1":"初期接地では重心は立脚中期より低い位置です。","o2":"荷重応答期では重心が下降方向へ移ります。","o3":"正しい。支持脚上を通過する立脚中期で重心は高くなります。","o4":"立脚終期では重心は次第に下降へ向かいます。","o5":"前遊脚期では両脚支持となり重心は低くなります。"},"related":"健常歩行では重心の上下動を小さくしてエネルギー消費を抑える機構が働きます。","tip":"重心最高＝立脚中期、最低＝両脚支持付近。","glossary":[{"term":"立脚中期","desc":"反対側足部が床から離れてから、身体重心が支持足上を通過する時期。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["歩行周期8相の順序を確認する。","骨盤回旋や膝屈曲は重心上下動を抑える要素。"]},{"id":"59B51","round":59,"source":"第59回・午後51（出題内容をもとに学習用再構成）","source_session":"午後","source_no":51,"subject":"解剖学","domain":"骨格系","topic":"関節の基礎","concept":"関節形式","secondary":["車軸関節","上橈尺関節","球関節","鞍関節","蝶番関節"],"question":"関節と関節形式の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"肩関節 ― 臼状関節"},{"id":"o2","text":"胸鎖関節 ― 蝶番関節"},{"id":"o3","text":"上橈尺関節 ― 車軸関節"},{"id":"o4","text":"腕尺関節 ― 球関節"},{"id":"o5","text":"MCP関節 ― 鞍関節"}],"answers":["o3"],"why":"正答は『上橈尺関節―車軸関節』です。上橈尺関節では橈骨頭が輪状靱帯内で回旋し、前腕の回内・回外に関与します。","option_explanations":{"o1":"肩甲上腕関節は球関節です。","o2":"胸鎖関節は鞍関節として分類されます。","o3":"正しい。上橈尺関節は車軸関節です。","o4":"腕尺関節は蝶番関節です。","o5":"MCP関節は顆状（楕円）関節です。"},"related":"関節形式は運動自由度とセットで覚えると整理しやすくなります。","tip":"回内外＝橈尺関節＝車軸。","glossary":[{"term":"車軸関節","desc":"一つの骨が長軸周りに回転する1軸性関節。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["下橈尺関節も車軸関節。","母指CM関節は鞍関節。"]},{"id":"59B52","round":59,"source":"第59回・午後52（出題内容をもとに学習用再構成）","source_session":"午後","source_no":52,"subject":"解剖学","domain":"体表解剖","topic":"ランドマーク","concept":"Jacoby線","secondary":["Jacoby線","腸骨稜","L4","腰椎穿刺"],"question":"左右の腸骨稜最高点を結ぶJacoby線が通る目安となる椎骨はどれか。","options":[{"id":"o1","text":"T12"},{"id":"o2","text":"L1"},{"id":"o3","text":"L2"},{"id":"o4","text":"L3"},{"id":"o5","text":"L4"}],"answers":["o5"],"why":"正答はL4です。Jacoby線（Tuffier線）は左右の腸骨稜最高点を結ぶ線で、一般にL4棘突起またはL4/5椎間付近を通る体表指標です。","option_explanations":{"o1":"T12はより頭側です。","o2":"L1はより頭側です。","o3":"L2はより頭側です。","o4":"L3は通常Jacoby線より頭側です。","o5":"正しい。L4棘突起付近が代表的な目安です。"},"related":"腰椎穿刺では脊髄円錐より尾側のL3/4やL4/5椎間が選ばれ、Jacoby線がランドマークになります。","tip":"腸骨稜の最高点を結ぶ＝L4付近。","glossary":[{"term":"Jacoby線","desc":"左右の腸骨稜最高点を結ぶ体表上の線。腰椎レベル推定に使う。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["成人の脊髄円錐はL1〜L2付近。","腰椎穿刺の安全な高さと関連づける。"]},{"id":"59B53","round":59,"source":"第59回・午後53（出題内容をもとに学習用再構成）","source_session":"午後","source_no":53,"subject":"解剖学","domain":"神経系","topic":"脳神経","concept":"滑車神経","secondary":["滑車神経","上斜筋","外眼筋","動眼神経","外転神経"],"question":"滑車神経が支配する外眼筋はどれか。","options":[{"id":"o1","text":"下斜筋"},{"id":"o2","text":"下直筋"},{"id":"o3","text":"上斜筋"},{"id":"o4","text":"上直筋"},{"id":"o5","text":"外側直筋"}],"answers":["o3"],"why":"正答は上斜筋です。滑車神経（第IV脳神経）は上斜筋のみを支配します。","option_explanations":{"o1":"下斜筋は動眼神経支配です。","o2":"下直筋は動眼神経支配です。","o3":"正しい。上斜筋は滑車神経支配です。","o4":"上直筋は動眼神経支配です。","o5":"外側直筋は外転神経支配です。"},"related":"外眼筋の支配は『LR6 SO4、残り3』と整理できます。LR＝外側直筋、SO＝上斜筋です。","tip":"外側直筋VI、上斜筋IV、その他III。","glossary":[{"term":"滑車神経","desc":"第IV脳神経。上斜筋を支配する純運動性脳神経。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["上斜筋は内旋・下転などに関与する。","脳神経麻痺と複視方向を関連づける。"]},{"id":"59B54","round":59,"source":"第59回・午後54（出題内容をもとに学習用再構成）","source_session":"午後","source_no":54,"subject":"解剖学","domain":"神経系","topic":"伝導路","concept":"温痛覚伝導路","secondary":["外側脊髄視床路","温痛覚","交叉","前外側系"],"question":"体幹・四肢の温痛覚を主に伝える上行路はどれか。","options":[{"id":"o1","text":"脊髄小脳路"},{"id":"o2","text":"皮質脊髄路"},{"id":"o3","text":"前脊髄視床路"},{"id":"o4","text":"網様体脊髄路"},{"id":"o5","text":"外側脊髄視床路"}],"answers":["o5"],"why":"正答は外側脊髄視床路です。温痛覚は後根から脊髄へ入り、主に後角でニューロンを替え、前白交連を通って反対側へ交叉し外側脊髄視床路を上行します。","option_explanations":{"o1":"脊髄小脳路は主に無意識的固有感覚を伝えます。","o2":"皮質脊髄路は下行性運動路です。","o3":"前脊髄視床路は主に粗大触覚・圧覚に関係します。","o4":"網様体脊髄路は下行性運動・姿勢調節系です。","o5":"正しい。温痛覚の主要経路です。"},"related":"脊髄半側損傷では温痛覚障害が病変より下位で対側に出るというBrown-Séquard症候群につながります。","tip":"温痛覚＝外側脊髄視床路。","glossary":[{"term":"前外側系","desc":"温痛覚・粗大触覚などを伝える脊髄上行路の総称。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["後索内側毛帯路は識別性触覚・振動覚・意識的固有感覚。","交叉部位の違いを経路ごとに整理する。"]},{"id":"59B55","round":59,"source":"第59回・午後55（出題内容をもとに学習用再構成）","source_session":"午後","source_no":55,"subject":"解剖学","domain":"神経系","topic":"伝導路","concept":"一次感覚ニューロン","secondary":["後根神経節","一次ニューロン","偽単極性ニューロン","体性感覚"],"question":"体幹・四肢の一般体性感覚で、一次感覚ニューロンの細胞体が主に存在するのはどこか。","options":[{"id":"o1","text":"脊髄後角"},{"id":"o2","text":"後索"},{"id":"o3","text":"前角"},{"id":"o4","text":"側索"},{"id":"o5","text":"後根神経節"}],"answers":["o5"],"why":"正答は後根神経節です。体性感覚の一次ニューロンは偽単極性ニューロンで、その細胞体は後根神経節にあります。","option_explanations":{"o1":"後角には主に二次ニューロンや介在ニューロンがあります。","o2":"後索は上行線維が走行する白質です。","o3":"前角には主に下位運動ニューロンがあります。","o4":"側索は複数の上行・下行路を含む白質です。","o5":"正しい。一次感覚ニューロンの細胞体が存在します。"},"related":"顔面の一般感覚では三叉神経節などが一次ニューロン細胞体の場になります。","tip":"体性感覚の一次ニューロン＝後根神経節。","glossary":[{"term":"後根神経節","desc":"脊髄神経後根にある感覚ニューロン細胞体の集まり。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["前角＝運動、後根神経節＝感覚という対比。","後索路と脊髄視床路で二次ニューロンの位置が異なる。"]},{"id":"59B56","round":59,"source":"第59回・午後56（出題内容をもとに学習用再構成）","source_session":"午後","source_no":56,"subject":"解剖学","domain":"神経系","topic":"上肢末梢神経","concept":"腋窩神経","secondary":["腋窩神経","三角筋","後神経束","四辺形間隙","上外側上腕皮神経"],"question":"腋窩神経について正しいのはどれか。","options":[{"id":"o1","text":"三角筋を支配する"},{"id":"o2","text":"広背筋を支配する"},{"id":"o3","text":"後骨間神経を分枝する"},{"id":"o4","text":"上腕内側の皮膚感覚を主に支配する"},{"id":"o5","text":"腕神経叢の外側神経束から分枝する"}],"answers":["o1"],"why":"正答は『三角筋を支配する』です。腋窩神経は腕神経叢後神経束から分かれ、三角筋と小円筋を支配します。","option_explanations":{"o1":"正しい。三角筋の主要運動神経です。","o2":"広背筋は胸背神経支配です。","o3":"後骨間神経は橈骨神経深枝の続きです。","o4":"腋窩神経の皮枝は上腕外側上部の感覚を担います。","o5":"腋窩神経は後神経束から分岐します。"},"related":"腋窩神経は上腕骨外科頸骨折や肩関節脱臼で障害されやすい神経です。","tip":"腋窩神経＝後神経束→三角筋・小円筋。","glossary":[{"term":"四辺形間隙","desc":"腋窩神経と後上腕回旋動脈が通過する肩後面の間隙。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["腋窩神経障害では肩外転筋力低下と上腕外側上部感覚障害。","後神経束からは橈骨神経も分岐する。"]},{"id":"59B57","round":59,"source":"第59回・午後57（出題内容をもとに学習用再構成）","source_session":"午後","source_no":57,"subject":"解剖学","domain":"応用解剖","topic":"機能・局所・断層","concept":"後腹膜臓器","secondary":["後腹膜","腎臓","十二指腸","腹膜内臓器"],"question":"後腹膜に位置する臓器を2つ選べ。","options":[{"id":"o1","text":"胃"},{"id":"o2","text":"空腸"},{"id":"o3","text":"腎臓"},{"id":"o4","text":"横行結腸"},{"id":"o5","text":"十二指腸"}],"answers":["o3","o5"],"why":"正答は腎臓と十二指腸です。腎臓は一次性後腹膜臓器で、十二指腸の大部分（第2〜4部など）は二次性後腹膜臓器です。","option_explanations":{"o1":"胃は腹膜内臓器です。","o2":"空腸は腸間膜をもち腹膜内にあります。","o3":"正しい。腎臓は代表的な後腹膜臓器です。","o4":"横行結腸は横行結腸間膜をもち腹膜内にあります。","o5":"正しい。十二指腸の大部分は後腹膜に固定されています。"},"related":"後腹膜臓器として腎臓・副腎・尿管・膵臓の大部分・十二指腸の大部分・上行/下行結腸などを整理します。","tip":"腎・尿管・膵の大部・十二指腸の大部＝後腹膜。","glossary":[{"term":"後腹膜","desc":"壁側腹膜の後方にある解剖学的空間。"}],"official_answers":[3,5],"problemImage":null,"problemImageCaption":null,"exam_links":["十二指腸第1部近位は腹膜内成分をもつ。","膵尾は脾腎間膜内に位置し例外として扱う。"]},{"id":"59B58","round":59,"source":"第59回・午後58（出題内容をもとに学習用再構成）","source_session":"午後","source_no":58,"subject":"解剖学","domain":"内臓諸器官","topic":"内分泌腺","concept":"甲状腺ホルモン","secondary":["カルシトニン","甲状腺C細胞","甲状腺ホルモン","副甲状腺"],"question":"甲状腺から分泌されるホルモンはどれか。","options":[{"id":"o1","text":"メラトニン"},{"id":"o2","text":"オキシトシン"},{"id":"o3","text":"カルシトニン"},{"id":"o4","text":"バソプレシン"},{"id":"o5","text":"パラトルモン"}],"answers":["o3"],"why":"正答はカルシトニンです。カルシトニンは甲状腺の傍濾胞細胞（C細胞）から分泌され、血中カルシウム濃度を低下させる方向に働きます。","option_explanations":{"o1":"メラトニンは松果体から分泌されます。","o2":"オキシトシンは下垂体後葉から放出されます。","o3":"正しい。甲状腺C細胞から分泌されます。","o4":"バソプレシンは下垂体後葉から放出されます。","o5":"パラトルモン（PTH）は副甲状腺から分泌されます。"},"related":"甲状腺濾胞細胞はT3/T4、C細胞はカルシトニンを分泌します。","tip":"甲状腺C細胞＝カルシトニン。","glossary":[{"term":"カルシトニン","desc":"骨吸収抑制などを介し血中Ca濃度を下げる方向に働くホルモン。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["PTHは血中Caを上げる方向に働く。","T3/T4は基礎代謝を高める。"]},{"id":"59B59","round":59,"source":"第59回・午後59（出題内容をもとに学習用再構成）","source_session":"午後","source_no":59,"subject":"解剖学","domain":"感覚器","topic":"特殊感覚","concept":"前庭器","secondary":["半規管","角加速度","耳石器","直線加速度","前庭神経"],"question":"平衡聴覚器について正しいのはどれか。","options":[{"id":"o1","text":"耳石器は鼓室にある"},{"id":"o2","text":"蝸牛神経は耳管を通る"},{"id":"o3","text":"半規管は角加速度を検出する"},{"id":"o4","text":"アブミ骨筋は前庭神経支配である"},{"id":"o5","text":"内耳道は内リンパ液で満たされる"}],"answers":["o3"],"why":"正答は『半規管は角加速度を検出する』です。三半規管の膨大部稜は頭部回転による角加速度を検出します。","option_explanations":{"o1":"耳石器（卵形嚢・球形嚢）は前庭にあります。","o2":"蝸牛神経は前庭蝸牛神経として内耳道を通ります。耳管ではありません。","o3":"正しい。半規管は回転運動の角加速度を検出します。","o4":"アブミ骨筋は顔面神経支配です。","o5":"内耳道は神経・血管が通る骨性管で、内リンパで満たされる空間ではありません。"},"related":"耳石器は直線加速度・重力、半規管は角加速度という対比が頻出です。","tip":"耳石＝直線、半規管＝回転。","glossary":[{"term":"耳石器","desc":"卵形嚢と球形嚢。直線加速度と頭部傾斜を検出する。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["前庭眼反射と半規管の関係を確認する。","蝸牛は聴覚、前庭・半規管は平衡覚。"]},{"id":"59B60","round":59,"source":"第59回・午後60（出題内容をもとに学習用再構成）","source_session":"午後","source_no":60,"subject":"解剖学","domain":"組織","topic":"細胞・組織","concept":"中心小体","secondary":["中心小体","中心体","紡錘体","細胞分裂"],"question":"体細胞分裂の開始時に紡錘体形成へ深く関与する細胞内小器官はどれか。","options":[{"id":"o1","text":"核小体"},{"id":"o2","text":"小胞体"},{"id":"o3","text":"中心小体"},{"id":"o4","text":"Golgi装置"},{"id":"o5","text":"ミトコンドリア"}],"answers":["o3"],"why":"正答は中心小体です。動物細胞では中心小体を含む中心体が微小管形成中心として働き、分裂時の紡錘体形成に重要です。","option_explanations":{"o1":"核小体は主にrRNA合成とリボソーム形成に関与します。","o2":"小胞体は蛋白・脂質合成などに関与します。","o3":"正しい。中心体の構成要素として紡錘体形成に関与します。","o4":"Golgi装置は蛋白の修飾・仕分けに関与します。","o5":"ミトコンドリアはATP産生に重要です。"},"related":"細胞周期ではDNA複製後にM期へ進み、微小管が染色体分離を担います。","tip":"分裂の紡錘体＝中心体・微小管。","glossary":[{"term":"中心小体","desc":"微小管からなる円筒状構造で、中心体を構成する。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["微小管阻害薬は細胞分裂に影響する。","核小体・Golgi・ミトコンドリアの機能も対比する。"]},{"id":"59B61","round":59,"source":"第59回・午後61（出題内容をもとに学習用再構成）","source_session":"午後","source_no":61,"subject":"生理学","domain":"神経","topic":"興奮・伝導","concept":"C線維","secondary":["C線維","無髄線維","伝導速度","痛覚","自律神経"],"question":"末梢神経のC線維について正しいのはどれか。","options":[{"id":"o1","text":"有髄線維である"},{"id":"o2","text":"骨格筋を直接支配する"},{"id":"o3","text":"筋紡錘一次終末からの求心線維である"},{"id":"o4","text":"B線維より直径が小さい"},{"id":"o5","text":"Aα線維より伝導速度が速い"}],"answers":["o4"],"why":"正答は『B線維より直径が小さい』です。C線維は細い無髄線維で、伝導速度が遅く、遅い痛覚・温度覚や自律神経節後線維などにみられます。","option_explanations":{"o1":"C線維は無髄です。","o2":"骨格筋運動線維は主に太いAα線維です。","o3":"筋紡錘一次終末はIa群（Aα相当）の太い有髄線維です。","o4":"正しい。B線維より細く、伝導速度も遅いです。","o5":"Aα線維は最も太く速い群で、C線維は遅いです。"},"related":"一般に線維径が大きく髄鞘があるほど伝導速度は速くなります。","tip":"C＝細い・無髄・遅い。","glossary":[{"term":"C線維","desc":"直径が小さい無髄末梢神経線維。遅い痛覚などを伝える。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":["Aδ線維は速い痛み、C線維は遅い痛み。","自律神経節前線維はB、節後線維は多くがC。"]},{"id":"59B62","round":59,"source":"第59回・午後62（出題内容をもとに学習用再構成）","source_session":"午後","source_no":62,"subject":"生理学","domain":"自律神経","topic":"自律神経機能","concept":"副腎髄質","secondary":["交感神経節前線維","副腎髄質","アドレナリン","クロム親和性細胞"],"question":"交感神経の節前線維によって直接刺激される器官はどれか。","options":[{"id":"o1","text":"肝臓"},{"id":"o2","text":"心臓"},{"id":"o3","text":"気管支"},{"id":"o4","text":"唾液腺"},{"id":"o5","text":"副腎髄質"}],"answers":["o5"],"why":"正答は副腎髄質です。副腎髄質のクロム親和性細胞は修飾された交感神経節後ニューロンに相当し、交感神経節前線維から直接アセチルコリン性入力を受けます。","option_explanations":{"o1":"肝臓への交感神経は通常、交感神経節を介した節後線維が作用します。","o2":"心臓も交感神経節後線維の支配を受けます。","o3":"気管支も通常は節後線維を介します。","o4":"唾液腺への交感神経も節後線維を介します。","o5":"正しい。副腎髄質は節前線維から直接刺激を受けます。"},"related":"副腎髄質は神経性刺激を血中カテコールアミン放出へ変換するため、『交感神経節の特殊型』として理解できます。","tip":"副腎髄質＝節前線維が直接。","glossary":[{"term":"クロム親和性細胞","desc":"副腎髄質にあり、アドレナリン・ノルアドレナリンを分泌する細胞。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["交感神経節前線維の伝達物質はアセチルコリン。","副腎皮質はACTHなど内分泌性調節を受ける。"]},{"id":"59B63","round":59,"source":"第59回・午後63（出題内容をもとに学習用再構成）","source_session":"午後","source_no":63,"subject":"生理学","domain":"呼吸","topic":"ガス交換・運搬","concept":"呼吸商","secondary":["呼吸商","二酸化炭素産生量","酸素消費量","酸素解離曲線"],"question":"呼吸の生理について正しいのはどれか。","options":[{"id":"o1","text":"安静呼気時に横隔神経活動が増大する"},{"id":"o2","text":"迷走神経活動が亢進すると気道抵抗は低下する"},{"id":"o3","text":"肺コンプライアンス増加で機能的残気量は必ず減少する"},{"id":"o4","text":"pH上昇で酸素はヘモグロビンから解離しやすくなる"},{"id":"o5","text":"呼吸商は二酸化炭素産生量を酸素消費量で除した値である"}],"answers":["o5"],"why":"正答は『呼吸商は二酸化炭素産生量を酸素消費量で除した値』です。RQ = VCO₂ / VO₂ で、基質利用の目安になります。","option_explanations":{"o1":"安静吸気時に横隔神経活動が増え、安静呼気は主に受動的です。","o2":"迷走神経の副交感作用は気管支収縮を促し、気道抵抗を増加させます。","o3":"コンプライアンス増加は肺の弾性収縮力低下と関連し、FRCが増える場合があります。","o4":"pH上昇は酸素解離曲線を左方移動させ、酸素を放しにくくします。","o5":"正しい。呼吸商はVCO₂/VO₂です。"},"related":"呼吸商は糖質約1.0、脂質約0.7が代表値です。Bohr効果ではpH低下で酸素解離曲線が右方移動します。","tip":"RQ＝CO₂/O₂、pH低下＝右方移動。","glossary":[{"term":"呼吸商","desc":"栄養基質の酸化で生じるCO₂量と消費O₂量の比。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["運動時のRERは呼気ガスから求める指標。","酸素解離曲線の右方・左方移動因子を整理する。"]},{"id":"59B64","round":59,"source":"第59回・午後64（出題内容をもとに学習用再構成）","source_session":"午後","source_no":64,"subject":"生理学","domain":"循環","topic":"循環調節","concept":"局所血流調節","secondary":["代謝性血管拡張","冠循環","脳血流","低酸素性肺血管収縮"],"question":"臓器と局所血流調節の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"骨格筋 ― 乳酸蓄積で血管収縮"},{"id":"o2","text":"心臓 ― 低酸素で冠細動脈収縮"},{"id":"o3","text":"脳 ― 二酸化炭素分圧上昇で細動脈収縮"},{"id":"o4","text":"肺 ― 肺胞低酸素で細動脈収縮"},{"id":"o5","text":"皮膚 ― 交感神経亢進で常に細動脈拡張"}],"answers":["o4"],"why":"正答は『肺―低酸素で細動脈収縮』です。全身臓器では低酸素が血管拡張を起こすことが多い一方、肺循環では肺胞低酸素に対して肺小動脈が収縮し、換気のよい領域へ血流を振り分けます。","option_explanations":{"o1":"活動筋では乳酸・H+・K+・アデノシンなどが血管拡張に寄与します。","o2":"心筋低酸素は冠血管拡張を促します。","o3":"脳ではCO₂上昇が強い血管拡張刺激になります。","o4":"正しい。低酸素性肺血管収縮です。","o5":"皮膚の交感神経亢進は一般に血管収縮を促します。"},"related":"肺循環は『低酸素で収縮』という全身循環との逆方向性が重要です。","tip":"肺だけ低酸素で収縮。","glossary":[{"term":"低酸素性肺血管収縮","desc":"肺胞低酸素に反応して肺小動脈が収縮する現象。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":["V/Q不均衡を減らす生理的機構。","脳血流はPaCO₂の影響を強く受ける。"]},{"id":"59B65","round":59,"source":"第59回・午後65（出題内容をもとに学習用再構成）","source_session":"午後","source_no":65,"subject":"生理学","domain":"血液・免疫","topic":"凝固・免疫","concept":"ワルファリン","secondary":["ワルファリン","ビタミンK","凝固因子","抗凝固薬"],"question":"ワルファリンの抗凝固作用に拮抗するビタミンはどれか。","options":[{"id":"o1","text":"ビタミンA"},{"id":"o2","text":"ビタミンC"},{"id":"o3","text":"ビタミンD"},{"id":"o4","text":"ビタミンE"},{"id":"o5","text":"ビタミンK"}],"answers":["o5"],"why":"正答はビタミンKです。ワルファリンはビタミンK依存性凝固因子の活性化を阻害するため、過量時などにはビタミンKが拮抗薬として用いられます。","option_explanations":{"o1":"ビタミンAは視覚・上皮維持などに関与します。","o2":"ビタミンCはコラーゲン合成や抗酸化に関与します。","o3":"ビタミンDはCa代謝に関与します。","o4":"ビタミンEは抗酸化作用をもちます。","o5":"正しい。ワルファリン作用と直接関係します。"},"related":"ビタミンK依存性凝固因子はII、VII、IX、Xなどです。","tip":"ワルファリン↔ビタミンK。","glossary":[{"term":"ワルファリン","desc":"ビタミンK拮抗薬。凝固因子のγカルボキシ化を阻害する。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["効果判定にPT-INRを用いる。","食事・薬物相互作用にも注意が必要。"]},{"id":"59B66","round":59,"source":"第59回・午後66（出題内容をもとに学習用再構成）","source_session":"午後","source_no":66,"subject":"生理学","domain":"咀嚼・嚥下・消化・吸収","topic":"消化吸収","concept":"脂質消化","secondary":["膵リパーゼ","胆汁酸","ミセル","腸肝循環"],"question":"脂質の消化・吸収について誤っているのはどれか。","options":[{"id":"o1","text":"膵リパーゼはLangerhans島から分泌される"},{"id":"o2","text":"リパーゼは中性脂肪の分解に働く"},{"id":"o3","text":"胆汁酸は脂質を乳化しミセル形成を助ける"},{"id":"o4","text":"ミセルは小腸で脂質吸収を助ける"},{"id":"o5","text":"胆汁酸は回腸などで再吸収され門脈を介して肝臓へ戻る"}],"answers":["o1"],"why":"誤っているのは『膵リパーゼはLangerhans島から分泌される』です。膵リパーゼは膵外分泌部の腺房細胞から分泌されます。Langerhans島はインスリンやグルカゴンなどを分泌する内分泌部です。","option_explanations":{"o1":"誤り。膵リパーゼは腺房細胞から分泌されます。","o2":"正しい。主にトリグリセリドを脂肪酸とモノグリセリドなどへ分解します。","o3":"正しい。胆汁酸は脂質を乳化し、消化産物のミセル形成を助けます。","o4":"正しい。ミセルは脂質成分を刷子縁へ運び吸収を促進します。","o5":"正しい。胆汁酸は腸肝循環で再利用されます。"},"related":"膵臓は外分泌（消化酵素・重炭酸）と内分泌（インスリンなど）の両機能をもちます。","tip":"膵酵素＝腺房、ホルモン＝膵島。","glossary":[{"term":"ミセル","desc":"胆汁酸により形成され、脂質消化産物を小腸上皮へ運ぶ微小集合体。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["脂溶性ビタミン吸収にも胆汁酸が重要。","胆汁酸の多くは終末回腸で再吸収される。"]},{"id":"59B67","round":59,"source":"第59回・午後67（出題内容をもとに学習用再構成）","source_session":"午後","source_no":67,"subject":"生理学","domain":"腎・排尿","topic":"腎機能","concept":"近位尿細管再吸収","secondary":["近位尿細管","グルコース","ナトリウム","水","再吸収"],"question":"正常時、近位尿細管で濾過量に対する再吸収率が最も高いのはどれか。","options":[{"id":"o1","text":"水"},{"id":"o2","text":"グルコース"},{"id":"o3","text":"水素イオン"},{"id":"o4","text":"クレアチニン"},{"id":"o5","text":"ナトリウムイオン"}],"answers":["o2"],"why":"正答はグルコースです。正常血糖範囲では濾過されたグルコースは近位尿細管でほぼ全量再吸収されます。水とNa+は近位尿細管で約3分の2が再吸収されます。","option_explanations":{"o1":"水は多量に再吸収されますが、近位尿細管だけで全量ではありません。","o2":"正しい。正常ではほぼ100%再吸収されます。","o3":"H+は主に尿細管腔へ分泌されます。","o4":"クレアチニンは再吸収されず、一部は分泌されます。","o5":"Na+も約65%前後が近位尿細管で再吸収されますが、グルコースより割合は低いです。"},"related":"血糖が腎閾値を超えると輸送最大を超え、尿糖が出現します。","tip":"正常グルコース＝近位尿細管でほぼ全回収。","glossary":[{"term":"輸送最大","desc":"尿細管輸送担体の処理能力上限。グルコース再吸収にも存在する。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["SGLT2阻害薬は近位尿細管のグルコース再吸収を抑える。","糸球体濾過と尿細管再吸収・分泌を区別する。"]},{"id":"59B68","round":59,"source":"第59回・午後68（出題内容をもとに学習用再構成）","source_session":"午後","source_no":68,"subject":"生理学","domain":"体温調節","topic":"体温","concept":"体温調節中枢","secondary":["視床下部","概日リズム","発汗","ふるえ","熱産生"],"question":"体温調節について正しいのはどれか。","options":[{"id":"o1","text":"体温調節中枢は間脳の視床下部にある"},{"id":"o2","text":"体温は通常、午後より午前の方が高い"},{"id":"o3","text":"精神性発汗は体温を上昇させるために起こる"},{"id":"o4","text":"体温上昇時にはふるえが促進される"},{"id":"o5","text":"甲状腺ホルモンは熱産生を低下させる"}],"answers":["o1"],"why":"正答は『体温調節中枢は視床下部にある』です。視床下部は中枢・末梢の温度情報を統合し、発汗・皮膚血流・ふるえ・代謝などを調整します。","option_explanations":{"o1":"正しい。視床下部、とくに視索前野などが重要です。","o2":"概日リズムにより体温は一般に朝低く夕方〜夜に高くなります。","o3":"精神性発汗は情動刺激によるもので、体温上昇を目的とする反応ではありません。","o4":"ふるえは寒冷時の熱産生反応です。","o5":"甲状腺ホルモンは代謝を高め、熱産生を増やす方向に働きます。"},"related":"発熱では視床下部の設定温度が上がるため、体温上昇期に悪寒・ふるえが起こりえます。","tip":"視床下部がサーモスタット。","glossary":[{"term":"視床下部","desc":"自律神経・内分泌・体温・摂食など恒常性維持を統合する間脳の部位。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["発熱と高体温は機序が異なる。","皮膚血管拡張と発汗は放熱反応。"]},{"id":"59B69","round":59,"source":"第59回・午後69（出題内容をもとに学習用再構成）","source_session":"午後","source_no":69,"subject":"生理学","domain":"筋","topic":"筋線維・収縮","concept":"力-速度関係","secondary":["力-速度関係","求心性収縮","遠心性収縮","活動張力","負荷"],"question":"骨格筋の張力と収縮速度の関係について正しいのはどれか。","options":[{"id":"o1","text":"活動張力は全張力と静止張力の和である"},{"id":"o2","text":"活動張力は筋長が長いほど無制限に増える"},{"id":"o3","text":"求心性収縮では速度が速いほど最大張力が大きい"},{"id":"o4","text":"同じ条件なら負荷が小さいほど筋の短縮速度は速い"},{"id":"o5","text":"求心性収縮は遠心性収縮より大きな最大張力を発揮する"}],"answers":["o4"],"why":"正答は『負荷が小さいほど短縮速度は速い』です。求心性収縮では負荷と短縮速度は逆相関し、負荷が増えるほど短縮速度は低下します。","option_explanations":{"o1":"活動張力は全張力から静止張力を差し引いた成分として考えます。","o2":"活動張力には最適筋長があり、長くなるほど無制限に増えるわけではありません。","o3":"求心性では短縮速度が速いほど発揮張力は小さくなります。","o4":"正しい。力-速度関係の基本です。","o5":"一般に遠心性収縮は求心性収縮より大きな張力を発揮できます。"},"related":"収縮様式別の最大張力は概ね『遠心性＞等尺性＞求心性』と整理できます。","tip":"求心性：重いほど遅い。張力は遠心性が大きい。","glossary":[{"term":"力-速度関係","desc":"筋が発揮する力と短縮・伸張速度の関係。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":["Hillの力-速度関係を理解する。","長さ-張力関係とは別の概念。"]},{"id":"59B70","round":59,"source":"第59回・午後70（出題内容をもとに学習用再構成）","source_session":"午後","source_no":70,"subject":"運動学","domain":"四肢・体幹の運動","topic":"肩甲帯・肩","concept":"肩関節内旋筋","secondary":["広背筋","肩甲下筋","大胸筋","内旋","ローテーターカフ"],"question":"肩甲上腕関節を内旋させる作用をもつ筋はどれか。","options":[{"id":"o1","text":"棘下筋"},{"id":"o2","text":"広背筋"},{"id":"o3","text":"小円筋"},{"id":"o4","text":"三角筋後部線維"},{"id":"o5","text":"上腕二頭筋長頭"}],"answers":["o2"],"why":"正答は広背筋です。広背筋は肩関節の伸展・内転・内旋に作用します。","option_explanations":{"o1":"棘下筋は主に外旋します。","o2":"正しい。伸展・内転・内旋に作用します。","o3":"小円筋は主に外旋します。","o4":"三角筋後部は主に伸展・水平外転に関与し、外旋方向の作用ももちます。","o5":"上腕二頭筋長頭は肘屈曲・前腕回外に加え肩関節安定化などに関与しますが、主要内旋筋ではありません。"},"related":"肩内旋筋は肩甲下筋・大胸筋・広背筋・大円筋など、外旋筋は棘下筋・小円筋が中心です。","tip":"内旋＝肩甲下・大胸・広背・大円。","glossary":[{"term":"広背筋","desc":"胸腰部から上腕骨小結節稜へ付着し、肩関節伸展・内転・内旋に作用する筋。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["ローテーターカフ4筋の作用を整理する。","肩関節運動は肩甲胸郭関節との協調が必要。"]},{"id":"59B71","round":59,"source":"第59回・午後71（出題内容をもとに学習用再構成）","source_session":"午後","source_no":71,"subject":"運動学","domain":"四肢・体幹の運動","topic":"膝関節","concept":"膝関節の構造と運動","secondary":["顆状関節","半月板","側副靱帯","前十字靱帯","スクリューホーム"],"question":"膝関節について正しいものを2つ選べ。","options":[{"id":"o1","text":"脛骨大腿関節は顆状関節として分類される"},{"id":"o2","text":"内側半月板はO字状である"},{"id":"o3","text":"外側側副靱帯は屈曲位で最も緊張する"},{"id":"o4","text":"前十字靱帯は脛骨の後方移動を主に制動する"},{"id":"o5","text":"開放運動連鎖で完全伸展に近づくと脛骨は大腿骨に対して外旋する"}],"answers":["o1","o5"],"why":"正答は『顆状関節として分類される』と『伸展終末で脛骨が外旋する』です。膝伸展終末ではスクリューホーム運動により、開放運動連鎖で脛骨が外旋します。","option_explanations":{"o1":"正しい。脛骨大腿関節は顆状関節として扱われます。","o2":"内側半月板はC字状、外側半月板はよりO字状です。","o3":"側副靱帯は一般に伸展位で緊張し、屈曲で緩みます。","o4":"ACLは主に脛骨の前方移動を制動します。後方移動はPCLが中心です。","o5":"正しい。開放運動連鎖では伸展終末で脛骨外旋が生じます。"},"related":"閉鎖運動連鎖ではスクリューホーム運動を大腿骨側の回旋として捉えます。","tip":"ACL＝前方移動を止める。伸展終末＝脛骨外旋。","glossary":[{"term":"スクリューホーム運動","desc":"膝伸展終末で生じる脛骨と大腿骨の自動回旋。"}],"official_answers":[1,5],"problemImage":null,"problemImageCaption":null,"exam_links":["ACL・PCLの制動方向を対比する。","半月板は内側C字、外側O字に近い。"],"scoring_status":"採点調整","official_note":"厚生労働省の訂正版では原問題の正答として1と5の両方を認めている。本アプリでは2つ選択する形式に再構成し、診断から除外する。","excludeFromDiagnosis":true},{"id":"59B72","round":59,"source":"第59回・午後72（出題内容をもとに学習用再構成）","source_session":"午後","source_no":72,"subject":"運動学","domain":"四肢・体幹の運動","topic":"足関節・足部","concept":"足関節部の腱配置","secondary":["前脛骨筋","長母指伸筋","長指伸筋","腓骨筋","足関節前面"],"question":"足関節前面を通る伸筋腱のうち、最も内側に位置するものはどれか。","options":[{"id":"o1","text":"長腓骨筋"},{"id":"o2","text":"前脛骨筋"},{"id":"o3","text":"長指伸筋"},{"id":"o4","text":"後脛骨筋"},{"id":"o5","text":"第3腓骨筋"}],"answers":["o2"],"why":"正答は前脛骨筋です。足関節前面では内側から概ね前脛骨筋腱、長母指伸筋腱、前脛骨動脈・深腓骨神経、長指伸筋腱、第3腓骨筋腱の順に並びます。","option_explanations":{"o1":"長腓骨筋腱は外果後方を通ります。","o2":"正しい。前面の伸筋腱群で最内側に位置します。","o3":"長指伸筋は前面を通りますが前脛骨筋より外側です。","o4":"後脛骨筋腱は内果後方を通ります。","o5":"第3腓骨筋は前外側で、前脛骨筋より外側です。"},"related":"足関節周囲では『前面』『内果後方』『外果後方』の3群に分けると位置関係が整理しやすくなります。","tip":"前面最内側＝前脛骨筋。","glossary":[{"term":"前脛骨筋","desc":"足関節背屈・足部内がえしに作用し、腱は足関節前面の内側を通る筋。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["内果後方は後脛骨筋・長指屈筋・血管神経・長母指屈筋。","外果後方は短・長腓骨筋腱。"]},{"id":"59B73","round":59,"source":"第59回・午後73（出題内容をもとに学習用再構成）","source_session":"午後","source_no":73,"subject":"運動学","domain":"姿勢","topic":"姿勢制御","concept":"正常立位の重心線","secondary":["重心線","S2","立位姿勢","腰仙角","大転子"],"question":"成人の正常立位姿勢について正しいのはどれか。","options":[{"id":"o1","text":"仙骨は前弯を示す"},{"id":"o2","text":"腰仙角は約5度である"},{"id":"o3","text":"成人の重心は小児より相対的に頭部に近い"},{"id":"o4","text":"矢状面で身体重心は仙骨の前方付近に位置する"},{"id":"o5","text":"理想的重心線は必ず大転子の明確な前方を通る"}],"answers":["o4"],"why":"正答は『矢状面で身体重心は仙骨の前方付近に位置する』です。成人立位の身体重心は一般に第2仙椎前方付近にあるとされます。","option_explanations":{"o1":"仙骨自体は後弯方向の形態を示します。","o2":"腰仙角は5度より大きく、定義にもよりますがおよそ30度前後などで扱われます。","o3":"小児は頭部比率が大きく重心が成人より相対的に高位です。","o4":"正しい。S2前方付近が代表的な目安です。","o5":"重心線は股関節軸付近〜やや後方を通るとされ、常に明確な前方とするのは不適切です。"},"related":"立位アライメントでは重心線と耳垂・肩峰・大転子・膝・外果などの位置関係を評価します。","tip":"身体重心の代表位置＝S2前方。","glossary":[{"term":"身体重心","desc":"身体各部の質量を代表する一点。静止立位では骨盤付近に位置する。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":["小児は成人より重心が高い。","姿勢評価は支持基底面との関係も重要。"]},{"id":"59B74","round":59,"source":"第59回・午後74（出題内容をもとに学習用再構成）","source_session":"午後","source_no":74,"subject":"運動学","domain":"運動制御・運動学習","topic":"運動学習","concept":"運動学習の進行","secondary":["二重課題","課題難易度","外在的フィードバック","誤りなし学習","エネルギー効率"],"question":"運動学習について最も適切なのはどれか。","options":[{"id":"o1","text":"学習初期から常に二重課題を導入する"},{"id":"o2","text":"課題難易度は高いほど学習効果が高い"},{"id":"o3","text":"療法士からの助言は内在的フィードバックである"},{"id":"o4","text":"記憶障害では試行錯誤を増やす学習が第一選択である"},{"id":"o5","text":"技能が熟練すると同じ課題に要するエネルギー効率が改善しやすい"}],"answers":["o5"],"why":"正答は『技能が熟練するとエネルギー効率が改善しやすい』です。運動学習が進むと動作の協調性・自動性が高まり、不要な筋活動や注意資源の消費が減ります。","option_explanations":{"o1":"学習初期は単一課題で基本技能を安定させてから二重課題へ進む方が適切な場合が多いです。","o2":"難しすぎる課題は失敗を増やし学習を阻害するため、適切な難易度調整が必要です。","o3":"療法士から与えられる助言は外在的（付加的）フィードバックです。","o4":"記憶障害では誤りを最小化するerrorless learningが有効な場合があります。","o5":"正しい。熟練化により動作は効率化します。"},"related":"運動学習では学習段階、フィードバック頻度、練習スケジュール、保持・転移を区別して考えます。","tip":"熟練＝自動化＋効率化。","glossary":[{"term":"外在的フィードバック","desc":"本人の感覚以外から追加されるフィードバック。KRやKPを含む。"},{"term":"誤りなし学習","desc":"誤反応をできるだけ生じさせず正しい反応を反復する学習法。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["KRは結果、KPは動作過程に関する情報。","保持テストと転移テストで学習成立を評価する。"]},{"id":"60A51","source":"第60回・午前51（出題内容をもとに再構成）","source_session":"午前","source_no":51,"subject":"解剖学","domain":"筋系","topic":"下肢の筋","concept":"大腿内側筋群","secondary":["薄筋","内転筋群","大腿横断面"],"question":"大腿中央部の模式的横断面を示す。矢印 a が示す、最も内側かつ表層に位置する細長い筋はどれか。","options":[{"id":"o1","text":"薄筋"},{"id":"o2","text":"縫工筋"},{"id":"o3","text":"大内転筋"},{"id":"o4","text":"短内転筋"},{"id":"o5","text":"長内転筋"}],"answers":["o1"],"why":"正答は薄筋です。薄筋は大腿内側を縦走する細長い表在筋で、大腿中央部の横断面では内側皮下に近い位置で同定しやすい筋です。内転筋群の中でも最も内側にあり、股関節内転に加え、膝関節をまたいで脛骨内側へ停止するため膝屈曲・下腿内旋にも関与します。","option_explanations":{"o1":"正しい。薄筋は大腿内側の最表層に近い細長い筋で、内転筋群の中でも位置を見分けやすい。","o2":"縫工筋は上前腸骨棘から脛骨内側へ斜走する長い筋で、中央断面ではより前内側に位置する。薄筋とは走行方向と位置関係が異なる。","o3":"大内転筋は大腿内側〜後内側に広く存在する大きな筋で、矢印部のような小さな表在筋ではない。","o4":"短内転筋は長内転筋の深層寄りに位置し、近位部で目立つ。中央断面で最内側表層を占める筋ではない。","o5":"長内転筋は内転筋群の前方寄りに広い筋腹を形成し、薄筋より外側・深部に位置する。"},"related":"内転筋群の位置関係は、前方寄りに長内転筋、深部に短内転筋、後内側に大内転筋、最内側表層に薄筋と整理すると横断面問題に対応しやすくなります。","tip":"『薄筋＝細く、いちばん内側』を基準点にして、そこから他の内転筋の位置を考える。","glossary":[{"term":"薄筋","desc":"大腿内側を走る細長い筋。股関節内転、膝屈曲、下腿内旋に関与する。"},{"term":"大腿横断面","desc":"太ももを輪切りにした断面。筋区画と位置関係の把握に使われる。"},{"term":"内転筋群","desc":"股関節内転に関与する筋群。長内転筋・短内転筋・大内転筋・薄筋などが含まれる。"}],"official_answers":[1],"problemImage":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABGAAAALSCAIAAAAdvjC6AAEAAElEQVR42uz9Z5Br6Zkn+B3v4L1L727em9ebulW3LIu2aJpN7U7PjHZC2o3Y3ZDmo2JiYiMUEzNfFPqiHW0oRrtSbGhM70xPN305sopVxWJ5d73Ja9Jnwnt7vNGHAxwcAAfIrGKRze56fuwmM5FI4OAAyPv+8b7v86CGYSBjHBQa0zEfAgAAAAAAAABfDRicAgAAAAAAAACAgAQAAAAAAAAAEJAAAAAAAAAAAAISAAAAAAAAAEBAAgAAAAAAAAAISAAAAAAAAAAAAQkAAAAAAAAAICABAAAAAAAAAAQkAAAAAAAAAICABAAAAAAAAAAQkAAAAAAAAAAAAhIAAAAAAAAAQEACAAAAAAAAAAhIAAAAAAAAAAABCQAAAAAAAAAgIAEAAAAAAAAABCQAAAAAAAAAgIAEAAAAAAAAABCQAAAAAAAAAAACEgAAAAAAAABAQAIAAAAAAAAACEgAAAAAAAAAAAEJAAAAAAAAACAgAQAAAAAAAAAEJAAAAAAAAACAgAQAAAAAAAAAEJAAAAAAAAAAAAISAAAAAAAAAEBAAgAAAAAAAAAISAAAAAAAAAAAAQkAAAAAAAAAICABAAAAAAAAAAQkAAAAAAAAAICABAAAAAAAAAAQkAAAAAAAAAAAAhIAAAAAAAAAQEACAAAAAAAAAAABCQAAAAAAAAAgIAEAAAAAAAAABCQAAAAAAAAAgIAEAAAAAAAAABCQAAAAAAAAAAACEgAAAAAAAABAQAIAAAAAAAAACEgAAAAAAAAAAAEJAAAAAAAAACAgAQAAAAAAAAAEJAAAAAAAAACAgAQAAAAAAAAAEJAAAAAAAAAAAAISAAAAAAAAAEBAAgAAAAAAAAAISAAAAAAAAAAAAQkAAAAAAAAAICABAA
