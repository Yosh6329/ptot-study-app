"text":"Golgi装置"},{"id":"o3","text":"滑面小胞体"},{"id":"o4","text":"リボソーム"},{"id":"o5","text":"ミトコンドリア"}],"answers":["o5"],"why":"正答はミトコンドリアです。ミトコンドリア内膜には電子伝達系とATP合成酵素が存在し、酸化的リン酸化によって細胞が利用するATPの多くを産生します。解糖系そのものは細胞質で行われますが、その後のクエン酸回路や酸化的リン酸化はミトコンドリアが中心です。","option_explanations":{"o1":"中心小体は微小管の形成や細胞分裂時の紡錘体形成に関与する。","o2":"Golgi装置は蛋白質・脂質の修飾、選別、輸送に関与する。","o3":"滑面小胞体は脂質合成、薬物代謝、Ca²⁺貯蔵などに関与する。","o4":"リボソームは蛋白質合成の場であり、ATP産生の中心ではない。","o5":"正しい。ミトコンドリアはクエン酸回路や酸化的リン酸化によりATP産生に重要な役割を担う。"},"related":"細胞小器官は機能と対にして整理します。粗面小胞体＝分泌蛋白などの合成、Golgi装置＝修飾・選別、リソソーム＝細胞内消化、ミトコンドリア＝好気的エネルギー産生、という対応が基本です。","tip":"ATPの大量産生＝ミトコンドリア。蛋白質合成＝リボソーム。","glossary":[{"term":"ATP","desc":"adenosine triphosphate（アデノシン三リン酸）。細胞が直接利用する主要なエネルギー担体。"},{"term":"酸化的リン酸化","desc":"ミトコンドリア内膜の電子伝達系を利用してATPを合成する過程。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["ミトコンドリアは二重膜構造をもち、内膜のひだをクリステという。","骨格筋のタイプI線維はミトコンドリア密度が高く、酸化能力が高い。"]},{"id":"60A62","source":"第60回・午前62（出題内容をもとに再構成）","source_session":"午前","source_no":62,"subject":"生理学","domain":"筋","topic":"筋線維・収縮","concept":"筋線維の種類","secondary":["タイプI線維","遅筋","酸化能力"],"question":"タイプII筋線維と比べたとき、タイプI筋線維の特徴として正しいのはどれか。","options":[{"id":"o1","text":"発生張力が小さい"},{"id":"o2","text":"筋線維径が太い"},{"id":"o3","text":"酸化酵素活性が低い"},{"id":"o4","text":"ミオグロビン量が少ない"},{"id":"o5","text":"ミトコンドリア密度が低い"}],"answers":["o1"],"why":"正答は『発生張力が小さい』です。タイプI線維は遅筋線維とも呼ばれ、収縮速度と最大張力は比較的小さい一方、ミトコンドリア・ミオグロビン・毛細血管が豊富で酸化能力が高く、疲労しにくいという特徴があります。姿勢保持や持久的活動に適しています。","option_explanations":{"o1":"正しい。タイプI線維はタイプII線維より収縮速度・発生張力が小さい傾向がある。","o2":"誤り。一般にタイプI線維はタイプII線維より筋線維径が小さい。","o3":"誤り。タイプI線維は有酸素代謝に優れ、酸化酵素活性は高い。","o4":"誤り。ミオグロビンが多く、赤色を呈しやすい。","o5":"誤り。持久的なエネルギー供給を支えるため、タイプI線維ではミトコンドリア密度が高い。"},"related":"タイプI＝遅い・持久力・酸化系、タイプII＝速い・大きな力・解糖系、という対比が基本です。ただし実際の骨格筋は複数タイプが混在します。 また、タイプI線維は小型の運動単位に多く、持続的な姿勢保持で動員されやすい。","tip":"I型は『赤・遅・長持ち』。","glossary":[{"term":"タイプI筋線維","desc":"遅筋線維。酸化能力が高く、疲れにくく、姿勢保持や持久活動に向く。"},{"term":"ミオグロビン","desc":"筋内で酸素を保持する蛋白。多いほど赤色調が強くなる。"},{"term":"酸化酵素活性","desc":"有酸素代謝に関わる酵素活性。タイプI線維では高い。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["タイプI線維は姿勢保持・持久活動に向き、タイプII線維は短時間の高出力に向く。","運動単位の動員は一般に小さい運動単位から大きい運動単位へ進む。"],"round":60},{"id":"60A63","source":"第60回・午前63（出題内容をもとに学習用再構成）","source_session":"午前","source_no":63,"subject":"生理学","domain":"自律神経","topic":"自律神経機能","concept":"自律神経系の基本","secondary":["交感神経","副交感神経","節前線維","アセチルコリン"],"question":"自律神経系の一般原則として正しいのはどれか。","options":[{"id":"o1","text":"交感神経節前線維はノルアドレナリンを放出する"},{"id":"o2","text":"副交感神経節後線維はすべてドパミンを放出する"},{"id":"o3","text":"交感神経節後線維はすべてアセチルコリンを放出する"},{"id":"o4","text":"副交感神経節前線維は脊髄胸腰髄から出る"},{"id":"o5","text":"交感神経・副交感神経の節前線維はいずれもアセチルコリンを放出する"}],"answers":["o5"],"why":"正答は『交感神経・副交感神経の節前線維はいずれもアセチルコリンを放出する』です。節前線維は自律神経節でニコチン性アセチルコリン受容体へ作用します。","option_explanations":{"o1":"交感神経節前線維の伝達物質はアセチルコリン。","o2":"副交感神経節後線維も基本的にアセチルコリンを放出する。","o3":"交感神経節後線維は多くがノルアドレナリンだが、汗腺支配など例外がある。","o4":"副交感神経は脳幹および仙髄から出る。","o5":"正しい。節前線維は交感・副交感ともアセチルコリン。"},"related":"自律神経は『起始・節前/節後線維・伝達物質・受容体・臓器反応』を表にして整理すると強いです。","tip":"節前は両方アセチルコリン。節後で違いが出る。","glossary":[{"term":"節前線維","desc":"中枢神経系から自律神経節までの線維。交感・副交感ともアセチルコリンを放出する。"},{"term":"アセチルコリン","desc":"神経伝達物質。自律神経節や神経筋接合部などで重要。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["交感神経節後線維でも汗腺支配はアセチルコリンという例外がある。","副交感神経の起始は脳幹・仙髄。"],"round":60},{"id":"60A64","source":"第60回・午前64（出題内容をもとに再構成）","source_session":"午前","source_no":64,"subject":"生理学","domain":"呼吸","topic":"呼吸調節","concept":"呼吸調節機構","secondary":["伸展受容器","迷走神経","化学受容器"],"question":"呼吸調節機構について正しい記述はどれか。","options":[{"id":"o1","text":"呼吸中枢は視床下部にある"},{"id":"o2","text":"末梢化学受容器は椎骨動脈にある"},{"id":"o3","text":"横隔膜・肋間筋は随意的に収縮できない"},{"id":"o4","text":"末梢化学受容器は動脈血酸素分圧の上昇で強く興奮する"},{"id":"o5","text":"肺伸展受容器の情報は迷走神経を介して呼吸中枢へ伝わる"}],"answers":["o5"],"why":"正答は肺伸展受容器からの情報が迷走神経を介して呼吸中枢へ伝わる、です。肺の伸展に関する求心性情報は迷走神経を通って延髄などへ入り、吸気を抑制する反射機構に関与します。呼吸は自律的に制御される一方、一定範囲では随意的にも調節できます。","option_explanations":{"o1":"呼吸リズム形成の主要部位は延髄・橋で、視床下部ではない。","o2":"末梢化学受容器は頸動脈小体と大動脈小体に存在する。","o3":"横隔膜や肋間筋は自動的にも活動するが、息止めや深呼吸のように随意的な調節も可能。","o4":"末梢化学受容器は動脈血酸素分圧（PaO₂）の低下、とくに著明な低下で強く刺激される。","o5":"正しい。肺の伸展受容器からの求心路は迷走神経を通る。"},"related":"中枢化学受容器は主に二酸化炭素変化に由来する髄液pHの変化を感知します。末梢化学受容器は動脈血酸素分圧（PaO₂）の低下、動脈血二酸化炭素分圧（PaCO₂）の上昇、pH低下を感知します。肺伸展受容器からの迷走神経求心路はヘーリング・ブロイエル反射（Hering-Breuer reflex）にも関与します。","tip":"呼吸中枢＝延髄・橋、末梢化学受容器＝頸動脈小体・大動脈小体、肺伸展＝迷走神経。","glossary":[{"term":"迷走神経","desc":"第10脳神経。内臓求心・遠心線維を広く含み、呼吸や循環の調節に関与する。"},{"term":"末梢化学受容器","desc":"頸動脈小体・大動脈小体にある受容器。動脈血酸素分圧（PaO₂）低下、動脈血二酸化炭素分圧（PaCO₂）上昇、pH低下を感知する。"},{"term":"肺伸展受容器","desc":"肺の伸展を感知する受容器。過伸展時に吸気を抑制する反射に関与する。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["呼吸リズム形成の主要部位は延髄・橋。","肺伸展受容器からの迷走神経求心路はヘーリング・ブロイエル反射（Hering-Breuer reflex）と関連する。"],"round":60},{"id":"60A65","source":"第60回・午前65（出題内容をもとに学習用再構成）","source_session":"午前","source_no":65,"subject":"生理学","domain":"循環","topic":"刺激伝導・心電図","concept":"刺激伝導系","secondary":["洞房結節","房室結節","His束","Purkinje線維"],"question":"心臓の刺激伝導系について正しいのはどれか。","options":[{"id":"o1","text":"房室結節が通常の一次ペースメーカーである"},{"id":"o2","text":"刺激は心室から心房へ向かって生理的に伝わる"},{"id":"o3","text":"Purkinje線維は心房内にのみ分布する"},{"id":"o4","text":"洞房結節は左心室心尖部にある"},{"id":"o5","text":"房室結節からの興奮はHis束を介して心室伝導系へ進む"}],"answers":["o5"],"why":"正答は『房室結節からの興奮はHis束を介して心室伝導系へ進む』です。通常は洞房結節で発生した興奮が心房を伝わり、房室結節、His束、脚、Purkinje線維へ進みます。","option_explanations":{"o1":"通常の一次ペースメーカーは洞房結節。","o2":"通常は心房から心室へ伝導する。","o3":"Purkinje線維は心室内で興奮を素早く広げる。","o4":"洞房結節は右心房上部、上大静脈開口部付近に位置する。","o5":"正しい。房室結節の後にHis束へ伝導する。"},"related":"心電図ではP波＝心房脱分極、QRS波＝心室脱分極、T波＝心室再分極という対応も一緒に押さえます。","tip":"洞房結節→房室結節→His束→脚→Purkinje線維。","glossary":[{"term":"洞房結節","desc":"通常の心拍を開始する一次ペースメーカー。右心房にある。"},{"term":"His束","desc":"房室結節から心室側へ興奮を伝える刺激伝導路。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["房室結節では伝導が遅延し、心房収縮後に心室収縮が起こる時間をつくる。","心電図の波形と刺激伝導順序を結びつける。"],"round":60},{"id":"60A66","source":"第60回・午前66（出題内容をもとに学習用再構成）","source_session":"午前","source_no":66,"subject":"生理学","domain":"血液・免疫","topic":"血液","concept":"血球","secondary":["赤血球","白血球","血小板","止血"],"question":"血球とその主な機能の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"赤血球 ― 抗体産生"},{"id":"o2","text":"好中球 ― 酸素運搬"},{"id":"o3","text":"血小板 ― 一次止血"},{"id":"o4","text":"リンパ球 ― フィブリン分解"},{"id":"o5","text":"好酸球 ― ヘモグロビン産生"}],"answers":["o3"],"why":"正答は『血小板―一次止血』です。血小板は血管損傷部位へ粘着・凝集し、血小板血栓を形成して一次止血に重要です。","option_explanations":{"o1":"抗体産生はBリンパ球から分化した形質細胞が担う。","o2":"酸素運搬は主に赤血球のヘモグロビンが担う。","o3":"正しい。血小板は一次止血で中心的役割を担う。","o4":"フィブリン分解は線溶系のプラスミンなどが担う。","o5":"ヘモグロビンは赤芽球系で産生され、好酸球の主機能ではない。"},"related":"止血は一次止血（血小板）と二次止血（凝固因子によるフィブリン形成）に分けて整理します。白血球は好中球・好酸球・好塩基球・単球・リンパ球の機能を比較します。","tip":"血小板＝一次止血、凝固因子＝二次止血。","glossary":[{"term":"一次止血","desc":"血小板の粘着・凝集により血小板血栓を形成する過程。"},{"term":"二次止血","desc":"凝固系によりフィブリンを形成し血栓を安定化する過程。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["好中球は細菌貪食、好酸球は寄生虫・アレルギー、リンパ球は獲得免疫と関連づける。","線溶系は血栓形成後のフィブリン分解に関与する。"],"round":60},{"id":"60A67","source":"第60回・午前67（出題内容をもとに学習用再構成）","source_session":"午前","source_no":67,"subject":"生理学","domain":"咀嚼・嚥下・消化・吸収","topic":"消化吸収","concept":"肝・胆・膵機能","secondary":["胆汁","胆汁酸","脂肪消化","胆嚢"],"question":"胆汁について正しいのはどれか。","options":[{"id":"o1","text":"胆汁酸は脂肪の乳化に関与する"},{"id":"o2","text":"胆汁には蛋白質を分解する主要消化酵素が大量に含まれる"},{"id":"o3","text":"胆汁は膵臓で産生される"},{"id":"o4","text":"胆嚢は胆汁を産生する"},{"id":"o5","text":"胆汁は胃内へ直接分泌される"}],"answers":["o1"],"why":"正答は『胆汁酸は脂肪の乳化に関与する』です。胆汁は肝臓で産生され、胆嚢で濃縮・貯蔵され、十二指腸へ排出されます。","option_explanations":{"o1":"正しい。胆汁酸は脂肪を乳化し、脂肪消化・吸収を助ける。","o2":"胆汁そのものは蛋白分解酵素の主要供給源ではない。","o3":"胆汁は肝臓で産生される。","o4":"胆嚢は胆汁を貯蔵・濃縮する。","o5":"胆汁は総胆管などを通って十二指腸へ流入する。"},"related":"脂質の消化吸収では胆汁酸による乳化と膵リパーゼによる分解を分けて理解します。肝臓・胆嚢・膵臓の役割を混同しないことが重要です。","tip":"胆汁は肝で作る、胆嚢でためる、十二指腸へ出す。","glossary":[{"term":"乳化","desc":"大きな脂肪滴を細かく分散させ、消化酵素が作用しやすくすること。"},{"term":"胆汁酸","desc":"胆汁の主要成分の一つ。脂質の消化吸収を助ける。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["脂肪分解酵素の代表は膵リパーゼ。","総胆管と膵管は十二指腸への流入部で近接する。"],"round":60},{"id":"60A68","source":"第60回・午前68（出題内容をもとに学習用再構成）","source_session":"午前","source_no":68,"subject":"生理学","domain":"生殖","topic":"生殖生理","concept":"排卵・月経","secondary":["月経周期","排卵","黄体形成ホルモン","プロゲステロン"],"question":"正常月経周期について正しいのはどれか。","options":[{"id":"o1","text":"排卵は黄体形成ホルモンの急増と関連する"},{"id":"o2","text":"排卵後はプロゲステロン分泌が直ちに消失する"},{"id":"o3","text":"卵胞期は黄体からのプロゲステロンが主体である"},{"id":"o4","text":"月経中はエストロゲンとプロゲステロンが高値を維持する"},{"id":"o5","text":"排卵は通常、月経開始の直後に起こる"}],"answers":["o1"],"why":"正答は『排卵は黄体形成ホルモンの急増と関連する』です。成熟卵胞からのエストロゲン上昇を背景に黄体形成ホルモンのサージが起こり、排卵が誘発されます。","option_explanations":{"o1":"正しい。黄体形成ホルモンのサージは排卵誘発に重要。","o2":"排卵後は黄体が形成され、プロゲステロン分泌が増える。","o3":"卵胞期は卵胞からのエストロゲン分泌が中心。","o4":"月経は黄体退縮に伴うエストロゲン・プロゲステロン低下と関連する。","o5":"一般的な周期では排卵は次回月経開始のおよそ14日前に起こる。"},"related":"月経周期は卵胞期・排卵・黄体期で整理し、卵胞刺激ホルモン、黄体形成ホルモン、エストロゲン、プロゲステロンの変化を対応させます。","tip":"排卵＝黄体形成ホルモンサージ。","glossary":[{"term":"黄体形成ホルモン","desc":"luteinizing hormone。排卵と黄体形成に重要。"},{"term":"黄体期","desc":"排卵後に黄体からプロゲステロンが増える時期。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["プロゲステロンは基礎体温上昇と関連する。","閉経では卵巣機能低下により性腺刺激ホルモンが上昇する。"],"round":60},{"id":"60A69","source":"第60回・午前69（出題内容をもとに学習用再構成）","source_session":"午前","source_no":69,"subject":"生理学","domain":"運動","topic":"運動生理","concept":"運動単位","secondary":["運動単位","サイズの原理","神経支配比","α運動ニューロン"],"question":"運動単位について正しいものを2つ選べ。","options":[{"id":"o1","text":"1つの筋線維は複数のα運動ニューロンに同時支配される"},{"id":"o2","text":"精密運動を行う筋ほど1運動単位あたりの筋線維数が多い"},{"id":"o3","text":"大きな運動単位から先に動員される"},{"id":"o4","text":"1個のα運動ニューロンと、それが支配する筋線維群で構成される"},{"id":"o5","text":"一般に小さな運動単位から順に動員される"}],"answers":["o4","o5"],"why":"正答は『1個のα運動ニューロンと、それが支配する筋線維群』と『小さな運動単位から順に動員』です。後者はサイズの原理として知られます。","option_explanations":{"o1":"通常、1本の骨格筋線維は1個のα運動ニューロンから神経支配を受ける。","o2":"眼球運動や手指など精密運動を行う筋では神経支配比が小さい。","o3":"一般には小さい運動単位から動員される。","o4":"正しい。これが運動単位の基本定義。","o5":"正しい。必要な張力が増すにつれてより大きい運動単位が追加動員される。"},"related":"神経支配比が小さいほど微細な力調節に向き、大きいほど大きな力を効率よく発揮できます。タイプI線維を含む小型運動単位は低強度から動員されやすいです。","tip":"運動単位＝1ニューロン＋支配筋線維。動員は小→大。","glossary":[{"term":"サイズの原理","desc":"筋力要求の増加に応じて、小さい運動単位から大きい運動単位へ動員される原則。"},{"term":"神経支配比","desc":"1個の運動ニューロンが支配する筋線維数。"}],"official_answers":[4,5],"problemImage":null,"problemImageCaption":null,"exam_links":["眼筋や手内在筋は神経支配比が小さく精密制御に向く。","タイプI筋線維と小型運動単位の関係も合わせて覚える。"],"round":60},{"id":"60A70","source":"第60回・午前70（出題内容をもとに学習用再構成）","source_session":"午前","source_no":70,"subject":"生理学","domain":"呼吸","topic":"換気","concept":"肺胞換気量","secondary":["一回換気量","死腔換気量","呼吸数","肺胞換気"],"question":"肺胞換気量を増加させる変化として正しいものを2つ選べ。","options":[{"id":"o1","text":"一回換気量を保ったまま呼吸数を低下させる"},{"id":"o2","text":"死腔換気量を減少させる"},{"id":"o3","text":"一回換気量を増加させる"},{"id":"o4","text":"死腔換気量を増加させる"},{"id":"o5","text":"呼吸を停止する"}],"answers":["o2","o3"],"why":"正答は『死腔換気量を減少させる』と『一回換気量を増加させる』です。肺胞換気量は、1回の呼吸で肺胞に届く有効換気量と呼吸数で決まります。","option_explanations":{"o1":"他条件が同じなら呼吸数低下は分時の肺胞換気を減らす。","o2":"正しい。死腔が減れば同じ一回換気量でも肺胞へ届く割合が増える。","o3":"正しい。一回換気量が増え、死腔を超える分が増えれば肺胞換気は増える。","o4":"死腔が増えると有効な肺胞換気は減る。","o5":"呼吸停止では肺胞換気は0になる。"},"related":"肺胞換気量は『（一回換気量－死腔換気量）×呼吸数』で整理できます。浅く速い呼吸では分時換気量が同じでも肺胞換気が低くなることがあります。","tip":"一回換気量から死腔を引いた分が肺胞へ届く。","glossary":[{"term":"死腔","desc":"換気はされるがガス交換に直接参加しない気道・肺胞領域。"},{"term":"肺胞換気量","desc":"1分間に肺胞へ到達しガス交換に関与する換気量。"}],"official_answers":[2,3],"problemImage":null,"problemImageCaption":null,"exam_links":["分時換気量と肺胞換気量は同じではない。","浅速呼吸では死腔の占める割合が大きくなりやすい。"],"round":60},{"id":"60A71","source":"第60回・午前71（出題内容をもとに学習用再構成）","source_session":"午前","source_no":71,"subject":"運動学","domain":"四肢・体幹の運動","topic":"顔面・頭頸部","concept":"頸椎運動","secondary":["胸鎖乳突筋","頸椎屈曲","頸椎回旋"],"question":"頭頸部の運動と筋作用の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"右胸鎖乳突筋 ― 頭部右回旋"},{"id":"o2","text":"両側板状筋 ― 頸部屈曲"},{"id":"o3","text":"左斜角筋 ― 頸部右側屈のみ"},{"id":"o4","text":"両側胸鎖乳突筋 ― 頸部屈曲"},{"id":"o5","text":"後頭下筋群 ― 頸部屈曲"}],"answers":["o4"],"why":"正答は『両側胸鎖乳突筋―頸部屈曲』です。胸鎖乳突筋は一側収縮で同側側屈・反対側回旋、両側収縮で頸部屈曲に関与します。","option_explanations":{"o1":"右胸鎖乳突筋は主に左回旋に作用する。","o2":"板状筋は両側で頸部伸展に作用する。","o3":"斜角筋は同側側屈などに関与し、記述が限定的すぎる。","o4":"正しい。両側胸鎖乳突筋は頸部屈曲に関与する。","o5":"後頭下筋群は主に上位頸椎の伸展・回旋に関与する。"},"related":"頸部筋は『一側作用』と『両側作用』を分けて覚えるのが重要です。胸鎖乳突筋は呼吸補助筋としても働きます。","tip":"胸鎖乳突筋：一側＝反対側回旋、両側＝屈曲。","glossary":[{"term":"胸鎖乳突筋","desc":"頸部表層の大きな筋。一側・両側で作用が異なる。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":["副神経支配と胸鎖乳突筋・僧帽筋を関連づける。","頸部筋の問題は回旋方向の左右を取り違えやすい。"],"round":60},{"id":"60A72","source":"第60回・午前72（出題内容をもとに学習用再構成）","source_session":"午前","source_no":72,"subject":"運動学","domain":"四肢・体幹の運動","topic":"股関節","concept":"股関節運動","secondary":["股関節","頸体角","腸骨大腿靱帯","関節軸"],"question":"股関節の構造・運動について正しいものを2つ選べ。","options":[{"id":"o1","text":"成人の大腿骨頸体角は通常90度未満である"},{"id":"o2","text":"腸骨大腿靱帯は股関節伸展を制限する"},{"id":"o3","text":"股関節は球関節で3軸性の運動が可能である"},{"id":"o4","text":"股関節屈曲では大腿骨頭が寛骨臼から離開するのが正常である"},{"id":"o5","text":"大腿骨頭は膝窩で脛骨と関節を形成する"}],"answers":["o2","o3"],"why":"正答は『腸骨大腿靱帯は伸展を制限する』と『股関節は球関節で3軸性』です。股関節は高い安定性を持ちながら屈伸・内外転・内外旋が可能です。","option_explanations":{"o1":"成人の頸体角は一般に約125度前後で、90度未満が通常ではない。","o2":"正しい。腸骨大腿靱帯は強靱で、とくに伸展を制限する。","o3":"正しい。球関節で多方向の運動が可能。","o4":"正常な股関節屈曲で大腿骨頭が大きく離開するわけではない。","o5":"大腿骨頭は寛骨臼と関節を形成する。"},"related":"股関節では頸体角、前捻角、靱帯、関節包内運動を関連づけます。開放運動連鎖と閉鎖運動連鎖で骨盤・大腿骨の動きが変わる点も重要です。","tip":"股関節＝球関節。腸骨大腿靱帯＝伸展制限。","glossary":[{"term":"頸体角","desc":"大腿骨頸部軸と骨幹軸のなす角。成人で一般に約125度前後。"},{"term":"腸骨大腿靱帯","desc":"股関節前面の強い靱帯。伸展制限に重要。"}],"official_answers":[2,3],"problemImage":null,"problemImageCaption":null,"exam_links":["トレンデレンブルグ徴候（Trendelenburg sign）は中殿筋など股関節外転筋機能と関連する。","股関節の屈曲拘縮ではトーマステスト（Thomas test）が関連する。"],"round":60},{"id":"60A73","source":"第60回・午前73（出題内容をもとに再構成）","source_session":"午前","source_no":73,"subject":"運動学","domain":"姿勢","topic":"姿勢制御","concept":"立位安定性","secondary":["支持基底面","重心線","摩擦"],"question":"静的立位の安定性について正しいのはどれか。","options":[{"id":"o1","text":"支持基底面が狭いほど安定する"},{"id":"o2","text":"重心位置が高いほど安定する"},{"id":"o3","text":"重心線は膝関節中心よりやや前方を通る"},{"id":"o4","text":"足底と床の摩擦が小さいほど安定する"},{"id":"o5","text":"重心線は支持基底面の中心から離れるほど安定する"}],"answers":["o3"],"why":"正答は『重心線は膝関節中心よりやや前方を通る』です。正常立位では重心線は膝関節軸のやや前方を通り、膝には軽い伸展方向の外力モーメントが生じます。安定性そのものは、支持基底面が広い、重心が低い、重心線が支持基底面中央に近い、床との摩擦が十分あるほど高くなります。","option_explanations":{"o1":"支持基底面が広いほど、重心線をその内部に保てる範囲が大きくなるため安定性は高い。","o2":"重心が低いほど転倒方向へのモーメントが小さくなり、一般に安定する。","o3":"正しい。正常立位では重心線は膝関節中心のやや前方を通る。","o4":"摩擦が小さいと滑りやすくなり、支持面との安定性は低下する。","o5":"重心線が支持基底面の縁へ近づくほど、わずかな外乱で基底面外へ出やすくなる。"},"related":"静的安定性は『支持基底面・重心高・重心線の位置・摩擦』の4点で整理すると、多くの姿勢問題に対応できます。","tip":"広い・低い・中央・滑らない＝安定。","glossary":[{"term":"支持基底面","desc":"身体を支える面の範囲。立位では両足底とその間の面で表される。"},{"term":"重心線","desc":"重心から鉛直下方に下ろした線。支持基底面内にあることが安定の条件。"},{"term":"摩擦","desc":"床と足底が滑らないための抵抗。小さいと姿勢保持が不利になる。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["安定性は『支持基底面が広い・重心が低い・重心線が中央に近い・摩擦が大きい』ほど高い。","姿勢制御では足関節戦略・股関節戦略・ステッピング戦略も関連して問われる。"],"round":60},{"id":"60A74","source":"第60回・午前74（出題内容をもとに学習用再構成）","source_session":"午前","source_no":74,"subject":"運動学","domain":"歩行","topic":"歩行周期","concept":"歩行周期イベント","secondary":["歩行周期","立脚中期","遊脚期","両脚支持期"],"question":"正常歩行について正しいのはどれか。","options":[{"id":"o1","text":"遊脚期は歩行周期の約60％を占める"},{"id":"o2","text":"立脚中期では身体重心が支持脚の上方を通過する"},{"id":"o3","text":"両脚支持期は走行時に増加する"},{"id":"o4","text":"初期接地では股関節は最大伸展位にある"},{"id":"o5","text":"遊脚終期では膝は最大屈曲位にある"}],"answers":["o2"],"why":"正答は『立脚中期では身体重心が支持脚の上方を通過する』です。正常歩行では立脚期が約60％、遊脚期が約40％で、立脚中期では身体が支持足の上を前方へ進みます。","option_explanations":{"o1":"遊脚期はおよそ40％。","o2":"正しい。立脚中期では身体が支持脚上を進む。","o3":"走行では両脚支持期がなく、両脚が浮く時期が生じる。","o4":"初期接地では股関節は屈曲位。","o5":"遊脚終期では膝は伸展方向へ戻り、次の接地に備える。"},"related":"歩行周期は初期接地・荷重応答・立脚中期・立脚終期・前遊脚・遊脚初期・遊脚中期・遊脚終期の順序で整理します。","tip":"立脚60％、遊脚40％。走行では両脚支持が消える。","glossary":[{"term":"立脚中期","desc":"片脚支持となり、身体が支持足の上を通過する時期。"},{"term":"両脚支持期","desc":"歩行中に両足が同時に接地している時期。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["歩行速度が上がると両脚支持時間は短くなる。","床反力・関節モーメント・筋活動を周期イベントと結びつける。"],"round":60},{"id":"60B51","source":"第60回・午後51（出題内容をもとに学習用再構成）","source_session":"午後","source_no":51,"subject":"解剖学","domain":"骨格系","topic":"骨の構造・代謝","concept":"骨形成・骨吸収","secondary":["骨芽細胞","破骨細胞","骨代謝","骨リモデリング"],"question":"骨代謝について正しいのはどれか。","options":[{"id":"o1","text":"破骨細胞は骨吸収に関与する"},{"id":"o2","text":"骨芽細胞は骨吸収を主に行う"},{"id":"o3","text":"骨細胞は破骨細胞から分化する"},{"id":"o4","text":"副甲状腺ホルモンは常に骨形成のみを促進する"},{"id":"o5","text":"骨リモデリングは成長期にのみ起こる"}],"answers":["o1"],"why":"正答は『破骨細胞は骨吸収に関与する』です。骨は生涯にわたり形成と吸収を繰り返しており、骨芽細胞が骨形成、破骨細胞が骨吸収を担います。","option_explanations":{"o1":"正しい。破骨細胞は多核細胞で骨吸収を担う。","o2":"骨芽細胞は骨基質形成・石灰化に関与する。","o3":"骨細胞は骨芽細胞が骨基質内に取り込まれて成熟した細胞。","o4":"副甲状腺ホルモンは血中カルシウム濃度調節に関与し、作用は単純な『骨形成のみ』ではない。","o5":"骨リモデリングは成人以降も継続する。"},"related":"骨代謝では骨芽細胞・破骨細胞に加え、副甲状腺ホルモン、活性型ビタミンD、カルシトニン、機械的負荷との関係も押さえます。","tip":"骨芽細胞＝形成、破骨細胞＝吸収。","glossary":[{"term":"骨リモデリング","desc":"古い骨を吸収し新しい骨を形成する更新過程。成人でも続く。"},{"term":"破骨細胞","desc":"骨吸収を担う多核細胞。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["骨粗鬆症では骨強度低下と骨折リスク上昇を関連づける。","長期不動では機械的負荷低下により骨量低下が問題になる。"],"round":60},{"id":"60B52","round":60,"source":"第60回・午後52（出題内容をもとに学習用再構成）","source_session":"午後","source_no":52,"subject":"解剖学","domain":"骨格系","topic":"関節の基礎","concept":"関節の形状分類","secondary":["腕尺関節","らせん関節","関節形状","滑膜関節"],"question":"腕尺関節の形状分類として最も適切なのはどれか。","options":[{"id":"o1","text":"らせん関節"},{"id":"o2","text":"鞍関節"},{"id":"o3","text":"楕円関節"},{"id":"o4","text":"平面関節"},{"id":"o5","text":"球関節"}],"answers":["o1"],"why":"正答はらせん関節です。腕尺関節は上腕骨滑車と尺骨滑車切痕で構成され、屈曲・伸展を主体としますが、関節面がらせん状であるため日本の解剖学的分類ではらせん関節に分類されます。","option_explanations":{"o1":"正しい。腕尺関節はらせん関節に分類される。","o2":"鞍関節の代表は母指手根中手関節で、互いに鞍状の関節面をもつ。","o3":"楕円関節の代表には橈骨手根関節などがある。","o4":"平面関節は関節面が比較的平坦で、手根間関節などにみられる。","o5":"球関節の代表は肩甲上腕関節や股関節で、多軸性の運動が可能。"},"related":"関節形状は代表例とセットで覚えると効率的です。球関節＝肩・股、鞍関節＝母指CM、楕円関節＝橈骨手根、平面関節＝手根間、らせん関節＝腕尺、という整理が国試対策で有用です。","tip":"腕尺関節＝らせん関節。母指CM＝鞍関節。","glossary":[{"term":"らせん関節","desc":"関節面がらせん状の特徴をもつ関節。腕尺関節が代表例。"},{"term":"滑膜関節","desc":"関節腔・関節軟骨・関節包などをもつ、可動性の高い関節。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["腕橈関節は球関節として分類される。","近位・遠位橈尺関節は車軸関節で、前腕回内・回外に関与する。"]},{"id":"60B53","round":60,"source":"第60回・午後53（採点調整問題を学習用に2選択へ再構成）","source_session":"午後","source_no":53,"subject":"解剖学","domain":"神経系","topic":"脳神経","concept":"脳神経の機能","secondary":["味覚","舌咽神経","迷走神経","顔面神経"],"question":"次の選択肢のうち、味覚情報の伝達に関与する脳神経を2つ選べ。","options":[{"id":"o1","text":"三叉神経"},{"id":"o2","text":"舌咽神経"},{"id":"o3","text":"迷走神経"},{"id":"o4","text":"副神経"},{"id":"o5","text":"舌下神経"}],"answers":["o2","o3"],"why":"正答は舌咽神経と迷走神経です。舌咽神経は舌後1/3の味覚、迷走神経は喉頭蓋付近などの味覚に関与します。なお舌前2/3の味覚は顔面神経（鼓索神経）で伝えられます。原問題は1つ選択形式でしたが複数正解があるとして採点調整されているため、本アプリでは学習上の曖昧さを避けて2つ選ぶ形式にしています。","option_explanations":{"o1":"三叉神経は顔面や口腔の一般体性感覚に重要だが、味覚そのものの主要求心路ではない。","o2":"正しい。舌咽神経は舌後1/3の味覚と一般感覚に関与する。","o3":"正しい。迷走神経は喉頭蓋周辺などの味覚情報を伝える。","o4":"副神経は胸鎖乳突筋・僧帽筋の運動に関与する。","o5":"舌下神経は舌筋の運動を支配する。"},"related":"味覚は『舌前2/3＝顔面神経、舌後1/3＝舌咽神経、喉頭蓋付近＝迷走神経』で整理します。一般体性感覚の支配とは異なるため、味覚と触覚・痛覚を分けて覚えることが重要です。","tip":"味覚：前2/3 VII、後1/3 IX、喉頭蓋 X。","glossary":[{"term":"鼓索神経","desc":"顔面神経の枝。舌前2/3の味覚などを伝える。"},{"term":"舌咽神経","desc":"第IX脳神経。舌後1/3の味覚・感覚、咽頭機能などに関与する。"},{"term":"迷走神経","desc":"第X脳神経。咽喉頭や内臓の感覚・運動・副交感機能に広く関与する。"}],"official_answers":[2,3],"scoring_status":"複数正解扱い","official_note":"厚生労働省は原問題について「複数の選択肢を正解として採点」とした。本アプリでは2・3を選ぶ学習問題に再構成し、診断テストからは除外している。","excludeFromDiagnosis":true,"problemImage":null,"problemImageCaption":null,"exam_links":["顔面神経麻痺では鼓索神経の障害部位によって舌前2/3の味覚障害を伴うことがある。","咽頭反射は求心路が舌咽神経、遠心路が迷走神経。"]},{"id":"60B54","round":60,"source":"第60回・午後54（出題内容をもとに学習用再構成）","source_session":"午後","source_no":54,"subject":"解剖学","domain":"内臓諸器官","topic":"消化器","concept":"食道・胃","secondary":["胃","幽門","幽門括約筋","噴門"],"question":"胃内容を十二指腸へ送り出す際に流出量を調節する構造はどれか。","options":[{"id":"o1","text":"幽門括約筋"},{"id":"o2","text":"噴門切痕"},{"id":"o3","text":"胃底"},{"id":"o4","text":"小網"},{"id":"o5","text":"胃体部の大彎"}],"answers":["o1"],"why":"正答は幽門括約筋です。胃の遠位端にある幽門部では輪走筋が厚くなって幽門括約筋を形成し、胃内容が十二指腸へ排出される速度を調節します。","option_explanations":{"o1":"正しい。幽門括約筋は胃と十二指腸の境界で胃内容の排出を調節する。","o2":"噴門切痕は食道と胃底の間にみられる切れ込みで、胃内容排出を調節する括約構造ではない。","o3":"胃底は噴門より上方に膨隆する部分で、出口側の調節構造ではない。","o4":"小網は肝臓と胃・十二指腸を連結する腹膜構造。","o5":"大彎は胃の外側縁であり、括約機能を担う構造ではない。"},"related":"胃は噴門・胃底・胃体・幽門部に分けて位置関係を整理します。入口側の噴門と出口側の幽門を混同しないことが基本です。","tip":"胃の入口＝噴門、出口＝幽門。","glossary":[{"term":"幽門括約筋","desc":"胃の遠位端で輪走筋が発達した構造。十二指腸への胃内容排出を調節する。"},{"term":"噴門","desc":"食道が胃へ移行する入口側の部位。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["幽門は概ねL1付近を目安にする。","胃底は噴門より上方に位置する。"]},{"id":"60B55","round":60,"source":"第60回・午後55（出題内容をもとに学習用再構成）","source_session":"午後","source_no":55,"subject":"解剖学","domain":"感覚器","topic":"特殊感覚","concept":"聴覚器","secondary":["内耳","蝸牛","半規管","耳小骨"],"question":"聴覚器の構造について正しいのはどれか。","options":[{"id":"o1","text":"蝸牛は内耳に属する"},{"id":"o2","text":"耳管は内耳と咽頭を直接つなぐ"},{"id":"o3","text":"鼓膜にはキヌタ骨が直接付着する"},{"id":"o4","text":"半規管は左右それぞれ2本で構成される"},{"id":"o5","text":"内リンパと外リンパは正常では自由に交通する"}],"answers":["o1"],"why":"正答は『蝸牛は内耳に属する』です。内耳には蝸牛・前庭・半規管があり、蝸牛は聴覚、前庭・半規管は平衡感覚に主として関与します。","option_explanations":{"o1":"正しい。蝸牛は内耳にあり、音刺激の受容に関与する。","o2":"耳管は中耳腔と咽頭を連絡し、中耳圧の調節に関与する。","o3":"鼓膜に柄が付着する耳小骨はツチ骨。キヌタ骨はツチ骨とアブミ骨の間にある。","o4":"半規管は前・後・外側の3つで構成される。","o5":"内リンパと外リンパは組成も存在する腔も異なり、正常状態で自由に交通するものではない。"},"related":"外耳・中耳・内耳の区分を整理すると選択肢を判定しやすくなります。外耳＝耳介・外耳道、中耳＝鼓膜内側の鼓室・耳小骨・耳管、内耳＝蝸牛・前庭・半規管です。","tip":"蝸牛＝聴覚、前庭・半規管＝平衡。","glossary":[{"term":"蝸牛","desc":"内耳の構造。コルチ器を含み、音刺激の受容に関与する。"},{"term":"耳管","desc":"中耳腔と咽頭を連絡し、中耳の圧を外気圧に近づける役割をもつ。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["耳小骨はツチ骨→キヌタ骨→アブミ骨の順で振動を伝える。","前庭神経と蝸牛神経は合流して第VIII脳神経を構成する。"]},{"id":"60B56","source":"第60回・午後56（出題内容をもとに再構成）","source_session":"午後","source_no":56,"subject":"解剖学","domain":"筋系","topic":"上肢の筋","concept":"第1背側腱区画","secondary":["長母指外転筋","短母指伸筋","解剖学的嗅ぎタバコ入れ"],"question":"右手を母指橈側外転させた模式図を示す。橈側手関節部で並走して目立つ2本の腱はどれか。2つ選べ。","options":[{"id":"o1","text":"短母指外転筋"},{"id":"o2","text":"短母指伸筋"},{"id":"o3","text":"長橈側手根伸筋"},{"id":"o4","text":"長母指外転筋"},{"id":"o5","text":"長母指伸筋"}],"answers":["o2","o4"],"why":"正答は短母指伸筋と長母指外転筋です。この2腱は手関節背側の第1伸筋腱区画を一緒に通過し、母指を橈側へ開いたとき橈骨茎状突起付近で目立ちます。長母指伸筋は第3区画を通り、解剖学的嗅ぎタバコ入れの尺側境界を形成するので位置が異なります。","option_explanations":{"o1":"短母指外転筋は母指球の筋で、図の橈側手関節部を長い腱として走行する筋ではない。","o2":"正しい。短母指伸筋は長母指外転筋とともに第1背側腱区画を通る。","o3":"長橈側手根伸筋は第2背側腱区画を通り、より尺側寄りに位置する。","o4":"正しい。長母指外転筋は短母指伸筋と並走して第1背側腱区画を通る。","o5":"長母指伸筋は第3背側腱区画を通り、リスター結節（Lister tubercle）を回り込んで走る。"},"related":"ドゥ・ケルバン腱鞘炎は、第1背側腱区画を通る長母指外転筋（abductor pollicis longus：APL）と短母指伸筋（extensor pollicis brevis：EPB）の腱鞘障害です。アイヒホッフテスト（Eichhoff test）は、母指を手掌内に入れて握り込み、手関節を尺屈して橈骨茎状突起周囲の疼痛を誘発します。フィンケルシュタインテスト（Finkelstein test）は別の手技で、両者はしばしば混同されます。解剖学的嗅ぎタバコ入れの橈側境界は長母指外転筋と短母指伸筋、尺側境界は長母指伸筋（extensor pollicis longus：EPL）です。","tip":"第1背側腱区画＝長母指外転筋（APL）＋短母指伸筋（EPB）。長母指伸筋（EPL）は第3背側腱区画。","glossary":[{"term":"解剖学的嗅ぎタバコ入れ","desc":"母指を伸ばしたとき手背橈側にできる陥凹。橈側境界は長母指外転筋（APL）・短母指伸筋（EPB）、尺側境界は長母指伸筋（EPL）。"},{"term":"ドゥ・ケルバン腱鞘炎","desc":"第1背側腱区画の長母指外転筋（APL）と短母指伸筋（EPB）に生じる腱鞘障害。"},{"term":"アイヒホッフテスト","desc":"母指を手掌内に入れて握り込み、手関節を尺屈して橈側手関節痛を誘発する検査。ドゥ・ケルバン腱鞘炎で用いられる。"},{"term":"フィンケルシュタインテスト","desc":"ドゥ・ケルバン腱鞘炎の誘発検査。アイヒホッフテストとは手技が異なるため、混同しない。"},{"term":"リスター結節（Lister tubercle）","desc":"橈骨背側の骨性隆起。長母指伸筋（EPL）の腱がここを回り込む。"}],"official_answers":[2,4],"problemImage":"./images/60B56.jpg","problemImageCaption":"第60回 午後56：母指橈側外転時の腱（出題図・全体表示版）","officialFigureUrl":"https://www.mhlw.go.jp/seisakunitsuite/bunya/kenkou_iryou/iryou/topics/dl/tp250428-08b_01.pdf#page=34","exam_links":["ドゥ・ケルバン腱鞘炎では第1背側腱区画の長母指外転筋（APL）・短母指伸筋（EPB）が対象。","アイヒホッフテストとフィンケルシュタインテストは別手技。名称を混同しない。","解剖学的嗅ぎタバコ入れの底には舟状骨・大菱形骨が位置し、橈骨動脈が通る。"],"round":60},{"id":"60B57","source":"第60回・午後57（出題内容をもとに学習用再構成）","source_session":"午後","source_no":57,"subject":"解剖学","domain":"筋系","topic":"筋の構造","concept":"起始・停止","secondary":["起始・停止","小円筋","大結節","回旋筋腱板"],"question":"筋と停止部の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"棘上筋 ― 上腕骨小結節"},{"id":"o2","text":"小円筋 ― 上腕骨大結節"},{"id":"o3","text":"肩甲下筋 ― 上腕骨大結節"},{"id":"o4","text":"上腕二頭筋 ― 尺骨粗面"},{"id":"o5","text":"上腕三頭筋 ― 橈骨粗面"}],"answers":["o2"],"why":"正答は『小円筋―上腕骨大結節』です。小円筋は回旋筋腱板を構成し、上腕骨大結節の下部に停止します。","option_explanations":{"o1":"棘上筋は上腕骨大結節に停止する。","o2":"正しい。小円筋は大結節に停止する。","o3":"肩甲下筋は上腕骨小結節に停止する。","o4":"上腕二頭筋は橈骨粗面に停止する。","o5":"上腕三頭筋は尺骨肘頭に停止する。"},"related":"肩関節周囲では回旋筋腱板4筋の起始・停止・作用・支配神経をまとめて覚えると効率的です。","tip":"回旋筋腱板：棘上・棘下・小円＝大結節、肩甲下＝小結節。","glossary":[{"term":"回旋筋腱板","desc":"棘上筋・棘下筋・小円筋・肩甲下筋からなる腱性構造。肩関節安定化に重要。"},{"term":"大結節","desc":"上腕骨近位外側の隆起。棘上筋・棘下筋・小円筋が停止する。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["棘上筋＝外転初期、棘下筋・小円筋＝外旋、肩甲下筋＝内旋。","腋窩神経障害では小円筋と三角筋の機能低下を考える。"],"round":60},{"id":"60B58","source":"第60回・午後58（出題内容をもとに学習用再構成）","source_session":"午後","source_no":58,"subject":"解剖学","domain":"神経系","topic":"伝導路","concept":"錐体路","secondary":["皮質脊髄路","内包","大脳脚","錐体交叉"],"question":"皮質脊髄路の走行に含まれる構造はどれか。","options":[{"id":"o1","text":"視床下部"},{"id":"o2","text":"脳弓"},{"id":"o3","text":"大脳脚"},{"id":"o4","text":"海馬"},{"id":"o5","text":"松果体"}],"answers":["o3"],"why":"正答は大脳脚です。皮質脊髄路は大脳皮質から内包を通り、中脳の大脳脚、橋、延髄錐体へ下降し、多くの線維が錐体交叉で反対側へ移ります。","option_explanations":{"o1":"視床下部は自律・内分泌調節などに重要だが皮質脊髄路の主要走行部ではない。","o2":"脳弓は海馬系の線維束で辺縁系に関与する。","o3":"正しい。皮質脊髄路は中脳の大脳脚を通る。","o4":"海馬は記憶に重要な灰白質構造。","o5":"松果体はメラトニン分泌に関与する。"},"related":"皮質脊髄路は『運動野→放線冠→内包後脚→大脳脚→橋→延髄錐体→錐体交叉→脊髄』の順で押さえます。","tip":"錐体路は内包と大脳脚を必ず通る。","glossary":[{"term":"皮質脊髄路","desc":"随意運動に重要な下行性運動路。"},{"term":"錐体交叉","desc":"延髄下部で皮質脊髄路線維の多くが反対側へ交叉する部位。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["内包病変は狭い部位でも広範な運動麻痺を生じうる。","上位運動ニューロン徴候と皮質脊髄路を関連づける。"],"round":60},{"id":"60B59","round":60,"source":"第60回・午後59（出題内容をもとに学習用再構成）","source_session":"午後","source_no":59,"subject":"解剖学","domain":"脈管系","topic":"血管","concept":"脳血管","secondary":["内頸動脈","眼動脈","外頸動脈","脳循環"],"question":"内頸動脈から直接分枝する血管はどれか。","options":[{"id":"o1","text":"顎動脈"},{"id":"o2","text":"眼動脈"},{"id":"o3","text":"舌動脈"},{"id":"o4","text":"顔面動脈"},{"id":"o5","text":"椎骨動脈"}],"answers":["o2"],"why":"正答は眼動脈です。眼動脈は内頸動脈の主要な分枝の一つで、眼窩内へ入り眼球や眼窩内組織などを灌流します。顎動脈・舌動脈・顔面動脈は外頸動脈系です。","option_explanations":{"o1":"顎動脈は外頸動脈の終枝の一つ。","o2":"正しい。眼動脈は内頸動脈から分枝する。","o3":"舌動脈は外頸動脈から分枝する。","o4":"顔面動脈は外頸動脈から分枝する。","o5":"椎骨動脈は鎖骨下動脈から分枝し、左右が合流して脳底動脈を形成する。"},"related":"頭頸部の動脈は『内頸動脈＝頭蓋内・眼窩中心』『外頸動脈＝顔面・頭皮など』を大枠として整理します。脳循環では内頸動脈系と椎骨脳底動脈系を区別します。","tip":"眼動脈＝内頸動脈。顔面・舌・顎＝外頸動脈系。","glossary":[{"term":"眼動脈","desc":"内頸動脈から分枝し、眼球や眼窩内組織などを灌流する動脈。"},{"term":"椎骨動脈","desc":"鎖骨下動脈から分枝し、左右が合流して脳底動脈になる。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["内頸動脈は頭蓋内で前大脳動脈・中大脳動脈などにつながる。","外頸動脈の終枝は浅側頭動脈と顎動脈。"]},{"id":"60B60","round":60,"source":"第60回・午後60（出題内容をもとに学習用再構成）","source_session":"午後","source_no":60,"subject":"解剖学","domain":"脈管系","topic":"血管","concept":"門脈系","secondary":["門脈","脾静脈","上腸間膜静脈","肝循環"],"question":"消化管や脾臓から肝臓へ血液を送る門脈系に直接流入する血管はどれか。","options":[{"id":"o1","text":"肝静脈"},{"id":"o2","text":"奇静脈"},{"id":"o3","text":"腎静脈"},{"id":"o4","text":"脾静脈"},{"id":"o5","text":"総腸骨静脈"}],"answers":["o4"],"why":"正答は脾静脈です。門脈は主に上腸間膜静脈と脾静脈の合流によって形成され、消化管や脾臓などからの血液を肝臓へ運びます。肝静脈は逆に肝臓から下大静脈へ血液を戻します。","option_explanations":{"o1":"肝静脈は肝臓から下大静脈へ流出する血管で、門脈へ流入する血管ではない。","o2":"奇静脈は胸壁などの静脈血を集め、上大静脈へ流入する。","o3":"腎静脈は下大静脈へ流入する。","o4":"正しい。脾静脈は門脈形成に関与する主要血管。","o5":"総腸骨静脈は左右が合流して下大静脈を形成する。"},"related":"門脈系は『消化管・脾臓など→門脈→肝類洞→肝静脈→下大静脈』の流れで理解します。門脈圧亢進では食道静脈瘤などの側副血行路が重要です。","tip":"門脈形成の主役＝上腸間膜静脈＋脾静脈。","glossary":[{"term":"門脈","desc":"消化管や脾臓などからの静脈血を肝臓へ運ぶ静脈系。"},{"term":"脾静脈","desc":"脾臓などから血液を集め、上腸間膜静脈と合流して門脈形成に関与する。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":["肝静脈は門脈とは逆方向で、肝臓から下大静脈へ流出する。","門脈圧亢進では食道静脈瘤・腹壁静脈怒張・直腸静脈叢などが関連する。"]},{"id":"60B61","round":60,"source":"第60回・午後61（出題内容をもとに学習用再構成）","source_session":"午後","source_no":61,"subject":"解剖学","domain":"組織","topic":"細胞・組織","concept":"筋組織","secondary":["心筋","介在板","ギャップ結合","横紋筋"],"question":"心筋細胞同士の電気的興奮を伝えやすくする細胞間構造はどれか。","options":[{"id":"o1","text":"基底膜のみ"},{"id":"o2","text":"髄鞘"},{"id":"o3","text":"ギャップ結合"},{"id":"o4","text":"シナプス小胞"},{"id":"o5","text":"運動終板"}],"answers":["o3"],"why":"正答はギャップ結合です。心筋細胞は介在板で互いに連結され、その中のギャップ結合を介してイオン電流が細胞間を伝わります。このため心筋は機能的に協調して興奮・収縮できます。","option_explanations":{"o1":"基底膜だけでは心筋細胞間の迅速な電気的連絡を担えない。","o2":"髄鞘は神経軸索の周囲に形成され、活動電位伝導を高速化する構造。","o3":"正しい。ギャップ結合は隣接する心筋細胞間でイオンなどを通し、電気的連結を担う。","o4":"シナプス小胞は神経終末などで神経伝達物質を貯蔵する。","o5":"運動終板は骨格筋に対する運動神経終末の特殊化した神経筋接合部。"},"related":"心筋は横紋をもつ不随意筋です。介在板にはギャップ結合のほか、機械的結合を強める接着構造があり、電気的・力学的に細胞同士を連結します。","tip":"心筋の電気的連結＝介在板のギャップ結合。","glossary":[{"term":"介在板","desc":"心筋細胞同士の境界にある特殊な接合部。電気的・機械的結合に重要。"},{"term":"ギャップ結合","desc":"隣接細胞間をチャネルで連結し、イオンなどを通過させる細胞間結合。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["心筋は横紋筋だが随意筋ではない。","心筋の興奮は自動能をもつ刺激伝導系から始まり、自律神経は心拍数・伝導などを調節する。"]},{"id":"60B62","source":"第60回・午後62（出題内容をもとに学習用再構成）","source_session":"午後","source_no":62,"subject":"生理学","domain":"神経","topic":"反射","concept":"伸張反射","secondary":["筋紡錘","Ia群線維","II群線維","Ib群線維"],"question":"筋紡錘からの求心性線維を2つ選べ。","options":[{"id":"o1","text":"Ia群線維"},{"id":"o2","text":"Ib群線維"},{"id":"o3","text":"II群線維"},{"id":"o4","text":"III群線維"},{"id":"o5","text":"IV群線維"}],"answers":["o1","o3"],"why":"正答はIa群線維とII群線維です。筋紡錘は筋の長さや伸張速度を感知し、Ia群・II群求心性線維を介して中枢へ情報を送ります。","option_explanations":{"o1":"正しい。Ia群線維は筋紡錘一次終末からの求心性線維。","o2":"Ib群線維は主に腱器官からの求心性線維。","o3":"正しい。II群線維は筋紡錘二次終末からの求心性線維。","o4":"III群線維は筋紡錘の主要求心性線維ではない。","o5":"IV群線維は無髄の細い線維で、筋紡錘の主要求心性線維ではない。"},"related":"伸張反射では筋紡錘→Ia群線維→α運動ニューロンという基本回路を押さえます。ゴルジ腱器官（Golgi tendon organ）はIb群線維と対応します。","tip":"筋紡錘＝Ia・II、ゴルジ腱器官（Golgi tendon organ）＝Ib。","glossary":[{"term":"筋紡錘","desc":"筋長とその変化を検出する固有受容器。"},{"term":"ゴルジ腱器官（Golgi tendon organ）","desc":"筋腱移行部にあり、筋張力を検出する受容器。"}],"official_answers":[1,3],"problemImage":null,"problemImageCaption":null,"exam_links":["腱反射は筋紡錘を利用した伸張反射。","相反性抑制では拮抗筋の活動低下が起こる。"],"round":60},{"id":"60B63","round":60,"source":"第60回・午後63（出題内容をもとに学習用再構成）","source_session":"午後","source_no":63,"subject":"生理学","domain":"体温調節","topic":"体温","concept":"体温調節","secondary":["熱放散","呼気","発汗","皮膚血流"],"question":"人体の熱放散に関する記述として正しいのはどれか。","options":[{"id":"o1","text":"呼気からも熱は放散される"},{"id":"o2","text":"ふるえは熱放散を増やす反応である"},{"id":"o3","text":"皮膚血管収縮は皮膚からの熱放散を増やす"},{"id":"o4","text":"発汗の蒸発は熱産生を増やすために起こる"},{"id":"o5","text":"褐色脂肪組織の活動は熱放散を目的とする"}],"answers":["o1"],"why":"正答は『呼気からも熱は放散される』です。身体の熱は皮膚からの放射・伝導・対流・蒸発に加え、呼気に含まれる水分や温められた空気を介しても失われます。","option_explanations":{"o1":"正しい。呼吸器からは温められた空気と水分の蒸発に伴って熱が失われる。","o2":"ふるえは骨格筋の不随意収縮によって熱産生を増やす反応。","o3":"皮膚血管収縮は皮膚血流を減らし、熱放散を抑える。","o4":"発汗は汗の蒸発によって熱を奪い、熱放散を増やす。","o5":"褐色脂肪組織は非ふるえ熱産生に関与する。"},"related":"暑熱時は皮膚血管拡張と発汗により熱放散を増やし、寒冷時は皮膚血管収縮・ふるえ・代謝亢進などで体温低下を防ぎます。中枢では視床下部が重要です。","tip":"暑い→血管拡張・発汗。寒い→血管収縮・ふるえ。","glossary":[{"term":"蒸発","desc":"液体の水分が気化する際に熱を奪う現象。発汗による熱放散の主要機序。"},{"term":"ふるえ熱産生","desc":"骨格筋の不随意収縮によって熱産生を増やす寒冷防御反応。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["体温調節中枢は視床下部にある。","高温多湿では汗が蒸発しにくくなり、熱放散効率が低下する。"]},{"id":"60B64","round":60,"source":"第60回・午後64（出題内容をもとに学習用再構成）","source_session":"午後","source_no":64,"subject":"生理学","domain":"内分泌・栄養・代謝","topic":"代謝","concept":"糖代謝","secondary":["嫌気性解糖","乳酸","ピルビン酸","ATP"],"question":"酸素供給が不十分な状況で進む嫌気性解糖について正しいのはどれか。","options":[{"id":"o1","text":"TCA回路が直接ATPを大量産生する"},{"id":"o2","text":"反応の中心はミトコンドリア内膜である"},{"id":"o3","text":"クレアチンリン酸系そのものを指す"},{"id":"o4","text":"ピルビン酸から乳酸が生成される"},{"id":"o5","text":"グルコース1分子あたりの正味ATP産生は30分子以上である"}],"answers":["o4"],"why":"正答は『ピルビン酸から乳酸が生成される』です。嫌気的条件では解糖系で生じたピルビン酸が乳酸へ還元され、この反応でNAD⁺が再生されるため解糖を継続できます。解糖系は細胞質で進み、グルコース1分子あたりの正味ATP産生は2分子です。","option_explanations":{"o1":"TCA回路はミトコンドリア内で進む好気的代謝の一部で、嫌気性解糖そのものではない。","o2":"解糖系は細胞質で行われる。ミトコンドリア内膜は電子伝達系・酸化的リン酸化の場。","o3":"クレアチンリン酸系は解糖系とは別の短時間高出力のエネルギー供給系。","o4":"正しい。嫌気的条件ではピルビン酸が乳酸へ還元される。","o5":"嫌気性解糖で得られるATPはグルコース1分子あたり正味2分子。"},"related":"短時間高強度運動ではATP-PCr系と解糖系の寄与が大きくなり、運動時間が長くなるほど酸化系の比重が高まります。ただし実際には各エネルギー供給系が完全に切り替わるわけではなく同時に働きます。","tip":"解糖＝細胞質、正味2 ATP、嫌気的なら乳酸へ。","glossary":[{"term":"解糖系","desc":"細胞質でグルコースをピルビン酸まで分解しATPを得る代謝経路。"},{"term":"乳酸","desc":"嫌気的条件などでピルビン酸から生成される代謝産物。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":["ATP-PCr系は最も迅速だが貯蔵量が少ない。","乳酸は単なる老廃物ではなく、他組織でエネルギー基質として再利用されうる。"]},{"id":"60B65","round":60,"source":"第60回・午後65（出題内容をもとに学習用再構成）","source_session":"午後","source_no":65,"subject":"生理学","domain":"自律神経","topic":"自律神経機能","concept":"副交感神経","secondary":["副交感神経","涙腺","唾液腺","アセチルコリン"],"question":"副交感神経活動によって分泌が促進されるものを2つ選べ。","options":[{"id":"o1","text":"汗腺からの発汗"},{"id":"o2","text":"涙腺からの涙液"},{"id":"o3","text":"舌下腺からの唾液"},{"id":"o4","text":"腎傍糸球体細胞からのレニン"},{"id":"o5","text":"交感神経終末からのノルアドレナリン"}],"answers":["o2","o3"],"why":"正答は涙液と舌下腺からの唾液です。副交感神経は『休息と消化』に関連し、涙腺や唾液腺などの分泌を促進します。汗腺は例外的に交感神経のコリン作動性線維によって支配されます。","option_explanations":{"o1":"汗腺は主に交感神経支配で、節後線維末端ではアセチルコリンが使われる。","o2":"正しい。涙腺分泌は副交感神経活動で促進される。","o3":"正しい。舌下腺などの唾液腺分泌は副交感神経で促進される。","o4":"レニン分泌は交感神経β1受容体刺激などで促進される。","o5":"ノルアドレナリンは多くの交感神経節後線維末端から放出される。"},"related":"自律神経は『交感＝活動・循環動員』『副交感＝休息・消化・分泌』を大枠にしつつ、汗腺の交感神経コリン作動性支配のような例外を押さえると整理しやすいです。","tip":"涙・唾液＝副交感。汗腺＝交感だけどACh。","glossary":[{"term":"コリン作動性","desc":"神経伝達物質としてアセチルコリンを用いること。"},{"term":"レニン","desc":"腎臓の傍糸球体細胞から分泌され、レニン・アンジオテンシン・アルドステロン系を開始する酵素。"}],"official_answers":[2,3],"problemImage":null,"problemImageCaption":null,"exam_links":["副交感神経節後線維の主要伝達物質はアセチルコリン。","交感神経節後線維は原則ノルアドレナリンだが、汗腺ではアセチルコリン。"]},{"id":"60B66","round":60,"source":"第60回・午後66（出題内容をもとに学習用再構成）","source_session":"午後","source_no":66,"subject":"生理学","domain":"呼吸","topic":"呼吸調節","concept":"酸塩基平衡","secondary":["代謝性アルカローシス","嘔吐","呼吸性アシドーシス","重炭酸"],"question":"酸塩基平衡でアルカローシスを生じやすい病態はどれか。","options":[{"id":"o1","text":"持続する嘔吐"},{"id":"o2","text":"飢餓によるケトン体増加"},{"id":"o3","text":"高度の下痢"},{"id":"o4","text":"換気不全を伴う重症喘息"},{"id":"o5","text":"CO₂ナルコーシス"}],"answers":["o1"],"why":"正答は持続する嘔吐です。胃液には塩酸が含まれるため、嘔吐でH⁺とCl⁻を失うと代謝性アルカローシスを生じやすくなります。これに対し下痢では重炭酸喪失、ケトーシスでは有機酸増加により代謝性アシドーシス方向へ傾きます。","option_explanations":{"o1":"正しい。胃酸喪失により代謝性アルカローシスを生じやすい。","o2":"飢餓ではケトン体が増加し、代謝性アシドーシスの原因になりうる。","o3":"下痢では腸液中のHCO₃⁻喪失により代謝性アシドーシスを生じやすい。","o4":"重症化して換気不全・CO₂貯留が生じると呼吸性アシドーシス方向となる。","o5":"CO₂ナルコーシスは高二酸化炭素血症を伴い、呼吸性アシドーシスに関連する。"},"related":"酸塩基平衡ではまず『呼吸性＝PaCO₂』『代謝性＝HCO₃⁻』を軸に整理します。嘔吐＝酸を失う、下痢＝重炭酸を失う、という対比は頻出です。","tip":"嘔吐＝H⁺を失う→アルカローシス。下痢＝HCO₃⁻を失う→アシドーシス。","glossary":[{"term":"代謝性アルカローシス","desc":"主にH⁺喪失やHCO₃⁻増加によって血液pHがアルカリ側へ傾く状態。"},{"term":"CO₂ナルコーシス","desc":"高度の高二酸化炭素血症により意識障害などを呈する状態。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["過換気ではPaCO₂低下により呼吸性アルカローシスを生じる。","低換気ではPaCO₂上昇により呼吸性アシドーシスを生じる。"]},{"id":"60B67","round":60,"source":"第60回・午後67（出題内容をもとに学習用再構成）","source_session":"午後","source_no":67,"subject":"生理学","domain":"血液・免疫","topic":"凝固・免疫","concept":"獲得免疫","secondary":["体液性免疫","B細胞","抗体","形質細胞"],"question":"抗体産生を中心とする体液性免疫で主要な役割を担う細胞はどれか。","options":[{"id":"o1","text":"単球"},{"id":"o2","text":"B細胞"},{"id":"o3","text":"好中球"},{"id":"o4","text":"NK細胞"},{"id":"o5","text":"マクロファージ"}],"answers":["o2"],"why":"正答はB細胞です。B細胞は抗原刺激を受けると形質細胞へ分化し、抗体を産生します。この抗体による防御が体液性免疫の中心です。","option_explanations":{"o1":"単球は血中を循環する貪食系細胞で、組織内ではマクロファージへ分化する。","o2":"正しい。B細胞は形質細胞へ分化し抗体を産生する。","o3":"好中球は自然免疫で細菌などの貪食に重要。","o4":"NK細胞は自然免疫でウイルス感染細胞や腫瘍細胞などの排除に関与する。","o5":"マクロファージは貪食や抗原提示などに関与するが、抗体産生の主体ではない。"},"related":"獲得免疫は大きく体液性免疫と細胞性免疫に分けます。体液性＝B細胞・抗体、細胞性＝T細胞、という基本対応を押さえます。","tip":"B細胞→形質細胞→抗体＝体液性免疫。","glossary":[{"term":"体液性免疫","desc":"抗体を介して病原体や毒素などに対処する獲得免疫。"},{"term":"形質細胞","desc":"B細胞から分化し、多量の抗体を分泌する細胞。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["ヘルパーT細胞はB細胞の活性化にも関与する。","NK細胞は獲得免疫のT細胞とは異なり、自然免疫に分類される。"]},{"id":"60B68","round":60,"source":"第60回・午後68（出題内容をもとに学習用再構成）","source_session":"午後","source_no":68,"subject":"生理学","domain":"排便","topic":"排便機構","concept":"排便反射","secondary":["排便中枢","仙髄","S2-S4","骨盤内臓神経"],"question":"排便反射の調節に重要な仙髄中枢が存在する髄節はどれか。","options":[{"id":"o1","text":"T1〜T3"},{"id":"o2","text":"T5〜T7"},{"id":"o3","text":"T10〜T12"},{"id":"o4","text":"L3〜L5"},{"id":"o5","text":"S2〜S4"}],"answers":["o5"],"why":"正答はS2〜S4です。直腸壁が伸展すると求心性刺激が仙髄へ伝わり、S2〜S4由来の副交感神経である骨盤内臓神経を介して直腸収縮や内肛門括約筋弛緩などの排便反射が促進されます。","option_explanations":{"o1":"T1〜T3は排便反射の主要な仙髄中枢ではない。","o2":"T5〜T7も排便中枢の髄節ではない。","o3":"T10〜T12は仙髄性排便反射の中枢ではない。","o4":"L3〜L5ではなく、主要な副交感性排便中枢は仙髄にある。","o5":"正しい。S2〜S4は骨盤内臓神経の起始と関連し、排便・排尿・性機能で重要。"},"related":"骨盤内臓神経はS2〜S4由来の副交感神経で、排便だけでなく排尿にも重要です。外肛門括約筋は陰部神経による体性支配を受け、随意的な調節に関与します。","tip":"骨盤内臓神経＝S2〜S4＝排便・排尿。","glossary":[{"term":"骨盤内臓神経","desc":"S2〜S4から出る副交感神経線維を含み、骨盤内臓の機能調節に関与する。"},{"term":"排便反射","desc":"直腸伸展を契機に直腸収縮や肛門括約筋の調節を起こす反射。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["排尿の副交感神経もS2〜S4由来。","外肛門括約筋は陰部神経支配で随意調節される。"]},{"id":"60B69","source":"第60回・午後69（出題内容をもとに再構成）","source_session":"午後","source_no":69,"subject":"運動学","domain":"四肢・体幹の運動","topic":"肩甲帯・肩","concept":"肩甲骨運動","secondary":["僧帽筋下部","上方回旋","前鋸筋"],"question":"肩甲骨に作用する筋と運動の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"僧帽筋上部線維 ― 外転"},{"id":"o2","text":"僧帽筋下部線維 ― 上方回旋"},{"id":"o3","text":"菱形筋 ― 下制"},{"id":"o4","text":"前鋸筋 ― 下方回旋"},{"id":"o5","text":"小胸筋 ― 挙上"}],"answers":["o2"],"why":"正答は『僧帽筋下部線維―上方回旋』です。肩甲骨の上方回旋では僧帽筋上部・下部線維と前鋸筋が協調し、フォースカップルを形成します。上肢挙上時に肩甲骨関節窩を上向きに回すため重要です。","option_explanations":{"o1":"僧帽筋上部線維は主に肩甲骨挙上と上方回旋に寄与する。肩甲骨外転（前方突出）の主働筋は前鋸筋。","o2":"正しい。僧帽筋下部線維は肩甲骨下制に加え、前鋸筋・僧帽筋上部と協働して上方回旋に寄与する。","o3":"菱形筋は主に肩甲骨内転（後退）・下方回旋に作用し、下制が主作用ではない。","o4":"前鋸筋は肩甲骨外転と上方回旋に作用する。","o5":"小胸筋は肩甲骨を前傾・下制・下方回旋方向へ作用させ、挙上が主作用ではない。"},"related":"肩甲骨上方回旋は上肢挙上の重要要素で、僧帽筋上部・下部＋前鋸筋の協調が基本です。肩甲上腕リズムとセットで理解します。","tip":"上方回旋の3者＝僧帽筋上部・僧帽筋下部・前鋸筋。","glossary":[{"term":"フォースカップル","desc":"複数の筋が別方向に力を出しながら協調し、1つの回旋運動を生み出す仕組み。"},{"term":"上方回旋","desc":"肩甲骨の下角が外上方へ動き、関節窩が上向きになる運動。"},{"term":"前鋸筋","desc":"肩甲骨外転と上方回旋に重要な筋。翼状肩甲の関連筋としても有名。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["前鋸筋は長胸神経支配。長胸神経障害では翼状肩甲がみられる。","上肢挙上では肩甲上腕リズムと肩甲骨上方回旋を関連づけて覚える。"],"round":60},{"id":"60B70","source":"第60回・午後70（出題内容をもとに学習用再構成）","source_session":"午後","source_no":70,"subject":"運動学","domain":"四肢・体幹の運動","topic":"膝関節","concept":"膝屈曲伸展","secondary":["膝関節","スクリューホーム運動","前十字靱帯","関節包内運動"],"question":"膝関節の運動学について正しいのはどれか。","options":[{"id":"o1","text":"膝関節伸展終末では脛骨は大腿骨に対して内旋する"},{"id":"o2","text":"前十字靱帯は脛骨の後方移動を主に制動する"},{"id":"o3","text":"開放運動連鎖の膝伸展では脛骨は後方へ滑る"},{"id":"o4","text":"膝蓋骨は膝伸展で遠位方向へ移動する"},{"id":"o5","text":"開放運動連鎖の膝伸展終末では脛骨外旋が起こる"}],"answers":["o5"],"why":"正答は『開放運動連鎖の膝伸展終末では脛骨外旋が起こる』です。これはスクリューホーム運動の一部で、終末伸展で膝を安定させます。","option_explanations":{"o1":"開放運動連鎖では終末伸展で脛骨外旋が起こる。","o2":"前十字靱帯は脛骨の前方移動などを制動する。","o3":"開放運動連鎖の伸展では関節面形状に従い脛骨は前方へ滑る。","o4":"膝蓋骨は膝伸展で近位方向へ移動する。","o5":"正しい。終末伸展で脛骨外旋が起こる。"},"related":"スクリューホーム運動は開放運動連鎖では脛骨外旋、閉鎖運動連鎖では大腿骨内旋として表現されます。膝の靱帯機能と合わせて理解します。","tip":"膝伸展ロック：開放連鎖＝脛骨外旋。","glossary":[{"term":"スクリューホーム運動","desc":"膝関節終末伸展で起こる回旋運動。膝の安定化に関与する。"},{"term":"前十字靱帯","desc":"脛骨の前方移動や過伸展などを制動する重要な靱帯。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["前十字靱帯損傷では前方引き出しテストやラックマンテスト（Lachman test）が関連する。","膝蓋大腿関節の動きも膝屈伸と関連づける。"],"round":60},{"id":"60B71","source":"第60回・午後71（出題内容をもとに学習用再構成）","source_session":"午後","source_no":71,"subject":"運動学","domain":"四肢・体幹の運動","topic":"体幹","concept":"脊柱運動","secondary":["脊柱","前縦靱帯","後縦靱帯","伸展制動"],"question":"脊柱伸展を主に制限する靱帯はどれか。","options":[{"id":"o1","text":"黄色靱帯"},{"id":"o2","text":"棘上靱帯"},{"id":"o3","text":"前縦靱帯"},{"id":"o4","text":"棘間靱帯"},{"id":"o5","text":"後縦靱帯"}],"answers":["o3"],"why":"正答は前縦靱帯です。前縦靱帯は椎体前面を縦走し、脊柱の過伸展を制限します。","option_explanations":{"o1":"黄色靱帯は椎弓間を連結し、主に屈曲時に伸張される。","o2":"棘上靱帯は棘突起先端を連結し、屈曲制限に関与する。","o3":"正しい。前縦靱帯は脊柱伸展を制限する。","o4":"棘間靱帯は棘突起間にあり、屈曲で緊張する。","o5":"後縦靱帯は椎体後面を走り、屈曲制限に関与する。"},"related":"脊柱靱帯は『前縦＝伸展を止める』『後縦・棘間・棘上・黄色＝屈曲で伸張』という方向性で整理すると覚えやすいです。","tip":"前縦靱帯だけ前面にあり、伸展で張る。","glossary":[{"term":"前縦靱帯","desc":"椎体前面を縦走し、脊柱過伸展を制限する靱帯。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["頸椎・腰椎の前弯、胸椎の後弯と脊柱運動を関連づける。","椎間板と靱帯の役割を区別する。"],"round":60},{"id":"60B72","source":"第60回・午後72（出題内容をもとに学習用再構成）","source_session":"午後","source_no":72,"subject":"運動学","domain":"四肢・体幹の運動","topic":"呼吸運動","concept":"胸郭運動","secondary":["努力性呼気","腹筋群","内肋間筋","横隔膜"],"question":"努力性呼気で働く筋として最も適切なのはどれか。","options":[{"id":"o1","text":"横隔膜"},{"id":"o2","text":"外肋間筋"},{"id":"o3","text":"腹筋群"},{"id":"o4","text":"胸鎖乳突筋"},{"id":"o5","text":"前斜角筋"}],"answers":["o3"],"why":"正答は腹筋群です。安静呼気は主に肺・胸郭の弾性収縮で起こりますが、努力性呼気では腹筋群や内肋間筋などが能動的に働きます。","option_explanations":{"o1":"横隔膜は主要な吸気筋。","o2":"外肋間筋は主に吸気に作用する。","o3":"正しい。腹直筋・腹斜筋・腹横筋などは努力性呼気に関与する。","o4":"胸鎖乳突筋は吸気補助筋として働く。","o5":"前斜角筋も吸気補助筋。"},"related":"呼吸筋は『安静吸気＝横隔膜中心』『安静呼気＝受動』『努力性呼気＝腹筋群・内肋間筋』で整理します。","tip":"努力性呼気＝腹筋群＋内肋間筋。","glossary":[{"term":"努力性呼気","desc":"運動時や強い呼出時に呼気筋を能動的に使う呼気。"},{"term":"呼吸補助筋","desc":"換気要求増大時に主呼吸筋を補助する筋。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["慢性閉塞性肺疾患（chronic obstructive pulmonary disease：COPD）などでは呼吸補助筋の過活動がみられることがある。","横隔膜は横隔神経支配で、頸髄C3〜C5由来。"],"round":60},{"id":"60B73","source":"第60回・午後73（出題内容をもとに学習用再構成）","source_session":"午後","source_no":73,"subject":"運動学","domain":"四肢・体幹の運動","topic":"肘・前腕","concept":"肘屈曲伸展","secondary":["上腕二頭筋","前腕回外","肘屈曲","上腕筋"],"question":"上肢の筋と運動の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"上腕三頭筋 ― 前腕回外"},{"id":"o2","text":"上腕二頭筋 ― 前腕回外"},{"id":"o3","text":"円回内筋 ― 前腕回外"},{"id":"o4","text":"上腕筋 ― 肘伸展"},{"id":"o5","text":"腕橈骨筋 ― 肩関節外転"}],"answers":["o2"],"why":"正答は『上腕二頭筋―前腕回外』です。上腕二頭筋は肘屈曲に加え、とくに肘屈曲位で強力な前腕回外筋として働きます。","option_explanations":{"o1":"上腕三頭筋の主作用は肘伸展。","o2":"正しい。上腕二頭筋は前腕回外に強く作用する。","o3":"円回内筋は前腕回内に作用する。","o4":"上腕筋は主要な肘屈筋。","o5":"腕橈骨筋は肘屈曲に関与する。"},"related":"肘屈曲筋では上腕筋・上腕二頭筋・腕橈骨筋の違いを整理します。前腕回外は上腕二頭筋と回外筋、回内は円回内筋と方形回内筋が中心です。","tip":"上腕二頭筋＝肘屈曲＋前腕回外。","glossary":[{"term":"回外","desc":"前腕を解剖学的肢位で手掌が前方を向く方向へ回す運動。"},{"term":"上腕筋","desc":"前腕の回内外位にかかわらず強く働く肘屈筋。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["上腕二頭筋の支配神経は筋皮神経。","前腕回内外の関節は近位・遠位橈尺関節。"],"round":60},{"id":"60B74","source":"第60回・午後74（出題内容をもとに再構成）","source_session":"午後","source_no":74,"subject":"運動学","domain":"運動制御・運動学習","topic":"運動学習","concept":"運動学習の原則","secondary":["小脳","手続き記憶","フィードフォワード"],"question":"運動学習について正しい記述はどれか。","options":[{"id":"o1","text":"運動学習の過程には小脳が関与する"},{"id":"o2","text":"学習初期から手続き記憶のみで運動が成立する"},{"id":"o3","text":"覚醒レベルが高いほどパフォーマンスは常に向上する"},{"id":"o4","text":"熟練するとフィードバック制御への依存が増える"},{"id":"o5","text":"練習量と達成度の学習曲線は典型的に逆U字型である"}],"answers":["o1"],"why":"正答は『運動学習の過程には小脳が関与する』です。小脳は運動誤差の検出・修正や適応学習に重要で、反復練習による運動パターンの更新に関与します。運動学習は認知的な理解から始まり、練習によって自動化が進みます。","option_explanations":{"o1":"正しい。小脳は誤差学習や運動適応、タイミング調整などに重要。","o2":"学習初期は課題理解や注意など意識的処理の比重が高く、反復により手続き化・自動化が進む。","o3":"覚醒レベルとパフォーマンスは単純比例ではなく、課題によって適度な覚醒水準が異なる。","o4":"熟練すると予測的なフィードフォワード制御が発達し、逐次的フィードバックへの依存は相対的に減る。","o5":"学習曲線は一般に練習量に応じて改善し、その後伸びが緩やかになる形などで表され、逆U字は覚醒とパフォーマンスの関係で用いられる。"},"related":"運動学習では、結果の知識（knowledge of results：KR）と遂行の知識（knowledge of performance：KP）、集中練習と分散練習、ブロック練習とランダム練習、保持と転移も頻出です。KRは『結果がどうだったか』、KPは『動作のやり方がどうだったか』という違いです。","tip":"逆U字＝覚醒とパフォーマンス。運動学習の誤差修正＝小脳。","glossary":[{"term":"フィードフォワード制御","desc":"運動前・運動中の予測に基づいてあらかじめ調整する制御。熟練で重要性が増す。"},{"term":"フィードバック制御","desc":"実際の運動結果を感覚情報として受け取り、修正に利用する制御。"},{"term":"逆U字","desc":"覚醒水準とパフォーマンスの関係を説明する概念。高すぎても低すぎても成績は下がる。"},{"term":"結果の知識","desc":"knowledge of results（KR）。課題の結果に関するフィードバック。例：目標から何cmずれたか。"},{"term":"遂行の知識","desc":"knowledge of performance（KP）。運動の方法やフォームに関するフィードバック。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["結果の知識（KR）は結果、遂行の知識（KP）は動作方法に関するフィードバック。","保持テスト・転移テストは『その場でできた』のではなく学習が成立したかを見る指標。"],"round":60},{"id":"58A51","round":58,"source":"第58回・午前51（出題内容をもとに学習用再構成）","source_session":"午前","source_no":51,"subject":"解剖学","domain":"筋系","topic":"上肢の筋","concept":"手の外来筋","secondary":["外来筋","手内在筋","短母指伸筋","母指球筋","小指球筋"],"question":"手の外来筋に分類されるのはどれか。","options":[{"id":"o1","text":"短母指外転筋"},{"id":"o2","text":"短小指屈筋"},{"id":"o3","text":"短母指屈筋"},{"id":"o4","text":"短母指伸筋"},{"id":"o5","text":"短掌筋"}],"answers":["o4"],"why":"短母指伸筋は前腕後面から起こり手に腱を送る外来筋です。ほかの4筋は手部に筋腹をもつ手内在筋です。","option_explanations":{"o1":"母指球筋の一つで手内在筋です。","o2":"小指球筋の一つで手内在筋です。","o3":"母指球筋の一つで手内在筋です。","o4":"正しい。前腕に筋腹をもち長母指伸筋などと同じ外来筋です。","o5":"小指球部の手内在筋です。"},"related":"手指筋は「前腕から腱が来る外来筋」と「手の中に筋腹をもつ内在筋」に分けて整理すると判別しやすくなります。","tip":"短母指伸筋は前腕筋＝外来筋。","glossary":[{"term":"外来筋","desc":"手の外に筋腹があり、腱が手指へ達して作用する筋。"},{"term":"手内在筋","desc":"筋の起始・停止が主として手部内にある筋。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A52","round":58,"source":"第58回・午前52（出題内容をもとに学習用再構成）","source_session":"午前","source_no":52,"subject":"解剖学","domain":"神経系","topic":"伝導路","concept":"下行性伝導路","secondary":["外側皮質脊髄路","錐体路","脊髄視床路","脊髄小脳路","下行路"],"question":"次のうち下行性の神経路はどれか。","options":[{"id":"o1","text":"後脊髄小脳路"},{"id":"o2","text":"前脊髄視床路"},{"id":"o3","text":"前脊髄小脳路"},{"id":"o4","text":"外側脊髄視床路"},{"id":"o5","text":"外側皮質脊髄路"}],"answers":["o5"],"why":"外側皮質脊髄路は大脳皮質から脊髄へ運動指令を伝える代表的な下行路です。脊髄視床路と脊髄小脳路は上行路です。","option_explanations":{"o1":"固有感覚を小脳へ送る上行路です。","o2":"痛覚・温度覚などを上位中枢へ送る上行路です。","o3":"小脳へ向かう上行路です。","o4":"痛覚・温度覚を伝える上行路です。","o5":"正しい。随意運動に重要な下行性錐体路です。"},"related":"「皮質→脊髄」は下行、「脊髄→視床・小脳」は上行という名称の向きも手掛かりになります。","tip":"皮質脊髄路＝下行性運動路。","glossary":[{"term":"外側皮質脊髄路","desc":"大脳皮質から脊髄前角へ下行し、四肢の随意運動に関与する経路。"},{"term":"脊髄視床路","desc":"痛覚・温度覚などを脊髄から視床へ上行させる経路。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A53","round":58,"source":"第58回・午前53（出題内容をもとに学習用再構成）","source_session":"午前","source_no":53,"subject":"解剖学","domain":"神経系","topic":"下肢末梢神経","concept":"閉鎖神経","secondary":["閉鎖神経","腰神経叢","L2-L4","薄筋","股関節内転筋"],"question":"閉鎖神経について正しいのはどれか。","options":[{"id":"o1","text":"第1仙髄神経根の線維を含む"},{"id":"o2","text":"大腿外側の表在覚を支配する"},{"id":"o3","text":"仙骨神経叢から分岐する"},{"id":"o4","text":"坐骨切痕を通る"},{"id":"o5","text":"薄筋を支配する"}],"answers":["o5"],"why":"閉鎖神経は腰神経叢L2〜L4由来で閉鎖管を通り、内転筋群や薄筋などを支配します。感覚領域は主に大腿内側です。","option_explanations":{"o1":"主な根はL2〜L4です。","o2":"感覚支配は主に大腿内側です。","o3":"腰神経叢から分岐します。","o4":"閉鎖管を通ります。","o5":"正しい。薄筋は閉鎖神経支配です。"},"related":"閉鎖神経＝L2〜L4、閉鎖管、内転筋群、大腿内側感覚をセットで覚えます。","tip":"閉鎖神経は「L2-4＋内転」。","glossary":[{"term":"閉鎖神経","desc":"腰神経叢L2〜L4由来で、主に大腿内転筋群を支配する神経。"},{"term":"閉鎖管","desc":"閉鎖神経・閉鎖動静脈が骨盤から大腿へ通る通路。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A54","round":58,"source":"第58回・午前54（出題内容をもとに学習用再構成）","source_session":"午前","source_no":54,"subject":"解剖学","domain":"脈管系","topic":"血管","concept":"大動脈弓の分枝","secondary":["大動脈弓","腕頭動脈","総頸動脈","鎖骨下動脈","椎骨動脈"],"question":"大動脈弓から直接分枝する動脈を2つ選べ。","options":[{"id":"o1","text":"腕頭動脈"},{"id":"o2","text":"右鎖骨下動脈"},{"id":"o3","text":"左鎖骨下動脈"},{"id":"o4","text":"右椎骨動脈"},{"id":"o5","text":"左椎骨動脈"}],"answers":["o1","o3"],"why":"大動脈弓の主要3分枝は腕頭動脈、左総頸動脈、左鎖骨下動脈です。右鎖骨下動脈は腕頭動脈から分かれ、椎骨動脈は鎖骨下動脈から分岐します。","option_explanations":{"o1":"正しい。大動脈弓の直接枝です。","o2":"腕頭動脈から分岐します。","o3":"正しい。大動脈弓の直接枝です。","o4":"右鎖骨下動脈から分岐します。","o5":"左鎖骨下動脈から分岐します。"},"related":"大動脈弓は「腕頭・左総頸・左鎖骨下」の3本を順番で覚えると安定します。","tip":"腕頭→左総頸→左鎖骨下。","glossary":[{"term":"大動脈弓","desc":"上行大動脈から下行大動脈へ移行する弓状部。"},{"term":"腕頭動脈","desc":"大動脈弓から最初に分岐し、右総頸動脈と右鎖骨下動脈に分かれる動脈。"}],"official_answers":[1,3],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A55","round":58,"source":"第58回・午前55（出題内容をもとに学習用再構成）","source_session":"午前","source_no":55,"subject":"解剖学","domain":"内臓諸器官","topic":"消化器","concept":"小網","secondary":["小網","肝胃間膜","肝十二指腸間膜","大網","腹膜"],"question":"小網を構成する構造を2つ選べ。","options":[{"id":"o1","text":"肝胃間膜"},{"id":"o2","text":"肝十二指腸間膜"},{"id":"o3","text":"胃結腸間膜"},{"id":"o4","text":"大網"},{"id":"o5","text":"小腸間膜"}],"answers":["o1","o2"],"why":"小網は肝臓と胃・十二指腸の間をつなぐ腹膜で、肝胃間膜と肝十二指腸間膜から構成されます。原問題は正答となる選択肢が3つあり、3通りの組合せが正解扱いとなったため、学習用に設問を再構成しています。","option_explanations":{"o1":"正しい。小網の構成要素です。","o2":"正しい。小網の構成要素で、門脈・固有肝動脈・総胆管などが走ります。","o3":"大網の一部を形成する腹膜構造です。","o4":"胃から垂れ下がる大きな腹膜ヒダです。","o5":"小腸を後腹壁へ固定する腸間膜です。"},"related":"肝十二指腸間膜では「総胆管・固有肝動脈・門脈」の位置関係も頻出です。","tip":"小網＝肝胃間膜＋肝十二指腸間膜。","glossary":[{"term":"小網","desc":"肝臓と胃小彎・十二指腸上部を結ぶ腹膜性の二重膜。"},{"term":"肝十二指腸間膜","desc":"小網の右側自由縁で、門脈三つ組を含む。"}],"official_answers":[1,2,3],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html","scoring_status":"採点調整","excludeFromDiagnosis":true,"official_answer_patterns":[[1,2],[1,3],[2,3]],"official_note":"第58回午前55の原問題は3つの選択肢が正解となり、1・2、1・3、2・3の3通りを正解として採点。アプリでは知識を明確にするため「小網の構成」に学習用再構成。"},{"id":"58A56","round":58,"source":"第58回・午前56（出題内容をもとに学習用再構成）","source_session":"午前","source_no":56,"subject":"解剖学","domain":"内臓諸器官","topic":"呼吸器","concept":"気管支と肺胞","secondary":["細気管支","葉気管支","区域気管支","肺胞","気管支軟骨"],"question":"肺の構造について正しいのはどれか。","options":[{"id":"o1","text":"左肺には3本の葉気管支がある"},{"id":"o2","text":"1本の葉気管支は必ず6本の区域気管支に分かれる"},{"id":"o3","text":"左肺には12本の区域気管支がある"},{"id":"o4","text":"細気管支は軟骨を欠く"},{"id":"o5","text":"左右肺の肺胞数は合計約5,000万個である"}],"answers":["o4"],"why":"細気管支は気管支とは異なり壁に軟骨をもちません。左肺は2葉で、区域数には解剖学的変異があり、肺胞は数億個規模です。","option_explanations":{"o1":"左肺は上葉・下葉の2葉です。","o2":"区域気管支数は葉ごとに一定の6本ではありません。","o3":"左肺の肺区域数は一般に8〜10程度で扱われます。","o4":"正しい。細気管支には軟骨がありません。","o5":"肺胞数は数億個規模とされます。"},"related":"気管支から細気管支へ細くなるにつれ軟骨は消失し、平滑筋の相対的役割が大きくなります。","tip":"細気管支＝軟骨なし。","glossary":[{"term":"細気管支","desc":"軟骨を欠き、平滑筋をもつ小径の気道。"},{"term":"肺区域","desc":"区域気管支を単位とする肺の解剖学的・外科的区分。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A57","round":58,"source":"第58回・午前57（出題内容をもとに学習用再構成）","source_session":"午前","source_no":57,"subject":"解剖学","domain":"内臓諸器官","topic":"泌尿・生殖器","concept":"腎臓の内分泌機能","secondary":["レニン","エリスロポエチン","傍糸球体装置","RAA系","腎間質"],"question":"腎臓から分泌される物質を2つ選べ。","options":[{"id":"o1","text":"レニン"},{"id":"o2","text":"メラトニン"},{"id":"o3","text":"カルシトニン"},{"id":"o4","text":"バゾプレシン"},{"id":"o5","text":"エリスロポエチン"}],"answers":["o1","o5"],"why":"腎臓は傍糸球体細胞からレニンを、主に腎間質細胞からエリスロポエチンを産生します。","option_explanations":{"o1":"正しい。傍糸球体装置から分泌されます。","o2":"松果体で産生されます。","o3":"甲状腺C細胞から分泌されます。","o4":"視床下部で合成され下垂体後葉から放出されます。","o5":"正しい。赤血球産生を促進します。"},"related":"腎臓は排泄だけでなく、血圧調節・造血・ビタミンD活性化にも関与します。","tip":"腎＝レニン＋EPO。","glossary":[{"term":"レニン","desc":"レニン・アンジオテンシン・アルドステロン系を開始する腎由来酵素。"},{"term":"エリスロポエチン","desc":"低酸素刺激などで腎から分泌され、骨髄の赤血球産生を促すホルモン。"}],"official_answers":[1,5],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A58","round":58,"source":"第58回・午前58（出題内容をもとに学習用再構成）","source_session":"午前","source_no":58,"subject":"解剖学","domain":"感覚器","topic":"特殊感覚","concept":"眼球の構造","secondary":["錐体","桿体","中心窩","毛様体","虹彩"],"question":"眼球の構造・機能について誤っているのはどれか。","options":[{"id":"o1","text":"視細胞には錐体と桿体がある"},{"id":"o2","text":"視神経乳頭は黄斑より鼻側にある"},{"id":"o3","text":"錐体は中心窩に高密度で存在する"},{"id":"o4","text":"前眼房は眼房水で満たされる"},{"id":"o5","text":"毛様体が瞳孔径を直接調節する"}],"answers":["o5"],"why":"瞳孔径を直接調節するのは虹彩の瞳孔括約筋・散大筋です。毛様体筋は主に水晶体の厚さを変えて調節（焦点合わせ）に関与します。","option_explanations":{"o1":"正しい。視細胞は桿体と錐体です。","o2":"正しい。視神経乳頭は黄斑の鼻側に位置します。","o3":"正しい。中心窩は錐体が高密度です。","o4":"正しい。前眼房には眼房水があります。","o5":"誤り。瞳孔径は虹彩筋が調節します。"},"related":"「瞳孔＝虹彩」「ピント＝毛様体筋・水晶体」を分けて覚えます。","tip":"瞳孔は虹彩、焦点調節は毛様体。","glossary":[{"term":"中心窩","desc":"黄斑中心部にあり錐体が密集し、視力が最も高い部位。"},{"term":"毛様体筋","desc":"水晶体の曲率を変えて近見・遠見の調節に関与する平滑筋。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A59","round":58,"source":"第58回・午前59（出題内容をもとに学習用再構成）","source_session":"午前","source_no":59,"subject":"解剖学","domain":"筋系","topic":"上肢の筋","concept":"深指屈筋の触診","secondary":["深指屈筋","方形回内筋","中間広筋","後脛骨筋","触診"],"question":"皮下組織の直下で筋腹を触知しやすい筋はどれか。","options":[{"id":"o1","text":"棘上筋"},{"id":"o2","text":"深指屈筋"},{"id":"o3","text":"方形回内筋"},{"id":"o4","text":"中間広筋"},{"id":"o5","text":"後脛骨筋"}],"answers":["o2"],"why":"選択肢の中では深指屈筋が前腕で触診対象となります。方形回内筋・中間広筋・後脛骨筋などは他の組織や筋に覆われ、表層から直接触れにくい筋です。","option_explanations":{"o1":"僧帽筋などに覆われ深層です。","o2":"正しい。前腕で筋腹・腱の動きを触診できます。","o3":"前腕遠位の深層に位置します。","o4":"大腿直筋・外側広筋などに覆われます。","o5":"下腿深後方区画に位置します。"},"related":"触診問題では「表層筋か深層筋か」と、被覆する筋・骨の位置関係を確認します。","tip":"筋の深さを断面でイメージする。","glossary":[{"term":"深指屈筋","desc":"前腕深層の指屈筋で、主に第2〜5指DIP関節屈曲に作用する。"},{"term":"触診","desc":"体表から組織の位置・硬さ・運動などを手で評価する方法。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A60","round":58,"source":"第58回・午前60（出題内容をもとに学習用再構成）","source_session":"午前","source_no":60,"subject":"解剖学","domain":"筋系","topic":"体幹・呼吸筋","concept":"広背筋の付着","secondary":["広背筋","腸骨稜","胸腰筋膜","上腕骨","体幹筋"],"question":"腸骨稜に付着する筋はどれか。","options":[{"id":"o1","text":"広背筋"},{"id":"o2","text":"小殿筋"},{"id":"o3","text":"僧帽筋"},{"id":"o4","text":"多裂筋"},{"id":"o5","text":"大腰筋"}],"answers":["o1"],"why":"広背筋は胸腰筋膜を介して腰椎・仙骨・腸骨稜など広い範囲から起始し、上腕骨小結節稜へ停止します。","option_explanations":{"o1":"正しい。腸骨稜後部などから起始します。","o2":"腸骨外面から起始しますが、腸骨稜そのものが主要付着ではありません。","o3":"後頭部・項靱帯・胸椎棘突起などに付着します。","o4":"仙骨・横突起・関節突起などに付着します。","o5":"腰椎椎体・横突起などから起始します。"},"related":"広背筋は「体幹から上腕骨へ渡る筋」で、腸骨稜・胸腰筋膜まで起始が広い点がポイントです。","tip":"広背筋は腸骨稜からも起こる。","glossary":[{"term":"広背筋","desc":"体幹後面から上腕骨へ走る大きな筋で、肩伸展・内転・内旋に作用。"},{"term":"胸腰筋膜","desc":"腰背部の筋群を包み、広背筋などの付着にも関与する強い筋膜。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A61","round":58,"source":"第58回・午前61（出題内容をもとに学習用再構成）","source_session":"午前","source_no":61,"subject":"生理学","domain":"総論","topic":"細胞生理","concept":"細胞内小器官","secondary":["粗面小胞体","リボソーム","Golgi装置","リソソーム","ミトコンドリア"],"question":"細胞内小器官と働きの組合せとして正しいのはどれか。","options":[{"id":"o1","text":"中心小体―転写開始"},{"id":"o2","text":"リソソーム―ATP合成"},{"id":"o3","text":"粗面小胞体―蛋白質合成"},{"id":"o4","text":"Golgi装置―細胞内物質の分解"},{"id":"o5","text":"ミトコンドリア―染色体分離"}],"answers":["o3"],"why":"粗面小胞体にはリボソームが付着し、分泌蛋白や膜蛋白などの合成に関与します。ATP産生は主にミトコンドリア、細胞内分解はリソソームです。","option_explanations":{"o1":"中心小体は紡錘体形成など細胞分裂に関与します。","o2":"リソソームは加水分解酵素による細胞内分解を担います。","o3":"正しい。付着リボソームで蛋白質を合成します。","o4":"Golgi装置は蛋白質・脂質の修飾・仕分け・輸送に関与します。","o5":"ミトコンドリアは主にATP産生を担います。"},"related":"細胞小器官は「作る＝リボソーム/RER、整える＝Golgi、分解＝リソソーム、ATP＝ミトコンドリア」で整理します。","tip":"RER＝蛋白合成。","glossary":[{"term":"粗面小胞体","desc":"表面にリボソームをもつ小胞体で、分泌・膜蛋白の合成に関与。"},{"term":"Golgi装置","desc":"蛋白質や脂質を修飾・仕分けし、小胞として輸送する細胞小器官。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A62","round":58,"source":"第58回・午前62（出題内容をもとに学習用再構成）","source_session":"午前","source_no":62,"subject":"生理学","domain":"神経","topic":"反射","concept":"深部腱反射","secondary":["筋紡錘","Ia線維","α運動ニューロン","γ運動ニューロン","Renshaw細胞"],"question":"深部腱反射について誤っているのはどれか。","options":[{"id":"o1","text":"錘内筋線維が受容器の一部をなす"},{"id":"o2","text":"感覚入力はIa群求心性線維を介する"},{"id":"o3","text":"運動出力はα運動ニューロンを介する"},{"id":"o4","text":"Renshaw細胞はα運動ニューロン側枝から入力を受ける"},{"id":"o5","text":"γ運動ニューロン興奮で反射は減弱する"}],"answers":["o5"],"why":"γ運動ニューロンが錘内筋線維を収縮させると筋紡錘の感受性が高まり、伸張反射はむしろ起こりやすくなります。","option_explanations":{"o1":"正しい。筋紡錘が伸張受容器です。","o2":"正しい。一次終末からIa線維が入力します。","o3":"正しい。α運動ニューロンが錘外筋線維を収縮させます。","o4":"正しい。反回性抑制に関与します。","o5":"誤り。γ活動増加は筋紡錘感受性を高め、反射を増強しうります。"},"related":"深部腱反射は筋紡錘→Ia→脊髄→α運動ニューロンという基本弓をまず押さえます。","tip":"γ活動↑→筋紡錘感受性↑。","glossary":[{"term":"筋紡錘","desc":"筋長とその変化を検出する伸張受容器。"},{"term":"γ運動ニューロン","desc":"錘内筋線維を支配し筋紡錘の感受性を調整する運動ニューロン。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A63","round":58,"source":"第58回・午前63（出題内容をもとに学習用再構成）","source_session":"午前","source_no":63,"subject":"生理学","domain":"咀嚼・嚥下・消化・吸収","topic":"消化吸収","concept":"消化酵素","secondary":["αアミラーゼ","トリプシン","ペプシン","マルターゼ","ラクターゼ"],"question":"消化酵素と基質・産物の組合せとして正しいものを2つ選べ。","options":[{"id":"o1","text":"αアミラーゼ―デンプンをデキストリンへ分解"},{"id":"o2","text":"トリプシン―蛋白質をポリペプチドへ分解"},{"id":"o3","text":"ペプシン―トリグリセリドを脂肪酸へ分解"},{"id":"o4","text":"マルターゼ―スクロースをブドウ糖へ分解"},{"id":"o5","text":"ラクターゼ―乳糖をマルトースへ分解"}],"answers":["o1","o2"],"why":"αアミラーゼはデンプンをより小さな糖へ、トリプシンは蛋白質・ペプチドをさらに分解します。脂肪分解は主にリパーゼ、マルターゼは麦芽糖、ラクターゼは乳糖を分解します。","option_explanations":{"o1":"正しい。デンプンのα1,4結合を加水分解します。","o2":"正しい。膵由来の蛋白分解酵素です。","o3":"ペプシンは蛋白分解酵素です。","o4":"マルターゼはマルトースをグルコースへ分解します。","o5":"ラクターゼは乳糖をグルコースとガラクトースへ分解します。"},"related":"糖質・蛋白質・脂質で「どの酵素が何を切るか」を対応表で整理すると得点源になります。","tip":"アミラーゼ＝糖質、トリプシン＝蛋白質。","glossary":[{"term":"αアミラーゼ","desc":"唾液・膵液に含まれ、デンプンを加水分解する酵素。"},{"term":"トリプシン","desc":"膵臓からトリプシノーゲンとして分泌され、小腸内で働く蛋白分解酵素。"}],"official_answers":[1,2],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html","scoring_status":"採点調整","excludeFromDiagnosis":true,"official_note":"第58回午前63は「複数の正解があるため」採点上の特別取扱いとなった問題。アプリでは2つ選択する学習用形式に整理。"},{"id":"58A64","round":58,"source":"第58回・午前64（出題内容をもとに学習用再構成）","source_session":"午前","source_no":64,"subject":"生理学","domain":"循環","topic":"刺激伝導・心電図","concept":"心臓刺激伝導系","secondary":["洞房結節","房室結節","His束","Purkinje線維","自動能"],"question":"心臓の刺激伝導系について正しいものを2つ選べ。","options":[{"id":"o1","text":"洞房結節は心室中隔にある"},{"id":"o2","text":"房室結節の伝導速度はHis束より速い"},{"id":"o3","text":"房室結節の興奮はHis束より先に生じる"},{"id":"o4","text":"刺激伝導系細胞は活動電位を生成できる"},{"id":"o5","text":"洞房結節の活動電位持続時間はPurkinje線維より長い"}],"answers":["o3","o4"],"why":"興奮は洞房結節から心房、房室結節、His束、脚、Purkinje線維へ伝わります。刺激伝導系の特殊心筋細胞は活動電位を生じ、房室結節は伝導が遅いことが特徴です。","option_explanations":{"o1":"洞房結節は右心房上部にあります。","o2":"房室結節は伝導が特に遅い部位です。","o3":"正しい。房室結節からHis束へ順に伝わります。","o4":"正しい。特殊心筋細胞も電気的興奮性をもちます。","o5":"Purkinje線維の活動電位は長いプラトー相をもちます。"},"related":"順序は「SA→AV→His→脚→Purkinje」。AV結節の遅延は心室充満に重要です。","tip":"AV結節は遅い、順序はSA→AV→His。","glossary":[{"term":"洞房結節","desc":"右心房にあり、通常の心拍のペースメーカーとなる部位。"},{"term":"房室結節","desc":"心房から心室への興奮伝導を遅延させる刺激伝導系の部位。"}],"official_answers":[3,4],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A65","round":58,"source":"第58回・午前65（出題内容をもとに学習用再構成）","source_session":"午前","source_no":65,"subject":"生理学","domain":"血液・免疫","topic":"凝固・免疫","concept":"I型アレルギー","secondary":["IgE","肥満細胞","ヒスタミン","即時型アレルギー","アナフィラキシー"],"question":"I型アレルギーに主要に関与する免疫グロブリンはどれか。","options":[{"id":"o1","text":"IgA"},{"id":"o2","text":"IgD"},{"id":"o3","text":"IgE"},{"id":"o4","text":"IgG"},{"id":"o5","text":"IgM"}],"answers":["o3"],"why":"I型（即時型）アレルギーではIgEが肥満細胞・好塩基球表面に結合し、抗原による架橋でヒスタミンなどが放出されます。","option_explanations":{"o1":"粘膜分泌液などで局所免疫に重要です。","o2":"B細胞表面などに発現します。","o3":"正しい。即時型アレルギーの中心となります。","o4":"血中で最も多く、胎盤通過などの特徴があります。","o5":"初回免疫応答で早期に増える五量体抗体です。"},"related":"I〜IV型アレルギーは機序と代表疾患を対応させて整理します。","tip":"I型＝IgE＋肥満細胞。","glossary":[{"term":"IgE","desc":"肥満細胞や好塩基球のFc受容体に結合し、I型アレルギーを媒介する抗体。"},{"term":"肥満細胞","desc":"ヒスタミンなどの顆粒をもち、即時型アレルギー反応に関与する細胞。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A66","round":58,"source":"第58回・午前66（出題内容をもとに学習用再構成）","source_session":"午前","source_no":66,"subject":"生理学","domain":"腎・排尿","topic":"排尿","concept":"排尿に関わる神経","secondary":["陰部神経","下腹神経","骨盤神経","排尿筋","尿道括約筋"],"question":"蓄尿・排尿機構に関与する神経を2つ選べ。","options":[{"id":"o1","text":"陰部神経"},{"id":"o2","text":"下腹神経"},{"id":"o3","text":"上殿神経"},{"id":"o4","text":"閉鎖神経"},{"id":"o5","text":"迷走神経"}],"answers":["o1","o2"],"why":"陰部神経は外尿道括約筋を体性支配し、下腹神経は交感神経として蓄尿に関与します。排尿反射には骨盤神経も重要ですが、この選択肢には含まれていません。","option_explanations":{"o1":"正しい。外尿道括約筋を支配し随意的尿禁制に関与します。","o2":"正しい。交感神経として排尿筋弛緩・内尿道括約部収縮など蓄尿に寄与します。","o3":"殿筋の運動支配が中心です。","o4":"大腿内転筋群などを支配します。","o5":"膀胱の主要な排尿神経ではありません。"},"related":"排尿は「下腹＝蓄尿」「骨盤＝排尿」「陰部＝外括約筋」を3本セットで覚えます。","tip":"下腹・骨盤・陰部の役割を対比。","glossary":[{"term":"下腹神経","desc":"腰髄由来の交感神経で、主に蓄尿相に働く。"},{"term":"陰部神経","desc":"仙髄由来の体性神経で外尿道括約筋を支配する。"}],"official_answers":[1,2],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A67","round":58,"source":"第58回・午前67（出題内容をもとに学習用再構成）","source_session":"午前","source_no":67,"subject":"生理学","domain":"内分泌・栄養・代謝","topic":"ホルモン","concept":"血糖調節ホルモン","secondary":["グルカゴン","アドレナリン","インスリン","糖新生","グリコーゲン分解"],"question":"血糖値を上昇させる作用をもつホルモンを2つ選べ。","options":[{"id":"o1","text":"アドレナリン"},{"id":"o2","text":"アルドステロン"},{"id":"o3","text":"カルシトニン"},{"id":"o4","text":"グルカゴン"},{"id":"o5","text":"パラトルモン"}],"answers":["o1","o4"],"why":"アドレナリンはグリコーゲン分解などを促し、グルカゴンは肝でのグリコーゲン分解・糖新生を促進して血糖を上げます。","option_explanations":{"o1":"正しい。ストレス時などに血糖を上げます。","o2":"主にNa保持・K排泄と体液量調節に関与します。","o3":"血中Caを低下させる方向に働きます。","o4":"正しい。膵α細胞由来の主要な血糖上昇ホルモンです。","o5":"主に血中Caを上昇させます。"},"related":"血糖を下げる主要ホルモンはインスリン、上げる側は複数ある点を押さえます。","tip":"血糖↓はインスリン、↑はグルカゴン等。","glossary":[{"term":"グルカゴン","desc":"膵α細胞から分泌され、肝での糖産生を増やすホルモン。"},{"term":"糖新生","desc":"乳酸・グリセロール・アミノ酸などからグルコースを新生する代謝経路。"}],"official_answers":[1,4],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A68","round":58,"source":"第58回・午前68（出題内容をもとに学習用再構成）","source_session":"午前","source_no":68,"subject":"生理学","domain":"生殖","topic":"生殖生理","concept":"排卵と卵胞","secondary":["原始卵胞","LHサージ","FSH","プロゲステロン","黄体"],"question":"女性の生殖生理について誤っているのはどれか。","options":[{"id":"o1","text":"原始卵胞は新生児期から存在する"},{"id":"o2","text":"成人卵巣の重量は数g程度である"},{"id":"o3","text":"卵胞の成熟は思春期以降に周期的に進む"},{"id":"o4","text":"卵細胞は始原生殖細胞に由来する"},{"id":"o5","text":"プロゲステロン上昇が排卵を直接誘発する"}],"answers":["o5"],"why":"排卵を直接引き起こす主要な内分泌イベントはLHサージです。プロゲステロンは排卵後に形成される黄体から多く分泌されます。","option_explanations":{"o1":"正しい。出生時には多数の原始卵胞があります。","o2":"概ね正しい範囲です。","o3":"正しい。思春期以降FSH/LHの影響を受けます。","o4":"正しい。生殖細胞系列に由来します。","o5":"誤り。排卵の引き金はLHサージです。"},"related":"月経周期は卵胞期→排卵→黄体期と、FSH・LH・エストロゲン・プロゲステロンを対応させます。","tip":"排卵＝LHサージ。","glossary":[{"term":"LHサージ","desc":"排卵前に黄体形成ホルモンが急増する現象で、排卵を誘発する。"},{"term":"黄体","desc":"排卵後の卵胞が変化した構造で、主にプロゲステロンを分泌する。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A69","round":58,"source":"第58回・午前69（出題内容をもとに学習用再構成）","source_session":"午前","source_no":69,"subject":"生理学","domain":"呼吸","topic":"換気","concept":"肺活量と肺気量分画","secondary":["肺活量","全肺気量","残気量","1回換気量","予備呼気量"],"question":"肺活量を算出するために最低限必要な肺気量分画を2つ選べ。","options":[{"id":"o1","text":"予備吸気量"},{"id":"o2","text":"予備呼気量"},{"id":"o3","text":"1回換気量"},{"id":"o4","text":"全肺気量"},{"id":"o5","text":"残気量"}],"answers":["o4","o5"],"why":"肺活量（VC）は全肺気量（TLC）から残気量（RV）を引いて求められます。したがってTLCとRVがあれば算出できます。","option_explanations":{"o1":"VCを構成する一要素ですが、TLCとRVがあれば個別値は不要です。","o2":"同様にVC構成要素ですが必須ではありません。","o3":"同様にVC構成要素ですが必須ではありません。","o4":"正しい。TLCを用います。","o5":"正しい。TLC−RVでVCになります。"},"related":"肺気量分画は式を丸暗記するより、肺容量の積み上げ図で位置関係を理解します。","tip":"VC＝TLC−RV。","glossary":[{"term":"肺活量","desc":"最大吸気位から最大呼気位まで呼出できる空気量。VC=TLC−RV。"},{"term":"残気量","desc":"最大呼気後にも肺内に残る空気量で、通常のスパイロメトリでは直接測定できない。"}],"official_answers":[4,5],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A70","round":58,"source":"第58回・午前70（出題内容をもとに学習用再構成）","source_session":"午前","source_no":70,"subject":"運動学","domain":"四肢・体幹の運動","topic":"足関節・足部","concept":"内側縦アーチ","secondary":["内側縦アーチ","後脛骨筋","舟状骨","足底腱膜","長足底靱帯"],"question":"足部の内側縦アーチ維持に最も関与する筋はどれか。","options":[{"id":"o1","text":"三角靱帯"},{"id":"o2","text":"長足底靱帯"},{"id":"o3","text":"後脛骨筋"},{"id":"o4","text":"足底筋"},{"id":"o5","text":"第三腓骨筋"}],"answers":["o3"],"why":"後脛骨筋は舟状骨などに停止し、足部内反・底屈とともに内側縦アーチの動的支持に重要です。","option_explanations":{"o1":"足関節内側の安定性には重要ですが、内側縦アーチの主要な動的支持筋ではありません。","o2":"主に外側縦アーチ支持に関与します。","o3":"正しい。内側縦アーチの重要な動的支持筋です。","o4":"下腿後面の小筋で主要支持筋ではありません。","o5":"足部外反方向に働き、主要支持筋ではありません。"},"related":"アーチ支持は骨形態・靱帯などの静的要素と筋腱の動的要素に分けて整理します。","tip":"内側縦アーチの動的支持＝後脛骨筋。","glossary":[{"term":"内側縦アーチ","desc":"踵骨・距骨・舟状骨・楔状骨・第1〜3中足骨などからなる高い縦アーチ。"},{"term":"後脛骨筋","desc":"足内反・底屈に働き、内側縦アーチの動的支持に重要な筋。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A71","round":58,"source":"第58回・午前71（出題内容をもとに学習用再構成）","source_session":"午前","source_no":71,"subject":"運動学","domain":"四肢・体幹の運動","topic":"股関節","concept":"筋ストレッチと肢位","secondary":["大腿筋膜張筋","腸脛靱帯","股関節外転","ストレッチ","筋作用"],"question":"図の肢位で右下肢の筋を伸張している。最も伸張される筋はどれか。","options":[{"id":"o1","text":"薄筋"},{"id":"o2","text":"中間広筋"},{"id":"o3","text":"半膜様筋"},{"id":"o4","text":"大腿方形筋"},{"id":"o5","text":"大腿筋膜張筋"}],"answers":["o5"],"why":"図では股関節を伸展・内転方向へ置くことで、大腿外側を走り股関節屈曲・外転に働く大腿筋膜張筋を伸張する肢位になっています。","option_explanations":{"o1":"薄筋は股関節外転と膝伸展などを組み合わせると伸張されます。","o2":"中間広筋は膝屈曲で伸張されます。","o3":"半膜様筋は股屈曲・膝伸展で伸張されます。","o4":"大腿方形筋は股関節屈曲・内転・内旋方向で伸張されます。","o5":"正しい。股関節伸展・内転方向で伸張されます。"},"related":"筋ストレッチ問題は、その筋の「作用と反対方向」に関節を置く原則から解きます。","tip":"作用の逆方向＝伸張肢位。","glossary":[{"term":"大腿筋膜張筋","desc":"上前腸骨棘付近から腸脛靱帯へ続き、股関節屈曲・外転・内旋などに作用する筋。"},{"term":"腸脛靱帯","desc":"大腿外側を走る強い筋膜性組織で、大腿筋膜張筋・大殿筋と連続する。"}],"official_answers":[5],"problemImage":"./images/58A71.jpg","problemImageCaption":"第58回 午前71：下肢筋の伸張肢位（出題図）","exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A72","round":58,"source":"第58回・午前72（出題内容をもとに学習用再構成）","source_session":"午前","source_no":72,"subject":"運動学","domain":"四肢・体幹の運動","topic":"手関節・手指","concept":"手指筋の作用","secondary":["虫様筋","掌側骨間筋","背側骨間筋","伸筋腱膜","MP関節"],"question":"手指の筋と作用の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"掌側骨間筋―MP関節伸展"},{"id":"o2","text":"浅指屈筋―DIP関節屈曲"},{"id":"o3","text":"短母指伸筋―IP関節伸展"},{"id":"o4","text":"虫様筋―MP関節屈曲"},{"id":"o5","text":"背側骨間筋―PIP関節屈曲"}],"answers":["o4"],"why":"虫様筋はMP関節を屈曲し、伸筋腱膜を介してPIP・DIP関節を伸展します。","option_explanations":{"o1":"掌側骨間筋はMP屈曲・内転、IP伸展に関与します。","o2":"浅指屈筋は主にPIP関節を屈曲します。","o3":"短母指伸筋は主に母指MP関節を伸展します。","o4":"正しい。虫様筋はMP屈曲・IP伸展です。","o5":"背側骨間筋はMP外転・屈曲、IP伸展です。"},"related":"内在筋の共通作用として「MP屈曲＋IP伸展」を押さえると整理しやすくなります。","tip":"虫様筋・骨間筋＝MP屈曲＋IP伸展。","glossary":[{"term":"虫様筋","desc":"深指屈筋腱から起こり伸筋腱膜へ停止し、MP屈曲とIP伸展に働く。"},{"term":"骨間筋","desc":"手掌側は指の内転、背側は外転を主に担い、MP屈曲・IP伸展にも関与する。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A73","round":58,"source":"第58回・午前73（出題内容をもとに学習用再構成）","source_session":"午前","source_no":73,"subject":"運動学","domain":"総論","topic":"運動器の機能解剖","concept":"遠心性収縮","secondary":["遠心性収縮","広背筋","求心性収縮","制動","肩関節"],"question":"鉄棒で懸垂した状態からゆっくり身体を下降させるとき、遠心性収縮する筋はどれか。","options":[{"id":"o1","text":"棘上筋"},{"id":"o2","text":"広背筋"},{"id":"o3","text":"烏口腕筋"},{"id":"o4","text":"三角筋前部"},{"id":"o5","text":"大胸筋鎖骨部"}],"answers":["o2"],"why":"身体をゆっくり下降させる際、肩関節は広背筋が発揮する力と反対方向へ動き、広背筋は張力を出しながら伸ばされる遠心性収縮となります。","option_explanations":{"o1":"棘上筋は主に肩外転・安定化に関与します。","o2":"正しい。下降を制動しながら伸張されます。","o3":"肩屈曲・内転筋でこの下降制動の主役ではありません。","o4":"肩屈曲筋で主役ではありません。","o5":"肩屈曲・水平内転などに作用し、この条件では主役ではありません。"},"related":"「動いている方向」だけでなく「その運動を起こすのか、ブレーキをかけるのか」を考えるのがコツです。","tip":"ゆっくり下降＝抗重力筋が遠心性で制動。","glossary":[{"term":"遠心性収縮","desc":"筋が張力を発揮しながら長くなる収縮様式。"},{"term":"求心性収縮","desc":"筋が張力を発揮しながら短くなる収縮様式。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58A74","round":58,"source":"第58回・午前74（出題内容をもとに学習用再構成）","source_session":"午前","source_no":74,"subject":"運動学","domain":"歩行","topic":"歩行の運動学・運動力学","concept":"歩行中の遠心性収縮","secondary":["前脛骨筋","下腿三頭筋","ローディングレスポンス","立脚中期","遠心性収縮"],"question":"正常歩行で遠心性収縮が重要となる筋を2つ選べ。","options":[{"id":"o1","text":"初期接地から荷重応答期の前脛骨筋"},{"id":"o2","text":"荷重応答期から立脚中期の下腿三頭筋"},{"id":"o3","text":"立脚中期から踵離地の大殿筋"},{"id":"o4","text":"初期遊脚から遊脚中期の内側広筋"},{"id":"o5","text":"遊脚中期から終期の腸腰筋"}],"answers":["o1","o2"],"why":"初期接地後、前脛骨筋は足関節底屈を遠心性に制御して足部の急な落下を防ぎます。立脚中期にかけて下腿三頭筋は脛骨の前方回転を遠心性に制御します。","option_explanations":{"o1":"正しい。前脛骨筋が底屈を制動します。","o2":"正しい。下腿三頭筋が脛骨前傾を制動します。","o3":"大殿筋の主要な制動は立脚初期です。","o4":"内側広筋の主活動時期・役割が一致しません。","o5":"遊脚終期の減速は主にハムストリングスなどが担います。"},"related":"歩行筋活動は「関節運動を生む筋」だけでなく「重力・慣性を制動する筋」を意識します。","tip":"前脛骨筋と下腿三頭筋の遠心性制御は頻出。","glossary":[{"term":"荷重応答期","desc":"初期接地直後から反対側足趾離地までの二重支持期。衝撃吸収と荷重受容が重要。"},{"term":"前脛骨筋","desc":"足関節背屈筋。荷重応答期に遠心性収縮して足部の底屈を制御する。"}],"official_answers":[1,2],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58am51-100.html"},{"id":"58B51","round":58,"source":"第58回・午後51（出題内容をもとに学習用再構成）","source_session":"午後","source_no":51,"subject":"解剖学","domain":"骨格系","topic":"骨の構造・代謝","concept":"骨の基本構造","secondary":["骨膜","皮質骨","海綿骨","Havers系","破骨細胞"],"question":"骨の構造について正しいのはどれか。","options":[{"id":"o1","text":"短骨には必ず明瞭な髄腔がある"},{"id":"o2","text":"黄色骨髄が主な造血部位である"},{"id":"o3","text":"海綿骨にHavers系が発達する"},{"id":"o4","text":"骨芽細胞が骨吸収を担う"},{"id":"o5","text":"皮質骨の外表面は骨膜で覆われる"}],"answers":["o5"],"why":"骨の外表面は関節面などを除き骨膜で覆われます。Havers系は主に緻密骨、骨吸収は破骨細胞、造血は赤色骨髄が中心です。","option_explanations":{"o1":"短骨は海綿骨主体で長骨のような明瞭な髄腔を必ずしももちません。","o2":"造血の中心は赤色骨髄です。","o3":"Havers系は緻密骨に発達します。","o4":"骨吸収は破骨細胞が担います。","o5":"正しい。皮質骨表面は骨膜で覆われます。"},"related":"骨芽細胞＝形成、破骨細胞＝吸収、骨細胞＝骨基質内で維持という役割を対比します。","tip":"骨形成＝骨芽、骨吸収＝破骨。","glossary":[{"term":"骨膜","desc":"骨表面を覆う結合組織膜で、血管・神経を含み骨形成や修復にも関与。"},{"term":"Havers系","desc":"緻密骨の基本構造単位で、中心管と同心円状骨層板からなる。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B52","round":58,"source":"第58回・午後52（出題内容をもとに学習用再構成）","source_session":"午後","source_no":52,"subject":"解剖学","domain":"神経系","topic":"上肢末梢神経","concept":"前骨間神経","secondary":["前骨間神経","正中神経","長母指屈筋","方形回内筋","OKサイン"],"question":"前骨間神経が支配する筋はどれか。","options":[{"id":"o1","text":"短母指伸筋"},{"id":"o2","text":"長母指屈筋"},{"id":"o3","text":"長母指伸筋"},{"id":"o4","text":"尺側手根屈筋"},{"id":"o5","text":"長母指外転筋"}],"answers":["o2"],"why":"前骨間神経は正中神経の運動枝で、長母指屈筋、方形回内筋、深指屈筋橈側部などを支配します。","option_explanations":{"o1":"橈骨神経深枝系の支配です。","o2":"正しい。長母指屈筋は前骨間神経支配です。","o3":"後骨間神経系の支配です。","o4":"尺骨神経支配です。","o5":"後骨間神経系の支配です。"},"related":"前骨間神経は原則として皮膚感覚枝をもたない運動性の枝である点も重要です。","tip":"AIN＝長母指屈筋＋方形回内筋＋FDP橈側。","glossary":[{"term":"前骨間神経","desc":"正中神経から分岐する運動枝で、前腕深層屈筋群の一部を支配する。"},{"term":"OKサイン","desc":"前骨間神経麻痺で母指IP・示指DIP屈曲が弱くなり、きれいな丸を作れない所見。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B53","round":58,"source":"第58回・午後53（出題内容をもとに学習用再構成）","source_session":"午後","source_no":53,"subject":"解剖学","domain":"神経系","topic":"脳神経","concept":"眼球運動の脳神経","secondary":["動眼神経","滑車神経","外転神経","上斜筋","外側直筋"],"question":"眼球運動に直接関与する脳神経を2つ選べ。","options":[{"id":"o1","text":"視神経"},{"id":"o2","text":"外転神経"},{"id":"o3","text":"滑車神経"},{"id":"o4","text":"顔面神経"},{"id":"o5","text":"三叉神経"}],"answers":["o2","o3"],"why":"眼球外筋を運動支配するのは動眼神経・滑車神経・外転神経です。この選択肢では滑車神経と外転神経が該当します。","option_explanations":{"o1":"視覚情報を伝える感覚神経です。","o2":"正しい。外側直筋を支配します。","o3":"正しい。上斜筋を支配します。","o4":"表情筋などを支配します。","o5":"顔面感覚・咀嚼筋などに関与します。"},"related":"眼球運動は「LR6 SO4、残り3（外側直筋VI、上斜筋IV、その他III）」が定番です。","tip":"LR6・SO4・残りIII。","glossary":[{"term":"滑車神経","desc":"第IV脳神経。上斜筋を支配する。"},{"term":"外転神経","desc":"第VI脳神経。外側直筋を支配し眼球外転に働く。"}],"official_answers":[2,3],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B54","round":58,"source":"第58回・午後54（出題内容をもとに学習用再構成）","source_session":"午後","source_no":54,"subject":"解剖学","domain":"神経系","topic":"中枢神経","concept":"脊髄の構造","secondary":["脊髄神経節","後根","前角","側角","脊髄円錐"],"question":"脊髄について正しいものを2つ選べ。","options":[{"id":"o1","text":"頸膨大・胸膨大・腰膨大の3つがある"},{"id":"o2","text":"前角は白質で構成される"},{"id":"o3","text":"後根には脊髄神経節がある"},{"id":"o4","text":"交感神経節前ニューロンは胸髄・上位腰髄に存在する"},{"id":"o5","text":"脊髄円錐は成人でL3〜L4高位にある"}],"answers":["o3","o4"],"why":"後根には一次感覚ニューロンの細胞体を含む脊髄神経節があります。交感神経節前ニューロンは主にT1〜L2付近の側角に存在します。","option_explanations":{"o1":"膨大は主に頸膨大と腰仙膨大です。","o2":"前角は灰白質です。","o3":"正しい。後根神経節があります。","o4":"正しい。胸腰髄の側角に交感神経節前ニューロンがあります。","o5":"成人の脊髄円錐は通常L1〜L2付近です。"},"related":"前根＝運動、後根＝感覚、側角＝自律神経という基本配置を押さえます。","tip":"前根運動・後根感覚。","glossary":[{"term":"脊髄神経節","desc":"後根にある感覚神経細胞体の集まり。"},{"term":"脊髄円錐","desc":"脊髄下端の円錐状部で、成人では概ねL1〜L2椎体高位。"}],"official_answers":[3,4],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B55","round":58,"source":"第58回・午後55（出題内容をもとに学習用再構成）","source_session":"午後","source_no":55,"subject":"解剖学","domain":"脈管系","topic":"心臓","concept":"心臓の内部構造","secondary":["卵円窩","心房中隔","僧帽弁","三尖弁","洞房結節"],"question":"心臓の構造について正しいのはどれか。","options":[{"id":"o1","text":"僧帽弁は3尖である"},{"id":"o2","text":"大動脈弁は2尖である"},{"id":"o3","text":"洞房結節は左心房にある"},{"id":"o4","text":"卵円窩は心房中隔にある"},{"id":"o5","text":"三尖弁は右室流出路にある"}],"answers":["o4"],"why":"卵円窩は胎児期の卵円孔が閉鎖した痕跡で、右心房からみた心房中隔にあります。僧帽弁は2尖、大動脈弁は3半月弁、洞房結節は右心房です。","option_explanations":{"o1":"僧帽弁は前尖・後尖の2尖です。","o2":"大動脈弁は3つの半月弁からなります。","o3":"洞房結節は右心房上部にあります。","o4":"正しい。心房中隔にみられます。","o5":"三尖弁は右房室口にあります。"},"related":"房室弁と半月弁の「場所・尖数」をセットで整理します。","tip":"僧帽2尖、三尖3尖、半月弁3枚。","glossary":[{"term":"卵円窩","desc":"胎児循環の卵円孔閉鎖後に残る心房中隔のくぼみ。"},{"term":"僧帽弁","desc":"左房室弁。前尖と後尖の2尖からなる。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B56","round":58,"source":"第58回・午後56（出題内容をもとに学習用再構成）","source_session":"午後","source_no":56,"subject":"解剖学","domain":"内臓諸器官","topic":"呼吸器","concept":"肺の縦隔面","secondary":["左肺","縦隔面","大動脈弓","心圧痕","肺門"],"question":"左肺の縦隔面と接する構造として適切なのはどれか。","options":[{"id":"o1","text":"気管"},{"id":"o2","text":"横隔膜"},{"id":"o3","text":"奇静脈"},{"id":"o4","text":"上大静脈"},{"id":"o5","text":"大動脈弓"}],"answers":["o5"],"why":"左肺の縦隔面には心圧痕や大動脈弓・下行大動脈に対応する圧痕があります。上大静脈・奇静脈は主に右肺との位置関係が重要です。","option_explanations":{"o1":"気管は肺門より上方の縦隔にあり肺面との直接関係としては不適切です。","o2":"横隔膜は肺底面と接します。","o3":"奇静脈は右側優位の構造です。","o4":"上大静脈は右肺縦隔面との関係が重要です。","o5":"正しい。左肺縦隔面に大動脈弓の圧痕がみられます。"},"related":"左右肺の縦隔面は「右＝SVC/奇静脈」「左＝大動脈弓/下行大動脈」を対比すると覚えやすいです。","tip":"左肺＝大動脈、右肺＝SVC・奇静脈。","glossary":[{"term":"縦隔面","desc":"肺の内側面で、心臓・大血管など縦隔構造と接する面。"},{"term":"肺門","desc":"主気管支・肺動静脈・神経・リンパ管などが出入りする部位。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B57","round":58,"source":"第58回・午後57（出題内容をもとに学習用再構成）","source_session":"午後","source_no":57,"subject":"解剖学","domain":"内臓諸器官","topic":"泌尿・生殖器","concept":"ネフロンの構造","secondary":["ネフロン","腎小体","糸球体","Bowman嚢","Henle係蹄"],"question":"腎臓の構造について正しいのはどれか。","options":[{"id":"o1","text":"糸球体は腎髄質に集中する"},{"id":"o2","text":"輸出細動脈は集合管へ直接つながる"},{"id":"o3","text":"ネフロンは腎小体と尿細管からなる"},{"id":"o4","text":"輸入細動脈はHenle係蹄へ直接つながる"},{"id":"o5","text":"腎乳頭はBowman嚢に覆われる"}],"answers":["o3"],"why":"ネフロンは腎小体（糸球体＋Bowman嚢）と尿細管からなる腎機能単位です。糸球体は皮質にあり、輸入細動脈→糸球体→輸出細動脈と血流が続きます。","option_explanations":{"o1":"糸球体は腎皮質にあります。","o2":"輸出細動脈は糸球体から出て毛細血管網へ移行します。","o3":"正しい。腎小体と尿細管が機能単位を作ります。","o4":"輸入細動脈は糸球体へ入ります。","o5":"Bowman嚢は糸球体を包みます。"},"related":"血流経路と尿流経路を混同しないことが重要です。","tip":"血液：輸入→糸球体→輸出。尿：Bowman→尿細管。","glossary":[{"term":"ネフロン","desc":"腎臓の構造・機能単位で、腎小体と尿細管からなる。"},{"term":"腎小体","desc":"糸球体とそれを包むBowman嚢からなる濾過装置。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B58","round":58,"source":"第58回・午後58（出題内容をもとに学習用再構成）","source_session":"午後","source_no":58,"subject":"解剖学","domain":"感覚器","topic":"特殊感覚","concept":"平衡聴覚器","secondary":["耳管","鼓室","蝸牛","Corti器","耳小骨"],"question":"平衡聴覚器について正しいのはどれか。","options":[{"id":"o1","text":"蝸牛は鼓室内にある"},{"id":"o2","text":"アブミ骨は鼓膜に直接接する"},{"id":"o3","text":"耳管は上咽頭へ開口する"},{"id":"o4","text":"耳小骨は外リンパ液中に浮遊する"},{"id":"o5","text":"半規管膨大部にCorti器がある"}],"answers":["o3"],"why":"耳管（咽頭鼓管）は中耳の鼓室と上咽頭を交通させ、気圧調節などに関与します。耳小骨は空気で満たされた中耳にあり、Corti器は蝸牛管内にあります。","option_explanations":{"o1":"蝸牛は内耳の骨迷路にあります。","o2":"鼓膜にはツチ骨柄が付着し、アブミ骨底は卵円窓に接します。","o3":"正しい。耳管は上咽頭へ開口します。","o4":"耳小骨は空気で満たされた鼓室内にあります。","o5":"Corti器は蝸牛管にあり、膨大部には膨大部稜があります。"},"related":"外耳・中耳・内耳のどこに何があるかを空間的に整理します。","tip":"耳管＝中耳と上咽頭。","glossary":[{"term":"耳管","desc":"鼓室と上咽頭を連絡し、中耳腔の圧調節・排液に関与する管。"},{"term":"Corti器","desc":"蝸牛管内の基底膜上にある聴覚受容器。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B59","round":58,"source":"第58回・午後59（出題内容をもとに学習用再構成）","source_session":"午後","source_no":59,"subject":"解剖学","domain":"体表解剖","topic":"ランドマーク","concept":"動脈の触知部位","secondary":["足背動脈","後脛骨動脈","橈骨動脈","総頸動脈","脈拍触知"],"question":"図に示す動脈の触知部位として正しい組合せはどれか。","options":[{"id":"o1","text":"腋窩動脈"},{"id":"o2","text":"後脛骨動脈"},{"id":"o3","text":"総頸動脈"},{"id":"o4","text":"足背動脈"},{"id":"o5","text":"橈骨動脈"}],"answers":["o4"],"why":"図4は足背の第1・第2中足骨間付近で触れる足背動脈の位置を示します。後脛骨動脈は内果後方、橈骨動脈は手関節橈側掌面で触知します。","option_explanations":{"o1":"図の位置は腋窩ではありません。","o2":"後脛骨動脈の触知は内果後方です。","o3":"総頸動脈は胸鎖乳突筋内側縁付近です。","o4":"正しい。足背動脈は足背で触知します。","o5":"橈骨動脈は手関節橈側の掌面で触知します。"},"related":"脈拍触知部位は実習・臨床にも直結するため、体表ランドマークと一緒に覚えます。","tip":"足背動脈＝足背、後脛骨＝内果後方。","glossary":[{"term":"足背動脈","desc":"前脛骨動脈の続きで、足背部を走り脈拍触知に用いられる動脈。"},{"term":"後脛骨動脈","desc":"内果後方で触知でき、末梢循環評価に用いられる動脈。"}],"official_answers":[4],"problemImage":"./images/58B59.webp","problemImageCaption":"第58回 午後59：動脈の触知部位（出題図）","exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B60","round":58,"source":"第58回・午後60（出題内容をもとに学習用再構成）","source_session":"午後","source_no":60,"subject":"解剖学","domain":"骨格系","topic":"下肢の骨・関節","concept":"距骨の関節面","secondary":["距骨","踵骨","舟状骨","距骨下関節","距舟関節"],"question":"距骨と直接関節を構成する骨を2つ選べ。","options":[{"id":"o1","text":"踵骨"},{"id":"o2","text":"舟状骨"},{"id":"o3","text":"立方骨"},{"id":"o4","text":"第1中足骨"},{"id":"o5","text":"内側楔状骨"}],"answers":["o1","o2"],"why":"距骨は上方で脛骨・腓骨、下方で踵骨、前方で舟状骨と関節します。","option_explanations":{"o1":"正しい。距骨下関節を構成します。","o2":"正しい。距舟関節を構成します。","o3":"距骨とは直接関節しません。","o4":"直接関節しません。","o5":"直接関節しません。"},"related":"距骨は脛骨・腓骨・踵骨・舟状骨の4骨と関節します。","tip":"距骨の相手＝脛・腓・踵・舟。","glossary":[{"term":"距骨","desc":"下腿と足部を連結する骨で、筋付着をほとんどもたない。"},{"term":"距骨下関節","desc":"距骨と踵骨の間にある関節で、足部の内外反に関与する。"}],"official_answers":[1,2],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B61","round":58,"source":"第58回・午後61（出題内容をもとに学習用再構成）","source_session":"午後","source_no":61,"subject":"生理学","domain":"筋","topic":"筋線維・収縮","concept":"骨格筋と筋疲労","secondary":["筋疲労","乳酸","遅筋線維","速筋線維","サイズの原理"],"question":"骨格筋について、国試の出題文脈で正しいものはどれか。","options":[{"id":"o1","text":"健常成人では体重の約10%を占める"},{"id":"o2","text":"遅筋線維はミトコンドリアが少ない"},{"id":"o3","text":"筋疲労には代謝産物の蓄積など化学的要因が関与する"},{"id":"o4","text":"神経筋接合部の伝達は双方向性である"},{"id":"o5","text":"低負荷では速筋線維が優先的に動員される"}],"answers":["o3"],"why":"筋疲労には無機リン酸やH+など代謝変化を含む多因子が関与します。原問題では「乳酸の蓄積」が正答扱いでしたが、現在は乳酸そのものを筋疲労の単純な原因とみなす説明は不十分です。このアプリでは現代的な生理学に合わせて表現を補正しています。","option_explanations":{"o1":"骨格筋量は成人体重の10%より大きく、個人差・性差があります。","o2":"遅筋線維はミトコンドリア・毛細血管・ミオグロビンが豊富です。","o3":"正しい。末梢性疲労にはイオン・代謝環境など複数因子が関与します。","o4":"神経筋接合部は通常、運動神経末端から筋への一方向伝達です。","o5":"サイズの原理により低負荷では小型運動単位・遅筋が先に動員されます。"},"related":"古い教材の「乳酸＝疲労物質」という単純化は避け、試験の歴史的表現と現在の生理学を区別して理解します。","tip":"低負荷＝遅筋優先。疲労は多因子。","glossary":[{"term":"筋疲労","desc":"持続的・反復的活動で期待される筋力や出力を維持できなくなる状態。中枢性・末梢性要因がある。"},{"term":"サイズの原理","desc":"必要張力が小さいとき小型運動単位から、大きいとき大型運動単位へ順に動員される原理。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html","official_note":"原問題の正答は3（「筋疲労の化学的原因は乳酸の蓄積」）。ただし現在の運動生理学では乳酸を単純な疲労原因とする説明は支持されないため、学習文を現代的に再構成。","excludeFromDiagnosis":true},{"id":"58B62","round":58,"source":"第58回・午後62（出題内容をもとに学習用再構成）","source_session":"午後","source_no":62,"subject":"生理学","domain":"内分泌・栄養・代謝","topic":"ホルモン","concept":"下垂体前葉ホルモン","secondary":["プロラクチン","下垂体前葉","下垂体後葉","オキシトシン","バゾプレシン"],"question":"下垂体前葉から分泌されるホルモンはどれか。","options":[{"id":"o1","text":"メラトニン"},{"id":"o2","text":"オキシトシン"}
