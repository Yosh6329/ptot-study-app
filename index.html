main":"神経系","topic":"脳神経","concept":"脳神経の機能","secondary":["副神経","胸鎖乳突筋","僧帽筋"],"question":"胸鎖乳突筋と僧帽筋の運動を主に支配する脳神経はどれか。","options":[{"id":"o1","text":"動眼神経"},{"id":"o2","text":"三叉神経"},{"id":"o3","text":"顔面神経"},{"id":"o4","text":"迷走神経"},{"id":"o5","text":"副神経"}],"answers":["o5"],"why":"正答は副神経です。副神経は第11脳神経で、胸鎖乳突筋と僧帽筋の運動に重要です。頸部回旋や肩甲帯の挙上を診るときに、筋作用と神経支配をセットで整理します。","option_explanations":{"o1":"動眼神経は主に外眼筋と上眼瞼挙筋を支配し、副交感線維も含む。","o2":"三叉神経は顔面の知覚と咀嚼筋の運動を担う混合神経。","o3":"顔面神経は表情筋の運動、舌前2/3の味覚などに関与する。","o4":"迷走神経は咽喉頭や胸腹部臓器に広く分布する混合神経。","o5":"正しい。副神経は胸鎖乳突筋と僧帽筋を支配する。"},"related":"脳神経は『番号・名称・主な機能・代表的な評価法』をセットで覚えると整理しやすくなります。副神経障害では肩すくめや反対側への頸部回旋が弱くなります。","tip":"副神経＝胸鎖乳突筋＋僧帽筋。","glossary":[{"term":"副神経","desc":"第11脳神経。胸鎖乳突筋と僧帽筋の運動に関与する。"},{"term":"胸鎖乳突筋","desc":"一側収縮で同側側屈・反対側回旋、両側収縮で頸部屈曲などに関与する。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["舌の運動は舌下神経、表情筋は顔面神経、咀嚼筋は三叉神経第3枝と整理する。","副神経の徒手評価では肩すくめと頭部回旋が重要。"],"round":60},{"id":"60A54","source":"第60回・午前54（出題内容をもとに再構成）","source_session":"午前","source_no":54,"subject":"解剖学","domain":"神経系","topic":"上肢末梢神経","concept":"尺骨神経","secondary":["手内在筋","母指内転筋","正中神経"],"question":"尺骨神経の支配を受ける筋はどれか。","options":[{"id":"o1","text":"長母指屈筋"},{"id":"o2","text":"母指内転筋"},{"id":"o3","text":"第1虫様筋"},{"id":"o4","text":"短母指外転筋"},{"id":"o5","text":"短母指屈筋浅頭"}],"answers":["o2"],"why":"正答は母指内転筋です。母指内転筋は尺骨神経深枝に支配され、母指を示指方向へ引き寄せる内転作用を担います。尺骨神経は多くの手内在筋を支配するため、障害時には巧緻運動低下やフロマン徴候（Froment sign）などがみられます。","option_explanations":{"o1":"長母指屈筋は前骨間神経（正中神経の枝）支配で、母指の指節間関節（interphalangeal joint：IP関節）の屈曲を担う。","o2":"正しい。母指内転筋は尺骨神経深枝支配である。","o3":"第1虫様筋は正中神経支配。虫様筋は第1・2が正中神経、第3・4が尺骨神経という分担が重要。","o4":"短母指外転筋は主に正中神経反回枝支配で、母指球筋の代表。","o5":"短母指屈筋の浅頭は主に正中神経支配。深頭は尺骨神経支配となることがあるため、問題文の『浅頭』が決め手。"},"related":"手内在筋では『尺骨神経が多数派』ですが、母指球筋の一部と第1・2虫様筋は正中神経支配です。フロマン徴候（Froment sign）では母指内転筋の弱化を長母指屈筋で代償します。","tip":"母指内転＝尺骨神経。母指対立・外転＝まず正中神経を考える。","glossary":[{"term":"フロマン徴候（Froment sign）","desc":"紙を母指と示指でつまませたとき、尺骨神経麻痺で母指内転筋が弱く、代償的に長母指屈筋が働いて母指の指節間関節（interphalangeal joint：IP関節）が屈曲する所見。"},{"term":"前骨間神経","desc":"正中神経の枝。長母指屈筋、方形回内筋、示指深指屈筋などを支配する。"},{"term":"虫様筋","desc":"手内在筋の一つ。第1・2虫様筋は正中神経、第3・4虫様筋は尺骨神経支配。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["尺骨神経障害ではフロマン徴候（Froment sign）、骨間筋の筋力低下、鉤爪変形などを関連づけて覚える。","虫様筋は第1・2が正中神経、第3・4が尺骨神経支配。"],"round":60},{"id":"60A55","source":"第60回・午前55（出題内容をもとに学習用再構成）","source_session":"午前","source_no":55,"subject":"解剖学","domain":"内臓諸器官","topic":"消化器","concept":"食道・胃","secondary":["食道","生理的狭窄","横隔膜"],"question":"食道について正しいのはどれか。","options":[{"id":"o1","text":"全長にわたり骨格筋のみで構成される"},{"id":"o2","text":"気管の前方を下降する"},{"id":"o3","text":"腹部食道は十二指腸へ連続する"},{"id":"o4","text":"横隔膜を通過する部位は生理的狭窄部の一つである"},{"id":"o5","text":"食道粘膜は単層円柱上皮である"}],"answers":["o4"],"why":"正答は『横隔膜を通過する部位は生理的狭窄部の一つである』です。食道には咽頭食道移行部、気管分岐部付近、横隔膜通過部などに狭窄があり、異物停滞や病変部位として重要です。","option_explanations":{"o1":"食道上部には横紋筋が多いが、下部ほど平滑筋が主体となる。","o2":"食道は気管の後方を下降する。","o3":"食道は胃の噴門へ連続する。","o4":"正しい。食道裂孔を通過する付近は生理的狭窄部の一つ。","o5":"食道粘膜は重層扁平上皮である。"},"related":"食道の位置関係では『気管の後方』『横隔膜の食道裂孔』『胃の噴門へ連続』を押さえます。嚥下では上部食道括約筋・食道蠕動・下部食道括約部の協調も関連します。","tip":"食道＝気管の後ろ、横隔膜を通って胃の噴門へ。","glossary":[{"term":"食道裂孔","desc":"横隔膜にある食道の通過部。"},{"term":"生理的狭窄","desc":"食道内腔が解剖学的に狭くなりやすい部位。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":["誤嚥は気道への侵入であり、食道通過障害とは区別する。","胃食道逆流では下部食道括約部の機能が関連する。"],"round":60},{"id":"60A56","source":"第60回・午前56（出題内容をもとに再構成）","source_session":"午前","source_no":56,"subject":"生理学","domain":"内分泌・栄養・代謝","topic":"ホルモン","concept":"下垂体後葉ホルモン","secondary":["オキシトシン","バソプレシン","抗利尿ホルモン"],"question":"下垂体後葉から血中へ放出されるホルモンを2つ選べ。","options":[{"id":"o1","text":"グレリン"},{"id":"o2","text":"エストロゲン"},{"id":"o3","text":"オキシトシン"},{"id":"o4","text":"バソプレシン"},{"id":"o5","text":"アルドステロン"}],"answers":["o3","o4"],"why":"正答はオキシトシンとバソプレシンです。バソプレシンは抗利尿ホルモン（antidiuretic hormone：ADH）とも呼ばれます。両者は視床下部の神経分泌細胞で合成され、軸索輸送によって下垂体後葉へ運ばれ、そこで貯蔵された後に血中へ放出されます。『下垂体後葉で合成される』わけではない点が重要です。","option_explanations":{"o1":"グレリンは主に胃から分泌され、摂食促進や成長ホルモン分泌促進に関与する。","o2":"エストロゲンは主に卵巣などから分泌される性ホルモン。","o3":"正しい。オキシトシンは子宮収縮や射乳反射に関与する。","o4":"正しい。バソプレシンは抗利尿ホルモン（antidiuretic hormone：ADH）とも呼ばれ、腎集合管での水再吸収を促進する。","o5":"アルドステロンは副腎皮質球状帯から分泌され、ナトリウムイオン（Na⁺）再吸収などに関与する。"},"related":"下垂体前葉から分泌される代表的なホルモンは、成長ホルモン（growth hormone：GH）、副腎皮質刺激ホルモン（adrenocorticotropic hormone：ACTH）、甲状腺刺激ホルモン（thyroid-stimulating hormone：TSH）、黄体形成ホルモン（luteinizing hormone：LH）、卵胞刺激ホルモン（follicle-stimulating hormone：FSH）、プロラクチン（prolactin：PRL）です。後葉は『視床下部で作られたオキシトシンと抗利尿ホルモン（ADH）を貯蔵・放出する場所』と区別します。","tip":"後葉はオキシトシンとバソプレシン（抗利尿ホルモン）。前葉ホルモンと混同しない。","glossary":[{"term":"バソプレシン","desc":"抗利尿ホルモン（antidiuretic hormone：ADH）とも呼ばれる。集合管での水再吸収を促進する。"},{"term":"オキシトシン","desc":"子宮収縮と射乳反射に関与するホルモン。"},{"term":"軸索輸送","desc":"神経細胞体で作られた物質が軸索を通って末端へ運ばれる過程。"}],"official_answers":[3,4],"problemImage":null,"problemImageCaption":null,"exam_links":["抗利尿ホルモン（ADH）の分泌低下では中枢性尿崩症が問題になる。","下垂体前葉と後葉では『どこで合成され、どこから放出されるか』まで区別する。"],"round":60},{"id":"60A57","source":"第60回・午前57（出題内容をもとに学習用再構成）","source_session":"午前","source_no":57,"subject":"解剖学","domain":"感覚器","topic":"特殊感覚","concept":"視覚器","secondary":["網膜","黄斑","中心窩","視神経乳頭"],"question":"視覚器について正しいのはどれか。","options":[{"id":"o1","text":"視神経乳頭には錐体細胞が最も密集する"},{"id":"o2","text":"中心窩は視力が最も高い部位である"},{"id":"o3","text":"角膜には血管が豊富に分布する"},{"id":"o4","text":"水晶体は毛様体筋の収縮で扁平になる"},{"id":"o5","text":"網膜の杆体細胞は色覚を主に担う"}],"answers":["o2"],"why":"正答は『中心窩は視力が最も高い部位である』です。黄斑中央の中心窩には錐体細胞が高密度に分布し、精細な中心視に適しています。","option_explanations":{"o1":"視神経乳頭には視細胞がなく、生理的盲点となる。","o2":"正しい。中心窩は錐体細胞が密で、最も高い視力を担う。","o3":"角膜は透明性を保つため正常では血管を欠く。","o4":"近見時には毛様体筋が収縮し、チン小帯の張力が減って水晶体は厚くなる。","o5":"杆体は暗所視に重要で、色覚は主に錐体が担う。"},"related":"中心窩・視神経乳頭・杆体・錐体の違いは頻出です。視路では視神経→視交叉→視索→外側膝状体→視放線→一次視覚野の流れも関連します。","tip":"中心窩＝高視力、視神経乳頭＝盲点。","glossary":[{"term":"中心窩","desc":"黄斑の中央部。錐体が高密度で、精細な中心視を担う。"},{"term":"視神経乳頭","desc":"視神経が眼球を出る部位。視細胞がなく生理的盲点になる。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["杆体＝暗所視、錐体＝色覚・高視力。","視野障害問題では視交叉と視索の位置関係も一緒に押さえる。"],"round":60},{"id":"60A58","source":"第60回・午前58（出題内容をもとに学習用再構成）","source_session":"午前","source_no":58,"subject":"解剖学","domain":"体表解剖","topic":"ランドマーク","concept":"動脈触知部位","secondary":["総頸動脈","橈骨動脈","大腿動脈","足背動脈"],"question":"体表から脈拍を触知する部位と動脈の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"胸鎖乳突筋前縁付近 ― 総頸動脈"},{"id":"o2","text":"手関節尺側 ― 橈骨動脈"},{"id":"o3","text":"鼠径靱帯外側端 ― 大腿動脈"},{"id":"o4","text":"内果後方 ― 足背動脈"},{"id":"o5","text":"膝蓋骨前面 ― 膝窩動脈"}],"answers":["o1"],"why":"正答は『胸鎖乳突筋前縁付近―総頸動脈』です。脈拍触知部位は体表解剖の基本で、臨床評価や循環状態の確認にも使います。","option_explanations":{"o1":"正しい。総頸動脈は頸部で胸鎖乳突筋前縁付近に触知できる。","o2":"橈骨動脈は手関節の橈側で触知する。","o3":"大腿動脈は鼠径靱帯中央付近で触知する。","o4":"足背動脈は足背で長母趾伸筋腱の外側付近に触知する。内果後方は後脛骨動脈。","o5":"膝窩動脈は膝窩深部で触知する。"},"related":"代表的な触診部位として、橈骨動脈、上腕動脈、大腿動脈、膝窩動脈、後脛骨動脈、足背動脈を位置とセットで覚えます。","tip":"動脈名だけでなく『どこで触るか』までセット。","glossary":[{"term":"足背動脈","desc":"足背で触知される動脈。末梢循環の確認に用いる。"},{"term":"後脛骨動脈","desc":"内果後方で触知する。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["足背動脈と後脛骨動脈は下肢末梢循環の確認で重要。","上腕動脈は肘窩内側で血圧測定にも関連する。"],"round":60},{"id":"60A59","source":"第60回・午前59（出題内容をもとに学習用再構成）","source_session":"午前","source_no":59,"subject":"解剖学","domain":"神経系","topic":"中枢神経","concept":"脊髄","secondary":["脊髄前角","運動ニューロン","脊髄後角"],"question":"骨格筋を支配する下位運動ニューロンの細胞体が主に存在する脊髄の部位はどれか。","options":[{"id":"o1","text":"後索"},{"id":"o2","text":"側索"},{"id":"o3","text":"前角"},{"id":"o4","text":"後角"},{"id":"o5","text":"中心管"}],"answers":["o3"],"why":"正答は脊髄前角です。前角には骨格筋を支配する下位運動ニューロンの細胞体があり、その軸索は前根から末梢へ出ます。","option_explanations":{"o1":"後索は深部感覚などの上行路が通る白質。","o2":"側索には皮質脊髄路や脊髄視床路など複数の伝導路が通る。","o3":"正しい。前角には下位運動ニューロンの細胞体が存在する。","o4":"後角は感覚情報の入力・処理に重要。","o5":"中心管は脊髄中央の髄液を含む管腔。"},"related":"前根＝運動、後根＝感覚という基本と、前角＝運動ニューロン、後角＝感覚入力を対応させます。","tip":"前角＝運動、後角＝感覚。","glossary":[{"term":"下位運動ニューロン","desc":"前角細胞などから骨格筋へ直接指令を送る運動ニューロン。"},{"term":"前根","desc":"脊髄から運動線維が出る根。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["下位運動ニューロン障害では筋萎縮・線維束性収縮・腱反射低下などを関連づける。","上位運動ニューロン障害との比較も頻出。"],"round":60},{"id":"60A60","source":"第60回・午前60（出題内容をもとに学習用再構成）","source_session":"午前","source_no":60,"subject":"解剖学","domain":"脈管系","topic":"血管","concept":"脳血管","secondary":["中大脳動脈","線条体動脈","被殻","内包"],"question":"被殻や内包の一部へ血流を送る線条体動脈が主に分枝する動脈はどれか。","options":[{"id":"o1","text":"前大脳動脈"},{"id":"o2","text":"中大脳動脈"},{"id":"o3","text":"後大脳動脈"},{"id":"o4","text":"脳底動脈"},{"id":"o5","text":"後下小脳動脈"}],"answers":["o2"],"why":"正答は中大脳動脈です。中大脳動脈から分枝するレンズ核線条体動脈は、被殻や淡蒼球、内包など深部構造の血流に関与します。","option_explanations":{"o1":"前大脳動脈は主に大脳半球内側面を灌流する。","o2":"正しい。中大脳動脈の穿通枝である線条体動脈は基底核・内包に関与する。","o3":"後大脳動脈は主に後頭葉や側頭葉下面などを灌流する。","o4":"脳底動脈は脳幹・小脳などへの枝を出し、終末で後大脳動脈へ分かれる。","o5":"後下小脳動脈は延髄外側や小脳下面などに関与する。"},"related":"脳血管問題は『表面を走る主幹動脈』と『深部へ入る穿通枝』を分けて整理します。内包・基底核の病変では中大脳動脈系の穿通枝が重要です。","tip":"被殻・内包の深部血流＝中大脳動脈の穿通枝を意識。","glossary":[{"term":"線条体動脈","desc":"中大脳動脈などから深部へ入り、基底核や内包を灌流する穿通枝。"},{"term":"被殻","desc":"大脳基底核を構成する灰白質の一つ。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["中大脳動脈領域では顔面・上肢優位の運動感覚障害や失語・半側空間無視も関連する。","内包後脚には皮質脊髄路が通る。"],"round":60},{"id":"60A61","round":60,"source":"第60回・午前61（出題内容をもとに学習用再構成）","source_session":"午前","source_no":61,"subject":"解剖学","domain":"組織","topic":"細胞・組織","concept":"細胞小器官","secondary":["ミトコンドリア","ATP","細胞小器官","有酸素代謝"],"question":"細胞内で有酸素的なATP産生の中心となる細胞小器官はどれか。","options":[{"id":"o1","text":"中心小体"},{"id":"o2","text":"Golgi装置"},{"id":"o3","text":"滑面小胞体"},{"id":"o4","text":"リボソーム"},{"id":"o5","text":"ミトコンドリア"}],"answers":["o5"],"why":"正答はミトコンドリアです。ミトコンドリア内膜には電子伝達系とATP合成酵素が存在し、酸化的リン酸化によって細胞が利用するATPの多くを産生します。解糖系そのものは細胞質で行われますが、その後のクエン酸回路や酸化的リン酸化はミトコンドリアが中心です。","option_explanations":{"o1":"中心小体は微小管の形成や細胞分裂時の紡錘体形成に関与する。","o2":"Golgi装置は蛋白質・脂質の修飾、選別、輸送に関与する。","o3":"滑面小胞体は脂質合成、薬物代謝、Ca²⁺貯蔵などに関与する。","o4":"リボソームは蛋白質合成の場であり、ATP産生の中心ではない。","o5":"正しい。ミトコンドリアはクエン酸回路や酸化的リン酸化によりATP産生に重要な役割を担う。"},"related":"細胞小器官は機能と対にして整理します。粗面小胞体＝分泌蛋白などの合成、Golgi装置＝修飾・選別、リソソーム＝細胞内消化、ミトコンドリア＝好気的エネルギー産生、という対応が基本です。","tip":"ATPの大量産生＝ミトコンドリア。蛋白質合成＝リボソーム。","glossary":[{"term":"ATP","desc":"adenosine triphosphate（アデノシン三リン酸）。細胞が直接利用する主要なエネルギー担体。"},{"term":"酸化的リン酸化","desc":"ミトコンドリア内膜の電子伝達系を利用してATPを合成する過程。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["ミトコンドリアは二重膜構造をもち、内膜のひだをクリステという。","骨格筋のタイプI線維はミトコンドリア密度が高く、酸化能力が高い。"]},{"id":"60A62","source":"第60回・午前62（出題内容をもとに再構成）","source_session":"午前","source_no":62,"subject":"生理学","domain":"筋","topic":"筋線維・収縮","concept":"筋線維の種類","secondary":["タイプI線維","遅筋","酸化能力"],"question":"タイプII筋線維と比べたとき、タイプI筋線維の特徴として正しいのはどれか。","options":[{"id":"o1","text":"発生張力が小さい"},{"id":"o2","text":"筋線維径が太い"},{"id":"o3","text":"酸化酵素活性が低い"},{"id":"o4","text":"ミオグロビン量が少ない"},{"id":"o5","text":"ミトコンドリア密度が低い"}],"answers":["o1"],"why":"正答は『発生張力が小さい』です。タイプI線維は遅筋線維とも呼ばれ、収縮速度と最大張力は比較的小さい一方、ミトコンドリア・ミオグロビン・毛細血管が豊富で酸化能力が高く、疲労しにくいという特徴があります。姿勢保持や持久的活動に適しています。","option_explanations":{"o1":"正しい。タイプI線維はタイプII線維より収縮速度・発生張力が小さい傾向がある。","o2":"誤り。一般にタイプI線維はタイプII線維より筋線維径が小さい。","o3":"誤り。タイプI線維は有酸素代謝に優れ、酸化酵素活性は高い。","o4":"誤り。ミオグロビンが多く、赤色を呈しやすい。","o5":"誤り。持久的なエネルギー供給を支えるため、タイプI線維ではミトコンドリア密度が高い。"},"related":"タイプI＝遅い・持久力・酸化系、タイプII＝速い・大きな力・解糖系、という対比が基本です。ただし実際の骨格筋は複数タイプが混在します。 また、タイプI線維は小型の運動単位に多く、持続的な姿勢保持で動員されやすい。","tip":"I型は『赤・遅・長持ち』。","glossary":[{"term":"タイプI筋線維","desc":"遅筋線維。酸化能力が高く、疲れにくく、姿勢保持や持久活動に向く。"},{"term":"ミオグロビン","desc":"筋内で酸素を保持する蛋白。多いほど赤色調が強くなる。"},{"term":"酸化酵素活性","desc":"有酸素代謝に関わる酵素活性。タイプI線維では高い。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["タイプI線維は姿勢保持・持久活動に向き、タイプII線維は短時間の高出力に向く。","運動単位の動員は一般に小さい運動単位から大きい運動単位へ進む。"],"round":60},{"id":"60A63","source":"第60回・午前63（出題内容をもとに学習用再構成）","source_session":"午前","source_no":63,"subject":"生理学","domain":"自律神経","topic":"自律神経機能","concept":"自律神経系の基本","secondary":["交感神経","副交感神経","節前線維","アセチルコリン"],"question":"自律神経系の一般原則として正しいのはどれか。","options":[{"id":"o1","text":"交感神経節前線維はノルアドレナリンを放出する"},{"id":"o2","text":"副交感神経節後線維はすべてドパミンを放出する"},{"id":"o3","text":"交感神経節後線維はすべてアセチルコリンを放出する"},{"id":"o4","text":"副交感神経節前線維は脊髄胸腰髄から出る"},{"id":"o5","text":"交感神経・副交感神経の節前線維はいずれもアセチルコリンを放出する"}],"answers":["o5"],"why":"正答は『交感神経・副交感神経の節前線維はいずれもアセチルコリンを放出する』です。節前線維は自律神経節でニコチン性アセチルコリン受容体へ作用します。","option_explanations":{"o1":"交感神経節前線維の伝達物質はアセチルコリン。","o2":"副交感神経節後線維も基本的にアセチルコリンを放出する。","o3":"交感神経節後線維は多くがノルアドレナリンだが、汗腺支配など例外がある。","o4":"副交感神経は脳幹および仙髄から出る。","o5":"正しい。節前線維は交感・副交感ともアセチルコリン。"},"related":"自律神経は『起始・節前/節後線維・伝達物質・受容体・臓器反応』を表にして整理すると強いです。","tip":"節前は両方アセチルコリン。節後で違いが出る。","glossary":[{"term":"節前線維","desc":"中枢神経系から自律神経節までの線維。交感・副交感ともアセチルコリンを放出する。"},{"term":"アセチルコリン","desc":"神経伝達物質。自律神経節や神経筋接合部などで重要。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["交感神経節後線維でも汗腺支配はアセチルコリンという例外がある。","副交感神経の起始は脳幹・仙髄。"],"round":60},{"id":"60A64","source":"第60回・午前64（出題内容をもとに再構成）","source_session":"午前","source_no":64,"subject":"生理学","domain":"呼吸","topic":"呼吸調節","concept":"呼吸調節機構","secondary":["伸展受容器","迷走神経","化学受容器"],"question":"呼吸調節機構について正しい記述はどれか。","options":[{"id":"o1","text":"呼吸中枢は視床下部にある"},{"id":"o2","text":"末梢化学受容器は椎骨動脈にある"},{"id":"o3","text":"横隔膜・肋間筋は随意的に収縮できない"},{"id":"o4","text":"末梢化学受容器は動脈血酸素分圧の上昇で強く興奮する"},{"id":"o5","text":"肺伸展受容器の情報は迷走神経を介して呼吸中枢へ伝わる"}],"answers":["o5"],"why":"正答は肺伸展受容器からの情報が迷走神経を介して呼吸中枢へ伝わる、です。肺の伸展に関する求心性情報は迷走神経を通って延髄などへ入り、吸気を抑制する反射機構に関与します。呼吸は自律的に制御される一方、一定範囲では随意的にも調節できます。","option_explanations":{"o1":"呼吸リズム形成の主要部位は延髄・橋で、視床下部ではない。","o2":"末梢化学受容器は頸動脈小体と大動脈小体に存在する。","o3":"横隔膜や肋間筋は自動的にも活動するが、息止めや深呼吸のように随意的な調節も可能。","o4":"末梢化学受容器は動脈血酸素分圧（PaO₂）の低下、とくに著明な低下で強く刺激される。","o5":"正しい。肺の伸展受容器からの求心路は迷走神経を通る。"},"related":"中枢化学受容器は主に二酸化炭素変化に由来する髄液pHの変化を感知します。末梢化学受容器は動脈血酸素分圧（PaO₂）の低下、動脈血二酸化炭素分圧（PaCO₂）の上昇、pH低下を感知します。肺伸展受容器からの迷走神経求心路はヘーリング・ブロイエル反射（Hering-Breuer reflex）にも関与します。","tip":"呼吸中枢＝延髄・橋、末梢化学受容器＝頸動脈小体・大動脈小体、肺伸展＝迷走神経。","glossary":[{"term":"迷走神経","desc":"第10脳神経。内臓求心・遠心線維を広く含み、呼吸や循環の調節に関与する。"},{"term":"末梢化学受容器","desc":"頸動脈小体・大動脈小体にある受容器。動脈血酸素分圧（PaO₂）低下、動脈血二酸化炭素分圧（PaCO₂）上昇、pH低下を感知する。"},{"term":"肺伸展受容器","desc":"肺の伸展を感知する受容器。過伸展時に吸気を抑制する反射に関与する。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["呼吸リズム形成の主要部位は延髄・橋。","肺伸展受容器からの迷走神経求心路はヘーリング・ブロイエル反射（Hering-Breuer reflex）と関連する。"],"round":60},{"id":"60A65","source":"第60回・午前65（出題内容をもとに学習用再構成）","source_session":"午前","source_no":65,"subject":"生理学","domain":"循環","topic":"刺激伝導・心電図","concept":"刺激伝導系","secondary":["洞房結節","房室結節","His束","Purkinje線維"],"question":"心臓の刺激伝導系について正しいのはどれか。","options":[{"id":"o1","text":"房室結節が通常の一次ペースメーカーである"},{"id":"o2","text":"刺激は心室から心房へ向かって生理的に伝わる"},{"id":"o3","text":"Purkinje線維は心房内にのみ分布する"},{"id":"o4","text":"洞房結節は左心室心尖部にある"},{"id":"o5","text":"房室結節からの興奮はHis束を介して心室伝導系へ進む"}],"answers":["o5"],"why":"正答は『房室結節からの興奮はHis束を介して心室伝導系へ進む』です。通常は洞房結節で発生した興奮が心房を伝わり、房室結節、His束、脚、Purkinje線維へ進みます。","option_explanations":{"o1":"通常の一次ペースメーカーは洞房結節。","o2":"通常は心房から心室へ伝導する。","o3":"Purkinje線維は心室内で興奮を素早く広げる。","o4":"洞房結節は右心房上部、上大静脈開口部付近に位置する。","o5":"正しい。房室結節の後にHis束へ伝導する。"},"related":"心電図ではP波＝心房脱分極、QRS波＝心室脱分極、T波＝心室再分極という対応も一緒に押さえます。","tip":"洞房結節→房室結節→His束→脚→Purkinje線維。","glossary":[{"term":"洞房結節","desc":"通常の心拍を開始する一次ペースメーカー。右心房にある。"},{"term":"His束","desc":"房室結節から心室側へ興奮を伝える刺激伝導路。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["房室結節では伝導が遅延し、心房収縮後に心室収縮が起こる時間をつくる。","心電図の波形と刺激伝導順序を結びつける。"],"round":60},{"id":"60A66","source":"第60回・午前66（出題内容をもとに学習用再構成）","source_session":"午前","source_no":66,"subject":"生理学","domain":"血液・免疫","topic":"血液","concept":"血球","secondary":["赤血球","白血球","血小板","止血"],"question":"血球とその主な機能の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"赤血球 ― 抗体産生"},{"id":"o2","text":"好中球 ― 酸素運搬"},{"id":"o3","text":"血小板 ― 一次止血"},{"id":"o4","text":"リンパ球 ― フィブリン分解"},{"id":"o5","text":"好酸球 ― ヘモグロビン産生"}],"answers":["o3"],"why":"正答は『血小板―一次止血』です。血小板は血管損傷部位へ粘着・凝集し、血小板血栓を形成して一次止血に重要です。","option_explanations":{"o1":"抗体産生はBリンパ球から分化した形質細胞が担う。","o2":"酸素運搬は主に赤血球のヘモグロビンが担う。","o3":"正しい。血小板は一次止血で中心的役割を担う。","o4":"フィブリン分解は線溶系のプラスミンなどが担う。","o5":"ヘモグロビンは赤芽球系で産生され、好酸球の主機能ではない。"},"related":"止血は一次止血（血小板）と二次止血（凝固因子によるフィブリン形成）に分けて整理します。白血球は好中球・好酸球・好塩基球・単球・リンパ球の機能を比較します。","tip":"血小板＝一次止血、凝固因子＝二次止血。","glossary":[{"term":"一次止血","desc":"血小板の粘着・凝集により血小板血栓を形成する過程。"},{"term":"二次止血","desc":"凝固系によりフィブリンを形成し血栓を安定化する過程。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["好中球は細菌貪食、好酸球は寄生虫・アレルギー、リンパ球は獲得免疫と関連づける。","線溶系は血栓形成後のフィブリン分解に関与する。"],"round":60},{"id":"60A67","source":"第60回・午前67（出題内容をもとに学習用再構成）","source_session":"午前","source_no":67,"subject":"生理学","domain":"咀嚼・嚥下・消化・吸収","topic":"消化吸収","concept":"肝・胆・膵機能","secondary":["胆汁","胆汁酸","脂肪消化","胆嚢"],"question":"胆汁について正しいのはどれか。","options":[{"id":"o1","text":"胆汁酸は脂肪の乳化に関与する"},{"id":"o2","text":"胆汁には蛋白質を分解する主要消化酵素が大量に含まれる"},{"id":"o3","text":"胆汁は膵臓で産生される"},{"id":"o4","text":"胆嚢は胆汁を産生する"},{"id":"o5","text":"胆汁は胃内へ直接分泌される"}],"answers":["o1"],"why":"正答は『胆汁酸は脂肪の乳化に関与する』です。胆汁は肝臓で産生され、胆嚢で濃縮・貯蔵され、十二指腸へ排出されます。","option_explanations":{"o1":"正しい。胆汁酸は脂肪を乳化し、脂肪消化・吸収を助ける。","o2":"胆汁そのものは蛋白分解酵素の主要供給源ではない。","o3":"胆汁は肝臓で産生される。","o4":"胆嚢は胆汁を貯蔵・濃縮する。","o5":"胆汁は総胆管などを通って十二指腸へ流入する。"},"related":"脂質の消化吸収では胆汁酸による乳化と膵リパーゼによる分解を分けて理解します。肝臓・胆嚢・膵臓の役割を混同しないことが重要です。","tip":"胆汁は肝で作る、胆嚢でためる、十二指腸へ出す。","glossary":[{"term":"乳化","desc":"大きな脂肪滴を細かく分散させ、消化酵素が作用しやすくすること。"},{"term":"胆汁酸","desc":"胆汁の主要成分の一つ。脂質の消化吸収を助ける。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["脂肪分解酵素の代表は膵リパーゼ。","総胆管と膵管は十二指腸への流入部で近接する。"],"round":60},{"id":"60A68","source":"第60回・午前68（出題内容をもとに学習用再構成）","source_session":"午前","source_no":68,"subject":"生理学","domain":"生殖","topic":"生殖生理","concept":"排卵・月経","secondary":["月経周期","排卵","黄体形成ホルモン","プロゲステロン"],"question":"正常月経周期について正しいのはどれか。","options":[{"id":"o1","text":"排卵は黄体形成ホルモンの急増と関連する"},{"id":"o2","text":"排卵後はプロゲステロン分泌が直ちに消失する"},{"id":"o3","text":"卵胞期は黄体からのプロゲステロンが主体である"},{"id":"o4","text":"月経中はエストロゲンとプロゲステロンが高値を維持する"},{"id":"o5","text":"排卵は通常、月経開始の直後に起こる"}],"answers":["o1"],"why":"正答は『排卵は黄体形成ホルモンの急増と関連する』です。成熟卵胞からのエストロゲン上昇を背景に黄体形成ホルモンのサージが起こり、排卵が誘発されます。","option_explanations":{"o1":"正しい。黄体形成ホルモンのサージは排卵誘発に重要。","o2":"排卵後は黄体が形成され、プロゲステロン分泌が増える。","o3":"卵胞期は卵胞からのエストロゲン分泌が中心。","o4":"月経は黄体退縮に伴うエストロゲン・プロゲステロン低下と関連する。","o5":"一般的な周期では排卵は次回月経開始のおよそ14日前に起こる。"},"related":"月経周期は卵胞期・排卵・黄体期で整理し、卵胞刺激ホルモン、黄体形成ホルモン、エストロゲン、プロゲステロンの変化を対応させます。","tip":"排卵＝黄体形成ホルモンサージ。","glossary":[{"term":"黄体形成ホルモン","desc":"luteinizing hormone。排卵と黄体形成に重要。"},{"term":"黄体期","desc":"排卵後に黄体からプロゲステロンが増える時期。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["プロゲステロンは基礎体温上昇と関連する。","閉経では卵巣機能低下により性腺刺激ホルモンが上昇する。"],"round":60},{"id":"60A69","source":"第60回・午前69（出題内容をもとに学習用再構成）","source_session":"午前","source_no":69,"subject":"生理学","domain":"運動","topic":"運動生理","concept":"運動単位","secondary":["運動単位","サイズの原理","神経支配比","α運動ニューロン"],"question":"運動単位について正しいものを2つ選べ。","options":[{"id":"o1","text":"1つの筋線維は複数のα運動ニューロンに同時支配される"},{"id":"o2","text":"精密運動を行う筋ほど1運動単位あたりの筋線維数が多い"},{"id":"o3","text":"大きな運動単位から先に動員される"},{"id":"o4","text":"1個のα運動ニューロンと、それが支配する筋線維群で構成される"},{"id":"o5","text":"一般に小さな運動単位から順に動員される"}],"answers":["o4","o5"],"why":"正答は『1個のα運動ニューロンと、それが支配する筋線維群』と『小さな運動単位から順に動員』です。後者はサイズの原理として知られます。","option_explanations":{"o1":"通常、1本の骨格筋線維は1個のα運動ニューロンから神経支配を受ける。","o2":"眼球運動や手指など精密運動を行う筋では神経支配比が小さい。","o3":"一般には小さい運動単位から動員される。","o4":"正しい。これが運動単位の基本定義。","o5":"正しい。必要な張力が増すにつれてより大きい運動単位が追加動員される。"},"related":"神経支配比が小さいほど微細な力調節に向き、大きいほど大きな力を効率よく発揮できます。タイプI線維を含む小型運動単位は低強度から動員されやすいです。","tip":"運動単位＝1ニューロン＋支配筋線維。動員は小→大。","glossary":[{"term":"サイズの原理","desc":"筋力要求の増加に応じて、小さい運動単位から大きい運動単位へ動員される原則。"},{"term":"神経支配比","desc":"1個の運動ニューロンが支配する筋線維数。"}],"official_answers":[4,5],"problemImage":null,"problemImageCaption":null,"exam_links":["眼筋や手内在筋は神経支配比が小さく精密制御に向く。","タイプI筋線維と小型運動単位の関係も合わせて覚える。"],"round":60},{"id":"60A70","source":"第60回・午前70（出題内容をもとに学習用再構成）","source_session":"午前","source_no":70,"subject":"生理学","domain":"呼吸","topic":"換気","concept":"肺胞換気量","secondary":["一回換気量","死腔換気量","呼吸数","肺胞換気"],"question":"肺胞換気量を増加させる変化として正しいものを2つ選べ。","options":[{"id":"o1","text":"一回換気量を保ったまま呼吸数を低下させる"},{"id":"o2","text":"死腔換気量を減少させる"},{"id":"o3","text":"一回換気量を増加させる"},{"id":"o4","text":"死腔換気量を増加させる"},{"id":"o5","text":"呼吸を停止する"}],"answers":["o2","o3"],"why":"正答は『死腔換気量を減少させる』と『一回換気量を増加させる』です。肺胞換気量は、1回の呼吸で肺胞に届く有効換気量と呼吸数で決まります。","option_explanations":{"o1":"他条件が同じなら呼吸数低下は分時の肺胞換気を減らす。","o2":"正しい。死腔が減れば同じ一回換気量でも肺胞へ届く割合が増える。","o3":"正しい。一回換気量が増え、死腔を超える分が増えれば肺胞換気は増える。","o4":"死腔が増えると有効な肺胞換気は減る。","o5":"呼吸停止では肺胞換気は0になる。"},"related":"肺胞換気量は『（一回換気量－死腔換気量）×呼吸数』で整理できます。浅く速い呼吸では分時換気量が同じでも肺胞換気が低くなることがあります。","tip":"一回換気量から死腔を引いた分が肺胞へ届く。","glossary":[{"term":"死腔","desc":"換気はされるがガス交換に直接参加しない気道・肺胞領域。"},{"term":"肺胞換気量","desc":"1分間に肺胞へ到達しガス交換に関与する換気量。"}],"official_answers":[2,3],"problemImage":null,"problemImageCaption":null,"exam_links":["分時換気量と肺胞換気量は同じではない。","浅速呼吸では死腔の占める割合が大きくなりやすい。"],"round":60},{"id":"60A71","source":"第60回・午前71（出題内容をもとに学習用再構成）","source_session":"午前","source_no":71,"subject":"運動学","domain":"四肢・体幹の運動","topic":"顔面・頭頸部","concept":"頸椎運動","secondary":["胸鎖乳突筋","頸椎屈曲","頸椎回旋"],"question":"頭頸部の運動と筋作用の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"右胸鎖乳突筋 ― 頭部右回旋"},{"id":"o2","text":"両側板状筋 ― 頸部屈曲"},{"id":"o3","text":"左斜角筋 ― 頸部右側屈のみ"},{"id":"o4","text":"両側胸鎖乳突筋 ― 頸部屈曲"},{"id":"o5","text":"後頭下筋群 ― 頸部屈曲"}],"answers":["o4"],"why":"正答は『両側胸鎖乳突筋―頸部屈曲』です。胸鎖乳突筋は一側収縮で同側側屈・反対側回旋、両側収縮で頸部屈曲に関与します。","option_explanations":{"o1":"右胸鎖乳突筋は主に左回旋に作用する。","o2":"板状筋は両側で頸部伸展に作用する。","o3":"斜角筋は同側側屈などに関与し、記述が限定的すぎる。","o4":"正しい。両側胸鎖乳突筋は頸部屈曲に関与する。","o5":"後頭下筋群は主に上位頸椎の伸展・回旋に関与する。"},"related":"頸部筋は『一側作用』と『両側作用』を分けて覚えるのが重要です。胸鎖乳突筋は呼吸補助筋としても働きます。","tip":"胸鎖乳突筋：一側＝反対側回旋、両側＝屈曲。","glossary":[{"term":"胸鎖乳突筋","desc":"頸部表層の大きな筋。一側・両側で作用が異なる。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":["副神経支配と胸鎖乳突筋・僧帽筋を関連づける。","頸部筋の問題は回旋方向の左右を取り違えやすい。"],"round":60},{"id":"60A72","source":"第60回・午前72（出題内容をもとに学習用再構成）","source_session":"午前","source_no":72,"subject":"運動学","domain":"四肢・体幹の運動","topic":"股関節","concept":"股関節運動","secondary":["股関節","頸体角","腸骨大腿靱帯","関節軸"],"question":"股関節の構造・運動について正しいものを2つ選べ。","options":[{"id":"o1","text":"成人の大腿骨頸体角は通常90度未満である"},{"id":"o2","text":"腸骨大腿靱帯は股関節伸展を制限する"},{"id":"o3","text":"股関節は球関節で3軸性の運動が可能である"},{"id":"o4","text":"股関節屈曲では大腿骨頭が寛骨臼から離開するのが正常である"},{"id":"o5","text":"大腿骨頭は膝窩で脛骨と関節を形成する"}],"answers":["o2","o3"],"why":"正答は『腸骨大腿靱帯は伸展を制限する』と『股関節は球関節で3軸性』です。股関節は高い安定性を持ちながら屈伸・内外転・内外旋が可能です。","option_explanations":{"o1":"成人の頸体角は一般に約125度前後で、90度未満が通常ではない。","o2":"正しい。腸骨大腿靱帯は強靱で、とくに伸展を制限する。","o3":"正しい。球関節で多方向の運動が可能。","o4":"正常な股関節屈曲で大腿骨頭が大きく離開するわけではない。","o5":"大腿骨頭は寛骨臼と関節を形成する。"},"related":"股関節では頸体角、前捻角、靱帯、関節包内運動を関連づけます。開放運動連鎖と閉鎖運動連鎖で骨盤・大腿骨の動きが変わる点も重要です。","tip":"股関節＝球関節。腸骨大腿靱帯＝伸展制限。","glossary":[{"term":"頸体角","desc":"大腿骨頸部軸と骨幹軸のなす角。成人で一般に約125度前後。"},{"term":"腸骨大腿靱帯","desc":"股関節前面の強い靱帯。伸展制限に重要。"}],"official_answers":[2,3],"problemImage":null,"problemImageCaption":null,"exam_links":["トレンデレンブルグ徴候（Trendelenburg sign）は中殿筋など股関節外転筋機能と関連する。","股関節の屈曲拘縮ではトーマステスト（Thomas test）が関連する。"],"round":60},{"id":"60A73","source":"第60回・午前73（出題内容をもとに再構成）","source_session":"午前","source_no":73,"subject":"運動学","domain":"姿勢","topic":"姿勢制御","concept":"立位安定性","secondary":["支持基底面","重心線","摩擦"],"question":"静的立位の安定性について正しいのはどれか。","options":[{"id":"o1","text":"支持基底面が狭いほど安定する"},{"id":"o2","text":"重心位置が高いほど安定する"},{"id":"o3","text":"重心線は膝関節中心よりやや前方を通る"},{"id":"o4","text":"足底と床の摩擦が小さいほど安定する"},{"id":"o5","text":"重心線は支持基底面の中心から離れるほど安定する"}],"answers":["o3"],"why":"正答は『重心線は膝関節中心よりやや前方を通る』です。正常立位では重心線は膝関節軸のやや前方を通り、膝には軽い伸展方向の外力モーメントが生じます。安定性そのものは、支持基底面が広い、重心が低い、重心線が支持基底面中央に近い、床との摩擦が十分あるほど高くなります。","option_explanations":{"o1":"支持基底面が広いほど、重心線をその内部に保てる範囲が大きくなるため安定性は高い。","o2":"重心が低いほど転倒方向へのモーメントが小さくなり、一般に安定する。","o3":"正しい。正常立位では重心線は膝関節中心のやや前方を通る。","o4":"摩擦が小さいと滑りやすくなり、支持面との安定性は低下する。","o5":"重心線が支持基底面の縁へ近づくほど、わずかな外乱で基底面外へ出やすくなる。"},"related":"静的安定性は『支持基底面・重心高・重心線の位置・摩擦』の4点で整理すると、多くの姿勢問題に対応できます。","tip":"広い・低い・中央・滑らない＝安定。","glossary":[{"term":"支持基底面","desc":"身体を支える面の範囲。立位では両足底とその間の面で表される。"},{"term":"重心線","desc":"重心から鉛直下方に下ろした線。支持基底面内にあることが安定の条件。"},{"term":"摩擦","desc":"床と足底が滑らないための抵抗。小さいと姿勢保持が不利になる。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["安定性は『支持基底面が広い・重心が低い・重心線が中央に近い・摩擦が大きい』ほど高い。","姿勢制御では足関節戦略・股関節戦略・ステッピング戦略も関連して問われる。"],"round":60},{"id":"60A74","source":"第60回・午前74（出題内容をもとに学習用再構成）","source_session":"午前","source_no":74,"subject":"運動学","domain":"歩行","topic":"歩行周期","concept":"歩行周期イベント","secondary":["歩行周期","立脚中期","遊脚期","両脚支持期"],"question":"正常歩行について正しいのはどれか。","options":[{"id":"o1","text":"遊脚期は歩行周期の約60％を占める"},{"id":"o2","text":"立脚中期では身体重心が支持脚の上方を通過する"},{"id":"o3","text":"両脚支持期は走行時に増加する"},{"id":"o4","text":"初期接地では股関節は最大伸展位にある"},{"id":"o5","text":"遊脚終期では膝は最大屈曲位にある"}],"answers":["o2"],"why":"正答は『立脚中期では身体重心が支持脚の上方を通過する』です。正常歩行では立脚期が約60％、遊脚期が約40％で、立脚中期では身体が支持足の上を前方へ進みます。","option_explanations":{"o1":"遊脚期はおよそ40％。","o2":"正しい。立脚中期では身体が支持脚上を進む。","o3":"走行では両脚支持期がなく、両脚が浮く時期が生じる。","o4":"初期接地では股関節は屈曲位。","o5":"遊脚終期では膝は伸展方向へ戻り、次の接地に備える。"},"related":"歩行周期は初期接地・荷重応答・立脚中期・立脚終期・前遊脚・遊脚初期・遊脚中期・遊脚終期の順序で整理します。","tip":"立脚60％、遊脚40％。走行では両脚支持が消える。","glossary":[{"term":"立脚中期","desc":"片脚支持となり、身体が支持足の上を通過する時期。"},{"term":"両脚支持期","desc":"歩行中に両足が同時に接地している時期。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["歩行速度が上がると両脚支持時間は短くなる。","床反力・関節モーメント・筋活動を周期イベントと結びつける。"],"round":60},{"id":"60B51","source":"第60回・午後51（出題内容をもとに学習用再構成）","source_session":"午後","source_no":51,"subject":"解剖学","domain":"骨格系","topic":"骨の構造・代謝","concept":"骨形成・骨吸収","secondary":["骨芽細胞","破骨細胞","骨代謝","骨リモデリング"],"question":"骨代謝について正しいのはどれか。","options":[{"id":"o1","text":"破骨細胞は骨吸収に関与する"},{"id":"o2","text":"骨芽細胞は骨吸収を主に行う"},{"id":"o3","text":"骨細胞は破骨細胞から分化する"},{"id":"o4","text":"副甲状腺ホルモンは常に骨形成のみを促進する"},{"id":"o5","text":"骨リモデリングは成長期にのみ起こる"}],"answers":["o1"],"why":"正答は『破骨細胞は骨吸収に関与する』です。骨は生涯にわたり形成と吸収を繰り返しており、骨芽細胞が骨形成、破骨細胞が骨吸収を担います。","option_explanations":{"o1":"正しい。破骨細胞は多核細胞で骨吸収を担う。","o2":"骨芽細胞は骨基質形成・石灰化に関与する。","o3":"骨細胞は骨芽細胞が骨基質内に取り込まれて成熟した細胞。","o4":"副甲状腺ホルモンは血中カルシウム濃度調節に関与し、作用は単純な『骨形成のみ』ではない。","o5":"骨リモデリングは成人以降も継続する。"},"related":"骨代謝では骨芽細胞・破骨細胞に加え、副甲状腺ホルモン、活性型ビタミンD、カルシトニン、機械的負荷との関係も押さえます。","tip":"骨芽細胞＝形成、破骨細胞＝吸収。","glossary":[{"term":"骨リモデリング","desc":"古い骨を吸収し新しい骨を形成する更新過程。成人でも続く。"},{"term":"破骨細胞","desc":"骨吸収を担う多核細胞。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["骨粗鬆症では骨強度低下と骨折リスク上昇を関連づける。","長期不動では機械的負荷低下により骨量低下が問題になる。"],"round":60},{"id":"60B52","round":60,"source":"第60回・午後52（出題内容をもとに学習用再構成）","source_session":"午後","source_no":52,"subject":"解剖学","domain":"骨格系","topic":"関節の基礎","concept":"関節の形状分類","secondary":["腕尺関節","らせん関節","関節形状","滑膜関節"],"question":"腕尺関節の形状分類として最も適切なのはどれか。","options":[{"id":"o1","text":"らせん関節"},{"id":"o2","text":"鞍関節"},{"id":"o3","text":"楕円関節"},{"id":"o4","text":"平面関節"},{"id":"o5","text":"球関節"}],"answers":["o1"],"why":"正答はらせん関節です。腕尺関節は上腕骨滑車と尺骨滑車切痕で構成され、屈曲・伸展を主体としますが、関節面がらせん状であるため日本の解剖学的分類ではらせん関節に分類されます。","option_explanations":{"o1":"正しい。腕尺関節はらせん関節に分類される。","o2":"鞍関節の代表は母指手根中手関節で、互いに鞍状の関節面をもつ。","o3":"楕円関節の代表には橈骨手根関節などがある。","o4":"平面関節は関節面が比較的平坦で、手根間関節などにみられる。","o5":"球関節の代表は肩甲上腕関節や股関節で、多軸性の運動が可能。"},"related":"関節形状は代表例とセットで覚えると効率的です。球関節＝肩・股、鞍関節＝母指CM、楕円関節＝橈骨手根、平面関節＝手根間、らせん関節＝腕尺、という整理が国試対策で有用です。","tip":"腕尺関節＝らせん関節。母指CM＝鞍関節。","glossary":[{"term":"らせん関節","desc":"関節面がらせん状の特徴をもつ関節。腕尺関節が代表例。"},{"term":"滑膜関節","desc":"関節腔・関節軟骨・関節包などをもつ、可動性の高い関節。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["腕橈関節は球関節として分類される。","近位・遠位橈尺関節は車軸関節で、前腕回内・回外に関与する。"]},{"id":"60B53","round":60,"source":"第60回・午後53（採点調整問題を学習用に2選択へ再構成）","source_session":"午後","source_no":53,"subject":"解剖学","domain":"神経系","topic":"脳神経","concept":"脳神経の機能","secondary":["味覚","舌咽神経","迷走神経","顔面神経"],"question":"次の選択肢のうち、味覚情報の伝達に関与する脳神経を2つ選べ。","options":[{"id":"o1","text":"三叉神経"},{"id":"o2","text":"舌咽神経"},{"id":"o3","text":"迷走神経"},{"id":"o4","text":"副神経"},{"id":"o5","text":"舌下神経"}],"answers":["o2","o3"],"why":"正答は舌咽神経と迷走神経です。舌咽神経は舌後1/3の味覚、迷走神経は喉頭蓋付近などの味覚に関与します。なお舌前2/3の味覚は顔面神経（鼓索神経）で伝えられます。原問題は1つ選択形式でしたが複数正解があるとして採点調整されているため、本アプリでは学習上の曖昧さを避けて2つ選ぶ形式にしています。","option_explanations":{"o1":"三叉神経は顔面や口腔の一般体性感覚に重要だが、味覚そのものの主要求心路ではない。","o2":"正しい。舌咽神経は舌後1/3の味覚と一般感覚に関与する。","o3":"正しい。迷走神経は喉頭蓋周辺などの味覚情報を伝える。","o4":"副神経は胸鎖乳突筋・僧帽筋の運動に関与する。","o5":"舌下神経は舌筋の運動を支配する。"},"related":"味覚は『舌前2/3＝顔面神経、舌後1/3＝舌咽神経、喉頭蓋付近＝迷走神経』で整理します。一般体性感覚の支配とは異なるため、味覚と触覚・痛覚を分けて覚えることが重要です。","tip":"味覚：前2/3 VII、後1/3 IX、喉頭蓋 X。","glossary":[{"term":"鼓索神経","desc":"顔面神経の枝。舌前2/3の味覚などを伝える。"},{"term":"舌咽神経","desc":"第IX脳神経。舌後1/3の味覚・感覚、咽頭機能などに関与する。"},{"term":"迷走神経","desc":"第X脳神経。咽喉頭や内臓の感覚・運動・副交感機能に広く関与する。"}],"official_answers":[2,3],"scoring_status":"複数正解扱い","official_note":"厚生労働省は原問題について「複数の選択肢を正解として採点」とした。本アプリでは2・3を選ぶ学習問題に再構成し、診断テストからは除外している。","excludeFromDiagnosis":true,"problemImage":null,"problemImageCaption":null,"exam_links":["顔面神経麻痺では鼓索神経の障害部位によって舌前2/3の味覚障害を伴うことがある。","咽頭反射は求心路が舌咽神経、遠心路が迷走神経。"]},{"id":"60B54","round":60,"source":"第60回・午後54（出題内容をもとに学習用再構成）","source_session":"午後","source_no":54,"subject":"解剖学","domain":"内臓諸器官","topic":"消化器","concept":"食道・胃","secondary":["胃","幽門","幽門括約筋","噴門"],"question":"胃内容を十二指腸へ送り出す際に流出量を調節する構造はどれか。","options":[{"id":"o1","text":"幽門括約筋"},{"id":"o2","text":"噴門切痕"},{"id":"o3","text":"胃底"},{"id":"o4","text":"小網"},{"id":"o5","text":"胃体部の大彎"}],"answers":["o1"],"why":"正答は幽門括約筋です。胃の遠位端にある幽門部では輪走筋が厚くなって幽門括約筋を形成し、胃内容が十二指腸へ排出される速度を調節します。","option_explanations":{"o1":"正しい。幽門括約筋は胃と十二指腸の境界で胃内容の排出を調節する。","o2":"噴門切痕は食道と胃底の間にみられる切れ込みで、胃内容排出を調節する括約構造ではない。","o3":"胃底は噴門より上方に膨隆する部分で、出口側の調節構造ではない。","o4":"小網は肝臓と胃・十二指腸を連結する腹膜構造。","o5":"大彎は胃の外側縁であり、括約機能を担う構造ではない。"},"related":"胃は噴門・胃底・胃体・幽門部に分けて位置関係を整理します。入口側の噴門と出口側の幽門を混同しないことが基本です。","tip":"胃の入口＝噴門、出口＝幽門。","glossary":[{"term":"幽門括約筋","desc":"胃の遠位端で輪走筋が発達した構造。十二指腸への胃内容排出を調節する。"},{"term":"噴門","desc":"食道が胃へ移行する入口側の部位。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["幽門は概ねL1付近を目安にする。","胃底は噴門より上方に位置する。"]},{"id":"60B55","round":60,"source":"第60回・午後55（出題内容をもとに学習用再構成）","source_session":"午後","source_no":55,"subject":"解剖学","domain":"感覚器","topic":"特殊感覚","concept":"聴覚器","secondary":["内耳","蝸牛","半規管","耳小骨"],"question":"聴覚器の構造について正しいのはどれか。","options":[{"id":"o1","text":"蝸牛は内耳に属する"},{"id":"o2","text":"耳管は内耳と咽頭を直接つなぐ"},{"id":"o3","text":"鼓膜にはキヌタ骨が直接付着する"},{"id":"o4","text":"半規管は左右それぞれ2本で構成される"},{"id":"o5","text":"内リンパと外リンパは正常では自由に交通する"}],"answers":["o1"],"why":"正答は『蝸牛は内耳に属する』です。内耳には蝸牛・前庭・半規管があり、蝸牛は聴覚、前庭・半規管は平衡感覚に主として関与します。","option_explanations":{"o1":"正しい。蝸牛は内耳にあり、音刺激の受容に関与する。","o2":"耳管は中耳腔と咽頭を連絡し、中耳圧の調節に関与する。","o3":"鼓膜に柄が付着する耳小骨はツチ骨。キヌタ骨はツチ骨とアブミ骨の間にある。","o4":"半規管は前・後・外側の3つで構成される。","o5":"内リンパと外リンパは組成も存在する腔も異なり、正常状態で自由に交通するものではない。"},"related":"外耳・中耳・内耳の区分を整理すると選択肢を判定しやすくなります。外耳＝耳介・外耳道、中耳＝鼓膜内側の鼓室・耳小骨・耳管、内耳＝蝸牛・前庭・半規管です。","tip":"蝸牛＝聴覚、前庭・半規管＝平衡。","glossary":[{"term":"蝸牛","desc":"内耳の構造。コルチ器を含み、音刺激の受容に関与する。"},{"term":"耳管","desc":"中耳腔と咽頭を連絡し、中耳の圧を外気圧に近づける役割をもつ。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["耳小骨はツチ骨→キヌタ骨→アブミ骨の順で振動を伝える。","前庭神経と蝸牛神経は合流して第VIII脳神経を構成する。"]},{"id":"60B56","source":"第60回・午後56（出題内容をもとに再構成）","source_session":"午後","source_no":56,"subject":"解剖学","domain":"筋系","topic":"上肢の筋","concept":"第1背側腱区画","secondary":["長母指外転筋","短母指伸筋","解剖学的嗅ぎタバコ入れ"],"question":"右手を母指橈側外転させた模式図を示す。橈側手関節部で並走して目立つ2本の腱はどれか。2つ選べ。","options":[{"id":"o1","text":"短母指外転筋"},{"id":"o2","text":"短母指伸筋"},{"id":"o3","text":"長橈側手根伸筋"},{"id":"o4","text":"長母指外転筋"},{"id":"o5","text":"長母指伸筋"}],"answers":["o2","o4"],"why":"正答は短母指伸筋と長母指外転筋です。この2腱は手関節背側の第1伸筋腱区画を一緒に通過し、母指を橈側へ開いたとき橈骨茎状突起付近で目立ちます。長母指伸筋は第3区画を通り、解剖学的嗅ぎタバコ入れの尺側境界を形成するので位置が異なります。","option_explanations":{"o1":"短母指外転筋は母指球の筋で、図の橈側手関節部を長い腱として走行する筋ではない。","o2":"正しい。短母指伸筋は長母指外転筋とともに第1背側腱区画を通る。","o3":"長橈側手根伸筋は第2背側腱区画を通り、より尺側寄りに位置する。","o4":"正しい。長母指外転筋は短母指伸筋と並走して第1背側腱区画を通る。","o5":"長母指伸筋は第3背側腱区画を通り、リスター結節（Lister tubercle）を回り込んで走る。"},"related":"ドゥ・ケルバン腱鞘炎は、第1背側腱区画を通る長母指外転筋（abductor pollicis longus：APL）と短母指伸筋（extensor pollicis brevis：EPB）の腱鞘障害です。アイヒホッフテスト（Eichhoff test）は、母指を手掌内に入れて握り込み、手関節を尺屈して橈骨茎状突起周囲の疼痛を誘発します。フィンケルシュタインテスト（Finkelstein test）は別の手技で、両者はしばしば混同されます。解剖学的嗅ぎタバコ入れの橈側境界は長母指外転筋と短母指伸筋、尺側境界は長母指伸筋（extensor pollicis longus：EPL）です。","tip":"第1背側腱区画＝長母指外転筋（APL）＋短母指伸筋（EPB）。長母指伸筋（EPL）は第3背側腱区画。","glossary":[{"term":"解剖学的嗅ぎタバコ入れ","desc":"母指を伸ばしたとき手背橈側にできる陥凹。橈側境界は長母指外転筋（APL）・短母指伸筋（EPB）、尺側境界は長母指伸筋（EPL）。"},{"term":"ドゥ・ケルバン腱鞘炎","desc":"第1背側腱区画の長母指外転筋（APL）と短母指伸筋（EPB）に生じる腱鞘障害。"},{"term":"アイヒホッフテスト","desc":"母指を手掌内に入れて握り込み、手関節を尺屈して橈側手関節痛を誘発する検査。ドゥ・ケルバン腱鞘炎で用いられる。"},{"term":"フィンケルシュタインテスト","desc":"ドゥ・ケルバン腱鞘炎の誘発検査。アイヒホッフテストとは手技が異なるため、混同しない。"},{"term":"リスター結節（Lister tubercle）","desc":"橈骨背側の骨性隆起。長母指伸筋（EPL）の腱がここを回り込む。"}],"official_answers":[2,4],"problemImage":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABGwAAANhCAIAAAA9q7pbAAEAAElEQVR42uz9d3Akd5bnCbp2D611QGsgtdaSTGpWkSwturpnune3Z3fEH2d2drY2dn1ne3Zre3/s3ojrme3u6a7qqmJRJ0WSTKZOMrUAUkJrILSOcK3uD48IRAqSSTIzmUm+D0kw4AAC7j/3CLyvv/e+D9V1HUGQ+WSxKeBAAAAAAAAAAAAAgC8EgyUAAAAAAAAAAAAAEQUAAAAAAAAAAAAiCgAAAAAAAAAAAEQUAAAAAAAAAAAAiCgAAAAAAAAAAAAQUQAAAAAAAAAAACCiYAkAAAAAAAAAAABARAEAAAAAAAAAAICIAgAAAAAAAAAAABEFAAAAAAAAAAAAIgoAAAAAAAAAAABEFAAAAAAAAAAAAIgoWAIAAAAAAAAAAAAQUQAAAAAAAAAAACCiAAAAAAAAAAAAQEQBAAAAAAAAAACAiAIAAAAAAAAAAAARBQAAAAAAAAAAACIKlgAAAAAAAAAAAABEFAAAAAAAAAAAAIgoAAAAAAAAAAAAEFEAAAAAAAAAAAAgogAAAAAAAAAAAEBEAQAAAAAAAAAAgIiCJQAAAAAAAAAAAAARBQAAAAAAAAAAACIKAAAAAAAAAAAARBQAAAAAAAAAAACIKAAAAAAAAAAAABBRAAAAAAAAAAAAIKJgCQAAAAAAAAAAAEBEAQAAAAAAAAAAgIgCAAAAAAAAAAAAEQUAAAAAAAAAAAAiCgAAAAAAAAAAAEQUAAAAAAAAAAAAiChYAgAAAAAAAAAAABBRAAAAAAAAAAAAIKIAAAAAAAAAAABARAEAAAAAAAAAAICIAgAAAAAAAAAAABEFAAAAAAAAAAAAIgqWAAAAAAAAAAAAAEQUAAAAAAAAAAAAiCgAAAAAAAAAAIBvGwKWAACA7wO6rmuapqoqousohiI6IssyiqEEQRIEgaIoLBEAAAAAACCiAAAAqmiaxnHc7OzM+MgIz7E2h1PXkUMHP7Y77HueeHLN2nUOhwN0FAAAAAAAIKIAAAAQBEGKxeKFc2ePHz1y/cpQNpNVFZmiaBTD8rkshmGXz5/fuHnL3n37Vq5eY7VaQUoBAAAAAAAiCgCA7y+6rs/Nzr63/53PThyfmZwolUqKLCMIYiglTdMQBOE5LpfN3Lx2dfnq1dt37Fqzfj1IKQAAAAAAvhhU13UEQeaTxaaAA5YDAO5L4C6KYj6fl0RB0zRER1AUJSnKYrHYHQ4MAzeXh3cW5mdnX/vj708eO7a4MC8Kwu1vfyiKYpiu6bqukxTpcrk7urrXbtiwbefOvr5+s8UCUgoAAAAAgLsCmSgAuA9IkpRJp+fnZjPptKZpxWJxfm6OLZdVVdERBEMxxmTy+nzNLS0trW2RaNTucBAEvPoeFALPLy4sDF6+NHT50rFDn2TSaVVV68KJpCiX2xNtbvZ4PBRNJ+OJ2ZnpXDaTSiZy2ez05MTk+NjuJ55ct2FDMBSmKArWEwAAAAAAEFHA7RjZSLjp/vWQZTmfy01MjA9dunR KAAAAAAAAAAAAAABAogAAAAAAAAAAAAAASBQAAAAAAAAAAAAAAIkCAAAAAAAAAAAAACBRAAAAAAAAAAAAAAAkCgAAAAAAAAAAAACARAEAAAAAAAAAAAAAAEgUAAAAAAAAAAAAAACJAgAAAAAAAAAAAAAgUQAAAAAAAAAAAAAAJAoAAAAAAAAAAAAAvk74/wPazcOyY0YmaAAAAABJRU5ErkJggg==","problemImageCaption":"厚生労働省 第60回 午後56 公式問題図","officialFigureUrl":"https://www.mhlw.go.jp/seisakunitsuite/bunya/kenkou_iryou/iryou/topics/dl/tp250428-08b_01.pdf#page=34","exam_links":["ドゥ・ケルバン腱鞘炎では第1背側腱区画の長母指外転筋（APL）・短母指伸筋（EPB）が対象。","アイヒホッフテストとフィンケルシュタインテストは別手技。名称を混同しない。","解剖学的嗅ぎタバコ入れの底には舟状骨・大菱形骨が位置し、橈骨動脈が通る。"],"round":60},{"id":"60B57","source":"第60回・午後57（出題内容をもとに学習用再構成）","source_session":"午後","source_no":57,"subject":"解剖学","domain":"筋系","topic":"筋の構造","concept":"起始・停止","secondary":["起始・停止","小円筋","大結節","回旋筋腱板"],"question":"筋と停止部の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"棘上筋 ― 上腕骨小結節"},{"id":"o2","text":"小円筋 ― 上腕骨大結節"},{"id":"o3","text":"肩甲下筋 ― 上腕骨大結節"},{"id":"o4","text":"上腕二頭筋 ― 尺骨粗面"},{"id":"o5","text":"上腕三頭筋 ― 橈骨粗面"}],"answers":["o2"],"why":"正答は『小円筋―上腕骨大結節』です。小円筋は回旋筋腱板を構成し、上腕骨大結節の下部に停止します。","option_explanations":{"o1":"棘上筋は上腕骨大結節に停止する。","o2":"正しい。小円筋は大結節に停止する。","o3":"肩甲下筋は上腕骨小結節に停止する。","o4":"上腕二頭筋は橈骨粗面に停止する。","o5":"上腕三頭筋は尺骨肘頭に停止する。"},"related":"肩関節周囲では回旋筋腱板4筋の起始・停止・作用・支配神経をまとめて覚えると効率的です。","tip":"回旋筋腱板：棘上・棘下・小円＝大結節、肩甲下＝小結節。","glossary":[{"term":"回旋筋腱板","desc":"棘上筋・棘下筋・小円筋・肩甲下筋からなる腱性構造。肩関節安定化に重要。"},{"term":"大結節","desc":"上腕骨近位外側の隆起。棘上筋・棘下筋・小円筋が停止する。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["棘上筋＝外転初期、棘下筋・小円筋＝外旋、肩甲下筋＝内旋。","腋窩神経障害では小円筋と三角筋の機能低下を考える。"],"round":60},{"id":"60B58","source":"第60回・午後58（出題内容をもとに学習用再構成）","source_session":"午後","source_no":58,"subject":"解剖学","domain":"神経系","topic":"伝導路","concept":"錐体路","secondary":["皮質脊髄路","内包","大脳脚","錐体交叉"],"question":"皮質脊髄路の走行に含まれる構造はどれか。","options":[{"id":"o1","text":"視床下部"},{"id":"o2","text":"脳弓"},{"id":"o3","text":"大脳脚"},{"id":"o4","text":"海馬"},{"id":"o5","text":"松果体"}],"answers":["o3"],"why":"正答は大脳脚です。皮質脊髄路は大脳皮質から内包を通り、中脳の大脳脚、橋、延髄錐体へ下降し、多くの線維が錐体交叉で反対側へ移ります。","option_explanations":{"o1":"視床下部は自律・内分泌調節などに重要だが皮質脊髄路の主要走行部ではない。","o2":"脳弓は海馬系の線維束で辺縁系に関与する。","o3":"正しい。皮質脊髄路は中脳の大脳脚を通る。","o4":"海馬は記憶に重要な灰白質構造。","o5":"松果体はメラトニン分泌に関与する。"},"related":"皮質脊髄路は『運動野→放線冠→内包後脚→大脳脚→橋→延髄錐体→錐体交叉→脊髄』の順で押さえます。","tip":"錐体路は内包と大脳脚を必ず通る。","glossary":[{"term":"皮質脊髄路","desc":"随意運動に重要な下行性運動路。"},{"term":"錐体交叉","desc":"延髄下部で皮質脊髄路線維の多くが反対側へ交叉する部位。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["内包病変は狭い部位でも広範な運動麻痺を生じうる。","上位運動ニューロン徴候と皮質脊髄路を関連づける。"],"round":60},{"id":"60B59","round":60,"source":"第60回・午後59（出題内容をもとに学習用再構成）","source_session":"午後","source_no":59,"subject":"解剖学","domain":"脈管系","topic":"血管","concept":"脳血管","secondary":["内頸動脈","眼動脈","外頸動脈","脳循環"],"question":"内頸動脈から直接分枝する血管はどれか。","options":[{"id":"o1","text":"顎動脈"},{"id":"o2","text":"眼動脈"},{"id":"o3","text":"舌動脈"},{"id":"o4","text":"顔面動脈"},{"id":"o5","text":"椎骨動脈"}],"answers":["o2"],"why":"正答は眼動脈です。眼動脈は内頸動脈の主要な分枝の一つで、眼窩内へ入り眼球や眼窩内組織などを灌流します。顎動脈・舌動脈・顔面動脈は外頸動脈系です。","option_explanations":{"o1":"顎動脈は外頸動脈の終枝の一つ。","o2":"正しい。眼動脈は内頸動脈から分枝する。","o3":"舌動脈は外頸動脈から分枝する。","o4":"顔面動脈は外頸動脈から分枝する。","o5":"椎骨動脈は鎖骨下動脈から分枝し、左右が合流して脳底動脈を形成する。"},"related":"頭頸部の動脈は『内頸動脈＝頭蓋内・眼窩中心』『外頸動脈＝顔面・頭皮など』を大枠として整理します。脳循環では内頸動脈系と椎骨脳底動脈系を区別します。","tip":"眼動脈＝内頸動脈。顔面・舌・顎＝外頸動脈系。","glossary":[{"term":"眼動脈","desc":"内頸動脈から分枝し、眼球や眼窩内組織などを灌流する動脈。"},{"term":"椎骨動脈","desc":"鎖骨下動脈から分枝し、左右が合流して脳底動脈になる。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["内頸動脈は頭蓋内で前大脳動脈・中大脳動脈などにつながる。","外頸動脈の終枝は浅側頭動脈と顎動脈。"]},{"id":"60B60","round":60,"source":"第60回・午後60（出題内容をもとに学習用再構成）","source_session":"午後","source_no":60,"subject":"解剖学","domain":"脈管系","topic":"血管","concept":"門脈系","secondary":["門脈","脾静脈","上腸間膜静脈","肝循環"],"question":"消化管や脾臓から肝臓へ血液を送る門脈系に直接流入する血管はどれか。","options":[{"id":"o1","text":"肝静脈"},{"id":"o2","text":"奇静脈"},{"id":"o3","text":"腎静脈"},{"id":"o4","text":"脾静脈"},{"id":"o5","text":"総腸骨静脈"}],"answers":["o4"],"why":"正答は脾静脈です。門脈は主に上腸間膜静脈と脾静脈の合流によって形成され、消化管や脾臓などからの血液を肝臓へ運びます。肝静脈は逆に肝臓から下大静脈へ血液を戻します。","option_explanations":{"o1":"肝静脈は肝臓から下大静脈へ流出する血管で、門脈へ流入する血管ではない。","o2":"奇静脈は胸壁などの静脈血を集め、上大静脈へ流入する。","o3":"腎静脈は下大静脈へ流入する。","o4":"正しい。脾静脈は門脈形成に関与する主要血管。","o5":"総腸骨静脈は左右が合流して下大静脈を形成する。"},"related":"門脈系は『消化管・脾臓など→門脈→肝類洞→肝静脈→下大静脈』の流れで理解します。門脈圧亢進では食道静脈瘤などの側副血行路が重要です。","tip":"門脈形成の主役＝上腸間膜静脈＋脾静脈。","glossary":[{"term":"門脈","desc":"消化管や脾臓などからの静脈血を肝臓へ運ぶ静脈系。"},{"term":"脾静脈","desc":"脾臓などから血液を集め、上腸間膜静脈と合流して門脈形成に関与する。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":["肝静脈は門脈とは逆方向で、肝臓から下大静脈へ流出する。","門脈圧亢進では食道静脈瘤・腹壁静脈怒張・直腸静脈叢などが関連する。"]},{"id":"60B61","round":60,"source":"第60回・午後61（出題内容をもとに学習用再構成）","source_session":"午後","source_no":61,"subject":"解剖学","domain":"組織","topic":"細胞・組織","concept":"筋組織","secondary":["心筋","介在板","ギャップ結合","横紋筋"],"question":"心筋細胞同士の電気的興奮を伝えやすくする細胞間構造はどれか。","options":[{"id":"o1","text":"基底膜のみ"},{"id":"o2","text":"髄鞘"},{"id":"o3","text":"ギャップ結合"},{"id":"o4","text":"シナプス小胞"},{"id":"o5","text":"運動終板"}],"answers":["o3"],"why":"正答はギャップ結合です。心筋細胞は介在板で互いに連結され、その中のギャップ結合を介してイオン電流が細胞間を伝わります。このため心筋は機能的に協調して興奮・収縮できます。","option_explanations":{"o1":"基底膜だけでは心筋細胞間の迅速な電気的連絡を担えない。","o2":"髄鞘は神経軸索の周囲に形成され、活動電位伝導を高速化する構造。","o3":"正しい。ギャップ結合は隣接する心筋細胞間でイオンなどを通し、電気的連結を担う。","o4":"シナプス小胞は神経終末などで神経伝達物質を貯蔵する。","o5":"運動終板は骨格筋に対する運動神経終末の特殊化した神経筋接合部。"},"related":"心筋は横紋をもつ不随意筋です。介在板にはギャップ結合のほか、機械的結合を強める接着構造があり、電気的・力学的に細胞同士を連結します。","tip":"心筋の電気的連結＝介在板のギャップ結合。","glossary":[{"term":"介在板","desc":"心筋細胞同士の境界にある特殊な接合部。電気的・機械的結合に重要。"},{"term":"ギャップ結合","desc":"隣接細胞間をチャネルで連結し、イオンなどを通過させる細胞間結合。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["心筋は横紋筋だが随意筋ではない。","心筋の興奮は自動能をもつ刺激伝導系から始まり、自律神経は心拍数・伝導などを調節する。"]},{"id":"60B62","source":"第60回・午後62（出題内容をもとに学習用再構成）","source_session":"午後","source_no":62,"subject":"生理学","domain":"神経","topic":"反射","concept":"伸張反射","secondary":["筋紡錘","Ia群線維","II群線維","Ib群線維"],"question":"筋紡錘からの求心性線維を2つ選べ。","options":[{"id":"o1","text":"Ia群線維"},{"id":"o2","text":"Ib群線維"},{"id":"o3","text":"II群線維"},{"id":"o4","text":"III群線維"},{"id":"o5","text":"IV群線維"}],"answers":["o1","o3"],"why":"正答はIa群線維とII群線維です。筋紡錘は筋の長さや伸張速度を感知し、Ia群・II群求心性線維を介して中枢へ情報を送ります。","option_explanations":{"o1":"正しい。Ia群線維は筋紡錘一次終末からの求心性線維。","o2":"Ib群線維は主に腱器官からの求心性線維。","o3":"正しい。II群線維は筋紡錘二次終末からの求心性線維。","o4":"III群線維は筋紡錘の主要求心性線維ではない。","o5":"IV群線維は無髄の細い線維で、筋紡錘の主要求心性線維ではない。"},"related":"伸張反射では筋紡錘→Ia群線維→α運動ニューロンという基本回路を押さえます。ゴルジ腱器官（Golgi tendon organ）はIb群線維と対応します。","tip":"筋紡錘＝Ia・II、ゴルジ腱器官（Golgi tendon organ）＝Ib。","glossary":[{"term":"筋紡錘","desc":"筋長とその変化を検出する固有受容器。"},{"term":"ゴルジ腱器官（Golgi tendon organ）","desc":"筋腱移行部にあり、筋張力を検出する受容器。"}],"official_answers":[1,3],"problemImage":null,"problemImageCaption":null,"exam_links":["腱反射は筋紡錘を利用した伸張反射。","相反性抑制では拮抗筋の活動低下が起こる。"],"round":60},{"id":"60B63","round":60,"source":"第60回・午後63（出題内容をもとに学習用再構成）","source_session":"午後","source_no":63,"subject":"生理学","domain":"体温調節","topic":"体温","concept":"体温調節","secondary":["熱放散","呼気","発汗","皮膚血流"],"question":"人体の熱放散に関する記述として正しいのはどれか。","options":[{"id":"o1","text":"呼気からも熱は放散される"},{"id":"o2","text":"ふるえは熱放散を増やす反応である"},{"id":"o3","text":"皮膚血管収縮は皮膚からの熱放散を増やす"},{"id":"o4","text":"発汗の蒸発は熱産生を増やすために起こる"},{"id":"o5","text":"褐色脂肪組織の活動は熱放散を目的とする"}],"answers":["o1"],"why":"正答は『呼気からも熱は放散される』です。身体の熱は皮膚からの放射・伝導・対流・蒸発に加え、呼気に含まれる水分や温められた空気を介しても失われます。","option_explanations":{"o1":"正しい。呼吸器からは温められた空気と水分の蒸発に伴って熱が失われる。","o2":"ふるえは骨格筋の不随意収縮によって熱産生を増やす反応。","o3":"皮膚血管収縮は皮膚血流を減らし、熱放散を抑える。","o4":"発汗は汗の蒸発によって熱を奪い、熱放散を増やす。","o5":"褐色脂肪組織は非ふるえ熱産生に関与する。"},"related":"暑熱時は皮膚血管拡張と発汗により熱放散を増やし、寒冷時は皮膚血管収縮・ふるえ・代謝亢進などで体温低下を防ぎます。中枢では視床下部が重要です。","tip":"暑い→血管拡張・発汗。寒い→血管収縮・ふるえ。","glossary":[{"term":"蒸発","desc":"液体の水分が気化する際に熱を奪う現象。発汗による熱放散の主要機序。"},{"term":"ふるえ熱産生","desc":"骨格筋の不随意収縮によって熱産生を増やす寒冷防御反応。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["体温調節中枢は視床下部にある。","高温多湿では汗が蒸発しにくくなり、熱放散効率が低下する。"]},{"id":"60B64","round":60,"source":"第60回・午後64（出題内容をもとに学習用再構成）","source_session":"午後","source_no":64,"subject":"生理学","domain":"内分泌・栄養・代謝","topic":"代謝","concept":"糖代謝","secondary":["嫌気性解糖","乳酸","ピルビン酸","ATP"],"question":"酸素供給が不十分な状況で進む嫌気性解糖について正しいのはどれか。","options":[{"id":"o1","text":"TCA回路が直接ATPを大量産生する"},{"id":"o2","text":"反応の中心はミトコンドリア内膜である"},{"id":"o3","text":"クレアチンリン酸系そのものを指す"},{"id":"o4","text":"ピルビン酸から乳酸が生成される"},{"id":"o5","text":"グルコース1分子あたりの正味ATP産生は30分子以上である"}],"answers":["o4"],"why":"正答は『ピルビン酸から乳酸が生成される』です。嫌気的条件では解糖系で生じたピルビン酸が乳酸へ還元され、この反応でNAD⁺が再生されるため解糖を継続できます。解糖系は細胞質で進み、グルコース1分子あたりの正味ATP産生は2分子です。","option_explanations":{"o1":"TCA回路はミトコンドリア内で進む好気的代謝の一部で、嫌気性解糖そのものではない。","o2":"解糖系は細胞質で行われる。ミトコンドリア内膜は電子伝達系・酸化的リン酸化の場。","o3":"クレアチンリン酸系は解糖系とは別の短時間高出力のエネルギー供給系。","o4":"正しい。嫌気的条件ではピルビン酸が乳酸へ還元される。","o5":"嫌気性解糖で得られるATPはグルコース1分子あたり正味2分子。"},"related":"短時間高強度運動ではATP-PCr系と解糖系の寄与が大きくなり、運動時間が長くなるほど酸化系の比重が高まります。ただし実際には各エネルギー供給系が完全に切り替わるわけではなく同時に働きます。","tip":"解糖＝細胞質、正味2 ATP、嫌気的なら乳酸へ。","glossary":[{"term":"解糖系","desc":"細胞質でグルコースをピルビン酸まで分解しATPを得る代謝経路。"},{"term":"乳酸","desc":"嫌気的条件などでピルビン酸から生成される代謝産物。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":["ATP-PCr系は最も迅速だが貯蔵量が少ない。","乳酸は単なる老廃物ではなく、他組織でエネルギー基質として再利用されうる。"]},{"id":"60B65","round":60,"source":"第60回・午後65（出題内容をもとに学習用再構成）","source_session":"午後","source_no":65,"subject":"生理学","domain":"自律神経","topic":"自律神経機能","concept":"副交感神経","secondary":["副交感神経","涙腺","唾液腺","アセチルコリン"],"question":"副交感神経活動によって分泌が促進されるものを2つ選べ。","options":[{"id":"o1","text":"汗腺からの発汗"},{"id":"o2","text":"涙腺からの涙液"},{"id":"o3","text":"舌下腺からの唾液"},{"id":"o4","text":"腎傍糸球体細胞からのレニン"},{"id":"o5","text":"交感神経終末からのノルアドレナリン"}],"answers":["o2","o3"],"why":"正答は涙液と舌下腺からの唾液です。副交感神経は『休息と消化』に関連し、涙腺や唾液腺などの分泌を促進します。汗腺は例外的に交感神経のコリン作動性線維によって支配されます。","option_explanations":{"o1":"汗腺は主に交感神経支配で、節後線維末端ではアセチルコリンが使われる。","o2":"正しい。涙腺分泌は副交感神経活動で促進される。","o3":"正しい。舌下腺などの唾液腺分泌は副交感神経で促進される。","o4":"レニン分泌は交感神経β1受容体刺激などで促進される。","o5":"ノルアドレナリンは多くの交感神経節後線維末端から放出される。"},"related":"自律神経は『交感＝活動・循環動員』『副交感＝休息・消化・分泌』を大枠にしつつ、汗腺の交感神経コリン作動性支配のような例外を押さえると整理しやすいです。","tip":"涙・唾液＝副交感。汗腺＝交感だけどACh。","glossary":[{"term":"コリン作動性","desc":"神経伝達物質としてアセチルコリンを用いること。"},{"term":"レニン","desc":"腎臓の傍糸球体細胞から分泌され、レニン・アンジオテンシン・アルドステロン系を開始する酵素。"}],"official_answers":[2,3],"problemImage":null,"problemImageCaption":null,"exam_links":["副交感神経節後線維の主要伝達物質はアセチルコリン。","交感神経節後線維は原則ノルアドレナリンだが、汗腺ではアセチルコリン。"]},{"id":"60B66","round":60,"source":"第60回・午後66（出題内容をもとに学習用再構成）","source_session":"午後","source_no":66,"subject":"生理学","domain":"呼吸","topic":"呼吸調節","concept":"酸塩基平衡","secondary":["代謝性アルカローシス","嘔吐","呼吸性アシドーシス","重炭酸"],"question":"酸塩基平衡でアルカローシスを生じやすい病態はどれか。","options":[{"id":"o1","text":"持続する嘔吐"},{"id":"o2","text":"飢餓によるケトン体増加"},{"id":"o3","text":"高度の下痢"},{"id":"o4","text":"換気不全を伴う重症喘息"},{"id":"o5","text":"CO₂ナルコーシス"}],"answers":["o1"],"why":"正答は持続する嘔吐です。胃液には塩酸が含まれるため、嘔吐でH⁺とCl⁻を失うと代謝性アルカローシスを生じやすくなります。これに対し下痢では重炭酸喪失、ケトーシスでは有機酸増加により代謝性アシドーシス方向へ傾きます。","option_explanations":{"o1":"正しい。胃酸喪失により代謝性アルカローシスを生じやすい。","o2":"飢餓ではケトン体が増加し、代謝性アシドーシスの原因になりうる。","o3":"下痢では腸液中のHCO₃⁻喪失により代謝性アシドーシスを生じやすい。","o4":"重症化して換気不全・CO₂貯留が生じると呼吸性アシドーシス方向となる。","o5":"CO₂ナルコーシスは高二酸化炭素血症を伴い、呼吸性アシドーシスに関連する。"},"related":"酸塩基平衡ではまず『呼吸性＝PaCO₂』『代謝性＝HCO₃⁻』を軸に整理します。嘔吐＝酸を失う、下痢＝重炭酸を失う、という対比は頻出です。","tip":"嘔吐＝H⁺を失う→アルカローシス。下痢＝HCO₃⁻を失う→アシドーシス。","glossary":[{"term":"代謝性アルカローシス","desc":"主にH⁺喪失やHCO₃⁻増加によって血液pHがアルカリ側へ傾く状態。"},{"term":"CO₂ナルコーシス","desc":"高度の高二酸化炭素血症により意識障害などを呈する状態。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["過換気ではPaCO₂低下により呼吸性アルカローシスを生じる。","低換気ではPaCO₂上昇により呼吸性アシドーシスを生じる。"]},{"id":"60B67","round":60,"source":"第60回・午後67（出題内容をもとに学習用再構成）","source_session":"午後","source_no":67,"subject":"生理学","domain":"血液・免疫","topic":"凝固・免疫","concept":"獲得免疫","secondary":["体液性免疫","B細胞","抗体","形質細胞"],"question":"抗体産生を中心とする体液性免疫で主要な役割を担う細胞はどれか。","options":[{"id":"o1","text":"単球"},{"id":"o2","text":"B細胞"},{"id":"o3","text":"好中球"},{"id":"o4","text":"NK細胞"},{"id":"o5","text":"マクロファージ"}],"answers":["o2"],"why":"正答はB細胞です。B細胞は抗原刺激を受けると形質細胞へ分化し、抗体を産生します。この抗体による防御が体液性免疫の中心です。","option_explanations":{"o1":"単球は血中を循環する貪食系細胞で、組織内ではマクロファージへ分化する。","o2":"正しい。B細胞は形質細胞へ分化し抗体を産生する。","o3":"好中球は自然免疫で細菌などの貪食に重要。","o4":"NK細胞は自然免疫でウイルス感染細胞や腫瘍細胞などの排除に関与する。","o5":"マクロファージは貪食や抗原提示などに関与するが、抗体産生の主体ではない。"},"related":"獲得免疫は大きく体液性免疫と細胞性免疫に分けます。体液性＝B細胞・抗体、細胞性＝T細胞、という基本対応を押さえます。","tip":"B細胞→形質細胞→抗体＝体液性免疫。","glossary":[{"term":"体液性免疫","desc":"抗体を介して病原体や毒素などに対処する獲得免疫。"},{"term":"形質細胞","desc":"B細胞から分化し、多量の抗体を分泌する細胞。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["ヘルパーT細胞はB細胞の活性化にも関与する。","NK細胞は獲得免疫のT細胞とは異なり、自然免疫に分類される。"]},{"id":"60B68","round":60,"source":"第60回・午後68（出題内容をもとに学習用再構成）","source_session":"午後","source_no":68,"subject":"生理学","domain":"排便","topic":"排便機構","concept":"排便反射","secondary":["排便中枢","仙髄","S2-S4","骨盤内臓神経"],"question":"排便反射の調節に重要な仙髄中枢が存在する髄節はどれか。","options":[{"id":"o1","text":"T1〜T3"},{"id":"o2","text":"T5〜T7"},{"id":"o3","text":"T10〜T12"},{"id":"o4","text":"L3〜L5"},{"id":"o5","text":"S2〜S4"}],"answers":["o5"],"why":"正答はS2〜S4です。直腸壁が伸展すると求心性刺激が仙髄へ伝わり、S2〜S4由来の副交感神経である骨盤内臓神経を介して直腸収縮や内肛門括約筋弛緩などの排便反射が促進されます。","option_explanations":{"o1":"T1〜T3は排便反射の主要な仙髄中枢ではない。","o2":"T5〜T7も排便中枢の髄節ではない。","o3":"T10〜T12は仙髄性排便反射の中枢ではない。","o4":"L3〜L5ではなく、主要な副交感性排便中枢は仙髄にある。","o5":"正しい。S2〜S4は骨盤内臓神経の起始と関連し、排便・排尿・性機能で重要。"},"related":"骨盤内臓神経はS2〜S4由来の副交感神経で、排便だけでなく排尿にも重要です。外肛門括約筋は陰部神経による体性支配を受け、随意的な調節に関与します。","tip":"骨盤内臓神経＝S2〜S4＝排便・排尿。","glossary":[{"term":"骨盤内臓神経","desc":"S2〜S4から出る副交感神経線維を含み、骨盤内臓の機能調節に関与する。"},{"term":"排便反射","desc":"直腸伸展を契機に直腸収縮や肛門括約筋の調節を起こす反射。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["排尿の副交感神経もS2〜S4由来。","外肛門括約筋は陰部神経支配で随意調節される。"]},{"id":"60B69","source":"第60回・午後69（出題内容をもとに再構成）","source_session":"午後","source_no":69,"subject":"運動学","domain":"四肢・体幹の運動","topic":"肩甲帯・肩","concept":"肩甲骨運動","secondary":["僧帽筋下部","上方回旋","前鋸筋"],"question":"肩甲骨に作用する筋と運動の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"僧帽筋上部線維 ― 外転"},{"id":"o2","text":"僧帽筋下部線維 ― 上方回旋"},{"id":"o3","text":"菱形筋 ― 下制"},{"id":"o4","text":"前鋸筋 ― 下方回旋"},{"id":"o5","text":"小胸筋 ― 挙上"}],"answers":["o2"],"why":"正答は『僧帽筋下部線維―上方回旋』です。肩甲骨の上方回旋では僧帽筋上部・下部線維と前鋸筋が協調し、フォースカップルを形成します。上肢挙上時に肩甲骨関節窩を上向きに回すため重要です。","option_explanations":{"o1":"僧帽筋上部線維は主に肩甲骨挙上と上方回旋に寄与する。肩甲骨外転（前方突出）の主働筋は前鋸筋。","o2":"正しい。僧帽筋下部線維は肩甲骨下制に加え、前鋸筋・僧帽筋上部と協働して上方回旋に寄与する。","o3":"菱形筋は主に肩甲骨内転（後退）・下方回旋に作用し、下制が主作用ではない。","o4":"前鋸筋は肩甲骨外転と上方回旋に作用する。","o5":"小胸筋は肩甲骨を前傾・下制・下方回旋方向へ作用させ、挙上が主作用ではない。"},"related":"肩甲骨上方回旋は上肢挙上の重要要素で、僧帽筋上部・下部＋前鋸筋の協調が基本です。肩甲上腕リズムとセットで理解します。","tip":"上方回旋の3者＝僧帽筋上部・僧帽筋下部・前鋸筋。","glossary":[{"term":"フォースカップル","desc":"複数の筋が別方向に力を出しながら協調し、1つの回旋運動を生み出す仕組み。"},{"term":"上方回旋","desc":"肩甲骨の下角が外上方へ動き、関節窩が上向きになる運動。"},{"term":"前鋸筋","desc":"肩甲骨外転と上方回旋に重要な筋。翼状肩甲の関連筋としても有名。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["前鋸筋は長胸神経支配。長胸神経障害では翼状肩甲がみられる。","上肢挙上では肩甲上腕リズムと肩甲骨上方回旋を関連づけて覚える。"],"round":60},{"id":"60B70","source":"第60回・午後70（出題内容をもとに学習用再構成）","source_session":"午後","source_no":70,"subject":"運動学","domain":"四肢・体幹の運動","topic":"膝関節","concept":"膝屈曲伸展","secondary":["膝関節","スクリューホーム運動","前十字靱帯","関節包内運動"],"question":"膝関節の運動学について正しいのはどれか。","options":[{"id":"o1","text":"膝関節伸展終末では脛骨は大腿骨に対して内旋する"},{"id":"o2","text":"前十字靱帯は脛骨の後方移動を主に制動する"},{"id":"o3","text":"開放運動連鎖の膝伸展では脛骨は後方へ滑る"},{"id":"o4","text":"膝蓋骨は膝伸展で遠位方向へ移動する"},{"id":"o5","text":"開放運動連鎖の膝伸展終末では脛骨外旋が起こる"}],"answers":["o5"],"why":"正答は『開放運動連鎖の膝伸展終末では脛骨外旋が起こる』です。これはスクリューホーム運動の一部で、終末伸展で膝を安定させます。","option_explanations":{"o1":"開放運動連鎖では終末伸展で脛骨外旋が起こる。","o2":"前十字靱帯は脛骨の前方移動などを制動する。","o3":"開放運動連鎖の伸展では関節面形状に従い脛骨は前方へ滑る。","o4":"膝蓋骨は膝伸展で近位方向へ移動する。","o5":"正しい。終末伸展で脛骨外旋が起こる。"},"related":"スクリューホーム運動は開放運動連鎖では脛骨外旋、閉鎖運動連鎖では大腿骨内旋として表現されます。膝の靱帯機能と合わせて理解します。","tip":"膝伸展ロック：開放連鎖＝脛骨外旋。","glossary":[{"term":"スクリューホーム運動","desc":"膝関節終末伸展で起こる回旋運動。膝の安定化に関与する。"},{"term":"前十字靱帯","desc":"脛骨の前方移動や過伸展などを制動する重要な靱帯。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":["前十字靱帯損傷では前方引き出しテストやラックマンテスト（Lachman test）が関連する。","膝蓋大腿関節の動きも膝屈伸と関連づける。"],"round":60},{"id":"60B71","source":"第60回・午後71（出題内容をもとに学習用再構成）","source_session":"午後","source_no":71,"subject":"運動学","domain":"四肢・体幹の運動","topic":"体幹","concept":"脊柱運動","secondary":["脊柱","前縦靱帯","後縦靱帯","伸展制動"],"question":"脊柱伸展を主に制限する靱帯はどれか。","options":[{"id":"o1","text":"黄色靱帯"},{"id":"o2","text":"棘上靱帯"},{"id":"o3","text":"前縦靱帯"},{"id":"o4","text":"棘間靱帯"},{"id":"o5","text":"後縦靱帯"}],"answers":["o3"],"why":"正答は前縦靱帯です。前縦靱帯は椎体前面を縦走し、脊柱の過伸展を制限します。","option_explanations":{"o1":"黄色靱帯は椎弓間を連結し、主に屈曲時に伸張される。","o2":"棘上靱帯は棘突起先端を連結し、屈曲制限に関与する。","o3":"正しい。前縦靱帯は脊柱伸展を制限する。","o4":"棘間靱帯は棘突起間にあり、屈曲で緊張する。","o5":"後縦靱帯は椎体後面を走り、屈曲制限に関与する。"},"related":"脊柱靱帯は『前縦＝伸展を止める』『後縦・棘間・棘上・黄色＝屈曲で伸張』という方向性で整理すると覚えやすいです。","tip":"前縦靱帯だけ前面にあり、伸展で張る。","glossary":[{"term":"前縦靱帯","desc":"椎体前面を縦走し、脊柱過伸展を制限する靱帯。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["頸椎・腰椎の前弯、胸椎の後弯と脊柱運動を関連づける。","椎間板と靱帯の役割を区別する。"],"round":60},{"id":"60B72","source":"第60回・午後72（出題内容をもとに学習用再構成）","source_session":"午後","source_no":72,"subject":"運動学","domain":"四肢・体幹の運動","topic":"呼吸運動","concept":"胸郭運動","secondary":["努力性呼気","腹筋群","内肋間筋","横隔膜"],"question":"努力性呼気で働く筋として最も適切なのはどれか。","options":[{"id":"o1","text":"横隔膜"},{"id":"o2","text":"外肋間筋"},{"id":"o3","text":"腹筋群"},{"id":"o4","text":"胸鎖乳突筋"},{"id":"o5","text":"前斜角筋"}],"answers":["o3"],"why":"正答は腹筋群です。安静呼気は主に肺・胸郭の弾性収縮で起こりますが、努力性呼気では腹筋群や内肋間筋などが能動的に働きます。","option_explanations":{"o1":"横隔膜は主要な吸気筋。","o2":"外肋間筋は主に吸気に作用する。","o3":"正しい。腹直筋・腹斜筋・腹横筋などは努力性呼気に関与する。","o4":"胸鎖乳突筋は吸気補助筋として働く。","o5":"前斜角筋も吸気補助筋。"},"related":"呼吸筋は『安静吸気＝横隔膜中心』『安静呼気＝受動』『努力性呼気＝腹筋群・内肋間筋』で整理します。","tip":"努力性呼気＝腹筋群＋内肋間筋。","glossary":[{"term":"努力性呼気","desc":"運動時や強い呼出時に呼気筋を能動的に使う呼気。"},{"term":"呼吸補助筋","desc":"換気要求増大時に主呼吸筋を補助する筋。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":["慢性閉塞性肺疾患（chronic obstructive pulmonary disease：COPD）などでは呼吸補助筋の過活動がみられることがある。","横隔膜は横隔神経支配で、頸髄C3〜C5由来。"],"round":60},{"id":"60B73","source":"第60回・午後73（出題内容をもとに学習用再構成）","source_session":"午後","source_no":73,"subject":"運動学","domain":"四肢・体幹の運動","topic":"肘・前腕","concept":"肘屈曲伸展","secondary":["上腕二頭筋","前腕回外","肘屈曲","上腕筋"],"question":"上肢の筋と運動の組合せとして正しいのはどれか。","options":[{"id":"o1","text":"上腕三頭筋 ― 前腕回外"},{"id":"o2","text":"上腕二頭筋 ― 前腕回外"},{"id":"o3","text":"円回内筋 ― 前腕回外"},{"id":"o4","text":"上腕筋 ― 肘伸展"},{"id":"o5","text":"腕橈骨筋 ― 肩関節外転"}],"answers":["o2"],"why":"正答は『上腕二頭筋―前腕回外』です。上腕二頭筋は肘屈曲に加え、とくに肘屈曲位で強力な前腕回外筋として働きます。","option_explanations":{"o1":"上腕三頭筋の主作用は肘伸展。","o2":"正しい。上腕二頭筋は前腕回外に強く作用する。","o3":"円回内筋は前腕回内に作用する。","o4":"上腕筋は主要な肘屈筋。","o5":"腕橈骨筋は肘屈曲に関与する。"},"related":"肘屈曲筋では上腕筋・上腕二頭筋・腕橈骨筋の違いを整理します。前腕回外は上腕二頭筋と回外筋、回内は円回内筋と方形回内筋が中心です。","tip":"上腕二頭筋＝肘屈曲＋前腕回外。","glossary":[{"term":"回外","desc":"前腕を解剖学的肢位で手掌が前方を向く方向へ回す運動。"},{"term":"上腕筋","desc":"前腕の回内外位にかかわらず強く働く肘屈筋。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":["上腕二頭筋の支配神経は筋皮神経。","前腕回内外の関節は近位・遠位橈尺関節。"],"round":60},{"id":"60B74","source":"第60回・午後74（出題内容をもとに再構成）","source_session":"午後","source_no":74,"subject":"運動学","domain":"運動制御・運動学習","topic":"運動学習","concept":"運動学習の原則","secondary":["小脳","手続き記憶","フィードフォワード"],"question":"運動学習について正しい記述はどれか。","options":[{"id":"o1","text":"運動学習の過程には小脳が関与する"},{"id":"o2","text":"学習初期から手続き記憶のみで運動が成立する"},{"id":"o3","text":"覚醒レベルが高いほどパフォーマンスは常に向上する"},{"id":"o4","text":"熟練するとフィードバック制御への依存が増える"},{"id":"o5","text":"練習量と達成度の学習曲線は典型的に逆U字型である"}],"answers":["o1"],"why":"正答は『運動学習の過程には小脳が関与する』です。小脳は運動誤差の検出・修正や適応学習に重要で、反復練習による運動パターンの更新に関与します。運動学習は認知的な理解から始まり、練習によって自動化が進みます。","option_explanations":{"o1":"正しい。小脳は誤差学習や運動適応、タイミング調整などに重要。","o2":"学習初期は課題理解や注意など意識的処理の比重が高く、反復により手続き化・自動化が進む。","o3":"覚醒レベルとパフォーマンスは単純比例ではなく、課題によって適度な覚醒水準が異なる。","o4":"熟練すると予測的なフィードフォワード制御が発達し、逐次的フィードバックへの依存は相対的に減る。","o5":"学習曲線は一般に練習量に応じて改善し、その後伸びが緩やかになる形などで表され、逆U字は覚醒とパフォーマンスの関係で用いられる。"},"related":"運動学習では、結果の知識（knowledge of results：KR）と遂行の知識（knowledge of performance：KP）、集中練習と分散練習、ブロック練習とランダム練習、保持と転移も頻出です。KRは『結果がどうだったか』、KPは『動作のやり方がどうだったか』という違いです。","tip":"逆U字＝覚醒とパフォーマンス。運動学習の誤差修正＝小脳。","glossary":[{"term":"フィードフォワード制御","desc":"運動前・運動中の予測に基づいてあらかじめ調整する制御。熟練で重要性が増す。"},{"term":"フィードバック制御","desc":"実際の運動結果を感覚情報として受け取り、修正に利用する制御。"},{"term":"逆U字","desc":"覚醒水準とパフォーマンスの関係を説明する概念。高すぎても低すぎても成績は下がる。"},{"term":"結果の知識","desc":"knowledge of results（KR）。課題の結果に関するフィードバック。例：目標から何cmずれたか。"},{"term":"遂行の知識","desc":"knowledge of performance（KP）。運動の方法やフォームに関するフィードバック。"}],"official_answers":[1],"problemImage":null,"problemImageCaption":null,"exam_links":["結果の知識（KR）は結果、遂行の知識（KP）は動作方法に関するフィードバック。","保持テスト・転移テストは『その場でできた』のではなく学習が成立したかを見る指標。"],"round":60}];

let deferredInstallPrompt=null;
function isStandaloneApp(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
}
function isIOSDevice(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function isSafariBrowser(){
  const ua=navigator.userAgent.toLowerCase();
  return ua.includes('safari') && !ua.includes('crios') && !ua.includes('fxios') && !ua.includes('edgios');
}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  setTimeout(renderInstallCard,0);
});
window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  setTimeout(renderInstallCard,0);
});
async function installPWA(){
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  try{ await deferredInstallPrompt.userChoice; }catch(e){}
  deferredInstallPrompt=null;
  renderInstallCard();
}
function dismissInstallCard(){
  localStorage.setItem('ptot_install_dismissed',String(Date.now()));
  const el=document.getElementById('installCard'); if(el)el.classList.add('hidden');
}
function renderInstallCard(){
  const el=document.getElementById('installCard'); if(!el)return;
  if(isStandaloneApp()){ el.classList.add('hidden'); return; }
  const dismissed=Number(localStorage.getItem('ptot_install_dismissed')||0);

  eligible.forEach(q=>exposure[q.id]=st.attempts.filter(a=>a.id===q.id&&a.type==='diag').length);

    <div class="conf-cell wrong"><b>${conf.highWrong}</b><span>自信あり<br>不正解</span></div>
    <div class="conf-cell wrong"><b>${conf.midWrong}</b><span>迷った<br>不正解</span></div>
    <div class="conf-cell wrong"><b>${conf.lowWrong}</b><span>わからない<br>不正解</span></div>
  </div>`;

  let changeHtml='';
  if(prevSubjects.length){
    const rows=subjects.map(cur=>{
      const old=prevSubjects.find(x=>x.subject===cur.subject);
      if(!old)return '';
      const delta=cur.pct-old.pct,cls=delta>0?'up':delta<0?'down':'';
      const sign=delta>0?'+':'';
      return `<div class="change-row">
        <div class="change-main"><b>${esc(cur.subject)}</b><div class="change-values">${old.pct}% → ${cur.pct}%</div></div>
        <span class="change-delta ${cls}">${sign}${delta}pt</span>
      </div>`;
    }).join('');
    changeHtml=`<div class="card"><h2>前回診断からの変化</h2><div class="change-list">${rows}</div><div class="result-note">前回と今回で出題問題が異なる場合があるため、正答率の変化は目安として見てください。</div></div>`;
  }

  S.innerHTML=`<div class="card">
    <h1>診断結果</h1>
    <div class="diag-hero-score"><div class="fraction">${ok} / ${n}</div><div class="percent">今回の正答率 ${pct}%</div></div>
    <p class="muted" style="text-align:center">ここは今回の診断テストの成績です。下の「推定習熟度」とは別の指標です。</p>
  </div>

  <div class="card"><h2>科目別の成績</h2>${subjectHtml}</div>

  <div class="card">
    <h2>回答の確信度</h2>
    <p class="small muted">正解・不正解だけでなく、答えたときの確信度も弱点分析に使います。</p>
    ${confHtml}
  </div>

  <div class="card">
    <h2>重点確認</h2>
    <div class="focus-card">
      <div class="focus-count">${focus}問</div>
      <p>自信を持って答えたものの、不正解だった問題です。通常の誤答より優先して復習に回します。</p>
      <button class="btn" ${focus?'':'disabled'} onclick="diagnosisReview('focus')">重点確認の問題を見る →</button>
    </div>
  </div>

  <div class="card">
    <h2>現在の弱点 TOP3</h2>
    <p class="small muted">「推定習熟度」は、今回だけでなくこれまでの正誤・確信度・最近の回答履歴から算出します。</p>
    ${resultWeakHtml(3)}
    <button class="btn secondary" style="margin-top:10px" onclick="weak()">弱点を詳しく見る →</button>
  </div>

  ${changeHtml}

  <div class="card">
    <h2>問題を見直す</h2>
    <div class="result-actions">
      <button class="btn" ${bad?'':'disabled'} onclick="diagnosisReview('wrong')">間違えた問題（${bad}問）</button>
      <button class="btn secondary" onclick="diagnosisReview('all')">全問題を確認</button>
      <button class="btn secondary" onclick="home()">ホームへ</button>
    </div>
  </div>`;
  NAV.classList.remove('hide');nav('home');scrollTopNow();
}
function diagnosisReview(mode='wrong'){
  const recs=latestDiagnosisRecords();
  const items=mode==='wrong'?recs.filter(a=>!a.correct):mode==='focus'?recs.filter(a=>!a.correct&&a.conf==='high'):recs;
  const title=mode==='wrong'?'間違えた問題':mode==='focus'?'重点確認の問題':'診断問題';
  S.innerHTML=`<div class="card">
    <button class="backlink" onclick="diagnosisResults()">← 診断結果へ戻る</button>
    <h1>${title}を確認</h1>
    <p class="muted">診断結果の確認用です。ここで見ても新しい回答履歴には加算しません。</p>
    ${items.length?`<div class="diag-summary-list">${items.map((a,i)=>{const q=qBy(a.id);return `<button class="diag-summary-item ${a.correct?'good':'bad'}" onclick="diagnosisReviewQuestion('${a.id}','${mode}')"><b>${i+1}. ${esc(q.question)}</b><span class="${a.correct?'result-good':'result-bad'}">${a.correct?'正解':'不正解'}</span> <span class="small muted">／ ${q.subject}・${q.concept}</span></button>`}).join('')}</div>`:'<div class="lookup-empty">確認対象はありません。</div>'}
  </div>`;
  NAV.classList.remove('hide');scrollTopNow();
}
function diagnosisReviewQuestion(id,mode){
  const q=qBy(id),recs=latestDiagnosisRecords(),a=recs.find(x=>x.id===id);if(!q||!a){diagnosisReview(mode);return;}
  const selected=new Set(a.selected||[]);
  const optionHtml=q.options.map((o,idx)=>`<div class="option-ex"><b>${q.answers.includes(o.id)?'✓ ':''}${idx+1}. ${o.text}${selected.has(o.id)?'　<span class="small">← あなたの回答</span>':''}</b><br/>${q.option_explanations[o.id]}</div>`).join('');
  const gloss=(q.glossary||[]).map(g=>`<div class="gloss-item"><b>${g.term}</b><div class="small">${g.desc}</div>${lookupButton(g.term,q.id)}</div>`).join('');
  S.innerHTML=`<div class="card">
    <button class="backlink" onclick="diagnosisReview('${mode}')">← 一覧へ戻る</button>
    <div class="source">${q.source}</div>
    <h2>${q.question}</h2>
    ${problemFigureHtml(q)}
    <div class="explain">
      <div class="explain-result ${a.correct?'good':'bad'}"><h2 class="${a.correct?'result-good':'result-bad'}" style="margin:0">${a.correct?'正解':'不正解'}</h2></div>
      <div class="section-box section-main"><h3>解説</h3><p>${q.why}</p></div>
      <div class="section-box section-options"><h3>各選択肢</h3>${optionHtml}</div>
      <div class="section-box section-related"><h3>関連する知識</h3><div>${q.related}</div></div>
      ${(q.exam_links&&q.exam_links.length)?`<div class="section-box section-exam"><h3>国試で一緒に押さえる</h3><ul style="margin:8px 0 0 20px;padding:0">${q.exam_links.map(x=>`<li style="margin:5px 0">${x}</li>`).join('')}</ul></div>`:''}
      <div class="section-box section-tip"><h3>覚えておくポイント</h3><div>${q.tip}</div></div>
      ${gloss?`<div class="section-box" style="background:#fff;border:1px solid #dbe4ee"><h3>用語整理</h3><div class="gloss-grid">${gloss}</div></div>`:''}
    </div>
  </div>`;
  NAV.classList.remove('hide');scrollTopNow();
}
function openAxis(subject,axisId){
  const a=axisConfig(subject,axisId);if(!a)return;scrollTopNow();const ax=axisStats(subject,axisId),axStatus=areaStatus(ax,axisQuestions(subject,axisId));
  const groups=a.subgroups.map(g=>({...g,stat:subgroupStats(subject,g.domain,g.topic)}));
  S.innerHTML=`<div class="card"><button class="backlink" onclick="weak()">← 弱点分析へ戻る</button><div class="axis-detail-head"><div><h1>${esc(subject)}：${esc(a.label)}</h1><p class="muted">${esc(a.description)}</p><div class="axis-detail-status">${statusBadge(axStatus)}</div></div><div>${ax.value===null?'<div class="subgroup-score mutedscore">未測定</div>':`<div class="axis-detail-score-label">推定習熟度</div><div class="axis-detail-score-value">${ax.value} / 100</div>`}</div></div>${ax.value!==null?`<div class="mini-meter"><span style="width:${ax.value}%"></span></div>`:''}<button class="btn soft" style="margin-top:12px" ${ax.total?'':'disabled'} onclick="startAxisPractice('${subject.replace(/'/g,"\\'")}','${axisId}',5)">この領域を演習する →</button></div>
  <div class="card"><h2>細分類</h2>${groups.map(g=>{const c=subgroupConcepts(subject,g.domain,g.topic),s=g.stat,qs=Q.filter(q=>q.subject===subject&&q.domain===g.domain&&q.topic===g.topic);s.insufficient=s.seen<3;const status=areaStatus(s,qs);return `<div class="subgroup-card"><div class="subgroup-head"><div><b>${esc(g.label)}</b><div class="small muted">${esc(g.domain)}</div><div style="margin-top:5px">${statusBadge(status)}</div></div><div>${s.total===0?'<div class="subgroup-score mutedscore">準備中</div>':s.value===null?'<div class="subgroup-score mutedscore">未測定</div>':`<div class="subgroup-score-label">推定習熟度</div><div class="subgroup-score">${s.value} / 100</div>`}</div></div>${s.value!==null?`<div class="mini-meter"><span style="width:${s.value}%"></span></div>`:''}${c.length?`<div class="concept-list">${c.slice(0,4).map(x=>`<div class="concept-row"><span>${esc(x.q.concept)} ${x.mastery===null?'<span class="status-unmeasured">未測定</span>':`<span class="${x.mastery<60?'status-focus':'status-ok'}">習熟度 ${x.mastery}/100</span>`}</span><button onclick="startConcept('${x.q.id}')">演習 →</button></div>`).join('')}</div>`:''}${s.total?`<button class="btn secondary" style="margin-top:9px;padding:9px;font-size:13px" onclick="startSubgroupPractice('${subject.replace(/'/g,"\\'")}','${g.domain.replace(/'/g,"\\'")}','${g.topic.replace(/'/g,"\\'")}',5)">この細分類を演習する →</button>`:''}</div>`}).join('')}</div>`;
  nav('weak');scrollTopNow();
}
function startConcept(id){const q=qBy(id),pool=Q.filter(x=>x.subject===q.subject&&(x.concept===q.concept||(x.secondary||[]).some(t=>(q.secondary||[]).includes(t))));let ids=shuffle(pool.map(x=>x.id)).slice(0,5);if(!ids.length)ids=[id];start(ids,'tagreview');}

function weak(){
  if(!st.diagnosed){home();return;}const subjects=Object.keys(ANALYTICS);scrollTopNow();
  S.innerHTML=`<div class="card"><h1>弱点分析</h1><p class="muted">回答履歴から、科目全体→領域→細分類→概念の順に弱点を確認できます。</p>${subjectSummaryHtml()}</div><div class="card"><h2>現在の弱点 TOP3</h2><p class="small muted">タップすると、その系列の問題をすぐ演習できます。</p>${weakTopHtml(3)}</div>${subjects.map(s=>{const th=subjectTheme(s);return `<div class="card weak-subject-card" style="--subject-color:${th.color};--subject-soft:${th.soft}"><div class="weak-subject-head"><span class="weak-subject-badge">${esc(s)}</span><h2>${esc(s)}の弱点マップ</h2></div>${radarSvg(s)}</div>`}).join('')}<div class="card"><h2>概念別</h2>${conceptScores().slice(0,12).map(weakCard).join('')||'<p class="muted">まだありません。</p>'}</div>`;nav('weak');scrollTopNow();
}

function lookupPage(){
  const pending=[...st.lookup].filter(x=>!x.done).sort((a,b)=>new Date(b.added)-new Date(a.added));
  const done=[...st.lookup].filter(x=>x.done).sort((a,b)=>new Date(b.added)-new Date(a.added));
  const card=x=>{
    const q=qBy(x.qid);
    const path=q?`${q.subject} › ${q.domain} › ${q.topic} › ${q.concept}`:'元の問題情報なし';
    const src=q?q.source:'';
    return `<div class="lookup-card ${x.done?'done':''}">
      <div class="lookup-term">${esc(x.term)}</div>
      <div class="lookup-path">${esc(path)}${src?`<br>${esc(src)}`:''}</div>
      <div class="lookup-actions">
        <button class="primary" ${q?'':'disabled'} onclick="start(['${x.qid}'],'lookupreview')">元の問題を見る</button>
        <button class="donebtn" onclick="toggleLookupDone('${x.key.replace(/'/g,"\\'")}')">${x.done?'未確認に戻す':'✓ 確認済みにする'}</button>
      </div>
      ${x.done?`<button class="backlink" style="margin-top:8px;color:#64748b" onclick="removeLookup('${x.key.replace(/'/g,"\\'")}')">一覧から削除</button>`:''}
    </div>`;
  };
  S.innerHTML=`<div class="card"><h1>あとで調べる</h1>
    <p class="muted">解説中に気になった用語だけ保存しておき、あとで教科書や授業資料で確認するための一覧です。</p>
    <div class="stats">
      <div class="stat"><b>${pending.length}</b><span class="small">未確認</span></div>
      <div class="stat"><b>${done.length}</b><span class="small">確認済み</span></div>
      <div class="stat"><b>${st.lookup.length}</b><span class="small">保存合計</span></div>
    </div>
  </div>
  <div class="card"><h2>未確認</h2>${pending.length?`<div class="lookup-list">${pending.map(card).join('')}</div>`:'<div class="lookup-empty">保存した用語はありません。<br>問題解説の「＋ あとで調べる」から追加できます。</div>'}</div>
  ${done.length?`<div class="card"><h2>確認済み</h2><div class="lookup-list">${done.map(card).join('')}</div></div>`:''}`;
  NAV.classList.remove('hide');nav('lookup');scrollTopNow();
}

function exportStudyData(){
  const payload={format:'ptot-study-data',version:1,appVersion:'1.14',exportedAt:new Date().toISOString(),data:st};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a'),d=new Date(),ymd=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href=url;a.download=`ptot-study-backup-${ymd}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function triggerImport(){document.getElementById('backupInput')?.click();}
async function importStudyData(input){
  const file=input.files&&input.files[0];if(!file)return;
  try{
    const raw=JSON.parse(await file.text()),data=raw&&raw.format==='ptot-study-data'?raw.data:raw;
    if(!data||!Array.isArray(data.attempts))throw new Error('学習データ形式ではありません');
    if(!confirm('現在の学習データを、読み込んだバックアップで置き換えますか？')){input.value='';return;}
    st={
      attempts:Array.isArray(data.attempts)?data.attempts:[],
      diagnosed:!!data.diagnosed,
      lookup:Array.isArray(data.lookup)?data.lookup:[],
      activeDiag:data.activeDiag&&Array.isArray(data.activeDiag.ids)?data.activeDiag:null,
      lastDiagSessionId:data.lastDiagSessionId||null
    };
    ses=null;save();alert('学習データを復元しました。');home();
  }catch(e){alert('読み込みに失敗しました：'+e.message);}
  input.value='';
}
function hist(){
  if(!st.diagnosed&&!st.attempts.length){home();return;}const a=[...st.attempts].reverse().slice(0,50);
  S.innerHTML=`<div class="card"><h1>履歴</h1>${a.length?a.map(x=>{const q=qBy(x.id);if(!q)return'';return `<div class="row"><div><b>${q.subject} / ${q.concept}</b><div class="small muted">${q.source}・${new Date(x.ts).toLocaleString('ja-JP')}</div></div><span class="${x.correct?'result-good':'result-bad'}">${x.correct?'○':'×'}・${x.conf==='high'?'自信':x.conf==='mid'?'迷い':'不明'}</span></div>`}).join(''):'<p class="muted">履歴なし</p>'}</div>
  <div class="card"><h2>学習データのバックアップ</h2><p class="muted">ログインを使わないため、端末変更やブラウザデータ削除に備えてファイルへ保存できます。</p><div class="data-actions"><button class="btn soft" onclick="exportStudyData()">学習データを書き出す</button><button class="btn secondary" onclick="triggerImport()">バックアップを読み込む</button></div><input id="backupInput" class="file-input" type="file" accept=".json,application/json" onchange="importStudyData(this)"><div class="data-note-box">回答履歴、弱点分析用データ、「あとで調べる」、途中の診断テストを1つのJSONファイルに保存します。</div></div>
  <div class="card"><h2>データ初期化</h2><p class="muted">端末内の回答履歴と保存内容をすべて削除します。</p><button class="btn" style="background:#64748b" onclick="resetData()">学習データを初期化</button></div>`;nav('hist');scrollTopNow();
}
function resetData(){if(confirm('回答履歴・あとで調べる・途中の診断を含む学習データをすべて削除しますか？')){localStorage.removeItem(KEY);st={attempts:[],diagnosed:false,lookup:[],activeDiag:null,lastDiagSessionId:null};ses=null;save();home();}}
function nav(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));}
document.querySelectorAll('.nav button').forEach(b=>{b.onclick=()=>{if(b.dataset.p==='home')home();else if(b.dataset.p==='weak')weak();else if(b.dataset.p==='lookup')lookupPage();else hist();};});
updateLookupNav();home();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js');
      reg.update().catch(()=>{});
    }catch(e){}
  });
}

</script>
