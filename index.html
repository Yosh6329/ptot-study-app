,{"id":"o3","text":"バゾプレシン"},{"id":"o4","text":"プロラクチン"},{"id":"o5","text":"アルドステロン"}],"answers":["o4"],"why":"プロラクチンは下垂体前葉から分泌され、乳腺での乳汁産生を促進します。オキシトシンとバゾプレシンは後葉から放出されます。","option_explanations":{"o1":"松果体由来です。","o2":"視床下部で合成され下垂体後葉から放出されます。","o3":"視床下部で合成され下垂体後葉から放出されます。","o4":"正しい。下垂体前葉ホルモンです。","o5":"副腎皮質球状帯から分泌されます。"},"related":"前葉ホルモンはGH・PRL・TSH・ACTH・FSH・LHを基本セットで覚えます。","tip":"PRL＝前葉。ADH/OT＝後葉放出。","glossary":[{"term":"プロラクチン","desc":"下垂体前葉から分泌され、乳汁産生を促進するホルモン。"},{"term":"下垂体後葉","desc":"視床下部で合成されたオキシトシン・バゾプレシンを貯蔵・放出する。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B63","round":58,"source":"第58回・午後63（出題内容をもとに学習用再構成）","source_session":"午後","source_no":63,"subject":"生理学","domain":"感覚・認知","topic":"特殊感覚","concept":"視覚生理","secondary":["視神経乳頭","盲点","暗順応","近視","毛様体筋"],"question":"視覚の生理について正しいのはどれか。","options":[{"id":"o1","text":"明順応には通常20分程度を要する"},{"id":"o2","text":"視神経乳頭には視細胞がない"},{"id":"o3","text":"ビタミンC欠乏で夜盲症になる"},{"id":"o4","text":"近視では焦点が網膜後方に結ぶ"},{"id":"o5","text":"遠方視で毛様体筋が収縮する"}],"answers":["o2"],"why":"視神経乳頭は網膜神経節細胞の軸索が眼球外へ出る部位で、桿体・錐体がなく盲点となります。","option_explanations":{"o1":"暗順応の方が長時間を要し、明順応はより速いです。","o2":"正しい。視細胞がないため生理的盲点となります。","o3":"夜盲症は主にビタミンA欠乏と関連します。","o4":"近視では焦点が網膜前方に結びます。","o5":"遠方視では毛様体筋は弛緩します。"},"related":"解剖の眼球構造と、生理の順応・屈折調節を関連づけると定着します。","tip":"視神経乳頭＝視細胞なし＝盲点。","glossary":[{"term":"視神経乳頭","desc":"視神経線維が眼球から出る部位。視細胞を欠くため盲点となる。"},{"term":"暗順応","desc":"明所から暗所へ移った際に感度が高まる過程。桿体のロドプシン再生などが関与する。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B64","round":58,"source":"第58回・午後64（出題内容をもとに学習用再構成）","source_session":"午後","source_no":64,"subject":"生理学","domain":"運動","topic":"運動生理","concept":"有酸素トレーニング適応","secondary":["有酸素運動","最大心拍出量","毛細血管密度","一回拍出量","安静時心拍数"],"question":"長期間の有酸素運動トレーニングによる適応を2つ選べ。","options":[{"id":"o1","text":"安静時血圧の上昇"},{"id":"o2","text":"安静時心拍数の上昇"},{"id":"o3","text":"最大心拍出量の増加"},{"id":"o4","text":"骨格筋毛細血管網の発達"},{"id":"o5","text":"安静時交感神経緊張の亢進"}],"answers":["o3","o4"],"why":"持久性トレーニングでは一回拍出量増加などにより最大心拍出量が増え、骨格筋では毛細血管密度・ミトコンドリア能力などが高まります。安静時心拍数は一般に低下します。","option_explanations":{"o1":"一般に血圧は上昇せず、特に高血圧者では低下が期待されます。","o2":"安静時心拍数は低下する傾向です。","o3":"正しい。一回拍出量増大などが寄与します。","o4":"正しい。酸素供給能力を高める適応です。","o5":"安静時交感神経活動はむしろ低下方向です。"},"related":"中枢適応（心臓）と末梢適応（筋・毛細血管）に分けると整理しやすいです。","tip":"持久トレ＝SV↑、毛細血管↑、安静HR↓。","glossary":[{"term":"最大心拍出量","desc":"最大運動時の心拍数×一回拍出量。持久性トレーニングで増加しうる。"},{"term":"毛細血管密度","desc":"筋線維周囲の毛細血管の発達度。持久性トレーニングで増加する。"}],"official_answers":[3,4],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B65","round":58,"source":"第58回・午後65（出題内容をもとに学習用再構成）","source_session":"午後","source_no":65,"subject":"生理学","domain":"自律神経","topic":"自律神経機能","concept":"副交感神経作用","secondary":["副交感神経","迷走神経","房室結節","ムスカリン受容体","rest and digest"],"question":"副交感神経の作用によって抑制されるのはどれか。","options":[{"id":"o1","text":"膵液分泌"},{"id":"o2","text":"気管支平滑筋収縮"},{"id":"o3","text":"房室伝導速度"},{"id":"o4","text":"直腸平滑筋収縮"},{"id":"o5","text":"グリコーゲン合成"}],"answers":["o3"],"why":"副交感神経（迷走神経）は心臓で房室結節などに作用し、心拍数や房室伝導を低下させます。消化管分泌・運動は概ね促進します。","option_explanations":{"o1":"消化液分泌は一般に促進されます。","o2":"副交感刺激は気管支収縮方向に働きます。","o3":"正しい。房室伝導を遅くします。","o4":"消化管平滑筋活動は促進方向です。","o5":"休息・消化時の代謝では合成方向と整合します。"},"related":"副交感神経は「心臓は抑える、消化管は動かす」という大きな方向性を先に押さえます。","tip":"迷走神経→心拍・AV伝導↓。","glossary":[{"term":"副交感神経","desc":"安静・消化・排泄などに関与する自律神経系。"},{"term":"房室伝導","desc":"心房から房室結節を介して心室へ興奮が伝わる過程。迷走神経刺激で遅延する。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B66","round":58,"source":"第58回・午後66（出題内容をもとに学習用再構成）","source_session":"午後","source_no":66,"subject":"生理学","domain":"血液・免疫","topic":"血液","concept":"血球の機能","secondary":["赤血球","ヘモグロビン","血小板","単球","リンパ球"],"question":"血球と働きの組合せとして正しいものを2つ選べ。","options":[{"id":"o1","text":"顆粒球―止血"},{"id":"o2","text":"血小板―病原体の主要な貪食"},{"id":"o3","text":"赤血球―ヘモグロビンの運搬"},{"id":"o4","text":"単球―栄養素の主な運搬"},{"id":"o5","text":"リンパ球―抗体産生"}],"answers":["o3","o5"],"why":"赤血球はヘモグロビンを含み酸素・二酸化炭素運搬に関与します。Bリンパ球は形質細胞へ分化して抗体を産生します。","option_explanations":{"o1":"止血の中心は血小板と凝固系です。","o2":"血小板の主機能は止血です。","o3":"正しい。赤血球内にヘモグロビンがあります。","o4":"単球は組織でマクロファージとなり貪食などに関与します。","o5":"正しい。Bリンパ球系が抗体産生を担います。"},"related":"各血球は「赤血球＝ガス、血小板＝止血、好中球/単球＝貪食、リンパ球＝獲得免疫」で整理します。","tip":"赤＝Hb、血小板＝止血、B細胞＝抗体。","glossary":[{"term":"赤血球","desc":"ヘモグロビンを含み、主に酸素運搬を担う血球。"},{"term":"Bリンパ球","desc":"抗原刺激で形質細胞へ分化し、抗体を産生するリンパ球。"}],"official_answers":[3,5],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B67","round":58,"source":"第58回・午後67（出題内容をもとに学習用再構成）","source_session":"午後","source_no":67,"subject":"生理学","domain":"咀嚼・嚥下・消化・吸収","topic":"消化吸収","concept":"胃液分泌","secondary":["壁細胞","主細胞","内因子","ガストリン","ヒスタミンH2受容体"],"question":"胃の分泌・調節について正しいものを2つ選べ。","options":[{"id":"o1","text":"ヒスタミンは胃酸分泌を抑制する"},{"id":"o2","text":"迷走神経刺激は胃酸分泌を促進する"},{"id":"o3","text":"ガストリンは蛋白質分解酵素である"},{"id":"o4","text":"内因子はビタミンB12吸収に必要である"},{"id":"o5","text":"ペプシノーゲンは壁細胞から分泌される"}],"answers":["o2","o4"],"why":"迷走神経・ガストリン・ヒスタミンは胃酸分泌を促進します。壁細胞は胃酸と内因子、主細胞はペプシノーゲンを分泌します。","option_explanations":{"o1":"ヒスタミンはH2受容体を介して胃酸分泌を促進します。","o2":"正しい。迷走神経刺激は胃液分泌を促します。","o3":"ガストリンはホルモンで、蛋白分解酵素ではありません。","o4":"正しい。回腸でのビタミンB12吸収に必要です。","o5":"ペプシノーゲンは主細胞から分泌されます。"},"related":"胃腺細胞は「壁＝HCl＋内因子、主＝ペプシノーゲン」を最優先で覚えます。","tip":"壁細胞＝酸＋内因子、主細胞＝ペプシノーゲン。","glossary":[{"term":"内因子","desc":"胃壁細胞から分泌され、ビタミンB12の回腸吸収に必要な糖蛋白。"},{"term":"主細胞","desc":"胃腺でペプシノーゲンを分泌する細胞。"}],"official_answers":[2,4],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B68","round":58,"source":"第58回・午後68（出題内容をもとに学習用再構成）","source_session":"午後","source_no":68,"subject":"生理学","domain":"排便","topic":"排便機構","concept":"排便反射","secondary":["排便反射","骨盤神経","陰部神経","内肛門括約筋","直腸伸展"],"question":"排便機構について正しいのはどれか。","options":[{"id":"o1","text":"便意は内肛門括約筋の伸張だけで生じる"},{"id":"o2","text":"大腸内容物の混和は主に大蠕動で行われる"},{"id":"o3","text":"直腸平滑筋の収縮はアセチルコリンで促進される"},{"id":"o4","text":"骨盤神経が外肛門括約筋を直接弛緩させる"},{"id":"o5","text":"上行結腸の内容物は通常半固形である"}],"answers":["o3"],"why":"直腸伸展で排便反射が起こり、副交感神経（骨盤神経）末端のアセチルコリンなどにより直腸収縮・内肛門括約筋弛緩が促進されます。外肛門括約筋は陰部神経による体性支配です。","option_explanations":{"o1":"便意は主に直腸壁の伸展刺激に関連します。","o2":"混和運動はハウストラ運動などが担い、大蠕動は内容物を大きく移送します。","o3":"正しい。副交感性コリン作動性刺激が直腸運動を促進します。","o4":"外肛門括約筋は陰部神経による体性支配です。","o5":"上行結腸では内容物はより液状〜半流動です。"},"related":"排便は「直腸伸展→副交感反射」「内括約筋＝自律、外括約筋＝体性」を分けます。","tip":"内＝自律、外＝陰部神経。","glossary":[{"term":"内肛門括約筋","desc":"平滑筋からなり不随意性に調節される肛門括約筋。"},{"term":"外肛門括約筋","desc":"骨格筋からなり陰部神経支配を受け、随意的に調節できる。"}],"official_answers":[3],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B69","round":58,"source":"第58回・午後69（出題内容をもとに学習用再構成）","source_session":"午後","source_no":69,"subject":"運動学","domain":"四肢・体幹の運動","topic":"足関節・足部","concept":"下肢筋の作用","secondary":["短腓骨筋","後脛骨筋","長指伸筋","薄筋","縫工筋"],"question":"筋と作用の組合せとして正しいものを2つ選べ。","options":[{"id":"o1","text":"長指伸筋―足内がえし"},{"id":"o2","text":"後脛骨筋―足外がえし"},{"id":"o3","text":"短腓骨筋―足底屈"},{"id":"o4","text":"薄筋―膝屈曲"},{"id":"o5","text":"縫工筋―膝伸展"}],"answers":["o3","o4"],"why":"短腓骨筋は足関節底屈・外がえしに、薄筋は股関節内転と膝屈曲・内旋に働きます。","option_explanations":{"o1":"長指伸筋は背屈・外がえし方向に働きます。","o2":"後脛骨筋は底屈・内がえし方向に働きます。","o3":"正しい。底屈・外がえしに関与します。","o4":"正しい。膝屈曲・内旋に関与します。","o5":"縫工筋は膝を屈曲し、下腿内旋にも関与します。"},"related":"足関節筋は腱が足関節軸のどちら側を通るかから作用を推定できます。","tip":"後脛骨＝内がえし、腓骨筋＝外がえし。","glossary":[{"term":"短腓骨筋","desc":"腓骨外側から第5中足骨底へ走り、足底屈・外がえしに作用する。"},{"term":"薄筋","desc":"股関節内転と膝屈曲・下腿内旋に作用する内転筋群の一つ。"}],"official_answers":[3,4],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B70","round":58,"source":"第58回・午後70（出題内容をもとに学習用再構成）","source_session":"午後","source_no":70,"subject":"運動学","domain":"四肢・体幹の運動","topic":"肩甲帯・肩","concept":"肩甲骨上方回旋","secondary":["前鋸筋","肩甲骨上方回旋","僧帽筋","フォースカップル","翼状肩甲"],"question":"肩甲骨の外転・上方回旋を伴って肩関節屈曲位の保持に働く筋はどれか。","options":[{"id":"o1","text":"棘下筋"},{"id":"o2","text":"広背筋"},{"id":"o3","text":"小円筋"},{"id":"o4","text":"前鋸筋"},{"id":"o5","text":"菱形筋"}],"answers":["o4"],"why":"前鋸筋は肩甲骨を胸郭へ固定しつつ外転・上方回旋させ、上肢挙上に重要です。僧帽筋とのフォースカップルも形成します。","option_explanations":{"o1":"主に肩関節外旋筋です。","o2":"肩伸展・内転・内旋などに作用します。","o3":"主に肩関節外旋筋です。","o4":"正しい。肩甲骨外転・上方回旋の主要筋です。","o5":"肩甲骨内転・下方回旋に働きます。"},"related":"上肢挙上時の上方回旋は前鋸筋＋僧帽筋上部・下部の協働が重要です。","tip":"上方回旋＝前鋸筋＋僧帽筋。","glossary":[{"term":"前鋸筋","desc":"長胸神経支配で、肩甲骨外転・上方回旋・胸郭への固定に作用。"},{"term":"フォースカップル","desc":"複数筋が異なる方向から力を出し、共同して回転運動を生む組合せ。"}],"official_answers":[4],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B71","round":58,"source":"第58回・午後71（出題内容をもとに学習用再構成）","source_session":"午後","source_no":71,"subject":"運動学","domain":"四肢・体幹の運動","topic":"肘・前腕","concept":"肘屈曲筋の作用","secondary":["上腕筋","上腕二頭筋","腕橈骨筋","肘屈曲","前腕回外"],"question":"主作用が肘関節屈曲で、前腕回内外や肩関節作用をほとんどもたない筋はどれか。","options":[{"id":"o1","text":"肘筋"},{"id":"o2","text":"上腕筋"},{"id":"o3","text":"烏口腕筋"},{"id":"o4","text":"腕橈骨筋"},{"id":"o5","text":"上腕二頭筋"}],"answers":["o2"],"why":"上腕筋は尺骨に停止するため前腕の回内外位に影響されにくく、純粋な肘屈曲筋として強く働きます。","option_explanations":{"o1":"肘伸展補助に働きます。","o2":"正しい。主要な肘屈筋で、前腕回内外への直接作用が小さい筋です。","o3":"肩関節屈曲・内転などに働きます。","o4":"肘屈曲に加え前腕を中間位へ戻す作用があります。","o5":"肘屈曲に加えて強い前腕回外作用があります。"},"related":"肘屈筋3つは「上腕筋＝純屈曲、二頭筋＝屈曲＋回外、腕橈骨＝屈曲＋中間位」を対比します。","tip":"上腕筋＝純粋な肘屈筋。","glossary":[{"term":"上腕筋","desc":"上腕骨前面から尺骨粗面へ付着し、強力な肘屈曲を行う筋。"},{"term":"腕橈骨筋","desc":"肘屈曲に加え、前腕を回内・回外の中間位へ近づける作用をもつ。"}],"official_answers":[2],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B72","round":58,"source":"第58回・午後72（出題内容をもとに学習用再構成）","source_session":"午後","source_no":72,"subject":"運動学","domain":"四肢・体幹の運動","topic":"呼吸運動","concept":"安静吸気の胸郭運動","secondary":["横隔膜","外肋間筋","pump-handle運動","胸腔内圧","安静吸気"],"question":"安静吸気時の現象として正しいのはどれか。","options":[{"id":"o1","text":"横隔膜は上昇する"},{"id":"o2","text":"外肋間筋は弛緩する"},{"id":"o3","text":"胸腔内圧は陽圧になる"},{"id":"o4","text":"腹横筋が主に収縮する"},{"id":"o5","text":"上部胸郭は前上方へ拡張する"}],"answers":["o5"],"why":"安静吸気では横隔膜と外肋間筋が収縮し、胸腔容積が増加して胸腔内圧がより陰圧になります。上位肋骨はpump-handle運動により前上方へ挙上します。","option_explanations":{"o1":"横隔膜は収縮して下降します。","o2":"外肋間筋は収縮します。","o3":"胸腔内圧はより陰圧になります。","o4":"腹筋群は主に努力性呼気に関与します。","o5":"正しい。上部胸郭は前上方へ拡張します。"},"related":"呼吸運動は横隔膜下降と肋骨運動（pump-handle / bucket-handle）を立体的に理解します。","tip":"吸気＝横隔膜下降＋胸郭拡大＋陰圧。","glossary":[{"term":"pump-handle運動","desc":"上位肋骨・胸骨が前上方へ動き、胸郭前後径を増やす運動。"},{"term":"横隔膜","desc":"主要な吸気筋で、収縮時に下降して胸腔容積を増やす。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B73","round":58,"source":"第58回・午後73（出題内容をもとに学習用再構成）","source_session":"午後","source_no":73,"subject":"運動学","domain":"姿勢","topic":"姿勢制御","concept":"立位の重心線","secondary":["重心線","支持基底面","外果","姿勢アライメント","立位"],"question":"基本的立位姿勢を矢状面からみたとき、重心線が通る位置として適切なのはどれか。","options":[{"id":"o1","text":"外後頭隆起"},{"id":"o2","text":"烏口突起"},{"id":"o3","text":"大転子より明らかに前方"},{"id":"o4","text":"膝蓋骨より前方"},{"id":"o5","text":"外果より前方"}],"answers":["o5"],"why":"標準的な矢状面アライメントでは重心線は外果のやや前方を通ります。膝では関節軸のやや前方、股関節では大転子付近〜やや後方など、教科書により表現幅があります。","option_explanations":{"o1":"前額面の指標として扱われることが多い位置です。","o2":"肩峰付近が代表的ランドマークです。","o3":"大転子付近であり、明らかに前方とはしません。","o4":"膝関節軸のやや前方ですが「膝蓋骨前方」は過度です。","o5":"正しい。外果のやや前方を通るのが代表的です。"},"related":"重心線は一点の絶対値ではなく、標準的アライメントの目安として用いることにも注意します。","tip":"矢状面では外果のやや前方。","glossary":[{"term":"重心線","desc":"身体重心から鉛直下方へ引いた線。姿勢安定性や関節モーメントの理解に用いる。"},{"term":"支持基底面","desc":"身体が支持面と接触する点・領域で囲まれる範囲。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"58B74","round":58,"source":"第58回・午後74（出題内容をもとに学習用再構成）","source_session":"午後","source_no":74,"subject":"運動学","domain":"運動制御・運動学習","topic":"運動学習","concept":"練習の特異性","secondary":["運動学習","練習の特異性","転移","フィードバック","覚醒水準"],"question":"運動学習を効率化する条件として正しいのはどれか。","options":[{"id":"o1","text":"覚醒水準は高いほどよい"},{"id":"o2","text":"フィードバックは多いほどよい"},{"id":"o3","text":"課題難易度は低いほどよい"},{"id":"o4","text":"多様練習は学習初期ほど優先する"},{"id":"o5","text":"練習課題は目標課題に類似するほどよい"}],"answers":["o5"],"why":"学習には練習の特異性があり、実際に求められる目標課題に近い条件で練習するほど転移しやすい傾向があります。覚醒・難易度・フィードバックはいずれも「多いほど良い」という単純関係ではありません。","option_explanations":{"o1":"過度な覚醒は成績を低下させることがあります。","o2":"過剰なフィードバックは依存を生み保持を妨げることがあります。","o3":"適度な挑戦性が必要です。","o4":"学習段階に応じて変動・多様練習を組み合わせます。","o5":"正しい。目標課題に近い練習は転移に有利です。"},"related":"運動学習では「その場のパフォーマンス」と「保持・転移で確認する学習」を区別します。","tip":"目標課題に近い練習ほど転移しやすい。","glossary":[{"term":"練習の特異性","desc":"練習条件と目標パフォーマンス条件が似るほど学習効果が発揮されやすい考え方。"},{"term":"転移","desc":"ある課題で得た学習が別の課題や状況の成績に影響すること。"}],"official_answers":[5],"problemImage":null,"problemImageCaption":null,"exam_links":[],"source_url":"https://www.kokushiplus.net/2023/02/pot58pm51-100.html"},{"id":"57A51","round":57,"source":"第57回・午前51（出題内容をもとに学習用再構成）","source_session":"午前","source_no":51,"subject":"解剖学","domain":"骨格系","topic":"関節の基礎","concept":"関節円板を有する関節","secondary":["関節円板","遠位橈尺関節","胸鎖関節","橈骨手根関節","線維軟骨"],"question":"関節円板を有する関節を3つ選べ。","options":[{"id":"o1","text":"遠位橈尺関節"},{"id":"o2","text":"肩関節"},{"id":"o3","text":"胸鎖関節"},{"id":"o4","text":"橈骨手根関節"},{"id":"o5","text":"腕尺関節"}],"answers":["o1","o3","o4"],"why":"遠位橈尺関節・胸鎖関節・橈骨手根関節には関節円板があります。","option_explanations":{"o1":"正しい。遠位橈尺関節・胸鎖関節・橈骨手根関節には関節円板があります。","o2":"誤り。正答の中心は「遠位橈尺関節、胸鎖関節、橈骨手根関節」です。関節円板がある代表：顎・胸鎖・肩鎖・遠位橈尺・橈骨手根。","o3":"正しい。遠位橈尺関節・胸鎖関節・橈骨手根関節には関節円板があります。","o4":"正しい。遠位橈尺関節・胸鎖関節・橈骨手根関節には関節円板があります。","o5":"誤り。正答の中心は「遠位橈尺関節、胸鎖関節、橈骨手根関節」です。関節円板がある代表：顎・胸鎖・肩鎖・遠位橈尺・橈骨手根。"},"related":"関節円板は適合性の let deferredInstallPrompt=null;
function isStandaloneApp(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
}
function isIOSDevice(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function isSafariBrowser(){
  const ua=navigator.userAgent.toLowerCase();

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  setTimeout(renderInstallCard,0);
});
window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  setTimeout(renderInstallCard,0);
});
async function installPWA(){
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  try{ await deferredInstallPrompt.userChoice; }catch(e){}
  deferredInstallPrompt=null;
  renderInstallCard();
}
function dismissInstallCard(){
  localStorage.setItem('ptot_install_dismissed',String(Date.now()));
  const el=document.getElementById('installCard'); if(el)el.classList.add('hidden');
}
function renderInstallCard(){
  const el=document.getElementById('installCard'); if(!el)return;
  if(isStandaloneApp()){ el.classList.add('hidden'); return; }
  const dismissed=Number(localStorage.getItem('ptot_install_dismissed')||0);
  if(dismissed && Date.now()-dismissed<3*86400000){el.classList.add('hidden');return;}
  const title=el.querySelector('[data-install-title]');
  const body=el.querySelector('[data-install-body]');
  const action=el.querySelector('[data-install-action]');
  el.classList.remove('hidden');
  if(deferredInstallPrompt){
    title.textContent='スマホにインストールできます';
    body.textContent='インストール後はホーム画面のアイコンから、通常のアプリのように起動できます。';
    action.style.display='';
    action.textContent='アプリをインストール';
    action.onclick=installPWA;
  }else if(isIOSDevice()){
    title.textContent='ホーム画面に追加できます';
    body.innerHTML=isSafariBrowser()
      ? 'Safariの共有ボタン <b>□↑</b> → <b>「ホーム画面に追加」</b> → <b>「追加」</b> の順に操作してください。'
      : 'iPhoneではSafariでこのページを開き、共有 →「ホーム画面に追加」を選んでください。';
    action.style.display='none';
  }else{
    title.textContent='アプリとして使えます';
    body.textContent='ブラウザのメニューに「インストール」または「ホーム画面に追加」が表示される場合は、それを選択してください。';
    action.style.display='none';
  }
}

function lookupKey(term,qid){ return qid+'::'+term; }
function pendingLookup(){ return st.lookup.filter(x=>!x.done); }

function lookupSaved(term,qid){ return st.lookup.some(x=>x.key===lookupKey(term,qid)&&!x.done); }
function addLookup(term,qid,el){
  const key=lookupKey(term,qid),found=st.lookup.find(x=>x.key===key);
  if(found){ found.done=false; found.added=new Date().toISOString(); }
  else st.lookup.push({key,term,qid,added:new Date().toISOString(),done:false});
  save();
  if(el){el.textContent='✓ あとで調べるに保存済み';el.classList.add('saved');}
}
function toggleLookupDone(key){
  const x=st.lookup.find(v=>v.key===key); if(!x)return; x.done=!x.done; save(); lookupPage();
}
function removeLookup(key){ st.lookup=st.lookup.filter(x=>x.key!==key); save(); lookupPage(); }
function lookupButton(term,qid){
  const enc=encodeURIComponent(term),saved=lookupSaved(term,qid);
  return `<button class="lookup-add ${saved?'saved':''}" onclick="addLookup(decodeURIComponent('${enc}'),'${qid}',this)">${saved?'✓ あとで調べるに保存済み':'＋ あとで調べる'}</button>`;
}
function qBy(id){ return Q.find(q => q.id===id); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function dayKey(ts){ const d=new Date(ts); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function daysBetween(a,b){ return Math.floor((new Date(b)-new Date(a))/86400000); }
function weight(a){ if(!a.correct) return a.conf==='high'?5:a.conf==='mid'?4:3; return a.conf==='low'?2.5:a.conf==='mid'?1.5:0; }
function attemptMastery(a){ if(a.correct) return a.conf==='high'?100:a.conf==='mid'?82:65; return a.conf==='high'?5:a.conf==='mid'?20:35; }
function misconceptionStatus(id, cutoff=null){
  const aa=st.attempts.filter(a=>a.id===id&&(!cutoff||new Date(a.ts)<=new Date(cutoff))).sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  let lastBad=-1; aa.forEach((a,i)=>{if(!a.correct&&a.conf==='high')lastBad=i;});
  if(lastBad<0) return {active:false,confirmations:0};
  let confirmations=0;
  for(let i=lastBad+1;i<aa.length;i++){
    const a=aa[i];
    if(a.correct&&a.conf==='high') confirmations++;
    else if(!a.correct&&a.conf==='high'){ confirmations=0; lastBad=i; }
  }
  return {active:confirmations<2,confirmations:Math.min(confirmations,2)};
}
function questionMastery(id, cutoff=null){
  const aa=st.attempts.filter(a=>a.id===id&&(!cutoff||new Date(a.ts)<=new Date(cutoff))).sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  if(!aa.length) return null;
  const ww=[1,.65,.42,.27,.17], recent=aa.slice(0,5); let n=0,d=0;
  recent.forEach((a,i)=>{n+=attemptMastery(a)*ww[i];d+=ww[i];});
  let v=n/d; if(misconceptionStatus(id,cutoff).active) v=Math.min(v,55); return Math.round(v);
}
function profile(id){
  const aa=st.attempts.filter(a=>a.id===id);
  if(!aa.length) return {seen:0,score:1.5,due:null,sameDay:false,misconception:false,priority:1.5};
  const rev=[...aa].sort((a,b)=>new Date(b.ts)-new Date(a.ts)); let score=0,f=1;
  rev.slice(0,6).forEach(a=>{score+=weight(a)*f;f*=.6;});
  const last=rev[0],today=dayKey(new Date()),todayAttempts=aa.filter(a=>dayKey(a.ts)===today),lastToday=todayAttempts.length?todayAttempts[todayAttempts.length-1]:null;
  const sameDay=!!(lastToday&&(!lastToday.correct||lastToday.conf==='low'));
  const hadErrorOrLowToday=todayAttempts.some(a=>!a.correct||a.conf==='low');
  const mis=misconceptionStatus(id); let days=5;
  if(mis.active) days=mis.confirmations===0?1:2;
  else if(hadErrorOrLowToday||!last.correct||last.conf==='low') days=1;
  else if(last.conf==='mid') days=3;
  else { let streak=0; for(const a of rev){ if(a.correct&&a.conf==='high')streak++; else break; } days=streak>=3?21:streak===2?10:5; }
  return {seen:aa.length,score,due:new Date(new Date(last.ts).getTime()+days*86400000),sameDay,misconception:mis.active,confirmations:mis.confirmations,priority:score+(mis.active?5:0)+(sameDay?4:0)};
}
function dueIds(){
  const now=new Date();
  return Q.map(q=>({id:q.id,p:profile(q.id)})).filter(x=>x.p.sameDay||(x.p.due&&x.p.due<=now)).sort((a,b)=>{
    if(a.p.misconception!==b.p.misconception) return a.p.misconception?-1:1;
    if(a.p.sameDay!==b.p.sameDay) return a.p.sameDay?-1:1;
    return b.p.priority-a.p.priority;
  }).map(x=>x.id);
}
function conceptScores(){
  const m={};
  Q.forEach(q=>{const p=profile(q.id);if(!p.seen)return;const k=[q.subject,q.domain,q.topic,q.concept].join(' > ');if(!m[k])m[k]={parts:[q.subject,q.domain,q.topic,q.concept],v:0,n:0,mis:false};m[k].v+=p.priority;m[k].n++;m[k].mis ||= p.misconception;});
  return Object.entries(m).map(([key,x])=>({key,...x,av:x.v/x.n})).sort((a,b)=>b.av-a.av);
}
function related(key){const parts=key.split(' > ');return Q.filter(q=>[q.subject,q.domain,q.topic,q.concept].every((v,i)=>v===parts[i])).map(q=>q.id);}
function lvl(x){return x.mis?'重点復習':x.av>=4?'高':x.av>=2?'中':'低';}
function lvlc(x){return x.mis?'high':x.av>=4?'high':x.av>=2?'mid':'';}
function diagnosisRuns(){
  const groups={}; st.attempts.filter(a=>a.type==='diag').forEach(a=>{const k=a.sessionId||`legacy-${dayKey(a.ts)}`;groups[k]??=[];groups[k].push(a);});
  return Object.entries(groups).map(([id,aa])=>({id,start:new Date(Math.min(...aa.map(a=>new Date(a.ts).getTime()))),end:new Date(Math.max(...aa.map(a=>new Date(a.ts).getTime()))),count:aa.length})).sort((a,b)=>a.end-b.end);
}
function diagnosisInfo(){
  const runs=diagnosisRuns(); if(!runs.length)return {last:null,previous:null,recommended:true,reason:'初回診断が必要です',attemptsSince:st.attempts.length};
  const last=runs[runs.length-1],previous=runs.length>1?runs[runs.length-2]:null,days=daysBetween(last.end,new Date()),attemptsSince=st.attempts.filter(a=>new Date(a.ts)>last.end&&a.type!=='diag').length;
  const recommended=days>=14||(days>=7&&attemptsSince>=100); const reason=days>=14?'前回診断から14日以上経過':(days>=7&&attemptsSince>=100?'前回診断後に100問以上演習':'');
  return {last,previous,recommended,reason,attemptsSince,days};
}
function chooseDiagnosisIds(){
  const eligible=Q.filter(q=>!q.excludeFromDiagnosis),target=Math.min(40,eligible.length),exposure={};
  eligible.forEach(q=>exposure[q.id]=st.attempts.filter(a=>a.id===q.id&&a.type==='diag').length);
  const subjects=[...new Set(eligible.map(q=>q.subject))],pools=Object.fromEntries(subjects.map(s=>[s,shuffle(eligible.filter(q=>q.subject===s).sort((a,b)=>exposure[a.id]-exposure[b.id]))])),out=[];
  while(out.length<target){let added=false;for(const s of subjects){const next=pools[s].shift();if(next){out.push(next.id);added=true;if(out.length>=target)break;}}if(!added)break;}return out;
}
function subjectStats(subject,cutoff=null){
  const qs=Q.filter(q=>q.subject===subject),values=qs.map(q=>questionMastery(q.id,cutoff)).filter(v=>v!==null),attempts=st.attempts.filter(a=>qBy(a.id)?.subject===subject&&(!cutoff||new Date(a.ts)<=new Date(cutoff))).length;
  return {value:values.length?Math.round(values.reduce((a,b)=>a+b,0)/values.length):0,seen:values.length,total:qs.length,attempts,insufficient:values.length<Math.min(3,qs.length)};
}
function diagnosisRecordsBySession(sessionId){
  return st.attempts.filter(a=>a.type==='diag'&&(a.sessionId||`legacy-${dayKey(a.ts)}`)===sessionId);
}
function diagSubjectStats(records){
  return [...new Set(records.map(a=>qBy(a.id)?.subject).filter(Boolean))].map(subject=>{
    const aa=records.filter(a=>qBy(a.id)?.subject===subject),ok=aa.filter(a=>a.correct).length,total=aa.length;
    return {subject,ok,total,pct:total?Math.round(ok/total*100):0};
  });
}
function diagConfidenceStats(records){
  const out={
    highCorrect:0,midCorrect:0,lowCorrect:0,
    highWrong:0,midWrong:0,lowWrong:0
  };
  records.forEach(a=>{
    const side=a.correct?'Correct':'Wrong';
    const conf=a.conf==='high'?'high':a.conf==='mid'?'mid':'low';
    out[conf+side]++;
  });
  return out;
}
function conceptMasteryValue(key){
  const vals=related(key).map(id=>questionMastery(id)).filter(v=>v!==null);
  return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null;
}

function previousDiagnosisFor(sessionId){

function axisConfig(subject,axisId){return (ANALYTICS[subject]||[]).find(a=>a.id===axisId)||null;}
function axisMatches(q,axis){return !!axis && axis.rules.some(r=>q.domain===r.domain&&r.topics.includes(q.topic));}
function axisForQuestion(q){return (ANALYTICS[q.subject]||[]).find(a=>axisMatches(q,a))||null;}
function axisQuestions(subject,axisId){const a=axisConfig(subject,axisId);return Q.filter(q=>q.subject===subject&&axisMatches(q,a));}
function axisStats(subject,axisId,cutoff=null){
  const qs=axisQuestions(subject,axisId),vals=qs.map(q=>questionMastery(q.id,cutoff)).filter(v=>v!==null);
  const attempts=st.attempts.filter(x=>{const q=qBy(x.id);return q&&q.subject===subject&&axisMatches(q,axisConfig(subject,axisId))&&(!cutoff||new Date(x.ts)<=new Date(cutoff));}).length;
  return {value:vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null,seen:vals.length,total:qs.length,attempts,insufficient:vals.length<3};
}
function subgroupStats(subject,domain,topic,cutoff=null){
  const qs=Q.filter(q=>q.subject===subject&&q.domain===domain&&q.topic===topic),vals=qs.map(q=>questionMastery(q.id,cutoff)).filter(v=>v!==null);
  return {value:vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null,seen:vals.length,total:qs.length};
}
function subgroupConcepts(subject,domain,topic){
  return Q.filter(q=>q.subject===subject&&q.domain===domain&&q.topic===topic).map(q=>({q,mastery:questionMastery(q.id),priority:profile(q.id).priority})).sort((a,b)=>{
    if(a.mastery===null&&b.mastery!==null)return 1;if(a.mastery!==null&&b.mastery===null)return -1;
    if(a.mastery!==null&&b.mastery!==null&&a.mastery!==b.mastery)return a.mastery-b.mastery;
    return b.priority-a.priority;
  });
}
function areaStatus(stat,questions=[]){
  if(!questions.length||!stat.total)return {text:'準備中',cls:'data'};
  if(!stat.seen)return {text:'未測定',cls:'data'};
  if(questions.some(q=>profile(q.id).misconception))return {text:'重点確認',cls:'priority'};
  if(stat.value!==null&&stat.value<60)return {text:'弱点',cls:'weak'};
  if(stat.value!==null&&stat.value<75)return {text:'要確認',cls:'check'};
  if(stat.insufficient)return {text:'データ少',cls:'data'};
  return {text:'安定',cls:'stable'};
}
function statusBadge(status){return `<span class="area-status ${status.cls}">${status.text}</span>`;}
function masteryText(stat){return stat.value===null||!stat.seen?'':`<span class="practice-mastery">推定習熟度 ${stat.value} / 100</span>`;}
function subjectAreaStatus(subject){const qs=Q.filter(q=>q.subject===subject),stat=subjectStats(subject);return {stat,status:areaStatus(stat,qs)};}
function axisAreaStatus(subject,axisId){const qs=axisQuestions(subject,axisId),stat=axisStats(subject,axisId);return {stat,status:areaStatus(stat,qs)};}
function subgroupAreaStatus(subject,domain,topic){const qs=Q.filter(q=>q.subject===subject&&q.domain===domain&&q.topic===topic),stat=subgroupStats(subject,domain,topic);stat.insufficient=stat.seen<3;return {stat,status:areaStatus(stat,qs)};}
function axisStatusText(x){if(!x.total)return '準備中';if(x.value===null)return '未測定';return `推定習熟度 ${x.value} / 100${x.insufficient?'・データ少':''}`;}

}

function radarSvg(subject){
  const theme=subjectTheme(subject),axes=ANALYTICS[subject]||[],info=diagnosisInfo(),prevCut=info.previous?info.previous.end:null;
  if(axes.length<3)return '<p class="muted">レーダー表示に必要な分類がありません。</p>';
  const cur=axes.map(a=>({...a,stat:axisStats(subject,a.id)}));
  const prev=axes.map(a=>({...a,stat:axisStats(subject,a.id,prevCut)}));
  const n=axes.length,cx=210,cy=165,r=102;
  const pt=(i,val,rr=r)=>{const ang=-Math.PI/2+i*2*Math.PI/n;const rad=rr*(val/100);return [cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];};
  const ring=frac=>Array.from({length:n},(_,i)=>pt(i,100,r*frac).join(',')).join(' ');
  const measured=cur.filter(x=>x.stat.value!==null).length;

  const sectorFills=cur.map((x,i)=>{
    const j=(i+1)%n,a=x.stat.value,b=cur[j].stat.value;
    if(a===null||b===null)return '';
    const p1=pt(i,a),p2=pt(j,b);
    return `<polygon points="${cx},${cy} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}" fill="${theme.fill}" stroke="none"/>`;
  }).join('');

  const currentEdges=cur.map((x,i)=>{
    const j=(i+1)%n,a=x.stat.value,b=cur[j].stat.value;
    if(a===null||b===null)return '';
    const p1=pt(i,a),p2=pt(j,b);
    return `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="${theme.color}" stroke-width="2.6"/>`;
  }).join('');

  const prevEdges=prevCut?prev.map((x,i)=>{
    const j=(i+1)%n,a=x.stat.value,b=prev[j].stat.value;
    if(a===null||b===null)return '';
    const p1=pt(i,a),p2=pt(j,b);
    return `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  }).join(''):'';

  const axesSvg=cur.map((x,i)=>{
    const labelRadius=x.label.length>=8?126:136;
    const labelFont=x.label.length>=8?9.2:10.5;
    const [x1,y1]=pt(i,100),[lx,ly]=pt(i,100,labelRadius),val=x.stat.value;
    const anchor=lx<cx-18?'end':lx>cx+18?'start':'middle';
    const score=val===null?'未測定':`習熟度 ${val}/100`;
    const p=val===null?null:pt(i,val);
    const pp=prev[i].stat.value===null?null:pt(i,prev[i].stat.value);
    return `<line x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" stroke="#d6dee8"/>
      ${p?`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#fff" stroke="${theme.color}" stroke-width="2.5"/>`:''}
      ${pp?`<circle cx="${pp[0]}" cy="${pp[1]}" r="3" fill="#94a3b8"/>`:''}
      <g class="axis-label" onclick="openAxis('${subject.replace(/'/g,"\\'")}','${x.id}')">
        <text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle" font-size="${labelFont}" font-weight="700" fill="#334155">${esc(x.label)}</text>
        <text class="radar-score-label" x="${lx}" y="${ly+14}" text-anchor="${anchor}" dominant-baseline="middle">${score}</text>
      </g>`;
  }).join('');

  const chips=cur.map(x=>`<button class="axis-chip" onclick="openAxis('${subject.replace(/'/g,"\\'")}','${x.id}')">
    <b>${esc(x.label)}</b>
    <div class="axis-chip-meta"><span class="${x.stat.value===null?'':'axis-chip-score'}">${axisStatusText(x.stat)}</span><span class="go">詳細を見る →</span></div>
  </button>`).join('');

  return `<div class="radar-wrap"><svg class="radar" viewBox="0 0 420 340" aria-label="${esc(subject)}の弱点マップ">
    ${[.25,.5,.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="#e2e8f0"/>`).join('')}
    ${sectorFills}${prevEdges}${currentEdges}${axesSvg}
  </svg></div>
  <div class="radar-legend"><span><i class="dot current"></i>現在の推定習熟度</span>${prevCut?'<span><i class="dot prev"></i>前回診断時点</span>':''}</div>
  ${measured<n?`<div style="text-align:center"><span class="radar-gap-note">未測定の軸は0点にせず、図形をつなげていません</span></div>`:''}
  <div class="radar-note">数値は正答率そのものではなく、正誤・確信度・最近の回答履歴から算出した推定習熟度です。各分類をタップすると、細分類と弱点状態を確認できます。</div>
  <div class="axis-grid">${chips}</div>`;
}

  let rows;
  if(t){
    rows=Q.filter(q=>[q.id,q.source,q.subject,q.domain,q.topic,q.concept,q.question,...(q.secondary||[])].join(' ').toLowerCase().includes(t));
  }else{
    rows=Q.filter(q=>hasExplanationFigure(q));
  }
  rows=rows.slice(0,40);
  if(!rows.length){box.innerHTML='<div class="question-search-empty">該当する問題はありません。</div>';return;}
  box.innerHTML=rows.map(q=>`<button class="question-search-item" onclick="startExactQuestion('${q.id}')"><b>${esc(q.question)}</b><div class="question-search-meta">${esc(q.source)}<br>${esc(q.subject)} › ${esc(q.domain)} › ${esc(q.topic)} › ${esc(q.concept)}${hasExplanationFigure(q)?' <span class="figure-badge">図解あり</span>':''}</div></button>`).join('');
}
function startExactQuestion(id){if(!qBy(id))return;start([id],'practice');}

function weak(){
  if(!st.diagnosed){home();return;}const subjects=Object.keys(ANALYTICS);scrollTopNow();
  S.innerHTML=`<div class="card"><h1>弱点分析</h1><p class="muted">回答履歴から、科目全体→領域→細分類→概念の順に弱点を確認できます。</p>${subjectSummaryHtml()}</div><div class="card"><h2>現在の弱点 TOP3</h2><p class="small muted">タップすると、その系列の問題をすぐ演習できます。</p>${weakTopHtml(3)}</div>${subjects.map(s=>{const th=subjectTheme(s);return `<div class="card weak-subject-card" style="--subject-color:${th.color};--subject-soft:${th.soft}"><div class="weak-subject-head"><span class="weak-subject-badge">${esc(s)}</span><h2>${esc(s)}の弱点マップ</h2></div>${radarSvg(s)}</div>`}).join('')}<div class="card"><h2>概念別</h2>${conceptScores().slice(0,12).map(weakCard).join('')||'<p class="muted">まだありません。</p>'}</div>`;nav('weak');scrollTopNow();
}

function lookupPage(){
  const pending=[...st.lookup].filter(x=>!x.done).sort((a,b)=>new Date(b.added)-new Date(a.added));
  const done=[...st.lookup].filter(x=>x.done).sort((a,b)=>new Date(b.added)-new Date(a.added));
  const card=x=>{
    const q=qBy(x.qid);
    const path=q?`${q.subject} › ${q.domain} › ${q.topic} › ${q.concept}`:'元の問題情報なし';
    const src=q?q.source:'';
    return `<div class="lookup-card ${x.done?'done':''}">
      <div class="lookup-term">${esc(x.term)}</div>
      <div class="lookup-path">${esc(path)}${src?`<br>${esc(src)}`:''}</div>
      <div class="lookup-actions">
        <button class="primary" ${q?'':'disabled'} onclick="start(['${x.qid}'],'lookupreview')">元の問題を見る</button>
        <button class="donebtn" onclick="toggleLookupDone('${x.key.replace(/'/g,"\\'")}')">${x.done?'未確認に戻す':'✓ 確認済みにする'}</button>
      </div>
      ${x.done?`<button class="backlink" style="margin-top:8px;color:#64748b" onclick="removeLookup('${x.key.replace(/'/g,"\\'")}')">一覧から削除</button>`:''}
    </div>`;
  };
  S.innerHTML=`<div class="card"><h1>あとで調べる</h1>
    <p class="muted">解説中に気になった用語だけ保存しておき、あとで教科書や授業資料で確認するための一覧です。</p>
    <div class="stats">
      <div class="stat"><b>${pending.length}</b><span class="small">未確認</span></div>
      <div class="stat"><b>${done.length}</b><span class="small">確認済み</span></div>
      <div class="stat"><b>${st.lookup.length}</b><span class="small">保存合計</span></div>
    </div>
  </div>
  <div class="card"><h2>未確認</h2>${pending.length?`<div class="lookup-list">${pending.map(card).join('')}</div>`:'<div class="lookup-empty">保存した用語はありません。<br>問題解説の「＋ あとで調べる」から追加できます。</div>'}</div>
  ${done.length?`<div class="card"><h2>確認済み</h2><div class="lookup-list">${done.map(card).join('')}</div></div>`:''}`;
  NAV.classList.remove('hide');nav('lookup');scrollTopNow();
}

function exportStudyData(){
  const payload={format:'ptot-study-data',version:1,appVersion:'1.22',exportedAt:new Date().toISOString(),data:st};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a'),d=new Date(),ymd=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href=url;a.download=`ptot-study-backup-${ymd}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function triggerImport(){document.getElementById('backupInput')?.click();}
async function importStudyData(input){
  const file=input.files&&input.files[0];if(!file)return;
  try{
    const raw=JSON.parse(await file.text()),data=raw&&raw.format==='ptot-study-data'?raw.data:raw;
    if(!data||!Array.isArray(data.attempts))throw new Error('学習データ形式ではありません');
    if(!confirm('現在の学習データを、読み込んだバックアップで置き換えますか？')){input.value='';return;}
    st={
      attempts:Array.isArray(data.attempts)?data.attempts:[],
      diagnosed:!!data.diagnosed,
      lookup:Array.isArray(data.lookup)?data.lookup:[],
      activeDiag:data.activeDiag&&Array.isArray(data.activeDiag.ids)?data.activeDiag:null,
      lastDiagSessionId:data.lastDiagSessionId||null
    };
    ses=null;save();alert('学習データを復元しました。');home();
  }catch(e){alert('読み込みに失敗しました：'+e.message);}
  input.value='';
}
function hist(){
  if(!st.diagnosed&&!st.attempts.length){home();return;}const a=[...st.attempts].reverse().slice(0,50);
  S.innerHTML=`<div class="card"><h1>履歴</h1>${a.length?a.map(x=>{const q=qBy(x.id);if(!q)return'';return `<div class="row"><div><b>${q.subject} / ${q.concept}</b><div class="small muted">${q.source}・${new Date(x.ts).toLocaleString('ja-JP')}</div></div><span class="${x.correct?'result-good':'result-bad'}">${x.correct?'○':'×'}・${x.conf==='high'?'自信':x.conf==='mid'?'迷い':'不明'}</span></div>`}).join(''):'<p class="muted">履歴なし</p>'}</div>
  <div class="card"><h2>学習データのバックアップ</h2><p class="muted">ログインを使わないため、端末変更やブラウザデータ削除に備えてファイルへ保存できます。</p><div class="data-actions"><button class="btn soft" onclick="exportStudyData()">学習データを書き出す</button><button class="btn secondary" onclick="triggerImport()">バックアップを読み込む</button></div><input id="backupInput" class="file-input" type="file" accept=".json,application/json" onchange="importStudyData(this)"><div class="data-note-box">回答履歴、弱点分析用データ、「あとで調べる」、途中の診断テストを1つのJSONファイルに保存します。</div></div>
  <div class="card"><h2>データ初期化</h2><p class="muted">端末内の回答履歴と保存内容をすべて削除します。</p><button class="btn" style="background:#64748b" onclick="resetData()">学習データを初期化</button></div>`;nav('hist');scrollTopNow();
}
function resetData(){if(confirm('回答履歴・あとで調べる・途中の診断を含む学習データをすべて削除しますか？')){localStorage.removeItem(KEY);st={attempts:[],diagnosed:false,lookup:[],activeDiag:null,lastDiagSessionId:null};ses=null;save();home();}}
function nav(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));}
document.querySelectorAll('.nav button').forEach(b=>{b.onclick=()=>{if(b.dataset.p==='home')home();else if(b.dataset.p==='weak')weak();else if(b.dataset.p==='lookup')lookupPage();else hist();};});
updateLookupNav();home();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js');
      reg.update().catch(()=>{});
    }catch(e){}
  });
}

</script>
</body>
